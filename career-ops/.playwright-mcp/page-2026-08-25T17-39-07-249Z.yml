              - strong [ref=f193e449]: Why are you being asked to complete this form?
              - paragraph [ref=f193e450]: We are a federal contractor or subcontractor. The law requires us to provide equal employment opportunity to qualified people with disabilities. We have a goal of having at least 7% of our workers as people with disabilities. The law says we must measure our progress towards this goal. To do this, we must ask applicants and employees if they have a disability or have ever had one. People can become disabled, so we need to ask this question at least every five years.
              - paragraph [ref=f193e451]:
                - text: Completing this form is voluntary, and we hope that you will choose to do so. Your answer is confidential. No one who makes hiring decisions will see it. Your decision to complete the form and your answer will not harm you in any way. If you want to learn more about the law or this form, visit the U.S. Department of Labor’s Office of Federal Contract Compliance Programs (OFCCP) website at
                - link "www.dol.gov/ofccp" [ref=f193e452] [cursor=pointer]:
                  - /url: https://www.dol.gov/ofccp
                - text: .
              - strong [ref=f193e453]: How do you know if you have a disability?
              - paragraph [ref=f193e454]:
                - text: A disability is a condition that substantially limits one or more of your “major life activities.” If you have or have ever had such a condition, you are a person with a disability.
                - strong [ref=f193e455]: "Disabilities include, but are not limited to:"
              - list [ref=f193e456]:
                - listitem [ref=f193e457]: Alcohol or other substance use disorder (not currently using drugs illegally)
                - listitem [ref=f193e458]: Autoimmune disorder, for example, lupus, fibromyalgia, rheumatoid arthritis, HIV/AIDS
                - listitem [ref=f193e459]: Blind or low vision
                - listitem [ref=f193e460]: Cancer (past or present)
                - listitem [ref=f193e461]: Cardiovascular or heart disease
                - listitem [ref=f193e462]: Celiac disease
                - listitem [ref=f193e463]: Cerebral palsy
                - listitem [ref=f193e464]: Deaf or serious difficulty hearing
                - listitem [ref=f193e465]: Diabetes
                - listitem [ref=f193e466]: Disfigurement, for example, disfigurement caused by burns, wounds, accidents, or congenital disorders
                - listitem [ref=f193e467]: Epilepsy or other seizure disorder
                - listitem [ref=f193e468]: Gastrointestinal disorders, for example, Crohn's Disease, irritable bowel syndrome
                - listitem [ref=f193e469]: Intellectual or developmental disability
