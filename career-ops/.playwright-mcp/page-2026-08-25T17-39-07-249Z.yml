                - emphasis [ref=f193e103]: "*Compensation ranges are country specific. If you are applying for this role from a different location than listed above, your recruiter will discuss your specific market’s defined pay range & benefits at the beginning of the process."
              - paragraph [ref=f193e104]:
                - strong [ref=f193e105]: "Why You’ll Thrive at Grafana Labs:"
              - list [ref=f193e106]:
                - listitem [ref=f193e107]:
                  - strong [ref=f193e108]: 100% Remote, Global Culture -
                  - text: As a remote-only company, we bring together talent from around the world, united by a culture of collaboration and shared purpose.
                - listitem [ref=f193e109]:
                  - strong [ref=f193e110]: Scaling Organization
                  - text: – Tackle meaningful work in a high-growth, ever-evolving environment.
                - listitem [ref=f193e111]:
                  - strong [ref=f193e112]: Transparent Communication
                  - text: – Expect open decision-making and regular company-wide updates.
                - listitem [ref=f193e113]:
                  - strong [ref=f193e114]: Innovation-Driven
                  - text: – Autonomy and support to ship great work and try new things.
                - listitem [ref=f193e115]:
                  - strong [ref=f193e116]: Open Source Roots
                  - text: – Built on community-driven values that shape how we work.
                - listitem [ref=f193e117]:
                  - strong [ref=f193e118]: Empowered Teams
                  - text: – High trust, low ego culture that values outcomes over optics.
                - listitem [ref=f193e119]:
                  - strong [ref=f193e120]: Career Growth Pathways
                  - text: – Defined opportunities to grow and develop your career.
                - listitem [ref=f193e121]:
                  - strong [ref=f193e122]: Approachable Leadership
                  - text: – Transparent execs who are involved, visible, and human.
                - listitem [ref=f193e123]:
                  - strong [ref=f193e124]: Passionate People
                  - text: – Join a team of smart, supportive folks who care deeply about what they do.
                - listitem [ref=f193e125]:
                  - strong [ref=f193e126]: In-Person onboarding
                  - text: "- We want you to thrive from day 1 with your fellow new ‘Grafanistas’ to learn all about what we do and how we do it."
                - listitem [ref=f193e127]:
                  - strong [ref=f193e128]: Balance is Key
                  - text: "- We operate a global annual leave policy of 30 days per annum. 3 days of your annual leave entitlement are reserved for Grafana Shutdown Days to allow the team to really disconnect."
                  - emphasis [ref=f193e129]: "*We will comply with local legislation where applicable."
              - paragraph [ref=f193e130]:
                - strong [ref=f193e131]: "Equal Opportunity Employer:"
                - emphasis [ref=f193e132]: Grafana Labs is an equal opportunities employer. We welcome applications from everyone regardless of race, colour, nationality, origin, caste, sex, gender reassignment identity or expression, sexual orientation, age, religion or belief, disability, veteran status, genetic information, pregnancy, maternity, marital, family or carer status, or any other characteristic which is protected by local law. We believe that equality and diversity build a strong organisation, and we work hard to ensure that is the foundation of our organisation as we grow.
              - paragraph [ref=f193e133]:
                - emphasis [ref=f193e134]: Grafana Labs may utilize AI tools in its recruitment process to assist in matching information provided in CVs to job postings. The recruitment team will continue to review inbound CVs manually to identify alignment with current openings.
              - paragraph [ref=f193e135]: "#LI-Remote"
