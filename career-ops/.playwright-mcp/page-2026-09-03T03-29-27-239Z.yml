              - heading "Voluntary Self-Identification of Disability" [level=2] [ref=f3e308]
              - generic [ref=f3e309]:
                - generic [ref=f3e310]:
                  - generic [ref=f3e311]: Form CC-305
                  - generic [ref=f3e312]: Page 1 of 1
                - generic [ref=f3e313]:
                  - generic [ref=f3e314]: OMB Control Number 1250-0005
                  - generic [ref=f3e315]: Expires 07/31/2029
              - strong [ref=f3e316]: Why are you being asked to complete this form?
              - paragraph [ref=f3e317]: We are a federal contractor or subcontractor. The law requires us to provide equal employment opportunity to qualified people with disabilities. We have a goal of having at least 7% of our workers as people with disabilities. The law says we must measure our progress towards this goal. To do this, we must ask applicants and employees if they have a disability or have ever had one. People can become disabled, so we need to ask this question at least every five years.
              - paragraph [ref=f3e318]:
                - text: Completing this form is voluntary, and we hope that you will choose to do so. Your answer is confidential. No one who makes hiring decisions will see it. Your decision to complete the form and your answer will not harm you in any way. If you want to learn more about the law or this form, visit the U.S. Department of Labor’s Office of Federal Contract Compliance Programs (OFCCP) website at
                - link "www.dol.gov/ofccp" [ref=f3e319] [cursor=pointer]:
                  - /url: https://www.dol.gov/ofccp
                - text: .
              - strong [ref=f3e320]: How do you know if you have a disability?
              - paragraph [ref=f3e321]:
                - text: A disability is a condition that substantially limits one or more of your “major life activities.” If you have or have ever had such a condition, you are a person with a disability.
                - strong [ref=f3e322]: "Disabilities include, but are not limited to:"
              - list [ref=f3e323]:
                - listitem [ref=f3e324]: Alcohol or other substance use disorder (not currently using drugs illegally)
                - listitem [ref=f3e325]: Autoimmune disorder, for example, lupus, fibromyalgia, rheumatoid arthritis, HIV/AIDS
                - listitem [ref=f3e326]: Blind or low vision
                - listitem [ref=f3e327]: Cancer (past or present)
                - listitem [ref=f3e328]: Cardiovascular or heart disease
                - listitem [ref=f3e329]: Celiac disease
                - listitem [ref=f3e330]: Cerebral palsy
                - listitem [ref=f3e331]: Deaf or serious difficulty hearing
                - listitem [ref=f3e332]: Diabetes
                - listitem [ref=f3e333]: Disfigurement, for example, disfigurement caused by burns, wounds, accidents, or congenital disorders
                - listitem [ref=f3e334]: Epilepsy or other seizure disorder
                - listitem [ref=f3e335]: Gastrointestinal disorders, for example, Crohn's Disease, irritable bowel syndrome
                - listitem [ref=f3e336]: Intellectual or developmental disability
                - listitem [ref=f3e337]: Mental health conditions, for example, depression, bipolar disorder, anxiety disorder, schizophrenia, PTSD
                - listitem [ref=f3e338]: Missing limbs or partially missing limbs
                - listitem [ref=f3e339]: Mobility impairment, benefiting from the use of a wheelchair, scooter, walker, leg brace(s) and/or other supports
                - listitem [ref=f3e340]: Nervous system condition, for example, migraine headaches, Parkinson’s disease, multiple sclerosis (MS)
                - listitem [ref=f3e341]: Neurodivergence, for example, attention-deficit/hyperactivity disorder (ADHD), autism spectrum disorder, dyslexia, dyspraxia, other learning disabilities
                - listitem [ref=f3e342]: Partial or complete paralysis (any cause)
                - listitem [ref=f3e343]: Pulmonary or respiratory conditions, for example, tuberculosis, asthma, emphysema
                - listitem [ref=f3e344]: Short stature (dwarfism)
                - listitem [ref=f3e345]: Traumatic brain injury
