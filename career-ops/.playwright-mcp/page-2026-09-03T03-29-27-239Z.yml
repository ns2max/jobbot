            - heading "Staff Applied Scientist (Distribution Center)" [level=1] [ref=f3e14]
            - generic [ref=f3e15]: Remote - Ontario, Canada
          - button "Apply" [ref=f3e19] [cursor=pointer]
        - generic [ref=f3e20]:
          - generic [ref=f3e21]:
            - paragraph [ref=f3e22]: "Afresh, the AI platform for grocery, began by tackling the most complex problem in the industry: fresh, and has evolved into the core AI platform for grocers."
            - paragraph [ref=f3e23]: By leveraging proprietary AI designed for high-volatility environments, we empower partners like Albertsons, Meijer, and Wakefern to drive smarter decisions across their entire enterprise.
            - paragraph [ref=f3e24]: Following record-breaking 70% revenue growth in 2025, we have scaled to 6 enterprise-grade solutions, with solutions live in over 10% of the U.S. grocery market. Our platform now orchestrates billions of decisions from the store floor to the distribution center and prevented over 200 million pounds of food waste last year alone.
            - paragraph [ref=f3e25]: If you're looking for a role where your work directly translates into massive scale and social good, and you want to be part of the team that defines how the world eats, there is no better time to join us.
          - generic [ref=f3e26]:
            - paragraph [ref=f3e27]:
              - strong [ref=f3e29]: About the Role
            - paragraph [ref=f3e30]: The Afresh Intelligence team is responsible for the development and performance of AI/ML models that power our core replenishment technology. Our models are directly responsible for ordering millions of dollars of fresh inventory across the world every day. Fresh food ordering is an extremely complex high-dimensional decision-making problem, and we face the complex challenges presented by decaying product, uncertain shelf lives, varying consumer demand, stochastic arrival times, extreme weather events, and tight performance constraints (to name a few). We tackle these problems with a mix of machine learning, large-scale simulation, and optimization technologies.
            - paragraph [ref=f3e31]: We are looking for a Staff Applied Scientist to lead R&D work at Afresh. You will take your existing knowledge of machine learning, forecasting, operations research, and stochastic optimization and apply it to the challenging and important problem of perishable inventory control. You will research, implement, and rigorously validate improvements to our core replenishment system. This will include modeling consumer demand, item-level perishability, and complex multi-echelon supply chains. Your work will be visible from day one, will make a substantial impact on decreasing food waste, and will lead to fresher, healthier produce for millions of people across the world.
            - paragraph [ref=f3e32]:
              - strong [ref=f3e34]: What You'll Do
            - list [ref=f3e35]:
              - listitem [ref=f3e36]: Set technical direction for core replenishment R&D — define the modeling roadmap across demand forecasting, inventory optimization, and decision-making policy, and align it with product and business strategy.
              - listitem [ref=f3e37]: Model complex problems such as inventory decay, promotions, price elasticity, and inventory uncertainty, and implement solutions to multi-stage and multi-echelon inventory optimization problems.
              - listitem [ref=f3e38]: Drive fundamental changes to our core system from research through production, writing rigorously tested and scalable code — we are not an analytics team.
              - listitem [ref=f3e39]: Lead research and development for new product and business challenges.
              - listitem [ref=f3e40]: "Raise the technical bar across the Intelligence team: mentor scientists and engineers, set standards for experimental rigor, and review designs and results."
              - listitem [ref=f3e41]: Push the boundaries of AI capabilities in both products and scientist workflows.
            - paragraph [ref=f3e42]:
              - strong [ref=f3e44]: What Makes You a Great Fit
            - list [ref=f3e45]:
              - listitem [ref=f3e46]: MS or PhD in Operations Research, Industrial Engineering, Computer Science, Electrical Engineering, or another quantitative field, or equivalent practical experience.
              - listitem [ref=f3e47]: For candidates with an MS, 8+ years of industry experience; for candidates with a PhD, 4+ years of industry experience.
              - listitem [ref=f3e48]: Experience researching and building systems that support large-scale decision making under uncertainty.
              - listitem [ref=f3e49]: Prior experience in areas such as inventory optimization, supply chain management, network optimization, forecasting, game theory, decision analysis, stochastic optimization, approximate dynamic programming, or related fields is a plus.
              - listitem [ref=f3e50]: Excellent communication and presentation skills. You should be able to explain complex mathematical ideas to product teams in plain English and easily translate business requirements into constrained optimization problems.
              - listitem [ref=f3e51]: Ability to independently deliver high quality software implementations of your solutions in the Python data stack (numpy/torch/pandas/etc) or similar technologies. Prior experience with Python is not required.
              - listitem [ref=f3e52]: "Nice to Have skills: understanding of ML Platform and a passion for mentorship"
            - paragraph [ref=f3e53]
            - paragraph [ref=f3e54]:
              - strong [ref=f3e55]: This position is not eligible for company sponsorship.
            - paragraph [ref=f3e56]:
              - strong [ref=f3e57]: "Salary Range in Canada:"
              - text: $169,000 - $252,000 (
              - emphasis [ref=f3e58]: dependent on experience).
          - generic [ref=f3e59]:
            - generic [ref=f3e61]:
              - strong [ref=f3e62]: Why You’ll Love Working at Afresh
              - text: At Afresh, our mission to eliminate food waste starts with investing in our people. We provide a comprehensive support system designed to help you do your best work while maintaining a healthy, balanced life.
            - list [ref=f3e63]:
              - listitem [ref=f3e64]:
                - strong [ref=f3e65]: "Comprehensive Health & Wellness:"
                - text: Comprehensive medical, dental, and vision coverage for you and your family, with the majority of premiums covered by Afresh. We also provide dedicated mental health support and counseling services.
              - listitem [ref=f3e66]:
                - strong [ref=f3e67]: "Invested in Your Future:"
                - text: Competitive base salary, meaningful equity (U.S. employees), and a 401(k) program with a generous company match.
              - listitem [ref=f3e68]:
                - strong [ref=f3e69]: "Flexible & Modern Workspace:"
                - text: Whether you work from home or a local office, we support your setup with a home office stipend and "Coworking Wallets" for flexible workspace access.
              - listitem [ref=f3e70]:
                - strong [ref=f3e71]: "Growth-Obsessed Culture:"
                - text: We believe in continuous learning. Every employee receives an annual professional development budget to master new skills and grow their career at Afresh.
              - listitem [ref=f3e72]:
                - strong [ref=f3e73]: "Holistic Monthly Stipends:"
                - text: Beyond your paycheck, we provide monthly stipends for "Betterment" (wellness/lifestyle) and telecommunications to ensure you have what you need to thrive.
              - listitem [ref=f3e74]:
                - strong [ref=f3e75]: "Time to Recharge:"
                - text: Flexible paid time off to take the time you need to recharge.
            - generic [ref=f3e76]:
              - text: "*"
              - emphasis [ref=f3e77]: Full-time U.S. employees are eligible for these benefits
            - paragraph [ref=f3e79]:
              - strong [ref=f3e80]: About Afresh
            - paragraph [ref=f3e81]: "Founded in 2017, Afresh is using AI to tackle the #1 solution to curb climate change: reducing food waste. By building AI specifically for the intricacies of grocery—from the fresh perimeter to the center store—we help grocers minimize waste and maximize sales."
            - paragraph [ref=f3e82]: Afresh sits at an incredible intersection of positive social impact, rocket ship financial growth, and cutting-edge technology. Our best-in-class AI research has been published in top journals, including ICML, and our investors include Al Gore’s Just Climate, former Whole Foods Market CEO Walter Robb, and Eric Schmidt's Innovation Endeavors.
            - paragraph [ref=f3e83]: Grocery is the past, present, and future of our food system – the waste we create today will impact our planet for years to come. Join us as we continue to build a vibrant, diverse, and inclusive team that embodies our company’s values of proactivity, kindness, candor, and humility.
            - paragraph [ref=f3e84]:
              - strong [ref=f3e85]: Afresh provides equal employment opportunities (EEO) to all employees and applicants for employment without regard to race, color, religion, sex, national origin, age, disability, genetics, sexual orientation, gender identity/expression, marital status, pregnancy or related condition, or any other basis protected by law.
            - paragraph [ref=f3e86]:
              - strong [ref=f3e87]: "Here at Afresh, many of our employees work remotely provided that they reside in one of the following states: AL, AR, CA, CO, FL, GA, IL, KY, MA, MI, MT, MO, NV, NJ, NY, NC, OR, PA, TX, WA, UT, VA, WI"
              - text: .
            - paragraph [ref=f3e88]
