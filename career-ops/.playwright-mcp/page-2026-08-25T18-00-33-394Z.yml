            - paragraph [ref=f489e40]:
              - strong [ref=f489e41]: About Decagon
            - paragraph [ref=f489e42]: Decagon is the leading conversational AI platform empowering every brand to deliver concierge customer experiences.
            - paragraph [ref=f489e43]: Our technology enables industry-defining enterprises like Avis Budget Group, Block’s Cash App and Square, Chime, Oura Health, and Hunter Douglas to deploy AI agents that power personalized, deeply satisfying interactions across voice, chat, email, SMS, and every other channel.
            - paragraph [ref=f489e44]: We’re building a future where customer experiences are being redefined from support tickets and hold music to faster resolutions, richer conversations, and deeper relationships. We’re proud to be backed by world-class investors who share that vision, including a16z, Accel, Bain Capital Ventures, Coatue, and Index Ventures, along with many others.
            - paragraph [ref=f489e45]: We’re an in-office company, driven by a shared commitment to excellence and velocity. Our values — Just Get It Done, Invent What Customers Want, Winner’s Mindset, and The Polymath Principle — shape how we work and grow as a team.
            - paragraph [ref=f489e46]
            - paragraph [ref=f489e47]:
              - strong [ref=f489e48]: About the Team
            - paragraph [ref=f489e49]:
              - text: "Read more about the research team's work here:"
              - link "https://decagon.ai/blog/introducing-decagon-labs" [ref=f489e50] [cursor=pointer]:
                - /url: https://decagon.ai/blog/introducing-decagon-labs
            - paragraph [ref=f489e51]: The Research team develops the model and decision-making stack that powers Decagon’s conversational agents for enterprise support. We research, adapt, and implement state-of-the-art techniques in model training, prompting, orchestration, and evaluation in order to make our agents more accurate, robust, and efficient in real-world deployments.
            - paragraph [ref=f489e52]: "Our goal is to push the frontier of applied conversational AI: agents that reliably understand nuanced intent, track long context, and take the right actions under uncertainty. We measure success the way customers feel it: higher resolution rates, better user satisfaction, and consistent behavior at scale."
            - paragraph [ref=f489e53]
            - paragraph [ref=f489e54]:
              - strong [ref=f489e55]: About the Role
            - paragraph [ref=f489e56]: As a Voice Research Engineer, you’ll lead the development of the models and algorithms that power Decagon’s industry-leading, real-time voice agents, and drive them all the way into production. You’ll own multi-quarter initiatives that advance speech understanding, naturalness, turn-taking, and resilience in real-world conditions. You’ll design and implement frontier approaches for training, evaluation, and orchestration across the voice agent.
            - paragraph [ref=f489e57]: We’re looking for strong engineers who want to build the core models and algorithms behind our AI agents. People here own their work end-to-end, ship real improvements, and are trusted to make high-impact technical decisions.
            - paragraph [ref=f489e58]
            - paragraph [ref=f489e59]:
              - strong [ref=f489e60]: In this role, you will
            - list [ref=f489e61]:
              - listitem [ref=f489e62]:
                - paragraph [ref=f489e63]: Lead research and engineering efforts to improve core conversational capabilities in production, including instruction following, retrieval, memory, and long-horizon task completion
              - listitem [ref=f489e64]:
                - paragraph [ref=f489e65]: Build and iterate on end-to-end models and pipelines that optimize for quality, efficiency, and user experience
              - listitem [ref=f489e66]:
                - paragraph [ref=f489e67]: Partner with platform and product engineers to integrate new models into production systems
              - listitem [ref=f489e68]:
                - paragraph [ref=f489e69]: Break down ambiguous research ideas into clear, iterative milestones and roadmaps.
              - listitem [ref=f489e70]:
                - paragraph [ref=f489e71]: Mentor other researchers/engineers, set technical direction, and establish best practices for applied research and engineering
            - paragraph [ref=f489e72]
            - paragraph [ref=f489e73]:
              - strong [ref=f489e74]: Your background looks something like this
            - list [ref=f489e75]:
              - listitem [ref=f489e76]:
                - paragraph [ref=f489e77]: 6+ years of experience in AI/ML engineering or research.
              - listitem [ref=f489e78]:
                - paragraph [ref=f489e79]: Prior experience post-training and deploying LLMs in production environments.
              - listitem [ref=f489e80]:
                - paragraph [ref=f489e81]: Fluency in Python and modern ML tooling (training, evaluation, data pipelines)
              - listitem [ref=f489e82]:
                - paragraph [ref=f489e83]: Track record of taking research ideas from prototype → reliable, measurable production impact
              - listitem [ref=f489e84]:
                - paragraph [ref=f489e85]: Ability to define a roadmap, break ambiguity into milestones, and lead cross-functional execution
            - paragraph [ref=f489e86]
