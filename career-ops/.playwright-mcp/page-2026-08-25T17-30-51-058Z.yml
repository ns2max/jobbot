                - paragraph [ref=f131e105]: Monthly stipend to support your wellness, lifestyle, and work-life balance
              - listitem [ref=f131e106]:
                - paragraph [ref=f131e107]: Daily lunches and snacks in the office to keep you at your best
              - listitem [ref=f131e108]:
                - paragraph [ref=f131e109]: Take what you need vacation policy (subject to local requirements; UK employees receive 25 days of statutory leave)
            - paragraph [ref=f131e110]:
              - emphasis [ref=f131e111]: These benefits are described in more detail in Decagon’s policies, may vary by location, and can change at any time according to applicable compensation and benefits plans.
