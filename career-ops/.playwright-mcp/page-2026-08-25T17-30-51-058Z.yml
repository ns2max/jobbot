          - generic [ref=f131e39]:
            - paragraph [ref=f131e40]:
              - strong [ref=f131e41]: About Decagon
            - paragraph [ref=f131e42]: Decagon is the leading conversational AI platform empowering every brand to deliver concierge customer experiences.
            - paragraph [ref=f131e43]: Our technology enables industry-defining enterprises like Avis Budget Group, Block’s Cash App and Square, Chime, Oura Health, and Hunter Douglas to deploy AI agents that power personalized, deeply satisfying interactions across voice, chat, email, SMS, and every other channel.
            - paragraph [ref=f131e44]: We’re building a future where customer experiences are being redefined from support tickets and hold music to faster resolutions, richer conversations, and deeper relationships. We’re proud to be backed by world-class investors who share that vision, including a16z, Accel, Bain Capital Ventures, Coatue, and Index Ventures, along with many others.
            - paragraph [ref=f131e45]: We’re an in-office company, driven by a shared commitment to excellence and velocity. Our values — Just Get It Done, Invent What Customers Want, Winner’s Mindset, and The Polymath Principle — shape how we work and grow as a team.
            - paragraph [ref=f131e46]
            - paragraph [ref=f131e47]:
              - strong [ref=f131e48]: About the Team
            - paragraph [ref=f131e49]:
              - text: "Read more about the research team's work here:"
              - link "https://decagon.ai/blog/introducing-decagon-labs" [ref=f131e50] [cursor=pointer]:
                - /url: https://decagon.ai/blog/introducing-decagon-labs
              - text: The Research team develops the model and decision-making stack that powers Decagon’s conversational agents for enterprise support. We research, adapt, and implement state-of-the-art techniques in model training, prompting, orchestration, and evaluation in order to make our agents more accurate, robust, and efficient in real-world deployments.
            - paragraph [ref=f131e51]: "Our goal is to push the frontier of applied conversational AI: agents that reliably understand nuanced intent, track long context, and take the right actions under uncertainty. We measure success the way customers feel it: higher resolution rates, better user satisfaction, and consistent behavior at scale."
            - paragraph [ref=f131e52]
            - paragraph [ref=f131e53]:
              - strong [ref=f131e54]: About the Role
            - paragraph [ref=f131e55]: As a Research Engineer, you’ll be responsible for building industry-leading conversational AI models that power Decagon’s agent, and taking them all the way from idea to production. You’ll own multi-quarter initiatives that push the agent’s reliability, capability, and efficiency forward, and you’ll design and implement frontier approaches for training, evaluation, and orchestration across the system.
            - paragraph [ref=f131e56]: We’re looking for strong engineers who want to build the core models and algorithms behind our AI agents. People here own their work end-to-end, ship real improvements, and are trusted to make high-impact technical decisions.
            - paragraph [ref=f131e57]
            - paragraph [ref=f131e58]:
              - strong [ref=f131e59]: In this role, you will
            - list [ref=f131e60]:
              - listitem [ref=f131e61]:
                - paragraph [ref=f131e62]: Lead research and engineering efforts to improve core conversational capabilities in production, including instruction following, retrieval, memory, and long-horizon task completion
              - listitem [ref=f131e63]:
                - paragraph [ref=f131e64]: Build and iterate on end-to-end models and pipelines that optimize for quality, efficiency, and user experience
              - listitem [ref=f131e65]:
                - paragraph [ref=f131e66]: Partner with platform and product engineers to integrate new models into production systems
              - listitem [ref=f131e67]:
                - paragraph [ref=f131e68]: Break down ambiguous research ideas into clear, iterative milestones and roadmaps.
            - paragraph [ref=f131e69]
            - paragraph [ref=f131e70]:
              - strong [ref=f131e71]: Your background looks something like this
            - list [ref=f131e72]:
              - listitem [ref=f131e73]:
                - paragraph [ref=f131e74]: 2+ years of experience in AI/ML engineering or research.
              - listitem [ref=f131e75]:
                - paragraph [ref=f131e76]: Prior experience post-training and deploying LLMs in production environments.
              - listitem [ref=f131e77]:
                - paragraph [ref=f131e78]: Fluency in Python and modern ML tooling (training, evaluation, data pipelines)
              - listitem [ref=f131e79]:
                - paragraph [ref=f131e80]: Track record of taking research ideas from prototype → reliable, measurable production impact
            - paragraph [ref=f131e81]
            - paragraph [ref=f131e82]:
              - strong [ref=f131e83]: Compensation
            - paragraph [ref=f131e84]: $200K – $400K + Offers Equity
            - paragraph [ref=f131e85]:
              - emphasis [ref=f131e86]: This range reflects the expected compensation for this role. Compensation within the range is determined based on experience, skills, and the scope of responsibilities, with flexibility for candidates who demonstrate exceptional impact.
            - paragraph [ref=f131e87]:
              - emphasis [ref=f131e88]: In addition to base salary, we offer competitive equity. Final compensation may vary based on location within the United States.
            - paragraph [ref=f131e89]
            - paragraph [ref=f131e90]:
              - strong [ref=f131e91]: Benefits
            - paragraph [ref=f131e92]: "We proudly offer the following benefits for our full-time employees:"
            - list [ref=f131e93]:
              - listitem [ref=f131e94]:
                - paragraph [ref=f131e95]: Medical, Dental, and Vision benefits for you and your family
              - listitem [ref=f131e96]:
