        - heading [level=2] [ref=f618e19]:
          - strong [ref=f618e20]: About AssemblyAI
        - paragraph [ref=f618e21]: AssemblyAI builds the best-in-class Speech AI models powering the next generation of voice applications. Our models serve 600M+ inference calls monthly, process 1M+ hours of audio daily, and power 2 billion+ end-user experiences—from voice agents and meeting assistants to contact centers and medical scribes. Companies like Zoom, Granola, Fireflies, Cluely, and Calabrio rely on AssemblyAI to ship production-ready voice AI.
        - paragraph [ref=f618e22]:
          - text: "We're at an inflection point in Speech AI. We released Universal-Streaming in mid-2025, and it has quickly earned its place as the model offering the best accuracy-latency-cost tradeoff on the market. The adoption has been significant: we now process ~1.5M streaming hours per week, with 25x usage growth in the last six months alone. Our research team drives these advances and ships with relentless velocity. Since releasing Universal-Streaming, we've already launched"
          - link "keyterms prompting feature" [ref=f618e24] [cursor=pointer]:
            - /url: https://www.assemblyai.com/blog/streaming-keyterms-prompting
          - text: and
          - link "multilingual support" [ref=f618e26] [cursor=pointer]:
            - /url: https://www.assemblyai.com/blog/introducing-multilingual-universal-streaming
          - text: —with more significant improvements on the roadmap.
        - paragraph [ref=f618e27]: We've raised $115M+ from Accel, Insight Partners, Y Combinator's AI Fund, Patrick and John Collison, Nat Friedman, and Daniel Gross. We're a remote team building one of the next great AI companies—and we're looking for people who will shape its future.
