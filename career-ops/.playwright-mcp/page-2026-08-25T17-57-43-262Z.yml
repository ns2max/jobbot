        - generic [ref=f418e20]:
          - generic [ref=f418e21]:
            - heading [level=2] [ref=f418e22]:
              - strong [ref=f418e23]: About Anthropic
            - paragraph [ref=f418e24]: Anthropic’s mission is to create reliable, interpretable, and steerable AI systems. We want AI to be safe and beneficial for our users and for society as a whole. Our team is a quickly growing group of committed researchers, engineers, policy experts, and business leaders working together to build beneficial AI systems.
          - generic [ref=f418e25]:
            - heading [level=2] [ref=f418e26]:
              - strong [ref=f418e27]: "About the role:"
            - paragraph [ref=f418e28]:
              - text: Biology is the area where scientific progress has perhaps the greatest potential to directly and unambiguously improve human life — and we believe powerful AI could meaningfully accelerate the rate of biological discovery, helping compress decades of progress into years. With
              - emphasis [ref=f418e29]: Claude for Life Sciences
              - text: ", we're building tools that accelerate the work of scientists and drug developers across the full lifecycle, from early discovery through clinical translation and regulatory review."
            - paragraph [ref=f418e30]: "As the Applied AI Engineering Manager for Life Sciences, you'll lead the team of engineers who turn that ambition into deployed reality inside the world's leading scientific organizations. Our Applied AI Engineers are the technical front line: they sit with customers, understand their scientific and regulatory workflows in depth, and build the prototypes, integrations, and agents that let Claude do meaningful work in the lab and the clinic. You'll grow and lead this team, own the technical success of our most strategic life sciences accounts, those ties to advancing our strategy and mission, and create the feedback loop that turns what we learn in the field into better products and models."
            - paragraph [ref=f418e31]: "This is more than wiring up a chatbot. As our own research has shown, the hard part of putting agents to work in biology is the infrastructure beneath them: messy databases, idiosyncratic file formats, scattered APIs, and metadata conventions where a single wrong or missing record can change a scientific conclusion. Your team builds the deterministic tools, connectors, and evaluations that make biological data reliably accessible to agents — and holds the work to a research-grade bar, where an answer has to be correct, reproducible, and auditable, not just plausible."
            - paragraph [ref=f418e32]: This is a hands-on leadership role. You'll coach engineers and raise the bar on their work, stay close enough to the technology to review prototypes and contribute directly, and partner across go-to-market, product, and research. Because this work sits in a sensitive, dual-use domain, you'll also help set the standard for how we deploy responsibly — enabling legitimate science while taking safety seriously.
            - heading [level=2] [ref=f418e33]:
              - strong [ref=f418e34]: "In this role, you will:"
            - list [ref=f418e35]:
              - listitem [ref=f418e36]:
                - paragraph [ref=f418e37]:
                  - strong [ref=f418e38]: "Build and lead the team:"
                  - text: hire, coach, and develop a team of Applied AI Engineers dedicated to strategic life sciences partners, setting a high technical bar and helping each engineer grow.
              - listitem [ref=f418e39]:
                - paragraph [ref=f418e40]:
                  - strong [ref=f418e41]: "Own technical success with partners:"
                  - text: be accountable for the technical outcomes of our strategic pharma and biotech deployments, from first scoping conversation through production.
              - listitem [ref=f418e42]:
                - paragraph [ref=f418e43]:
                  - strong [ref=f418e44]: "Stay hands-on:"
                  - text: review and contribute to prototypes, MCP integrations, agentic workflows, and Claude Code for Bio solutions; help the team get unblocked on the hardest technical problems.
              - listitem [ref=f418e45]:
                - paragraph [ref=f418e46]:
                  - strong [ref=f418e47]: "Build agent-ready scientific infrastructure:"
                  - text: guide the team in creating the deterministic tools, connectors/harnesses, and evaluations that make messy biological data and workflows reliably accessible to Claude — in partnership with scientists and research institutions.
              - listitem [ref=f418e48]:
                - paragraph [ref=f418e49]:
                  - strong [ref=f418e50]: "Translate the field into the roadmap:"
                  - text: partner cross functionally to turn what you learn from deployments into improvements in Anthropic's life sciences products and models.
              - listitem [ref=f418e51]:
                - paragraph [ref=f418e52]:
                  - strong [ref=f418e53]: "Set the standard for responsible deployment:"
                  - text: work alongside our safety teams to enable beneficial scientific work while guarding against misuse in a dual-use domain.
              - listitem [ref=f418e54]:
                - paragraph [ref=f418e55]:
                  - strong [ref=f418e56]: Build for the frontier
                  - text: ": use deep knowledge of frontier model intelligence coupled to your work in R&D and research to rapidly progress toward solutions to meaningful problems in life sciences."
            - heading "You may be a good fit if you:" [level=2] [ref=f418e57]
            - list [ref=f418e58]:
              - listitem [ref=f418e59]:
                - paragraph [ref=f418e60]: Have led or technically mentored software/ML engineers, ideally in a forward-deployed, solutions, or customer-facing engineering setting.
              - listitem [ref=f418e61]:
                - paragraph [ref=f418e62]: Have a background in pharma, biotech, computational biology, bioinformatics, or clinical/regulatory affairs.
              - listitem [ref=f418e63]:
                - paragraph [ref=f418e64]: Have a strong hands-on engineering background and are comfortable reading and writing production code, not just managing those who do.
              - listitem [ref=f418e65]:
                - paragraph [ref=f418e66]: Have delivered technical work directly with external customers or partners, and can communicate credibly with both technical experts and executives.
              - listitem [ref=f418e67]:
                - paragraph [ref=f418e68]: Have built on top of large language models or agents
              - listitem [ref=f418e69]:
                - paragraph [ref=f418e70]: Are energized by an unfamiliar technical domain and have a track record of going deep fast.
              - listitem [ref=f418e71]:
                - paragraph [ref=f418e72]: Hold a high bar for reliability and reproducibility, and understand why a plausible-looking answer that's subtly wrong can be worse than no answer in scientific work.
              - listitem [ref=f418e73]:
                - paragraph [ref=f418e74]: Have built tooling, data infrastructure, evals, or agent harnesses that turn messy real-world data into something usable and trustworthy — especially welcome if in a scientific or research setting.
              - listitem [ref=f418e75]:
                - paragraph [ref=f418e76]: Care deeply about the safe and beneficial deployment of AI, especially in sensitive domains.
            - heading [level=2] [ref=f418e77]:
              - strong [ref=f418e78]: "Strong candidates may also have:"
            - list [ref=f418e79]:
              - listitem [ref=f418e80]:
                - paragraph [ref=f418e81]: Experience deploying LLM or agent systems in regulated or enterprise environments.
              - listitem [ref=f418e82]:
                - paragraph [ref=f418e83]: Experience building MCP servers, developer tooling, or scientific computing pipelines.
              - listitem [ref=f418e84]:
                - paragraph [ref=f418e85]: Experience scaling a customer-facing technical team through a period of rapid growth.
