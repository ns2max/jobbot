              - strong [ref=f418e484]: Why are you being asked to complete this form?
              - paragraph [ref=f418e485]: We are a federal contractor or subcontractor. The law requires us to provide equal employment opportunity to qualified people with disabilities. We have a goal of having at least 7% of our workers as people with disabilities. The law says we must measure our progress towards this goal. To do this, we must ask applicants and employees if they have a disability or have ever had one. People can become disabled, so we need to ask this question at least every five years.
              - paragraph [ref=f418e486]:
                - text: Completing this form is voluntary, and we hope that you will choose to do so. Your answer is confidential. No one who makes hiring decisions will see it. Your decision to complete the form and your answer will not harm you in any way. If you want to learn more about the law or this form, visit the U.S. Department of Labor’s Office of Federal Contract Compliance Programs (OFCCP) website at
                - link "www.dol.gov/ofccp" [ref=f418e487] [cursor=pointer]:
                  - /url: https://www.dol.gov/ofccp
                - text: .
              - strong [ref=f418e488]: How do you know if you have a disability?
              - paragraph [ref=f418e489]:
                - text: A disability is a condition that substantially limits one or more of your “major life activities.” If you have or have ever had such a condition, you are a person with a disability.
                - strong [ref=f418e490]: "Disabilities include, but are not limited to:"
              - list [ref=f418e491]:
                - listitem [ref=f418e492]: Alcohol or other substance use disorder (not currently using drugs illegally)
                - listitem [ref=f418e493]: Autoimmune disorder, for example, lupus, fibromyalgia, rheumatoid arthritis, HIV/AIDS
                - listitem [ref=f418e494]: Blind or low vision
                - listitem [ref=f418e495]: Cancer (past or present)
                - listitem [ref=f418e496]: Cardiovascular or heart disease
                - listitem [ref=f418e497]: Celiac disease
                - listitem [ref=f418e498]: Cerebral palsy
                - listitem [ref=f418e499]: Deaf or serious difficulty hearing
                - listitem [ref=f418e500]: Diabetes
                - listitem [ref=f418e501]: Disfigurement, for example, disfigurement caused by burns, wounds, accidents, or congenital disorders
                - listitem [ref=f418e502]: Epilepsy or other seizure disorder
                - listitem [ref=f418e503]: Gastrointestinal disorders, for example, Crohn's Disease, irritable bowel syndrome
                - listitem [ref=f418e504]: Intellectual or developmental disability
                - listitem [ref=f418e505]: Mental health conditions, for example, depression, bipolar disorder, anxiety disorder, schizophrenia, PTSD
                - listitem [ref=f418e506]: Missing limbs or partially missing limbs
                - listitem [ref=f418e507]: Mobility impairment, benefiting from the use of a wheelchair, scooter, walker, leg brace(s) and/or other supports
                - listitem [ref=f418e508]: Nervous system condition, for example, migraine headaches, Parkinson’s disease, multiple sclerosis (MS)
                - listitem [ref=f418e509]: Neurodivergence, for example, attention-deficit/hyperactivity disorder (ADHD), autism spectrum disorder, dyslexia, dyspraxia, other learning disabilities
                - listitem [ref=f418e510]: Partial or complete paralysis (any cause)
                - listitem [ref=f418e511]: Pulmonary or respiratory conditions, for example, tuberculosis, asthma, emphysema
                - listitem [ref=f418e512]: Short stature (dwarfism)
                - listitem [ref=f418e513]: Traumatic brain injury
