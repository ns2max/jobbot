            - heading "Staff Data Scientist - Ads Measurement, Signals, Privacy" [level=1] [ref=f277e15]
            - generic [ref=f277e16]: Toronto, Canada
          - button "Apply" [ref=f277e20] [cursor=pointer]
        - generic [ref=f277e21]:
          - generic [ref=f277e28]:
            - text: Reddit is a community of communities. It’s built on shared interests, passion, and trust, and is home to the most open and authentic conversations on the internet. Every day, Reddit users submit, vote, and comment on the topics they care most about. With 100,000+ active communities and approximately 130 million daily active unique visitors, Reddit is one of the internet’s largest sources of information. For more information, visit
            - link "www.redditinc.com" [ref=f277e29] [cursor=pointer]:
              - /url: http://www.redditinc.com/
            - text: .
          - generic [ref=f277e30]:
            - paragraph [ref=f277e31]: Reddit’s Ads Data Science team is looking for a highly experienced Staff Data Scientist to advance the intelligence powering the advertiser experience on Reddit. In this role, you'll take deep ownership of a high-impact problem space within advertising, specializing in measurement, identity, and signal quality.
            - paragraph [ref=f277e32]: This is a high-impact, high-autonomy role where you'll influence strategic direction, set a high technical bar, and drive cross-functional initiatives across one or more critical focus areas in the Ads organization.
            - paragraph [ref=f277e33]:
              - strong [ref=f277e34]: "Responsibilities:"
            - list [ref=f277e35]:
              - listitem [ref=f277e36]:
                - strong [ref=f277e37]: "Design the Future of Ads Identity:"
                - text: Develop/employ probabilistic models for identity resolution. Design the methodology that links on-platform and off-platform actions to maximize addressability while honoring privacy.
              - listitem [ref=f277e38]:
                - strong [ref=f277e39]: "Advance Lift Methodologies & Experimentation:"
                - text: Own the statistical rigor behind Reddit’s Brand and Conversion Lift products. Innovate experimental design and develop infrastructure that supports large-scale, high-velocity, low-bias testing for advertisers.
              - listitem [ref=f277e40]:
                - strong [ref=f277e41]: "Maximize Signal for Predictive Performance:"
                - text: Define the strategy for new signal sources. You will mathematically quantify the value of these signals and work with modeling teams to incorporate them into predictive models, directly improving bidding efficiency and ROAS.
              - listitem [ref=f277e42]:
                - strong [ref=f277e43]: "Define Ground Truth & Evaluation Frameworks:"
                - text: Solve the industry-wide challenge of validating identity and measurement. Design the objective functions and truth sets used to train our models and measure the incremental impact of our identity graph.
              - listitem [ref=f277e44]:
                - strong [ref=f277e45]: "Lead Through Cross-Functional and Technical Influence:"
                - text: Collaborate deeply with engineering, product, and sales to align on strategic goals, translate insights into action, and drive execution. Set a high technical bar by mentoring others and championing best practices across modeling, experimentation, and measurement.
            - paragraph [ref=f277e46]:
              - strong [ref=f277e47]: "Qualifications:"
            - paragraph [ref=f277e48]:
              - strong [ref=f277e49]: "Required:"
            - list [ref=f277e50]:
              - listitem [ref=f277e51]: Advanced degree (Master's or Ph.D.) in Statistics, Mathematics, Physics, Economics, or Operations Research
              - listitem [ref=f277e52]: "For M.S. holders: 10+ years of industry experience in applied science or data science roles"
              - listitem [ref=f277e53]: "For Ph.D. holders: 6+ years of industry experience in applied science or data science roles"
              - listitem [ref=f277e54]: Deep understanding of the ads ecosystem
              - listitem [ref=f277e55]: "Demonstrated expertise in at least one of the following areas:"
              - list [ref=f277e56]:
                - listitem [ref=f277e57]: Measurement & Experimentation at Scale (with focus on lift and attribution)
                - listitem [ref=f277e58]: Identity Graph Creation & Resolution Methodology and Infrastructure
                - listitem [ref=f277e59]: Predictive Modeling with Signal Loss
              - listitem [ref=f277e60]: Advanced proficiency in statistical programming (Python or R) and SQL.
              - listitem [ref=f277e61]: Experience with machine learning or optimization techniques
              - listitem [ref=f277e62]: Strong understanding of experimental design, causal inference, or A/B testing methodologies
              - listitem [ref=f277e63]: Exceptional problem-solving and communication skills, with a track record of influencing product and engineering partners
              - listitem [ref=f277e64]: Experience working in fast-paced, ambiguous environments with cross-functional teams
            - paragraph [ref=f277e65]:
              - strong [ref=f277e66]: "Benefits:"
            - list [ref=f277e67]:
              - listitem [ref=f277e68]: Comprehensive Healthcare Benefits and Income Replacement Programs
              - listitem [ref=f277e69]: 401k with Employer Match
              - listitem [ref=f277e70]: Global Benefit programs that fit your lifestyle, from workspace to professional development to caregiving support
              - listitem [ref=f277e71]: Family Planning Support
              - listitem [ref=f277e72]: Gender-Affirming Care
              - listitem [ref=f277e73]: Mental Health & Coaching Benefits
              - listitem [ref=f277e74]: Flexible Vacation & Paid Volunteer Time Off
              - listitem [ref=f277e75]: Generous Paid Parental Leave
            - paragraph [ref=f277e76]
            - paragraph [ref=f277e77]: "#LI-Remote"
