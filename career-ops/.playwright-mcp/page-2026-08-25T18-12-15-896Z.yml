        - generic [ref=f633e21]:
          - generic [ref=f633e28]:
            - text: Reddit is a community of communities. It’s built on shared interests, passion, and trust, and is home to the most open and authentic conversations on the internet. Every day, Reddit users submit, vote, and comment on the topics they care most about. With 100,000+ active communities and approximately 130 million daily active unique visitors, Reddit is one of the internet’s largest sources of information. For more information, visit
            - link "www.redditinc.com" [ref=f633e29] [cursor=pointer]:
              - /url: http://www.redditinc.com/
            - text: .
          - generic [ref=f633e30]:
            - paragraph [ref=f633e31]:
              - text: Reddit is a community of communities. It’s built on shared interests, passion, and trust, and is home to the most open and authentic conversations on the internet. Every day, Reddit users submit, vote, and comment on the topics they care most about. With 100,000+ active communities and approximately 126 million daily active unique visitors, Reddit is one of the internet’s largest sources of information. For more information, visit
              - link "www.redditinc.com" [ref=f633e32] [cursor=pointer]:
                - /url: http://www.redditinc.com/
              - text: .
            - paragraph [ref=f633e33]: Reddit is poised to rapidly innovate and grow like no other time in its history. This is a unique opportunity to leave your mark on one of the most influential and trafficked corners of the internet.
            - paragraph [ref=f633e34]: Consumer data science plays a key role in fulfilling Reddit’s mission of bringing community & belonging to the world through deep understanding of how we can better connect people to the best information and communities for them - the heart of Reddit’s product - from crypto to support groups, gaming to AMAs, travel tips to memes.
            - paragraph [ref=f633e35]: Reddit's experimentation landscape presents uniquely challenging problems. Our platform is a deeply interconnected network of communities, contributors, and consumers – meaning that standard A/B testing assumptions often break down. We need a senior technical leader who thrives on these hard problems and can raise the bar for causal inference and experimentation rigor across the entire Consumer organization.
            - paragraph [ref=f633e36]: As a Senior Staff Data Scientist on the Consumer team, you will be the go-to expert on experimentation methodology, owning the most complex and high-stakes experimentation challenges across Consumer. You will shape how Reddit learns from its experiments, ensure we draw valid causal conclusions in the presence of network effects and interference, and influence product strategy through rigorous experimental design and analysis.
            - paragraph [ref=f633e37]:
              - strong [ref=f633e38]: "Responsibilities:"
            - list [ref=f633e39]:
              - listitem [ref=f633e40]: Serve as the technical authority on experimentation methodology across Consumer, setting standards for design, analysis, and interpretation of experiments in a complex, networked environment
              - listitem [ref=f633e41]: Tackle the hardest experimentation problems at Reddit, including spillover and network effects, interference between treatment and control, two-sided experimentation, and long-run effect estimation
              - listitem [ref=f633e42]: Develop and advance methods for causal inference in settings where standard randomization assumptions are violated, such as cluster-randomized designs, switchback experiments, and synthetic control approaches
              - listitem [ref=f633e43]: Design experimentation frameworks and guardrail metrics that account for ecosystem-level effects, ensuring product teams can measure true causal impact rather than biased local estimates
              - listitem [ref=f633e44]: Identify opportunities where improved experimentation methodology can unlock product insights that were previously unmeasurable or ambiguous
              - listitem [ref=f633e45]: Build and scale self-serve experimentation tools, platforms, and best-practice documentation that increase experimentation velocity and literacy across product, engineering, and design teams
              - listitem [ref=f633e46]: Influence the long-term product strategy by driving learning through well-designed experiments and translating experimental results into clear, actionable recommendations for senior leadership
              - listitem [ref=f633e47]: Mentor and elevate other data scientists across the organization on experimentation best practices, causal reasoning, and statistical rigor
              - listitem [ref=f633e48]: Publish and share methodological advances internally and, where appropriate, externally to contribute to the broader experimentation and causal inference community
            - paragraph [ref=f633e49]:
              - strong [ref=f633e50]: "Required Qualifications:"
            - list [ref=f633e51]:
              - listitem [ref=f633e52]: Ph.D. in Statistics, Econometrics, Economics, Computer Science, or a related quantitative field with a strong focus on causal inference or experimentation methodology; or M.S. with equivalent depth of expertise
              - listitem [ref=f633e53]: "For M.S. holders: 12+ years of industry experience in applied science, data science, or experimentation-focused roles"
              - listitem [ref=f633e54]: "For Ph.D. holders: 8+ years of industry experience in applied science, data science, or experimentation-focused roles"
              - listitem [ref=f633e55]: Deep expertise in causal inference, including practical experience with challenges such as network interference / spillovers, two-sided experimentation, switchback designs, cluster randomization, and/or synthetic control methods
              - listitem [ref=f633e56]: Strong theoretical grounding in experimental design, including power analysis, variance reduction techniques, sequential testing, and multiple comparison corrections
              - listitem [ref=f633e57]: Experience with experimentation platforms at scale (e.g., building or significantly extending an internal experimentation platform)
              - listitem [ref=f633e58]: Expert knowledge of SQL and proficiency in R and/or Python for statistical computing
              - listitem [ref=f633e59]: Track record of designing and analyzing experiments at scale in complex or networked environments
              - listitem [ref=f633e60]: Demonstrated ability to influence product and organizational strategy through experimentation insights
              - listitem [ref=f633e61]: Demonstrated ability to take ambiguous, technically complex problems and solve them in a structured, hypothesis-driven way
              - listitem [ref=f633e62]: Excellent communication skills with the ability to explain nuanced statistical concepts and tradeoffs to both technical and non-technical senior stakeholders
              - listitem [ref=f633e63]: Experience mentoring data scientists and building organizational capability in experimentation and causal reasoning
              - listitem [ref=f633e64]: Comfortable in innovative and fast-paced environments with a bias toward action
            - paragraph [ref=f633e65]:
              - strong [ref=f633e66]: "Preferred Qualifications:"
            - list [ref=f633e67]:
              - listitem [ref=f633e68]: Published research or industry contributions in areas such as interference in experiments, network experimentation, or marketplace causal inference
              - listitem [ref=f633e69]: Familiarity with Bayesian experimental methods, bandit algorithms, or adaptive experimental designs
              - listitem [ref=f633e70]: Experience with social network or user-generated content platforms where community-level dynamics create non-trivial experimentation challenges
            - paragraph [ref=f633e71]
            - paragraph [ref=f633e72]:
              - strong [ref=f633e73]: "Benefits:"
            - list [ref=f633e74]:
              - listitem [ref=f633e75]: Comprehensive Healthcare Benefits and Income Replacement Programs
              - listitem [ref=f633e76]: 401k with Employer Match
              - listitem [ref=f633e77]: Global Benefit programs that fit your lifestyle, from workspace to professional development to caregiving support
              - listitem [ref=f633e78]: Family Planning Support
