            - heading "Member of Technical Staff - X Money" [level=1] [ref=f481e14]
            - generic [ref=f481e15]: Tokyo, Japan
          - button "Apply" [ref=f481e19] [cursor=pointer]
        - generic [ref=f481e20]:
          - paragraph [ref=f481e22]: SpaceXAI’s mission is to create AI systems that can accurately understand the universe and aid humanity in its pursuit of knowledge. Our team is small, highly motivated, and focused on engineering excellence. This organization is for individuals who appreciate challenging themselves and thrive on curiosity. We operate with a flat organizational structure. All employees are expected to be hands-on and to contribute directly to the company’s mission. Leadership is given to those who show initiative and consistently deliver excellence. Work ethic and strong prioritization skills are important. All employees are expected to have strong communication skills. They should be able to concisely and accurately share knowledge with their teammates.
          - generic [ref=f481e23]:
            - heading "ABOUT THE ROLE:" [level=3] [ref=f481e24]
            - paragraph [ref=f481e25]: We are seeking a talented Software Engineer to join our X Money team, focused on building a revolutionary global payment network that will serve over 600 million users and rival the world’s largest financial institutions. In this role, you will specialize in backend development, designing and optimizing robust microservices to ensure scalability, security, and reliability. You will support full-stack efforts, collaborate with cross-functional teams on payments, fraud detection, and compliance initiatives, and contribute to the creation of a high-scale financial products platform. This is an opportunity to work on greenfield projects in a fast-paced, startup-like environment, driving innovation at the intersection of AI and finance.
            - heading "RESPONSIBILITIES:" [level=3] [ref=f481e26]
            - list [ref=f481e27]:
              - listitem [ref=f481e28]: Develop and optimize microservices for high-concurrency transactions using Go, Postgres, and Kafka.
              - listitem [ref=f481e29]: Collaborate on system architecture, testing, and monitoring to ensure uptime and performance.
              - listitem [ref=f481e30]: Build internal tools using frontend technologies as needed to support operational efficiency.
              - listitem [ref=f481e31]: Support the Technical Lead in risk mitigation and align with engineering, product, and compliance teams to drive project success.
              - listitem [ref=f481e32]: Contribute to the development of secure, scalable systems for handling financial data and transactions.
              - listitem [ref=f481e33]: Iterate rapidly on feedback to deliver high-quality solutions in a dynamic environment.
            - heading "BASIC QUALIFICATIONS:" [level=3] [ref=f481e34]
            - list [ref=f481e35]:
              - listitem [ref=f481e36]: 5+ years of software engineering experience, with a strong focus on backend development.
              - listitem [ref=f481e37]: Proficiency in Go or similar languages and experience with databases (e.g., Postgres) and streaming systems (e.g., Kafka).
              - listitem [ref=f481e38]: Familiarity with building distributed systems for high-scale, low-latency environments.
              - listitem [ref=f481e39]: Knowledge of handling secure financial data.
              - listitem [ref=f481e40]: Ability to contribute to frontend development for internal tools when required.
              - listitem [ref=f481e41]: Strong communication and problem-solving skills, with a collaborative mindset.
            - heading "PREFERRED SKILLS AND EXPERIENCE:" [level=3] [ref=f481e42]
            - list [ref=f481e43]:
              - listitem [ref=f481e44]: Experience in fintech, payments, or regulatory frameworks (e.g., PCI-DSS, AML/KYC).
              - listitem [ref=f481e45]: Prior work in a fast-paced, startup-like environment on greenfield projects.
              - listitem [ref=f481e46]: Comfort navigating ambiguous requirements and iterating based on feedback.
              - listitem [ref=f481e47]: Passion for leveraging AI to transform financial systems.
            - paragraph [ref=f481e48]
