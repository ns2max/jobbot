        - generic [ref=f107e19]:
          - generic [ref=f107e20]:
            - heading "About Arize" [level=3] [ref=f107e21]
            - paragraph [ref=f107e22]:
              - text: AI is rapidly transforming the world. As generative AI reshapes industries, teams need powerful ways to monitor, troubleshoot, and optimize their AI systems. That’s where we come in.
              - strong [ref=f107e23]: Arize AI is the leading AI & Agent Engineering observability and evaluation platform
              - text: ", empowering AI engineers to ship high-performing, reliable agents and applications. From first prototype to production scale, Arize AX unifies build, test, and run in a single workspace—so teams can ship faster with confidence."
            - paragraph [ref=f107e24]:
              - text: We’re a
              - strong [ref=f107e25]: Series C
              - text: company backed by top-tier investors,
              - strong [ref=f107e26]
              - text: with
              - strong [ref=f107e27]: over $135M in funding
              - text: and a rapidly growing customer base of
              - strong [ref=f107e28]: 150+ leading enterprises and Fortune 500 companies.
              - text: Customers like
              - link "Booking.com" [ref=f107e29] [cursor=pointer]:
                - /url: http://booking.com/
              - text: ", Uber, Siemens, and PepsiCo leverage Arize to deliver AI that works."
          - generic [ref=f107e30]:
            - heading [level=3] [ref=f107e31]:
              - strong [ref=f107e32]: The Opportunity
            - paragraph [ref=f107e33]: AI is rapidly transforming the world. Whether it’s developing the next generation of human-level intelligence, enhancing voice assistants, or enabling researchers to analyze genetic markers at scale, AI is increasingly integrated into various aspects of our daily lives.
            - paragraph [ref=f107e34]: Arize AI is the leading AI observability and evaluation platform, empowering AI engineers to build and deploy high-performing, reliable models. As the AI landscape shifts from traditional ML to generative AI and agentic systems, Arize ensures teams have the tools to monitor, troubleshoot, and improve AI in production.
            - paragraph [ref=f107e35]: We’re looking for an Open Source AI Engineer to join our growing OSS team to drive the development of new frameworks, metrics, and tooling that help people build, test, and improve LLM tasks. You’ll play a lead role in shaping how developers measure and understand performance in advanced AI systems, all in the open.
            - heading [level=3] [ref=f107e36]:
              - strong [ref=f107e37]: What You’ll Work On
            - list [ref=f107e38]:
              - listitem [ref=f107e39]: "Build LLM Observability Frameworks: Design, architect, and open-source new libraries, pipelines, and APIs that make it simpler to monitor, evaluate, and improve LLM output."
              - listitem [ref=f107e40]: "Collaborate with the Community: Partner closely with the broader AI open source ecosystem, gather feedback, review pull requests, and steer the direction of the project to address real developer needs."
              - listitem [ref=f107e41]: "Prototype and Iterate Rapidly: Experiment with state-of-the-art LLM techniques, turning research into practical developer tooling."
              - listitem [ref=f107e42]: "Improve Observability and Debugging: Integrate with our existing platform to surface deeper insights on LLM behavior—help teams quickly diagnose and fix issues such as hallucinations or bias."
              - listitem [ref=f107e43]: "Educate and Evangelize: Write blog posts, white papers, tutorials, and documentation to help developers succeed with our open source tools and grow the LLM eval community."
            - heading [level=3] [ref=f107e44]:
              - strong [ref=f107e45]: What We’re Looking For
            - paragraph [ref=f107e46]: "We’re looking for an engineer who’s deeply passionate about AI, loves working in the open, and thrives in a fast-paced environment where “everyone wears multiple hats”. You likely share our core values:"
            - list [ref=f107e47]:
              - listitem [ref=f107e48]: "Open Source Champion: You believe collaboration and community-driven development unlocks the best innovations."
              - listitem [ref=f107e49]: "Creative Problem Solver: You enjoy tackling ambiguous challenges and finding elegant technical solutions."
              - listitem [ref=f107e50]: "Data & Metrics Driven: You value empirical results, enjoy creating or refining evaluation metrics, and iterate based on real-world feedback."
              - listitem [ref=f107e51]: "Technically Curious: You’re always learning—exploring new LLM architectures, prompt engineering strategies, or emerging library standards."
              - listitem [ref=f107e52]: "Builder Mindset: You relish the process of taking ideas from initial prototypes to production-ready solutions that delight users."
            - heading [level=3] [ref=f107e53]:
              - strong [ref=f107e54]: Desired Skills & Experience
            - list [ref=f107e55]:
              - listitem [ref=f107e56]: "Hands-on LLM Experience: Familiarity with popular LLM frameworks, prompt engineering techniques, and agent harnesses."
              - listitem [ref=f107e57]: "Strong TypeScript Proficiency: You understand TypeScript and can write isomorphic code that executes seamlessly across clients, servers, and diverse edge runtimes."
              - listitem [ref=f107e58]: "Open Source Track Record: Contributions to open source projects, personal GitHub repos with interesting AI demos, or a history of active engagement in developer communities."
              - listitem [ref=f107e59]: "ML Observability & Tools: Familiarity with debugging AI applications, exploring embeddings, or building data-heavy dashboards is a plus."
            - heading [level=3] [ref=f107e60]:
              - strong [ref=f107e61]: Why Work With Us
            - list [ref=f107e62]:
              - listitem [ref=f107e63]: "Shape the Future of AI Evaluation: Be at the forefront of designing new ways to measure and improve next-generation LLMs."
              - listitem [ref=f107e64]: "High Impact, Real Ownership: Join a team that values autonomy and speed. You’ll drive major initiatives from day one and see your work used by developers worldwide."
              - listitem [ref=f107e65]: "Fully Remote, Flexible Environment: We are a fully remote company with offices in the Bay Area and NYC for those who prefer in-person collaboration."
              - listitem [ref=f107e66]: "Cutting-Edge Challenges: Our platform already helps analyze millions of AI predictions daily, giving you the chance to refine your evaluation tooling on real, large-scale production workloads."
              - listitem [ref=f107e67]: "Work With a Talented, Passionate Team: Collaborate closely with top engineers who are dedicated to making AI more transparent, reliable, and impactful."
            - paragraph [ref=f107e68]: "The estimated annual salary and variable compensation for this role is between $185,000 - $200,000, plus a competitive equity package. Actual compensation is determined based upon a variety of job related factors that may include: transferable work experience, skill sets, and qualifications. Total compensation also includes a comprehensive benefit package, including: medical, dental, vision, 401(k) plan, unlimited paid time off, generous parental leave plan, and others for mental and wellness support."
            - paragraph [ref=f107e69]: While we are a remote-first company, we have opened offices in New York City and the San Francisco Bay Area, as an option for those in those cities who wish to work in-person. For all other employees, there is a WFH monthly stipend to pay for co-working spaces.
            - paragraph [ref=f107e70]
          - generic [ref=f107e71]:
            - heading "More About Arize" [level=3] [ref=f107e72]
            - paragraph [ref=f107e73]: "Arize’s mission is to make the world’s AI work—and work for people.Our founders came together through a shared frustration: while investments in AI are growing rapidly across every industry, organizations face a critical challenge—understanding whether AI is performing and how to improve it at scale."
            - paragraph [ref=f107e74]: "Learn more about what we're doing here:"
            - paragraph [ref=f107e75]:
              - link "https://techcrunch.com/2025/02/20/arize-ai-hopes-it-has-first-mover-advantage-in-ai-observability/" [ref=f107e76] [cursor=pointer]:
                - /url: https://techcrunch.com/2025/02/20/arize-ai-hopes-it-has-first-mover-advantage-in-ai-observability/
            - paragraph [ref=f107e77]:
              - link "https://arize.com/blog/arize-ai-raises-70m-series-c-to-build-the-gold-standard-for-ai-evaluation-observability/" [ref=f107e78] [cursor=pointer]:
                - /url: https://arize.com/blog/arize-ai-raises-70m-series-c-to-build-the-gold-standard-for-ai-evaluation-observability/
            - paragraph [ref=f107e79]:
              - strong [ref=f107e80]: Diversity & Inclusion @ Arize
            - paragraph [ref=f107e81]: Our company's mission is to make AI work and make AI work for the people, we hope to make an impact in bias industry-wide and that's a big motivator for people who work here. We actively hope that individuals contribute to a good culture
            - list [ref=f107e82]:
              - listitem [ref=f107e83]: Regularly have chats with industry experts, researchers, and ethicists across the ecosystem to advance the use of responsible AI
              - listitem [ref=f107e84]: Culturally conscious events such as LGBTQ trivia during pride month
              - listitem [ref=f107e85]: We have an active Lady Arizers subgroup
