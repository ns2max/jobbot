              - generic [ref=f107e310]:
                - generic [ref=f107e311]:
                  - generic [ref=f107e312]: Form CC-305
                  - generic [ref=f107e313]: Page 1 of 1
                - generic [ref=f107e314]:
                  - generic [ref=f107e315]: OMB Control Number 1250-0005
                  - generic [ref=f107e316]: Expires 07/31/2029
              - strong [ref=f107e317]: Why are you being asked to complete this form?
              - paragraph [ref=f107e318]: We are a federal contractor or subcontractor. The law requires us to provide equal employment opportunity to qualified people with disabilities. We have a goal of having at least 7% of our workers as people with disabilities. The law says we must measure our progress towards this goal. To do this, we must ask applicants and employees if they have a disability or have ever had one. People can become disabled, so we need to ask this question at least every five years.
              - paragraph [ref=f107e319]:
                - text: Completing this form is voluntary, and we hope that you will choose to do so. Your answer is confidential. No one who makes hiring decisions will see it. Your decision to complete the form and your answer will not harm you in any way. If you want to learn more about the law or this form, visit the U.S. Department of Labor’s Office of Federal Contract Compliance Programs (OFCCP) website at
                - link "www.dol.gov/ofccp" [ref=f107e320] [cursor=pointer]:
                  - /url: https://www.dol.gov/ofccp
                - text: .
              - strong [ref=f107e321]: How do you know if you have a disability?
              - paragraph [ref=f107e322]:
                - text: A disability is a condition that substantially limits one or more of your “major life activities.” If you have or have ever had such a condition, you are a person with a disability.
                - strong [ref=f107e323]: "Disabilities include, but are not limited to:"
              - list [ref=f107e324]:
                - listitem [ref=f107e325]: Alcohol or other substance use disorder (not currently using drugs illegally)
                - listitem [ref=f107e326]: Autoimmune disorder, for example, lupus, fibromyalgia, rheumatoid arthritis, HIV/AIDS
                - listitem [ref=f107e327]: Blind or low vision
                - listitem [ref=f107e328]: Cancer (past or present)
                - listitem [ref=f107e329]: Cardiovascular or heart disease
                - listitem [ref=f107e330]: Celiac disease
                - listitem [ref=f107e331]: Cerebral palsy
                - listitem [ref=f107e332]: Deaf or serious difficulty hearing
                - listitem [ref=f107e333]: Diabetes
                - listitem [ref=f107e334]: Disfigurement, for example, disfigurement caused by burns, wounds, accidents, or congenital disorders
                - listitem [ref=f107e335]: Epilepsy or other seizure disorder
                - listitem [ref=f107e336]: Gastrointestinal disorders, for example, Crohn's Disease, irritable bowel syndrome
                - listitem [ref=f107e337]: Intellectual or developmental disability
                - listitem [ref=f107e338]: Mental health conditions, for example, depression, bipolar disorder, anxiety disorder, schizophrenia, PTSD
                - listitem [ref=f107e339]: Missing limbs or partially missing limbs
                - listitem [ref=f107e340]: Mobility impairment, benefiting from the use of a wheelchair, scooter, walker, leg brace(s) and/or other supports
                - listitem [ref=f107e341]: Nervous system condition, for example, migraine headaches, Parkinson’s disease, multiple sclerosis (MS)
                - listitem [ref=f107e342]: Neurodivergence, for example, attention-deficit/hyperactivity disorder (ADHD), autism spectrum disorder, dyslexia, dyspraxia, other learning disabilities
                - listitem [ref=f107e343]: Partial or complete paralysis (any cause)
                - listitem [ref=f107e344]: Pulmonary or respiratory conditions, for example, tuberculosis, asthma, emphysema
                - listitem [ref=f107e345]: Short stature (dwarfism)
                - listitem [ref=f107e346]: Traumatic brain injury
