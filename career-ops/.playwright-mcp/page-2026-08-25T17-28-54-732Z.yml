          - generic [ref=f101e36]:
            - heading [level=2] [ref=f101e37]:
              - strong [ref=f101e38]: About Liquid AI
            - paragraph [ref=f101e39]: Spun out of MIT CSAIL, we build general-purpose AI systems that run efficiently across deployment targets, from data center accelerators to on-device hardware, ensuring low latency, minimal memory usage, privacy, and reliability. We partner with enterprises across consumer electronics, automotive, life sciences, and financial services. We are scaling rapidly and need exceptional people to help us get there.
            - paragraph [ref=f101e40]
            - heading [level=2] [ref=f101e41]:
              - strong [ref=f101e42]: The Opportunity
            - paragraph [ref=f101e43]: Our Cluster Infrastructure team owns the compute environments that power foundation model training and research at Liquid AI. We are looking for a hands-on software engineer to keep our GPU clusters reliable, improve resource efficiency, and build the tooling that allows researchers to focus on model development rather than infrastructure.
            - paragraph [ref=f101e44]: This role matters because infrastructure issues can delay training by days, while improvements in utilization, storage management, and automation can significantly increase research velocity and reduce compute costs. You will work closely with researchers and infrastructure engineers, owning problems from immediate operational response through long-term platform improvements.
            - paragraph [ref=f101e45]
            - heading [level=2] [ref=f101e46]:
              - strong [ref=f101e47]: What We’re Looking For
            - paragraph [ref=f101e48]: "We need someone who:"
            - list [ref=f101e49]:
              - listitem [ref=f101e50]:
                - paragraph [ref=f101e51]:
                  - strong [ref=f101e52]: "Brings order to complex systems:"
                  - text: You identify root causes and build durable fixes rather than repeatedly firefighting.
              - listitem [ref=f101e53]:
                - paragraph [ref=f101e54]:
                  - strong [ref=f101e55]: "Is an engineer first:"
                  - text: You can go deep across Linux, networking, storage, schedulers, and distributed systems.
              - listitem [ref=f101e56]:
                - paragraph [ref=f101e57]:
                  - strong [ref=f101e58]: "Balances operations and engineering:"
                  - text: You handle urgent issues while steadily replacing manual work with automation.
              - listitem [ref=f101e59]:
                - paragraph [ref=f101e60]:
                  - strong [ref=f101e61]: "Owns outcomes:"
                  - text: You communicate clearly, prioritize effectively, and drive problems to resolution across internal teams and external providers.
            - paragraph [ref=f101e62]
            - heading [level=2] [ref=f101e63]:
              - strong [ref=f101e64]: The Work
            - list [ref=f101e65]:
              - listitem [ref=f101e66]:
                - paragraph [ref=f101e67]: Own the reliability and operation of the GPU clusters used for training and research.
              - listitem [ref=f101e68]:
                - paragraph [ref=f101e69]: Debug issues across compute, storage, networking, schedulers, and distributed workloads.
              - listitem [ref=f101e70]:
                - paragraph [ref=f101e71]: Improve CPU, GPU, and storage utilization through better tooling and automation.
              - listitem [ref=f101e72]:
                - paragraph [ref=f101e73]: Onboard and migrate workloads across GPU providers and hardware platforms.
              - listitem [ref=f101e74]:
                - paragraph [ref=f101e75]: Build monitoring, validation, and platform abstractions that reduce operational work for researchers.
              - listitem [ref=f101e76]:
                - paragraph [ref=f101e77]: Contribute to the longer-term architecture of Liquid AI’s training infrastructure and GPU platform.
            - paragraph [ref=f101e78]
            - heading [level=2] [ref=f101e79]:
              - strong [ref=f101e80]: Desired Experience
            - heading [level=3] [ref=f101e81]:
              - strong [ref=f101e82]: Must-have
            - list [ref=f101e83]:
              - listitem [ref=f101e84]:
                - paragraph [ref=f101e85]: Strong software engineering experience, with the ability to build production-quality infrastructure tooling and automation.
              - listitem [ref=f101e86]:
                - paragraph [ref=f101e87]: Deep knowledge of distributed systems, Linux, networking, and storage.
              - listitem [ref=f101e88]:
                - paragraph [ref=f101e89]: Experience operating a shared compute cluster or distributed training platform.
              - listitem [ref=f101e90]:
                - paragraph [ref=f101e91]: A track record of supporting production users and turning recurring failures into durable solutions.
              - listitem [ref=f101e92]:
                - paragraph [ref=f101e93]: The technical depth to partner effectively with senior research and infrastructure engineers.
            - heading [level=3] [ref=f101e94]:
              - strong [ref=f101e95]: Nice-to-have
            - list [ref=f101e96]:
              - listitem [ref=f101e97]:
                - paragraph [ref=f101e98]: Experience with SLURM, Kubernetes, Ray, Hadoop, or another distributed compute platform.
              - listitem [ref=f101e99]:
                - paragraph [ref=f101e100]: Experience supporting GPU, HPC, or large-scale AI training infrastructure.
              - listitem [ref=f101e101]:
                - paragraph [ref=f101e102]: Experience with distributed storage, cluster schedulers, cloud providers, or infrastructure control planes.
            - paragraph [ref=f101e103]
            - heading [level=2] [ref=f101e104]:
              - strong [ref=f101e105]: What Success Looks Like (Year One)
            - list [ref=f101e106]:
              - listitem [ref=f101e107]:
                - paragraph [ref=f101e108]: Researchers spend less time resolving infrastructure and resource-allocation issues.
              - listitem [ref=f101e109]:
                - paragraph [ref=f101e110]: GPU, CPU, and storage resources are used more efficiently across the fleet.
              - listitem [ref=f101e111]:
                - paragraph [ref=f101e112]: Recurring operational problems are replaced with automation, monitoring, and dependable platform tooling.
              - listitem [ref=f101e113]:
                - paragraph [ref=f101e114]: Liquid AI has the beginnings of a durable internal platform that hides infrastructure complexity from researchers.
