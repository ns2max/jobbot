            - heading "Member of Technical Staff - Imagine Safety" [level=1] [ref=f297e14]
            - generic [ref=f297e15]: Palo Alto, California
          - button "Apply" [ref=f297e19] [cursor=pointer]
        - generic [ref=f297e20]:
          - paragraph [ref=f297e22]: SpaceXAI’s mission is to create AI systems that can accurately understand the universe and aid humanity in its pursuit of knowledge. Our team is small, highly motivated, and focused on engineering excellence. This organization is for individuals who appreciate challenging themselves and thrive on curiosity. We operate with a flat organizational structure. All employees are expected to be hands-on and to contribute directly to the company’s mission. Leadership is given to those who show initiative and consistently deliver excellence. Work ethic and strong prioritization skills are important. All employees are expected to have strong communication skills. They should be able to concisely and accurately share knowledge with their teammates.
          - generic [ref=f297e23]:
            - heading "ABOUT THE ROLE:" [level=3] [ref=f297e24]
            - paragraph [ref=f297e25]: The Imagine team is redefining AI-driven media experiences for Grok users worldwide. As a Product Safety Engineer on the Imagine team, you will build the critical safety systems and infrastructure that ensure Grok’s multimodal generation capabilities (images, video, audio, and beyond) are powerful, delightful, and responsibly deployed. You’ll design and scale safeguards, detection systems, and evaluation frameworks that prevent harm while preserving creativity and user freedom. Your work will directly shape how millions of users experience generative media — balancing rapid innovation with rigorous safety, trustworthiness, and alignment with SpaceXAI's mission.If you’re a driven engineer passionate about AI safety, content integrity, and building robust systems that protect users without stifling innovation, this is your opportunity to make a lasting impact at the frontier of multimodal AI.
            - heading "RESPONSIBILITIES:" [level=3] [ref=f297e26]
            - list [ref=f297e27]:
              - listitem [ref=f297e28]: Design and implement scalable safety systems for Grok’s media generation platform, including real-time content moderation, risk detection, and safeguard enforcement for images, video, and audio.
              - listitem [ref=f297e29]: Build infrastructure to measure, monitor, and mitigate safety risks such as harmful content, bias, deepfakes, intellectual property issues, and misuse at global scale.
              - listitem [ref=f297e30]: Develop tools, pipelines, and evaluation frameworks that enable rapid iteration on safety policies in collaboration with researchers, product, and policy teams.
              - listitem [ref=f297e31]: Architect robust feedback loops between user interactions, model outputs, and training data to continuously improve safety while maintaining high performance and low latency.
              - listitem [ref=f297e32]: "Own full-cycle development of safety features: from problem definition and prototyping to deployment, monitoring, incident response, and long-term refinement."
              - listitem [ref=f297e33]: Partner closely with the Imagine engineering, research, and product teams to embed safety into core features and deliver delightful yet responsible user experiences.
            - heading "BASIC QUALIFICATIONS:" [level=3] [ref=f297e34]
            - list [ref=f297e35]:
              - listitem [ref=f297e36]: Proficiency in Rust, with a strong track record of writing clean, efficient, maintainable, and scalable code.
              - listitem [ref=f297e37]: Experience designing and building production safety, trust & safety, or content moderation systems for consumer-facing products at scale.
              - listitem [ref=f297e38]: Hands-on expertise developing real-time detection systems, data pipelines, or evaluation frameworks for high-throughput AI applications.
              - listitem [ref=f297e39]: Proven ability to deliver robust, reliable solutions that reach millions of users while maintaining high standards of uptime and performance.
              - listitem [ref=f297e40]: Strong problem-solving skills and a passion for turning complex safety challenges into practical, high-impact engineering solutions.
              - listitem [ref=f297e41]: Deep enthusiasm for responsible AI development and a commitment to building systems that advance humanity’s understanding while protecting users.
            - heading "PREFERRED SKILLS AND EXPERIENCE:" [level=3] [ref=f297e42]
            - list [ref=f297e43]:
              - listitem [ref=f297e44]: Experience with multimodal content safety (images, video, audio) or generative AI safety in production environments.
              - listitem [ref=f297e45]: Familiarity with machine learning classifiers, safety evaluation, red-teaming, or adversarial testing for media generation models.
              - listitem [ref=f297e46]: Background in distributed systems, real-time inference serving, Kubernetes, observability tools, or large-scale data infrastructure.
              - listitem [ref=f297e47]: Track record collaborating across engineering, research, and policy teams to ship safety-critical features quickly and effectively.
              - listitem [ref=f297e48]: Previous work on content moderation, anti-abuse, model alignment, or responsible AI at consumer AI products.
            - heading [level=3] [ref=f297e49]:
              - strong [ref=f297e51]: "COMPENSATION AND BENEFITS:"
            - paragraph [ref=f297e52]: $180,000 - $440,000 USD
            - paragraph [ref=f297e53]: Base salary is just one part of our total rewards package at SpaceXAI, which also includes equity, comprehensive medical, vision, and dental coverage, access to a 401(k) retirement plan, short & long-term disability insurance, life insurance, and various other discounts and perks.
