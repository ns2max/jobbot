            - heading "Staff AI Engineer | Canada | Remote" [level=1] [ref=f503e14]
            - generic [ref=f503e15]: Canada (Remote)
          - button "Apply" [ref=f503e19] [cursor=pointer]
        - generic [ref=f503e20]:
          - generic [ref=f503e21]:
            - paragraph [ref=f503e22]:
              - text: Grafana Labs, the company behind the open observability cloud, is founded on the principles of open source, open standards, open ecosystems, and open culture. Grafana Cloud, our fully managed observability platform, is flexible and built for scale. With Grafana Cloud's actually useful AI, organizations can see, understand, and act on all their disparate data to move at the speed of their ambitions. Today, more than 35 million users and 7,000+ customers – including Anthropic, Bloomberg, NVIDIA, Microsoft, and Salesforce – trust Grafana Labs to ensure reliability of their applications and systems, resolve incidents quickly, and optimize their telemetry to reduce noise and cost. We are a 100% remote company with 1,600+ team members across 40+ countries, and we’re backed by leading investors including Lightspeed Venture Partners, Sequoia Capital, GIC, Coatue, J.P. Morgan, CapitalG, and Lead Edge Capital. Learn more at
              - link "grafana.com" [ref=f503e25] [cursor=pointer]:
                - /url: http://grafana.com
              - text: and follow us on
              - link "LinkedIn" [ref=f503e28] [cursor=pointer]:
                - /url: https://www.linkedin.com/company/grafana-labs/
              - text: and
              - link "X" [ref=f503e31] [cursor=pointer]:
                - /url: https://twitter.com/grafana
              - text: .
            - paragraph [ref=f503e32]: "We’re scaling fast and staying true to what makes us different: an open-source legacy, a global collaborative culture, and a passion for meaningful work. Our team thrives in an innovation-driven environment where transparency, autonomy, and trust fuel everything we do."
            - paragraph [ref=f503e33]: You may not meet every requirement, and that’s okay. If this role excites you, we’d love you to raise your hand for what could be a truly career-defining opportunity.
          - generic [ref=f503e34]:
            - paragraph [ref=f503e35]: This is a remote opportunity and we are looking for candidates from Canada. Residents of Quebec are not eligible for this role.
            - paragraph [ref=f503e36]:
              - strong [ref=f503e37]: The Opportunity
            - paragraph [ref=f503e38]: Grafana Labs is seeking a Staff Engineer (AI & Automation) to own the AI agent infrastructure and automation platform that powers our Marketing Operations organization. You’ll build multi-agent architectures, LLM integrations, and backend services that connect AI models to internal and third-party data platforms. You’ll ship production systems that teams depend on daily.
            - paragraph [ref=f503e39]: This is a high-autonomy role where you own the technical direction. You’ll identify the highest-leverage problems across Marketing, RevOps, and SDR teams, design the solutions, and ship them. You’ll define the technical direction for the automation platform (data models, API contracts, shared libraries, reference architectures) and partner with Data Engineering, GTM Systems, and Field Operations to build scalable, self-service automation that eliminates manual work and drives operational efficiency.
            - paragraph [ref=f503e40]:
              - strong [ref=f503e41]: What You'll Be Doing
            - paragraph [ref=f503e42]: Agentic Systems & AI Infrastructure
            - list [ref=f503e43]:
              - listitem [ref=f503e44]: Own end-to-end development of multi-agent AI systems, from architecture and implementation through testing, deployment, and ongoing operation
              - listitem [ref=f503e45]: Build modular, composable agentic systems using orchestration frameworks (LangChain, CrewAI, Anthropic MCP, or similar) that operate 24/7 across teams
              - listitem [ref=f503e46]: Develop reusable agentic skills that agents invoke across interfaces (Slack, dashboards, internal apps, CLIs)
              - listitem [ref=f503e47]: Implement observability and feedback loops including logging, performance metrics, prompt iteration, model evaluation, and cost management
              - listitem [ref=f503e48]: Establish governance and compliance standards for AI workflows including access controls, audit trails, PII handling, and human-in-the-loop escalation paths
            - paragraph [ref=f503e49]: Systems Integration & Backend Services
            - list [ref=f503e50]:
              - listitem [ref=f503e51]: Build MCP servers, APIs, CLIs, and microservices connecting AI models to business systems (BigQuery, Slack, CRMs, email, calendars, analytics tools)
              - listitem [ref=f503e52]: Architect data flows for retrieval-augmented generation (RAG), connecting LLMs to internal knowledge bases, customer data, and real-time business context
              - listitem [ref=f503e53]: Build serverless or containerized services (GCP Cloud Functions, Cloud Run) that scale with usage and integrate with Grafana's cloud infrastructure
            - paragraph [ref=f503e54]: Automation & Workflow Enablement
            - list [ref=f503e55]:
              - listitem [ref=f503e56]: Partner with RevOps, Demand Generation, Regional Marketing, and SDR teams to scope high-impact automation problems, identify bottlenecks, and build solutions with measurable business outcomes
              - listitem [ref=f503e57]: Design and deploy workflows using orchestration tools (n8n, Workato, or custom platforms) with CI/CD, testing, and production reliability standards
              - listitem [ref=f503e58]: Build systems designed for self-service with documentation, playbooks, and enablement materials that let partner teams operate independently
            - paragraph [ref=f503e59]: We invest heavily in developer productivity. You'll have access to AI coding assistants (Claude Code, Gemini CLI, OpenAI Codex, and others of your choice within security guidelines). We encourage pragmatic AI-assisted development paired with strong code review and quality standards.
            - paragraph [ref=f503e60]:
              - strong [ref=f503e61]: What Makes You a Great Fit
            - list [ref=f503e62]:
              - listitem [ref=f503e63]: 8+ years of software engineering experience with depth in backend development, systems integration, or data/analytics engineering
              - listitem [ref=f503e64]: 2+ years hands-on experience applying LLMs/AI to production workflows, not just prototypes
              - listitem [ref=f503e65]: Strong proficiency in Python and JavaScript/Node.js with Git-based workflows, code review practices, and testing discipline
              - listitem [ref=f503e66]: Hands-on experience with LLM frameworks and patterns including prompt engineering, RAG, function calling/tool use, structured output parsing, and evaluation
              - listitem [ref=f503e67]: Experience building and operating multi-agent systems at scale including agent decomposition, orchestration patterns (sequential chains, router/dispatcher, parallel fan-out), state management, and production monitoring
              - listitem [ref=f503e68]: You diagnose business problems before writing code. You think in workflows and outcomes, not just functions.
              - listitem [ref=f503e69]: Deep familiarity with Google Cloud Platform, BigQuery, and serverless/containerized services (Cloud Functions, Cloud Run)
              - listitem [ref=f503e70]: Understanding of LLM failure modes and production mitigations including confidence thresholds, fallback logic, human escalation, and cost/latency management
              - listitem [ref=f503e71]: Proven ability to identify high-leverage problems, push back on low-impact requests, and deliver end-to-end with minimal direction
              - listitem [ref=f503e72]: Fluent with AI-assisted development tools (GitHub Copilot, Cursor, Claude Code). You use AI to build AI systems
              - listitem [ref=f503e73]: Clear technical communicator who can explain complex systems in simple terms to both engineers and business stakeholders
            - paragraph [ref=f503e74]:
              - strong [ref=f503e75]: Bonus Points
            - list [ref=f503e76]:
              - listitem [ref=f503e77]: Experience with vector databases or retrieval pipelines (Pinecone, Weaviate, ChromaDB, Qdrant, pgvector)
              - listitem [ref=f503e78]: Familiarity with marketing or sales platforms (Salesforce, Customer.io, HubSpot, Marketo, Outreach)
              - listitem [ref=f503e79]: Experience with frontend frameworks (React, Slack Block Kit) for building user-facing AI tool interfaces
              - listitem [ref=f503e80]: Observability tooling for AI systems (LangSmith, Weights & Biases, custom evaluation frameworks)
              - listitem [ref=f503e81]: Experience with workflow orchestration platforms (n8n, Temporal, Prefect, Airflow)
              - listitem [ref=f503e82]: Familiarity with Model Context Protocol (MCP) or similar standards for connecting AI systems to data sources
              - listitem [ref=f503e83]: Prior work automating marketing, sales, or customer success workflows in a B2B SaaS environment
              - listitem [ref=f503e84]: Active in open-source communities. Grafana is built on OSS and we value engineers who share that DNA
            - paragraph [ref=f503e85]: In Canada, the base compensation range for this role is CAD 164,490 - CAD 197,389. Actual compensation may vary based on level, experience, and skillset as assessed throughout the interview process. All of our roles include Restricted Stock Units (RSUs), giving every team member ownership in Grafana Labs' success. We believe in shared outcomes—RSUs help us stay aligned and invested as we scale globally.
