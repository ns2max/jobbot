              - paragraph [ref=e112]
              - paragraph [ref=e113]: Connection is everything. It drives us to innovate, explore, and stay close to what matters to us most. At Bell, we’re building a more connected future through world-class networks, AI-powered solutions, and digital experiences that elevate how people live, work, and play every day.
              - paragraph [ref=e114]
              - paragraph [ref=e115]: "We believe in empowering people. That’s why we equip our teams with cutting-edge technology, AI tools, and a collaborative environment that supports creativity and growth. Want to be part of a diverse team where your work makes a real impact? If you’re inspired by innovation that advances how people connect and transforms what’s possible, you belong on #TeamBell."
              - paragraph [ref=e116]
              - paragraph [ref=e117]
              - generic [ref=e118]:
                - generic [ref=e119]:
                  - heading "Summary" [level=2] [ref=e121]
                  - generic [ref=e122]:
                    - paragraph [ref=e123]
                    - paragraph [ref=e124]: The successful candidate will hold a key role within the Consumer Business Intelligence (CBI) group, acting as the technical lead and primary AI capability builder for a highly delivery focused team. In this hands-on capacity, you will guide the shift from AI experimentation to production deployment by delivering priority use cases and establishing robust engineering standards across the vertical.Operating at the forefront of applied artificial intelligence, you will provide technical guidance and direction to the broader team on AI solutioning and architecture. This role requires an intense focus on building and deploying scalable agentic workflows, machine learning models, and integrations across our enterprise stack to unlock immediate business value.
                - generic [ref=e125]:
                  - heading "Key Responsibilities" [level=2] [ref=e127]
                  - generic [ref=e128]:
                    - paragraph [ref=e129]
                    - list [ref=e130]:
                      - listitem [ref=e131]: Design, build and deploy end-to-end production artificial intelligence solutions to address priority business needs
                      - listitem [ref=e132]: Develop agentic workflows and multi-agent orchestration on enterprise platforms including Gemini Enterprise, AWS Bedrock and Azure AI Foundry
                      - listitem [ref=e133]: Architect and optimize retrieval-augmented generation pipelines including chunking, embedding, vector store design and grounding
                      - listitem [ref=e134]: Lead machine learning model development from initial feature engineering through evaluation, explainability and production monitoring
                      - listitem [ref=e135]: Establish rigorous engineering standards covering Git workflows, code review, repository structure, testing, continuous integration and deployment
                      - listitem [ref=e136]: Build robust data and integration pipelines connecting enterprise systems including Teradata, BigQuery and Salesforce
                      - listitem [ref=e137]: Provide technical leadership and hands-on guidance to upskill team members on advanced artificial intelligence techniques
                      - listitem [ref=e138]: Partner with business intelligence stakeholders to assess feasibility, effort, risk and value for incoming use casesImplement responsible evaluation practices encompassing accuracy testing, hallucination guardrails, human-in-the-loop controls and cost monitoringMaintain a continuous awareness of the rapidly evolving technological landscape to introduce new capabilities to the team
                - generic [ref=e139]:
                  - heading "Critical Qualifications" [level=2] [ref=e141]
                  - generic [ref=e142]:
                    - paragraph [ref=e143]
                    - list [ref=e144]:
                      - listitem [ref=e145]: Bachelor’s or Master’s degree in computer science, data science, engineering, statistics or a related field
                      - listitem [ref=e146]: 2 or more years of hands-on data science, machine learning or AI engineering experience with demonstrated production delivery
                      - listitem [ref=e147]: Advanced proficiency in Python and SQL with extensive enterprise data warehouse experience such as Teradata
                      - listitem [ref=e148]: Demonstrated hands-on generative AI delivery including agentic workflows and retrieval-augmented generation supported by a portfolio or practical experience
                      - listitem [ref=e149]: Hands-on experience building solutions on at least one major cloud artificial intelligence platform
                      - listitem [ref=e150]: Solid machine learning foundations with framework experience including scikit-learn, XGBoost, PyTorch or TensorFlow
                      - listitem [ref=e151]: Deep expertise in Git-based development workflows and modern software engineering best practices
                      - listitem [ref=e152]: Passion for maintaining a forward-looking mindset with a strong willingness to challenge conventional approaches to artificial intelligence
                      - listitem [ref=e153]: Ability to work in a fast paced, dynamic environment and manage multiple projects through effective prioritization
                      - listitem [ref=e154]: Ability to communicate effectively with all levels of the organization, including the ability to grasp complex AI concepts and explain them clearly to large non-technical audiences
                      - listitem [ref=e155]: Strong data analytical and problem solving skills and demonstrated ability to be highly creative in formulating solutions
                - generic [ref=e156]:
