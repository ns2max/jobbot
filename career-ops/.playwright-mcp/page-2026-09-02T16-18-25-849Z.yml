                      - listitem [ref=e163]: Strong understanding of MLOps and LLMOps practices for deploying and managing models at scale
                      - listitem [ref=e164]: Advanced modelling and optimization techniques such as constraint programming and operations research
                      - listitem [ref=e165]: Experience with Salesforce, Tableau or comparable customer relationship management and business intelligence platforms
                      - listitem [ref=e166]: Bilingual (French/English) is an asset
                      - listitem [ref=e167]: Telco experience is considered an asset
