        - generic [ref=f497e17]:
          - generic [ref=f497e18]:
            - paragraph [ref=f497e19]:
              - strong [ref=f497e20]: Machine Learning Engineer, Platform
            - paragraph [ref=f497e21]: London, UK
            - paragraph [ref=f497e22]: Scale GP (Scale Generative AI Platform) is an enterprise-grade Generative AI platform that provides APIs for knowledge retrieval, inference, evaluation, and agentic workflows. We are looking for a Machine Learning Engineer to join our team and build the retrieval and knowledge representation systems at the heart of the platform. You will own ML components end to end — from research and prototyping through to production deployment — working across knowledge bases, vector stores, RAG pipelines, and context engines to power agents that deliver real impact for enterprise customers.
            - paragraph [ref=f497e23]:
              - strong [ref=f497e24]: "You will:"
            - list [ref=f497e25]:
              - listitem [ref=f497e26]: Own large areas of platform end to end, driving components from design through to production deployment.
              - listitem [ref=f497e27]: Work on knowledge representation systems, including ontologies and knowledge graphs, to support structured reasoning over enterprise data.
              - listitem [ref=f497e28]: Design and implement RAG pipelines, including chunking, embedding, indexing, retrieval, and reranking.
              - listitem [ref=f497e29]: Build and maintain integrations between retrieval and ML components and diverse enterprise data sources, vector databases, APIs, and services.
              - listitem [ref=f497e30]: Develop context retrieval systems that balance recall, precision, latency, and cost.
              - listitem [ref=f497e31]: Build evaluation frameworks, datasets, and metrics to measure retrieval quality, context relevance, and end to end agent performance.
              - listitem [ref=f497e32]: Build reliable backend services and data pipelines that support ML and LLM components in production.
              - listitem [ref=f497e33]: Deliver experiments and new capabilities quickly, maintaining high quality and tight feedback loops with customers.
              - listitem [ref=f497e34]: Collaborate across product, ML, and infrastructure teams to shape the direction of the platform.
            - paragraph [ref=f497e35]:
              - strong [ref=f497e36]: "Ideally you'd have:"
            - list [ref=f497e37]:
              - listitem [ref=f497e38]: 5+ years of experience building and deploying machine learning or AI systems for real-world, production use cases.
              - listitem [ref=f497e39]: Strong engineering fundamentals, supported by a Master’s or PhD degree in Computer Science, Machine Learning, AI, or equivalent practical experience..
              - listitem [ref=f497e40]: A deep, hands-on understanding of retrieval systems, RAG, embeddings, vector indexing, and knowledge representation.
              - listitem [ref=f497e41]: Experience with knowledge representation, semantic search, or agentic systems.
              - listitem [ref=f497e42]: Proven proficiency in Python, including writing production-quality, testable, and maintainable code.
              - listitem [ref=f497e43]: Experience scaling or shipping products at high-growth startups.
              - listitem [ref=f497e44]: The ability to operate in ambiguous problem spaces, balancing research-driven approaches with pragmatic product constraints.
              - listitem [ref=f497e45]: Strong communication skills and comfort working in customer-facing or cross-functional environments.
          - generic [ref=f497e46]:
            - paragraph [ref=f497e47]:
              - strong [ref=f497e48]:
                - emphasis [ref=f497e49]: "PLEASE NOTE:"
              - emphasis [ref=f497e50]: Our policy requires a 90-day waiting period before reconsidering candidates for the same role. This allows us to ensure a fair and thorough evaluation of all applicants.
            - paragraph [ref=f497e51]:
              - strong [ref=f497e52]: "About Us:"
            - paragraph [ref=f497e53]:
              - emphasis [ref=f497e54]: At Scale, our mission is to develop reliable AI systems for the world's most important decisions. Our products provide the high-quality data and full-stack technologies that power the world's leading models, and help enterprises and governments build, deploy, and oversee AI applications that deliver real impact. We work closely with industry leaders like Meta,
              - emphasis [ref=f497e55]: Ernst
              - emphasis [ref=f497e56]
              - emphasis [ref=f497e57]: "&"
              - emphasis [ref=f497e58]: Young, Mayo Clinic, Time Inc., the Government of Qatar, and U.S. government agencies including the Army and Air Force. We are expanding our team to accelerate the development of AI applications.
            - paragraph [ref=f497e59]:
              - emphasis [ref=f497e60]: We believe that everyone should be able to bring their whole selves to work, which is why we are proud to be an inclusive and equal opportunity workplace. We are committed to equal employment opportunity regardless of race, color, ancestry, religion, sex, national origin, sexual orientation, age, citizenship, marital status, disability status, gender identity or Veteran status.
            - paragraph [ref=f497e61]:
              - emphasis [ref=f497e62]: We are committed to working with and providing reasonable accommodations to applicants with physical and mental disabilities. If you need assistance and/or a reasonable accommodation in the application or recruiting process due to a disability, please contact us at accommodations@scale.com. Please see the United States Department of Labor's
              - link [ref=f497e63] [cursor=pointer]:
                - /url: https://www.eeoc.gov/sites/default/files/2023-06/22-088_EEOC_KnowYourRights6.12ScreenRdr.pdf
                - emphasis [ref=f497e64]: Know Your Rights poster
              - emphasis [ref=f497e65]: for additional information.
            - paragraph [ref=f497e66]:
              - emphasis [ref=f497e67]: We comply with the United States Department of Labor's
              - emphasis [ref=f497e68]: Pay Transparency provision
              - emphasis [ref=f497e69]: .
            - paragraph [ref=f497e70]:
