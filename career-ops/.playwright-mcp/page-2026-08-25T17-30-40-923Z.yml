              - heading "Voluntary Self-Identification of Disability" [level=2] [ref=f125e301]
              - generic [ref=f125e302]:
                - generic [ref=f125e303]:
                  - generic [ref=f125e304]: Form CC-305
                  - generic [ref=f125e305]: Page 1 of 1
                - generic [ref=f125e306]:
                  - generic [ref=f125e307]: OMB Control Number 1250-0005
                  - generic [ref=f125e308]: Expires 07/31/2029
              - strong [ref=f125e309]: Why are you being asked to complete this form?
              - paragraph [ref=f125e310]: We are a federal contractor or subcontractor. The law requires us to provide equal employment opportunity to qualified people with disabilities. We have a goal of having at least 7% of our workers as people with disabilities. The law says we must measure our progress towards this goal. To do this, we must ask applicants and employees if they have a disability or have ever had one. People can become disabled, so we need to ask this question at least every five years.
              - paragraph [ref=f125e311]:
                - text: Completing this form is voluntary, and we hope that you will choose to do so. Your answer is confidential. No one who makes hiring decisions will see it. Your decision to complete the form and your answer will not harm you in any way. If you want to learn more about the law or this form, visit the U.S. Department of Labor’s Office of Federal Contract Compliance Programs (OFCCP) website at
                - link "www.dol.gov/ofccp" [ref=f125e312] [cursor=pointer]:
                  - /url: https://www.dol.gov/ofccp
                - text: .
              - strong [ref=f125e313]: How do you know if you have a disability?
              - paragraph [ref=f125e314]:
                - text: A disability is a condition that substantially limits one or more of your “major life activities.” If you have or have ever had such a condition, you are a person with a disability.
                - strong [ref=f125e315]: "Disabilities include, but are not limited to:"
              - list [ref=f125e316]:
                - listitem [ref=f125e317]: Alcohol or other substance use disorder (not currently using drugs illegally)
                - listitem [ref=f125e318]: Autoimmune disorder, for example, lupus, fibromyalgia, rheumatoid arthritis, HIV/AIDS
                - listitem [ref=f125e319]: Blind or low vision
                - listitem [ref=f125e320]: Cancer (past or present)
                - listitem [ref=f125e321]: Cardiovascular or heart disease
                - listitem [ref=f125e322]: Celiac disease
                - listitem [ref=f125e323]: Cerebral palsy
                - listitem [ref=f125e324]: Deaf or serious difficulty hearing
                - listitem [ref=f125e325]: Diabetes
                - listitem [ref=f125e326]: Disfigurement, for example, disfigurement caused by burns, wounds, accidents, or congenital disorders
                - listitem [ref=f125e327]: Epilepsy or other seizure disorder
                - listitem [ref=f125e328]: Gastrointestinal disorders, for example, Crohn's Disease, irritable bowel syndrome
                - listitem [ref=f125e329]: Intellectual or developmental disability
                - listitem [ref=f125e330]: Mental health conditions, for example, depression, bipolar disorder, anxiety disorder, schizophrenia, PTSD
                - listitem [ref=f125e331]: Missing limbs or partially missing limbs
                - listitem [ref=f125e332]: Mobility impairment, benefiting from the use of a wheelchair, scooter, walker, leg brace(s) and/or other supports
                - listitem [ref=f125e333]: Nervous system condition, for example, migraine headaches, Parkinson’s disease, multiple sclerosis (MS)
                - listitem [ref=f125e334]: Neurodivergence, for example, attention-deficit/hyperactivity disorder (ADHD), autism spectrum disorder, dyslexia, dyspraxia, other learning disabilities
                - listitem [ref=f125e335]: Partial or complete paralysis (any cause)
                - listitem [ref=f125e336]: Pulmonary or respiratory conditions, for example, tuberculosis, asthma, emphysema
                - listitem [ref=f125e337]: Short stature (dwarfism)
                - listitem [ref=f125e338]: Traumatic brain injury
