        - generic [ref=f125e19]:
          - generic [ref=f125e20]:
            - strong [ref=f125e23]: "About Glean:"
            - generic [ref=f125e25]: Glean is the Work AI platform that helps everyone work smarter with AI. What began as the industry’s most advanced enterprise search has evolved into a full-scale Work AI ecosystem, powering intelligent Search, an AI Assistant, and scalable AI agents on one secure, open platform. With over 100 enterprise SaaS connectors, flexible LLM choice, and robust APIs, Glean gives organizations the infrastructure to govern, scale, and customize AI across their entire business - without vendor lock-in or costly implementation cycles.
            - generic [ref=f125e27]: "At its core, Glean is redefining how enterprises find, use, and act on knowledge. Its Enterprise Graph and Personal Knowledge Graph map the relationships between people, content, and activity, delivering deeply personalized, context-aware responses for every employee. This foundation powers Glean’s agentic capabilities - AI agents that automate real work across teams by accessing the industry’s broadest range of data: enterprise and world, structured and unstructured, historical and real-time. The result: measurable business impact through faster onboarding, hours of productivity gained each week, and smarter, safer decisions at every level."
            - generic [ref=f125e29]: Recognized by Fast Company as one of the World’s Most Innovative Companies (Top 10, 2025), by CNBC’s Disruptor 50, Bloomberg’s AI Startups to Watch (2026), Forbes AI 50, and Gartner’s Tech Innovators in Agentic AI, Glean continues to accelerate its global impact. With customers across 50+ industries and 1,000+ employees in more than 25 countries, we’re helping the world’s largest organizations make every employee AI-fluent, and turning the superintelligent enterprise from concept into reality.
            - generic [ref=f125e31]: If you’re excited to shape how the world works, you’ll help build systems used daily across Microsoft Teams, Zoom, ServiceNow, Zendesk, GitHub, and many more - deeply embedded where people get things done. You’ll ship agentic capabilities on an open, extensible stack, with the craft and care required for enterprise trust, as we bring Work AI to every employee, in every company.
          - generic [ref=f125e32]:
            - paragraph [ref=f125e33]:
              - strong [ref=f125e34]: About the Team
            - paragraph [ref=f125e35]: "Building a great AI assistant is only half the battle; knowing whether it is actually great is the other half. The Evals & Observability team owns the measurement and quality layer that makes Glean’s Assistant and Agents reliably better over time: evaluation pipelines, quality evalsets, LLM-powered judges, agent observability, and the tooling engineers use to understand what changed and why."
            - paragraph [ref=f125e36]: This is a rare opportunity to work at the intersection of distributed systems, data infrastructure, applied AI, and product quality. You will help build the systems that decide whether new models, prompts, retrieval strategies, and agent workflows are ready to ship to enterprise customers.
            - paragraph [ref=f125e37]:
              - strong [ref=f125e38]: About the Role
            - paragraph [ref=f125e39]: We are looking for backend and infrastructure engineers in Bangalore to build the platforms that measure, explain, and improve AI quality at scale. You will own core systems for running large-scale evaluations, processing traces, powering observability workflows, and giving engineers clear signals about assistant and agent behavior — including how Glean evaluates frontier model releases and the latest open-source model drops before they shape customer-facing AI experiences.
            - paragraph [ref=f125e40]: This role is ideal for someone who loves building reliable distributed systems, cares deeply about product quality, and wants their infrastructure work to directly shape how AI products are shipped. You will work on systems that need to be scalable, secure, permissions-aware, fast, and cost-efficient.
            - paragraph [ref=f125e41]:
              - strong [ref=f125e42]: You will
            - list [ref=f125e43]:
              - listitem [ref=f125e44]: Design and build large-scale evaluation pipelines that measure assistant and agent quality across thousands of real user and synthetic workflows.
              - listitem [ref=f125e45]: Evaluate frontier model releases and the latest OSS model drops, building the infrastructure and quality signals that help Glean understand regressions, tradeoffs, and launch readiness.
              - listitem [ref=f125e46]: Build agent observability infrastructure, including trace enrichment, durable telemetry pipelines, dashboards, and debugging workflows that make AI behavior inspectable.
              - listitem [ref=f125e47]: Own backend systems from architecture and design docs through production rollout, reliability, monitoring, and iteration.
              - listitem [ref=f125e48]: Partner with product, ML, and infrastructure engineers to make evals a first-class part of how Glean ships AI features.
              - listitem [ref=f125e49]: Improve the quality loop by connecting eval results, customer feedback, regression analysis, and engineering workflows into concrete product improvements.
              - listitem [ref=f125e50]: Build systems that balance speed, reliability, enterprise security, and cost across modern cloud-native environments.
              - listitem [ref=f125e51]: Mentor other engineers, raise the bar for technical design, and help shape the engineering culture of Glean’s Bangalore AI quality team.
            - paragraph [ref=f125e52]:
              - strong [ref=f125e53]: About you
            - list [ref=f125e54]:
              - listitem [ref=f125e55]: You have 6+ years of software engineering experience building backend systems, infrastructure, distributed systems, or data platforms.
              - listitem [ref=f125e56]: You have strong coding skills in Go, Python, Java, C++, or similar languages, with an emphasis on reliability, scale, and well-tested components.
              - listitem [ref=f125e57]: You are comfortable working with distributed data pipelines, production services, observability systems, or cloud-native infrastructure.
              - listitem [ref=f125e58]: You are analytically rigorous and care about whether metrics reflect real user experience, not just whether dashboards look good.
              - listitem [ref=f125e59]: You enjoy customer-focused, cross-functional environments and are willing to take on whatever is most impactful for the company.
              - listitem [ref=f125e60]: You care deeply about quality, both in the systems you build and in the AI product you help measure and improve.
              - listitem [ref=f125e61]: Experience with LLM applications, evals, tracing, data warehouses, workflow orchestration, or ML infrastructure is a strong plus.
            - paragraph [ref=f125e62]:
              - strong [ref=f125e64]: "Location:"
            - list [ref=f125e65]:
              - listitem [ref=f125e66]: This role is in person in Bangalore, India
            - paragraph [ref=f125e67]:
              - strong [ref=f125e69]: "Compensation & Benefits:"
            - paragraph [ref=f125e70]: Compensation offered will be determined by factors such as location, level, job-related knowledge, skills, and experience. Certain roles may be eligible for variable compensation, equity, and benefits.
            - paragraph [ref=f125e71]: We are a diverse bunch of people and we want to continue to attract and retain a diverse range of people into our organization. We're committed to an inclusive and diverse company. We do not discriminate based on gender, ethnicity, sexual orientation, religion, civil or family status, age, disability, or race.
          - generic [ref=f125e72]:
            - strong [ref=f125e76]: "AI-First Mindset at Glean:"
            - generic [ref=f125e79]:
              - text: At Glean, AI fluency is core to how we work and we're committed to ensuring every new hire feels confident integrating AI into their everyday work.
              - strong [ref=f125e80]: As part of the interview process, you'll complete a brief AI-focused exercise or discussion so we can understand how you think about, design, and use AI to drive impact in your role.
              - text: Feel free to reference any tools, platforms, or workflows you use today — prior Glean experience isn't required.
            - strong [ref=f125e84]: "Global Data Privacy Notice for Job Candidates and Applicants:"
