              - emphasis [ref=f141e62]: Our policy requires a 90-day waiting period before reconsidering candidates for the same role. This allows us to ensure a fair and thorough evaluation of all applicants.
            - paragraph [ref=f141e63]:
              - strong [ref=f141e64]: "About Us:"
            - paragraph [ref=f141e65]:
              - emphasis [ref=f141e66]: At Scale, our mission is to develop reliable AI systems for the world's most important decisions. Our products provide the high-quality data and full-stack technologies that power the world's leading models, and help enterprises and governments build, deploy, and oversee AI applications that deliver real impact. We work closely with industry leaders like Meta,
              - emphasis [ref=f141e67]: Ernst
              - emphasis [ref=f141e68]
              - emphasis [ref=f141e69]: "&"
              - emphasis [ref=f141e70]: Young, Mayo Clinic, Time Inc., the Government of Qatar, and U.S. government agencies including the Army and Air Force. We are expanding our team to accelerate the development of AI applications.
            - paragraph [ref=f141e71]:
              - emphasis [ref=f141e72]: We believe that everyone should be able to bring their whole selves to work, which is why we are proud to be an inclusive and equal opportunity workplace. We are committed to equal employment opportunity regardless of race, color, ancestry, religion, sex, national origin, sexual orientation, age, citizenship, marital status, disability status, gender identity or Veteran status.
