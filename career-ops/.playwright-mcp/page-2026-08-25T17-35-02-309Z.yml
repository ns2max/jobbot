                - listitem [ref=f141e386]: Epilepsy or other seizure disorder
                - listitem [ref=f141e387]: Gastrointestinal disorders, for example, Crohn's Disease, irritable bowel syndrome
                - listitem [ref=f141e388]: Intellectual or developmental disability
