            - heading "Staff/Senior Machine Learning Research Engineer" [level=1] [ref=f141e11]
            - generic [ref=f141e12]: San Francisco, CA; New York, NY
          - button "Apply" [ref=f141e16] [cursor=pointer]
        - generic [ref=f141e17]:
          - generic [ref=f141e18]:
            - heading "About Scale" [level=2] [ref=f141e19]
            - paragraph [ref=f141e20]: Scale’s mission is to develop reliable AI systems for the world’s most important decisions. As the leading AI data foundry, we provide the high-quality data and full-stack technologies that power the world’s most advanced models — fueling breakthroughs in generative AI, defense, and autonomous vehicles. We partner with leading enterprises and governments to bring AI into production that performs when it matters most, combining rigorous evaluation with full-stack deployment so our customers can build AI they can trust.
            - heading "About the Team" [level=2] [ref=f141e21]
            - paragraph [ref=f141e22]: Applied Intelligence Systems (AIS) is part of the Scale Generative AI Platform (SGP), focused on pushing the frontier of what agentic applications can do across diverse enterprise and government use cases. We build the infrastructure and tooling that power agentic AI in production, paired with applied ML research, design, and evaluation to ensure these systems perform reliably at the scale our customers demand. AIS spans multiple workstreams — agent evaluation and oversight, orchestration and tool-use infrastructure, model and systems optimization, and applied research on new agent capabilities — and this role is not scoped to any single one of them. We’re growing fast, with increasing traction across both commercial and public sector customers, and we’re just getting started — this team will define what dependable, production-grade agentic AI looks like.
            - heading "About the Role" [level=2] [ref=f141e23]
            - paragraph [ref=f141e24]: "As a Staff Machine Learning Research Engineer, you will operate across the full breadth of AIS’s technical needs — wherever the hardest ML problem in agentic AI happens to be that quarter. This could mean training and fine-tuning models, designing evaluation and observability systems, building improvement loops from production data, prototyping novel agent architectures, or designing internal systems and tooling that boost productivity across teams. You’re not tied to one team’s roadmap; you’re expected to move to where the technical leverage is highest, and to set the AI/ML technical direction across AIS — the methods, architectures, and standards other teams build on, not just your own workstream. This is a hands-on research and engineering role at staff scope: you’ll write code — training pipelines, evaluation systems, infrastructure, or whatever the problem calls for — and ship production systems yourself, while also setting AIML technical direction and raising the bar for engineers and scientists across AIS."
            - heading "You will:" [level=3] [ref=f141e25]
            - list [ref=f141e26]:
              - listitem [ref=f141e27]: Move across AIS’s core problem areas as needed — training/fine-tuning, inference, memory and retrieval, evaluation and observability, orchestration and tool-use infrastructure, applied research on new agent capabilities — going wherever the technical leverage is highest rather than owning one fixed surface
              - listitem [ref=f141e28]: Research and prototype novel methods for agent performance improvement in a production/enterprise-ready setting — continuous learning loops, automated curriculum or data generation from production traces, online or offline RL — and validate them with rigorous experiments before they ship, making the call on where to build new infrastructure versus apply existing methods
              - listitem [ref=f141e29]: Build AI agents and internal tooling that reduce bottlenecks in AIS’s own processes — cutting down time spent on repetitive evaluation, data, or experimentation work so teams can focus on the hard problems
              - listitem [ref=f141e30]: Partner with other ML engineers, software engineers, product managers, customers, data annotators, and Forward Deployed Engineers to take your work from idea to production and translate enterprise and government requirements into robust ML capabilities
              - listitem [ref=f141e31]: Set AI/ML technical direction, mentor senior and staff-track engineers and scientists across teams, and raise the bar on experimental rigor org-wide
            - heading "Requirements:" [level=3] [ref=f141e32]
            - list [ref=f141e33]:
              - listitem [ref=f141e34]: 5+ years of experience as an ML engineer or applied/research scientist, including direct experience training or fine-tuning models in production systems
              - listitem [ref=f141e35]: PhD in Computer Science, Electrical Engineering, or a related field
              - listitem [ref=f141e36]: Broad, hands-on fluency across the agentic ML stack — model training and fine-tuning (SFT, RLHF/RLAIF, reward modeling), evaluation and observability infrastructure, and agent architecture (tool use, planning, memory, multi-agent orchestration) — with demonstrated depth or expertise in at least one area within the AI/ML domain
              - listitem [ref=f141e37]: Demonstrated ability to move across problem areas rather than specialize in one corner of the ML stack — comfortable picking up unfamiliar parts of a system quickly
              - listitem [ref=f141e38]: Track record of partnering with software engineers to productionize research and experimental work, not just deliver a one-off analysis — and of pushing code to production yourself when needed — with a genuine drive for pathfinding, 0-to-1 problems where the right approach isn’t yet known
              - listitem [ref=f141e39]: Track record of setting AI/ML technical direction — choosing methods and architectures that other teams adopt — and collaborating across functions (Product, Forward Deployed Engineering, etc.) to navigate ambiguous requirements and bring them to production
              - listitem [ref=f141e40]: Track record of mentoring engineers and scientists, giving and receiving direct, substantive technical feedback at a staff level, and influencing decisions and standards beyond your own team — through design reviews, technical writing, or shaping how other teams approach a problem
            - heading "Nice to have:" [level=3] [ref=f141e41]
            - list [ref=f141e42]:
              - listitem [ref=f141e43]: Published research, open-source contributions, or patents in agent training methods, LLM alignment, or applied ML
              - listitem [ref=f141e44]: Experience with online learning, continuous fine-tuning, or automated data/curriculum generation from production traces
              - listitem [ref=f141e45]: Experience with model or systems optimization (e.g., training efficiency, latency, cost, or inference efficiency at scale)
              - listitem [ref=f141e46]: Experience working in regulated or enterprise/government contexts
              - listitem [ref=f141e47]: Track record of taking a novel training method or agent architecture from prototype to something running reliably in production, navigating ambiguity along the way
              - listitem [ref=f141e48]: Prior experience as a technical lead setting direction across multiple teams or problem areas
          - generic [ref=f141e50]:
            - paragraph [ref=f141e54]:
              - emphasis [ref=f141e55]: "Compensation packages at Scale for eligible roles include base salary, equity, and benefits. The range displayed on each job posting reflects the minimum and maximum target for new hire salaries for the position and may be inclusive of several career levels at Scale; it will be determined during the interview process based on work location and additional factors, including job-related skills, experience, qualifications, interview performance, and relevant education or training. Scale employees in eligible roles are also granted equity based compensation, subject to Board of Director approval. Your recruiter can share more about the specific salary range for your preferred location during the hiring process, and confirm whether the hired role will be eligible for equity grant. You'll also receive benefits including, but not limited to: comprehensive health, dental and vision coverage, retirement benefits, a learning and development stipend, and generous PTO. Additionally, this role may be eligible for additional benefits such as a commuter stipend."
            - paragraph [ref=f141e56]: "Please reference the job posting's subtitle for where this position will be located. For pay transparency purposes, the base salary range for this full-time position in the locations of San Francisco, New York, Seattle is:"
            - paragraph [ref=f141e57]: $227,200 - $284,000 USD
