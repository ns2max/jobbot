        - generic [ref=f475e20]:
          - paragraph [ref=f475e22]: SpaceXAI’s mission is to create AI systems that can accurately understand the universe and aid humanity in its pursuit of knowledge. Our team is small, highly motivated, and focused on engineering excellence. This organization is for individuals who appreciate challenging themselves and thrive on curiosity. We operate with a flat organizational structure. All employees are expected to be hands-on and to contribute directly to the company’s mission. Leadership is given to those who show initiative and consistently deliver excellence. Work ethic and strong prioritization skills are important. All employees are expected to have strong communication skills. They should be able to concisely and accurately share knowledge with their teammates.
          - generic [ref=f475e23]:
            - heading [level=3] [ref=f475e24]:
              - strong [ref=f475e25]: "ABOUT THE ROLE:"
            - paragraph [ref=f475e26]: The RL infrastructure team is looking for an engineer to help with low precision RL training and inference.
            - paragraph [ref=f475e27]:
              - strong [ref=f475e28]: "RESPONSIBILITIES:"
            - list [ref=f475e29]:
              - listitem [ref=f475e30]: Design and optimize our inference stack for all shapes of RL workloads at SpaceXAI, from small scale ablations to production training runs.
              - listitem [ref=f475e31]: Analyze, profile and address performance bottlenecks in large scale RL systems
              - listitem [ref=f475e32]: Work closely with the modelling team to efficiently implement novel RL techniques and algorithms
            - heading [level=3] [ref=f475e33]:
              - strong [ref=f475e34]: "BASIC QUALIFICATIONS:"
            - list [ref=f475e35]:
              - listitem [ref=f475e36]: Experience in building, debugging, and optimizing efficiency of large-scale distributed systems
              - listitem [ref=f475e37]: Experience in LLM inference
              - listitem [ref=f475e38]: Proficiency in programming languages such as Python, C++ and/or Rust; frameworks such as PyTorch, Jax, CUDA
              - listitem [ref=f475e39]: Willingness to dive deep and solve hardcore problems at all levels of the stack
            - heading [level=3] [ref=f475e40]:
              - strong [ref=f475e41]: "PREFERRED SKILLS AND EXPERIENCE:"
            - list [ref=f475e42]:
              - listitem [ref=f475e43]: Strong knowledge in quantization and numerics in LLM inference and training
              - listitem [ref=f475e44]: Experience in developing inference engines, e.g. SGLang, vLLM
            - heading [level=3] [ref=f475e45]:
              - strong [ref=f475e46]: "COMPENSATION AND BENEFITS:"
            - paragraph [ref=f475e47]: $180,000 - $440,000 USD
            - paragraph [ref=f475e48]: Base salary is just one part of our total rewards package at SpaceXAI, which also includes equity, comprehensive medical, vision, and dental coverage, access to a 401(k) retirement plan, short & long-term disability insurance, life insurance, and various other discounts and perks.
