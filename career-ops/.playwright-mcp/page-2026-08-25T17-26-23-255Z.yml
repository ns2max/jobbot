        - generic [ref=f46e20]:
          - paragraph [ref=f46e22]: SpaceXAI’s mission is to create AI systems that can accurately understand the universe and aid humanity in its pursuit of knowledge. Our team is small, highly motivated, and focused on engineering excellence. This organization is for individuals who appreciate challenging themselves and thrive on curiosity. We operate with a flat organizational structure. All employees are expected to be hands-on and to contribute directly to the company’s mission. Leadership is given to those who show initiative and consistently deliver excellence. Work ethic and strong prioritization skills are important. All employees are expected to have strong communication skills. They should be able to concisely and accurately share knowledge with their teammates.
          - generic [ref=f46e23]:
            - paragraph [ref=f46e24]: You will own and elevate our mission-critical research platform that directly accelerates SpaceXAI's frontier work.
            - paragraph [ref=f46e25]: The evals team creates and executes instruments for measuring model capabilities and behaviors. These instruments are used to clean datasets, provide feedback for experiments, and track growth throughout training. The evals team also diagnoses why agents fail and how to make improvements both short and long term. We manage the execution infrastructure, design data sets and grading schemes.
            - paragraph [ref=f46e26]: You will design, build, and ship delightful and bulletproof systems that engineers love to use every day. This role values a strong attention to details, first principles reasoning, and great taste.
            - paragraph [ref=f46e27]: We are open to all levels from new grads to senior engineers.
            - paragraph [ref=f46e28]: Requirements
            - list [ref=f46e29]:
              - listitem [ref=f46e30]: Software engineering proficiency and 3+ years of experience actively writing code.
              - listitem [ref=f46e31]: A track record of shipping high quality projects and a strong sense of urgency.
              - listitem [ref=f46e32]: Exceptional product taste - you have a sharp sense for what “good” looks like in outputs, and you can translate fuzzy notions of quality, helpfulness, truthfulness, and safety into concrete, measurable criteria.
              - listitem [ref=f46e33]: Strong attention to detail.
            - paragraph [ref=f46e34]: Bonus Points
            - list [ref=f46e35]:
              - listitem [ref=f46e36]: Previously founded a startup or joined a fast-growing early-stage startup.
              - listitem [ref=f46e37]: Familiarity with AI/ML workflows, annotation tools, or evals.
              - listitem [ref=f46e38]: Experience creating and maintaining component libraries, design systems, or internal tools.
            - paragraph [ref=f46e39]:
