      - generic [ref=f531e43]:
        - generic [ref=f531e44]:
          - heading "Samsara's Mission" [level=3] [ref=f531e45]
          - paragraph [ref=f531e46]: Improve the safety, efficiency, and sustainability of the operations that power the global economy.
          - link [ref=f531e47] [cursor=pointer]:
            - /url: /blog/the-samsara-culture-playbook
        - generic [ref=f531e51]:
          - generic [ref=f531e52]:
            - paragraph [ref=f531e53]:
              - strong [ref=f531e55]: Who we are
            - paragraph [ref=f531e56]: "Samsara (NYSE: IOT) is the pioneer of the Connected Operations™ Cloud, which is a platform that enables organizations that depend on physical operations to harness Internet of Things (IoT) data to develop actionable insights and improve their operations. At Samsara, we are helping improve the safety, efficiency and sustainability of the physical operations that power our global economy. Representing more than 40% of global GDP, these industries are the infrastructure of our planet, including agriculture, construction, field services, transportation, and manufacturing — and we are excited to help digitally transform their operations at scale."
            - paragraph [ref=f531e57]: Working at Samsara means you’ll help define the future of physical operations and be on a team that’s shaping an exciting array of product solutions, including Video-Based Safety, Vehicle Telematics, Apps and Driver Workflows, and Equipment Monitoring. As part of a recently public company, you’ll have the autonomy and support to make an impact as we build for the long term.
          - paragraph [ref=f531e58]:
            - strong [ref=f531e59]: "About the role:"
          - paragraph [ref=f531e60]: The Samsara AI team builds end-to-end AI solutions for our customers as well as core ML infrastructure for Samsara. As a Staff Machine Learning Engineer, you will be working with petabyte-scale sensor, diagnostic, video, and text data to solve critical problems for Physical Operations customers, globally. You will work closely with ML Engineers and Scientists, as well as full-stack and firmware engineers to deliver core product features, services, and optimizations.
          - paragraph [ref=f531e61]:
            - strong [ref=f531e62]: This is a remote position open to candidates residing in the United States. This position requires travel up to 5% of the time. Relocation assistance will not be provided for this role.
          - paragraph [ref=f531e63]:
            - strong [ref=f531e64]: "You should apply if:"
          - list [ref=f531e65]:
            - listitem [ref=f531e66]:
              - strong [ref=f531e67]: "You want to impact the industries that run our world:"
              - text: The software, firmware, and hardware you build will result in real-world impact—helping to keep the lights on, get food into grocery stores, and most importantly, ensure workers return home safely.
            - listitem [ref=f531e68]:
              - strong [ref=f531e69]: "You are a life-long learner:"
              - text: We have ambitious goals. Every Samsarian has a growth mindset as we work with a wide range of technologies, challenges, and customers that push us to learn on the go.
            - listitem [ref=f531e70]:
              - strong [ref=f531e71]: "You believe customers are more than a number:"
              - text: Samsara engineers enjoy a rare closeness to the end user and you will have the opportunity to participate in customer interviews, collaborate with customer success and product managers, and use metrics to ensure our work is translating into better customer outcomes.
            - listitem [ref=f531e72]:
              - strong [ref=f531e73]: "You are a team player:"
              - text: Working on our Samsara Engineering teams requires a mix of independent effort and collaboration. Motivated by our mission, we’re all racing toward our connected operations vision, and we intend to win—together.
          - heading [level=4] [ref=f531e74]:
            - strong [ref=f531e75]: "In this role, you will:"
          - list [ref=f531e76]:
            - listitem [ref=f531e77]: Lead design and implementation of critical AI product initiatives on Edge devices.
            - listitem [ref=f531e78]: Develop both tactical AI solutions as well as more strategic and longer term research.
            - listitem [ref=f531e79]: Work with petabyte-scale data from customer operations including text, transactions, diagnostics, sensor, camera, and location data.
            - listitem [ref=f531e80]: Partner across business units to explore and prototype new AI experiences and optimize the ML model performance on edge devices.
            - listitem [ref=f531e81]: Stay connected to industry and academic research and adopt novel technology that suits Samsara’s needs.
            - listitem [ref=f531e82]: Champion, role model, and embed Samsara’s cultural principles (Focus on Customer Success, Build for the Long Term, Adopt a Growth Mindset, Be Inclusive, Win as a Team) as we scale globally and across new offices
          - paragraph [ref=f531e83]:
            - strong [ref=f531e84]: "Minimum requirements for the role:"
          - list [ref=f531e85]:
            - listitem [ref=f531e86]: 8+ years experience as a Machine Learning Engineer.
            - listitem [ref=f531e87]: Profound experience in optimizing ML models and systems for Edge compute constraints.
            - listitem [ref=f531e88]: Coding in python or similar.
            - listitem [ref=f531e89]: Coding in C++ or Rust.
            - listitem [ref=f531e90]: Strong functional knowledge of the iterative machine learning product development process.
            - listitem [ref=f531e91]: Experienced in developing and shipping production code at large scale.
            - listitem [ref=f531e92]: Ability to distill informal or ambiguous customer and business requirements into crisp problem definitions.
            - listitem [ref=f531e93]: Proven ability to communicate verbally and in writing to technical peers and leadership teams with various levels of technical knowledge.
            - listitem [ref=f531e94]: Experience coaching and mentoring ML Engineers.
          - paragraph [ref=f531e95]:
            - strong [ref=f531e96]: "An ideal candidate also has:"
          - list [ref=f531e97]:
            - listitem [ref=f531e98]: Proficiency in self-serving with data for experiments and model training at scale.
            - listitem [ref=f531e99]: An established record of successful high impact deliveries in AI.
            - listitem [ref=f531e100]: Deep knowledge in state of the art Computer Vision and multi-model models.
          - generic [ref=f531e102]:
            - paragraph [ref=f531e104]: The range of annual base salary for full-time employees for this position is below. Please note that base pay offered may vary depending on factors including your city of residence, job-related knowledge, skills, and experience. This role is also eligible for an initial RSU grant with no vesting cliff, and ongoing refresh opportunities tied to performance, subject to plan terms and conditions. Learn more about our total rewards and benefits below.
            - generic [ref=f531e105]: Annual Base Salary
            - generic [ref=f531e106]: $178,640—$319,000 USD
          - generic [ref=f531e107]:
            - paragraph [ref=f531e108]:
              - strong [ref=f531e109]: Total Rewards
            - paragraph [ref=f531e110]:
              - text: At Samsara, we build for the people who keep the global economy moving. We want owners, not passengers, which is why
              - link "our rewards" [ref=f531e111] [cursor=pointer]:
                - /url: https://www.samsara.com/company/careers/benefits
              - text: are designed to fuel high-impact builders. Our compensation program delivers above-market total compensation through a combination of base salary, performance-based bonus/variable pay, and equity (for eligible roles) in a high-growth public company. We meaningfully differentiate pay for our top performers, who have the opportunity to earn above-market compensation that can outpace the broader market over time.
            - paragraph [ref=f531e112]: "Beyond compensation, we provide the foundations that enable long-term success: a flexible, employee-led remote model, a professional development stipend, comprehensive health and parental leave plans, and more. If you’re ready to build for the long term and own the outcome, your journey starts here."
            - paragraph [ref=f531e113]:
              - strong [ref=f531e114]: Flexible Working
            - paragraph [ref=f531e115]: At Samsara, we embrace a flexible working model that caters to the diverse needs of our teams. Our offices are open for those who prefer to work in-person and we also support remote work where it aligns with our operational requirements. For certain positions, being close to one of our offices or within a specific geographic area is important to facilitate collaboration, access to resources, or alignment with our service regions. In these cases, the job description will clearly indicate any working location requirements. Our goal is to ensure that all members of our team can contribute effectively, whether they are working on-site, in a hybrid model, or fully remotely. All offers of employment are contingent upon an individual’s ability to secure and maintain the legal right to work at the company and in the specified work location, if applicable.
            - paragraph [ref=f531e116]:
              - strong [ref=f531e117]: Belonging at Samsara
            - paragraph [ref=f531e118]: At Samsara, we welcome everyone regardless of their background. All qualified applicants will receive consideration for employment without regard to race, color, religion, national origin, sex, gender, gender identity, sexual orientation, protected veteran status, disability, age, and other characteristics protected by law. We depend on the unique approaches of our team members to help us solve complex problems and want to ensure that Samsara is a place where people from all backgrounds can make an impact.
            - paragraph [ref=f531e119]:
              - strong [ref=f531e120]: Accommodations
            - paragraph [ref=f531e121]:
              - text: Samsara is an inclusive work environment, and we are committed to ensuring equal opportunity in employment for qualified persons with disabilities. Please email
              - link "accessibleinterviewing@samsara.com" [ref=f531e122] [cursor=pointer]:
                - /url: mailto:accessibleinterviewing@samsara.com
              - text: or
              - link "click here" [ref=f531e123] [cursor=pointer]:
                - /url: https://forms.gle/DrM6DFQUiSgfPtCVA
              - text: if you require any reasonable accommodations throughout the recruiting process.
            - paragraph [ref=f531e124]:
              - strong [ref=f531e125]: Our Commitment to Authenticity
            - paragraph [ref=f531e126]:
              - text: We use
              - link "Tofu" [ref=f531e127] [cursor=pointer]:
                - /url: https://hiretofu.com/privacyPolicy
              - text: ", a fraud detection tool, to validate the authenticity of applications and protect against identity fraud. This ensures we are connecting with real people and allows us to prioritize genuine candidates. Please see Samsara’s"
              - link "Candidate Privacy Notice" [ref=f531e128] [cursor=pointer]:
                - /url: https://www.samsara.com/legal/candidate-privacy-notice
              - text: for more information.
            - paragraph [ref=f531e129]:
              - strong [ref=f531e130]: Fraudulent Employment Offers
            - paragraph [ref=f531e131]:
              - text: Samsara is aware of scams involving fake job interviews and offers. Please know we do not charge fees to applicants at any stage of the hiring process. Official communication about your application will only come from emails ending in @samsara.com, @us-greenhouse-mail.io or @mail3.guide.co. For more information regarding fraudulent employment offers, please visit our
              - link "blog post here" [ref=f531e132] [cursor=pointer]:
                - /url: https://samsara.com/blog/avoiding-fake-job-offers
              - text: .
