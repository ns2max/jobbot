        - tabpanel "Overview" [ref=f117e39]:
          - generic [ref=f117e40]:
            - heading [level=1] [ref=f117e41]:
              - strong [ref=f117e42]: Company Overview
            - paragraph [ref=f117e43]: Deepgram is the leading platform underpinning the emerging trillion-dollar Voice AI economy, providing real-time APIs for speech-to-text (STT), text-to-speech (TTS), and building production-grade voice agents at scale. More than 200,000 developers and 1,300+ organizations build voice offerings that are ‘Powered by Deepgram’, including Twilio, Cloudflare, Sierra, Decagon, Vapi, Daily, Cresta, Granola, and Jack in the Box. Deepgram’s voice-native foundation models are accessed through cloud APIs or as self-hosted and on-premises software, with unmatched accuracy, low latency, and cost efficiency. Backed by a recent Series C led by leading global investors and strategic partners, Deepgram has processed over 50,000 years of audio and transcribed more than 1 trillion words. There is no organization in the world that understands voice better than Deepgram.
            - paragraph [ref=f117e44]
            - heading [level=1] [ref=f117e45]:
              - strong [ref=f117e46]: Company Operating Rhythm
            - paragraph [ref=f117e47]: At Deepgram, we expect an AI-first mindset—AI use and comfort aren’t optional, they’re core to how we operate, innovate, and measure performance.
            - paragraph [ref=f117e48]: Every team member who works at Deepgram is expected to actively use and experiment with advanced AI tools, and even build your own into your everyday work. We measure how effectively AI is applied to deliver results, and consistent, creative use of the latest AI capabilities is key to success here. Candidates should be comfortable adopting new models and modes quickly, integrating AI into their workflows, and continuously pushing the boundaries of what these technologies can do.
            - paragraph [ref=f117e49]: Additionally, we move at the pace of AI. Change is rapid, and you can expect your day-to-day work to evolve just as quickly. This may not be the right role if you’re not excited to experiment, adapt, think on your feet, and learn constantly, or if you’re seeking something highly prescriptive with a traditional 9-to-5.
            - paragraph [ref=f117e50]
            - heading [level=2] [ref=f117e51]:
              - strong [ref=f117e52]: The Opportunity
            - paragraph [ref=f117e53]: Deepgram is looking for a Senior Software Engineer - Model Evaluation & AI Systems to join the team responsible for validating the quality of our speech, audio, and multilingual models before they reach customers.
            - paragraph [ref=f117e54]: This team owns the evaluation and quality assurance surfaces that ensure Deepgram's models — across speech-to-text, text-to-speech, and increasingly LLM- and multimodal-powered systems — meet their performance targets in both batch and streaming environments. We build the pipelines, harnesses, canaries, and test frameworks that catch regressions, hallucinations, and quality issues before they impact customers, and we partner closely with Research to turn model expectations into automated, reproducible, enforceable checks.
            - paragraph [ref=f117e55]: In this role, you'll define evaluation methodology and build the infrastructure that measures model quality at scale. You'll create evaluation pipelines, define pass/fail criteria grounded in Research benchmarks, and build the monitoring that keeps models honest in production. Your work provides the trusted signals that inform release and optimization decisions, and directly protects the customer experience.
            - paragraph [ref=f117e56]: We're looking for a strong engineer who is equally comfortable building test infrastructure and reasoning about model behavior. This role is aimed at senior engineers with broad instincts for quality, measurement, and automation; hands-on experience evaluating modern AI systems is a strong plus.
            - paragraph [ref=f117e57]
            - heading [level=2] [ref=f117e58]:
              - strong [ref=f117e59]: What You'll Do
            - list [ref=f117e60]:
              - listitem [ref=f117e61]:
                - paragraph [ref=f117e62]: Define and build evaluation methodologies for Deepgram's models, spanning speech-to-text, text-to-speech, and emerging LLM, RAG, agent, and multimodal systems.
              - listitem [ref=f117e63]:
                - paragraph [ref=f117e64]: Design, build, and maintain automated evaluation pipelines across batch and streaming (e.g. WER, runaway/hallucination detection, latency and time-to-first-byte), with a focus on correctness, reproducibility, and ease of adoption.
              - listitem [ref=f117e65]:
                - paragraph [ref=f117e66]: Build scalable, reproducible evaluation infrastructure — harnesses, orchestration, and result-aggregation pipelines — running against production models and, where needed, large GPU clusters.
              - listitem [ref=f117e67]:
                - paragraph [ref=f117e68]: Translate Research benchmarks and expected model metrics into automated, enforceable pass/fail gates.
              - listitem [ref=f117e69]:
                - paragraph [ref=f117e70]: Build and operate canaries and continuous-monitoring systems that detect quality regressions in production before they reach customers.
              - listitem [ref=f117e71]:
                - paragraph [ref=f117e72]: Partner with DevOps/Infra to stand up ephemeral test environments and results-aggregation infrastructure.
              - listitem [ref=f117e73]:
                - paragraph [ref=f117e74]: Work alongside Research, model training, inference, and product teams to provide trusted evaluation signals that inform release and optimization decisions.
              - listitem [ref=f117e75]:
                - paragraph [ref=f117e76]: Integrate evaluation and quality gates into CI/CD so quality is verified continuously, not manually.
              - listitem [ref=f117e77]:
                - paragraph [ref=f117e78]: Help raise the bar through code reviews, technical design discussions, and strong engineering and QA practices.
            - paragraph [ref=f117e79]
            - heading [level=2] [ref=f117e80]:
              - strong [ref=f117e81]: What We're Looking For
            - list [ref=f117e82]:
              - listitem [ref=f117e83]:
                - paragraph [ref=f117e84]: BS, MS, or PhD in Computer Science, AI, Applied Math, or a related field, or equivalent experience.
              - listitem [ref=f117e85]:
                - paragraph [ref=f117e86]: 5+ years of professional software or QA engineering experience, with a track record of shipping test infrastructure or evaluation systems (senior candidates with significantly deeper experience welcome).
              - listitem [ref=f117e87]:
                - paragraph [ref=f117e88]: Solid backend/scripting experience in a language such as Python, Rust, Go, or similar.
              - listitem [ref=f117e89]:
                - paragraph [ref=f117e90]: Experience designing and building automated test pipelines, evaluation frameworks, or data-processing systems.
              - listitem [ref=f117e91]:
                - paragraph [ref=f117e92]: Strong analytical skills and comfort reasoning about metrics, thresholds, and statistical variation in results — able to distinguish real regressions from noise.
              - listitem [ref=f117e93]:
                - paragraph [ref=f117e94]: Ability to take charge of ambiguous technical challenges and communicate effectively across research, engineering, and product teams.
            - paragraph [ref=f117e95]
            - heading [level=2] [ref=f117e96]:
              - strong [ref=f117e97]: Nice to Have / Ways to Stand Out
            - list [ref=f117e98]:
              - listitem [ref=f117e99]:
                - paragraph [ref=f117e100]: Hands-on experience evaluating modern AI systems such as LLMs, RAG pipelines, agents, or multimodal models, including model behavior analysis.
              - listitem [ref=f117e101]:
                - paragraph [ref=f117e102]: Experience with React Native or other cross-platform mobile frameworks for building tooling that's accessible beyond the desktop.
              - listitem [ref=f117e103]:
                - paragraph [ref=f117e104]: Experience building or improving evaluation frameworks, benchmarks, or ML infrastructure used by other teams or external users.
              - listitem [ref=f117e105]:
                - paragraph [ref=f117e106]: A strong appreciation for evaluation quality — correctness, reproducibility, and consistency across environments.
              - listitem [ref=f117e107]:
                - paragraph [ref=f117e108]: Experience with voice, audio, speech recognition, or real-time systems, and familiarity with metrics like WER, MOS, or latency/TTFB.
              - listitem [ref=f117e109]:
                - paragraph [ref=f117e110]: Prior involvement in open-source projects, through contributions, reviews, maintenance, or community engagement.
              - listitem [ref=f117e111]:
                - paragraph [ref=f117e112]: Experience acting as a technical bridge across teams or platforms (evaluation, training, inference, agent frameworks), combining architectural understanding with clear communication and influence.
              - listitem [ref=f117e113]:
                - paragraph [ref=f117e114]: Familiarity with cloud infrastructure, containerized/ephemeral environments, and monitoring tooling (e.g. Grafana, canaries, anomaly detection).
