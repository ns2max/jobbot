        - generic [ref=f303e20]:
          - paragraph [ref=f303e22]: SpaceXAI’s mission is to create AI systems that can accurately understand the universe and aid humanity in its pursuit of knowledge. Our team is small, highly motivated, and focused on engineering excellence. This organization is for individuals who appreciate challenging themselves and thrive on curiosity. We operate with a flat organizational structure. All employees are expected to be hands-on and to contribute directly to the company’s mission. Leadership is given to those who show initiative and consistently deliver excellence. Work ethic and strong prioritization skills are important. All employees are expected to have strong communication skills. They should be able to concisely and accurately share knowledge with their teammates.
          - generic [ref=f303e23]:
            - heading "ABOUT THE ROLE:" [level=3] [ref=f303e24]
            - paragraph [ref=f303e25]: We are seeking a talented Software Engineer to join our X Money team, focused on building a revolutionary global payment network that will serve over 600 million users and rival the world’s largest financial institutions. In this role, you will specialize in backend development, designing and optimizing robust microservices to ensure scalability, security, and reliability. You will support full-stack efforts, collaborate with cross-functional teams on payments, fraud detection, and compliance initiatives, and contribute to the creation of a high-scale financial products platform. This is an opportunity to work on greenfield projects in a fast-paced, startup-like environment, driving innovation at the intersection of AI and finance.
            - generic [ref=f303e27]:
              - heading "RESPONSIBILITIES:" [level=3] [ref=f303e28]
              - list [ref=f303e29]:
                - listitem [ref=f303e30]: Develop backend services, APIs, and data models to support high-volume, multi-user environments.
                - listitem [ref=f303e31]: Work with iOS, Android & Web client engineers to ship products.
                - listitem [ref=f303e32]: Design robust infrastructure and microservices for payments, transactions, growth, monetization, and engagement across platforms.
                - listitem [ref=f303e33]: Build and maintain fullstack features, including user dashboards, personalized experiences, content delivery, interactive tools, assessments, and real-time analytics.
                - listitem [ref=f303e34]: Lead architecture, scalability, and reliability decisions for high-concurrency, low-latency systems.
                - listitem [ref=f303e35]: Uphold engineering excellence via testing, monitoring, deployment, and secure data handling.
              - heading "BASIC QUALIFICATIONS:" [level=3] [ref=f303e36]
              - list [ref=f303e37]:
                - listitem [ref=f303e38]: Proficiency in distributed systems for high-scale, low-latency environments; languages like Rust, Go, Python & Java, and high volume streaming systems.
                - listitem [ref=f303e39]: 2+ years of experience working on large scale consumer applications.
              - heading "PREFERRED SKILLS AND EXPERIENCE:" [level=3] [ref=f303e40]
              - list [ref=f303e41]:
                - listitem [ref=f303e42]: 5+ years of experience working on large scale consumer applications or early-mid stage startup experience as a founding engineer, emphasizing rapid prototyping, user-centric design, and AI solutions.
              - heading [level=3] [ref=f303e43]:
                - strong [ref=f303e44]: "COMPENSATION AND BENEFITS:"
              - paragraph [ref=f303e45]: $180,000 - $440,000 USD
              - paragraph [ref=f303e46]: Base salary is just one part of our total rewards package at SpaceXAI, which also includes equity, comprehensive medical, vision, and dental coverage, access to a 401(k) retirement plan, short & long-term disability insurance, life insurance, and various other discounts and perks.
