            - heading "Staff AI Engineer - 2nd Horizon | Germany | Remote" [level=1] [ref=f199e14]
            - generic [ref=f199e15]: Germany (Remote)
          - button "Apply" [ref=f199e19] [cursor=pointer]
        - generic [ref=f199e20]:
          - generic [ref=f199e21]:
            - paragraph [ref=f199e22]:
              - text: Grafana Labs, the company behind the open observability cloud, is founded on the principles of open source, open standards, open ecosystems, and open culture. Grafana Cloud, our fully managed observability platform, is flexible and built for scale. With Grafana Cloud's actually useful AI, organizations can see, understand, and act on all their disparate data to move at the speed of their ambitions. Today, more than 35 million users and 7,000+ customers – including Anthropic, Bloomberg, NVIDIA, Microsoft, and Salesforce – trust Grafana Labs to ensure reliability of their applications and systems, resolve incidents quickly, and optimize their telemetry to reduce noise and cost. We are a 100% remote company with 1,600+ team members across 40+ countries, and we’re backed by leading investors including Lightspeed Venture Partners, Sequoia Capital, GIC, Coatue, J.P. Morgan, CapitalG, and Lead Edge Capital. Learn more at
              - link "grafana.com" [ref=f199e25] [cursor=pointer]:
                - /url: http://grafana.com
              - text: and follow us on
              - link "LinkedIn" [ref=f199e28] [cursor=pointer]:
                - /url: https://www.linkedin.com/company/grafana-labs/
              - text: and
              - link "X" [ref=f199e31] [cursor=pointer]:
                - /url: https://twitter.com/grafana
              - text: .
            - paragraph [ref=f199e32]: "We’re scaling fast and staying true to what makes us different: an open-source legacy, a global collaborative culture, and a passion for meaningful work. Our team thrives in an innovation-driven environment where transparency, autonomy, and trust fuel everything we do."
            - paragraph [ref=f199e33]: You may not meet every requirement, and that’s okay. If this role excites you, we’d love you to raise your hand for what could be a truly career-defining opportunity.
          - generic [ref=f199e34]:
            - paragraph [ref=f199e35]:
              - strong [ref=f199e36]: This is a remote position. We are considering candidates in Germany, Ireland, Sweden, Spain and the UK only.
            - paragraph [ref=f199e37]:
              - strong [ref=f199e38]: "The Opportunity:"
            - paragraph [ref=f199e39]: At Grafana Labs, we build observability tools that help users understand, respond to, and improve their systems – regardless of scale, complexity, or tech stack. We recently started a skunkworks initiative with a mission to bring observability to the rest of the business via general data analytics. Our goal is to make Grafana the single best place where humans and AI agents understand and act on data from across the enterprise. We build systems that help users make sense of their sea of data through AI-driven features in use cases like product analytics and sales data. These capabilities lower the barrier of domain expertise and surface meaningful signals from messy data.
            - paragraph [ref=f199e40]: The 2H team is a mix of seasoned Grafanistas and new hires. We operate with a high degree of autonomy and ownership, both as individuals and as a team. Engineers are empowered to make decisions, move quickly, and validate ideas early – while being supported by a deeply collaborative culture that values curiosity, feedback, and cross-functional partnership.
            - paragraph [ref=f199e41]: We’re looking for an AI Software Engineer with a strong software engineering background, a quick iteration mindset, and a passion for experimentation – balanced by a focus on shipping and scaling impactful features that deliver value to users. As part of our skunkworks initiative, you'll wear multiple hats and won't rely on cross-functional teams that typically support other teams inside Grafana Labs engineering. You will design, develop, test, and ship AI-powered features that can manage dealing with large datasets, while also expanding the capabilities of analytics-focused AI agents to assist users with information retrieval. As the team matures, there’s a broad opportunity to expand or redefine this role based on impact and initiative.
            - paragraph [ref=f199e42]:
              - strong [ref=f199e43]: "What You’ll Be Doing:"
            - list [ref=f199e44]:
              - listitem [ref=f199e45]: "Build and deliver AI solutions: Take ownership of developing delightful, high-performance AI features to help users discover, organize, and optimize access to large datasets."
              - listitem [ref=f199e46]: "Rapid experimentation and iteration: Implement a highly iterative process where you quickly prototype, test, and validate with real users, including shipping and evolving LLM- or agent-powered workflows for the data engineering lifecycle."
              - listitem [ref=f199e47]: "Collaborate: Work with the rest of the team to shape AI-driven product features, including the integration of agentic components with internal tools like Slack and alerting systems while engaging with internal data teams for dogfooding."
              - listitem [ref=f199e48]: "Utilize AI tools effectively: Use AI and automation tools to enhance both product functionality and your own development workflows."
              - listitem [ref=f199e49]: "Effective communication: You’ll be working in a highly dynamic and collaborative environment, so we need someone who can communicate effectively and contribute across teams."
              - listitem [ref=f199e50]: "Ownership and impact: Take full ownership of the AI solutions you develop, ensuring they are not only innovative but also scalable, maintainable, and aligned with real user workflows."
            - paragraph [ref=f199e51]:
              - strong [ref=f199e52]: "What Makes You a Great Fit:"
            - list [ref=f199e53]:
              - listitem [ref=f199e54]: "Strong engineering skills: Solid experience building production-grade, user-facing software systems. You’re a self-starter, capable of tackling complex engineering problems and making UI design decisions with minimal supervision."
              - listitem [ref=f199e55]: "AI experience with a practical mindset: You’re familiar with AI technologies and frameworks, and you focus on delivering high-quality solutions that work in the real world, not just in theory."
              - listitem [ref=f199e56]: "Quick iteration and experimentation: You’re comfortable releasing prototypes, collecting feedback, and iterating with a pragmatic mindset."
              - listitem [ref=f199e57]: "Proven initiative: You take ownership and drive projects forward, pushing boundaries to find the most impactful solutions. You can deal with ambiguity and are able to define scope where things are loosely defined."
              - listitem [ref=f199e58]: "Collaborative attitude: You communicate effectively with your peers. You’re open to feedback, and you bring a solutions-oriented mindset to the table."
            - paragraph [ref=f199e59]:
              - strong [ref=f199e60]: "Requirements:"
            - list [ref=f199e61]:
              - listitem [ref=f199e62]: Experience with LLMs, context engineering, and building applications powered by GenAI.
              - listitem [ref=f199e63]: Proven track record of delivering software that made it into production and is actively used by users.
              - listitem [ref=f199e64]: Exposure to working in cloud-native environments (e.g., AWS, GCP, Azure).
              - listitem [ref=f199e65]: Experience using observability tools to understand and troubleshoot system behavior.
            - paragraph [ref=f199e66]:
              - strong [ref=f199e67]: "Bonus Points For:"
            - list [ref=f199e68]:
              - listitem [ref=f199e69]: Experience building or working with agent frameworks or multi‑agent workflows.
              - listitem [ref=f199e70]: Experience as a data analyst or work with data platforms (e.g., Looker, Tableau, PowerBI, Snowflake, DataBricks)
              - listitem [ref=f199e71]: Experience building tools for data engineering.
            - paragraph [ref=f199e72]:
              - strong [ref=f199e73]: "Compensation & Rewards:"
            - paragraph [ref=f199e74]:
              - text: In Germany, the Base compensation range for this role is €109,000 - €137,000. Actual compensation may vary based on level, experience, and skillset as assessed in the interview process. Benefits include equity, bonus (if applicable) and other benefits listed
              - link "here" [ref=f199e75] [cursor=pointer]:
                - /url: https://grafana.com/about/careers/#jobs
              - text: .
            - paragraph [ref=f199e76]
          - generic [ref=f199e77]:
