              - paragraph [ref=f199e81]:
                - strong [ref=f199e82]: "Why You’ll Thrive at Grafana Labs:"
              - list [ref=f199e83]:
                - listitem [ref=f199e84]:
                  - strong [ref=f199e85]: 100% Remote, Global Culture -
                  - text: As a remote-only company, we bring together talent from around the world, united by a culture of collaboration and shared purpose.
                - listitem [ref=f199e86]:
                  - strong [ref=f199e87]: Scaling Organization
                  - text: – Tackle meaningful work in a high-growth, ever-evolving environment.
                - listitem [ref=f199e88]:
                  - strong [ref=f199e89]: Transparent Communication
                  - text: – Expect open decision-making and regular company-wide updates.
                - listitem [ref=f199e90]:
                  - strong [ref=f199e91]: Innovation-Driven
                  - text: – Autonomy and support to ship great work and try new things.
                - listitem [ref=f199e92]:
                  - strong [ref=f199e93]: Open Source Roots
                  - text: – Built on community-driven values that shape how we work.
                - listitem [ref=f199e94]:
                  - strong [ref=f199e95]: Empowered Teams
                  - text: – High trust, low ego culture that values outcomes over optics.
                - listitem [ref=f199e96]:
                  - strong [ref=f199e97]: Career Growth Pathways
                  - text: – Defined opportunities to grow and develop your career.
                - listitem [ref=f199e98]:
                  - strong [ref=f199e99]: Approachable Leadership
                  - text: – Transparent execs who are involved, visible, and human.
                - listitem [ref=f199e100]:
                  - strong [ref=f199e101]: Passionate People
                  - text: – Join a team of smart, supportive folks who care deeply about what they do.
                - listitem [ref=f199e102]:
                  - strong [ref=f199e103]: In-Person onboarding
                  - text: "- We want you to thrive from day 1 with your fellow new ‘Grafanistas’ to learn all about what we do and how we do it."
                - listitem [ref=f199e104]:
                  - strong [ref=f199e105]: Balance is Key
                  - text: "- We operate a global annual leave policy of 30 days per annum. 3 days of your annual leave entitlement are reserved for Grafana Shutdown Days to allow the team to really disconnect."
                  - emphasis [ref=f199e106]: "*We will comply with local legislation where applicable."
              - paragraph [ref=f199e107]:
                - strong [ref=f199e108]: "Equal Opportunity Employer:"
                - emphasis [ref=f199e109]: Grafana Labs is an equal opportunities employer. We welcome applications from everyone regardless of race, colour, nationality, origin, caste, sex, gender reassignment identity or expression, sexual orientation, age, religion or belief, disability, veteran status, genetic information, pregnancy, maternity, marital, family or carer status, or any other characteristic which is protected by local law. We believe that equality and diversity build a strong organisation, and we work hard to ensure that is the foundation of our organisation as we grow.
              - paragraph [ref=f199e110]:
                - emphasis [ref=f199e111]: Grafana Labs may utilize AI tools in its recruitment process to assist in matching information provided in CVs to job postings. The recruitment team will continue to review inbound CVs manually to identify alignment with current openings.
              - paragraph [ref=f199e112]: "#LI-Remote"
            - emphasis [ref=f199e114]:
              - text: For information about how your personal data is used once you’ve applied to a job, check out our
