        - generic [ref=f449e20]:
          - generic [ref=f449e21]:
            - heading [level=2] [ref=f449e22]:
              - strong [ref=f449e23]: About Anthropic
            - paragraph [ref=f449e24]: Anthropic’s mission is to create reliable, interpretable, and steerable AI systems. We want AI to be safe and beneficial for our users and for society as a whole. Our team is a quickly growing group of committed researchers, engineers, policy experts, and business leaders working together to build beneficial AI systems.
          - generic [ref=f449e25]:
            - heading [level=2] [ref=f449e26]:
              - strong [ref=f449e27]: About the role
            - paragraph [ref=f449e28]: Anthropic's RL Scaling Science team studies how reinforcement learning behaves as we scale it (across model size, compute, and task horizon) and turns that understanding into the training recipes behind our frontier models. As a Research Engineer on this team, you'll design and run large-scale experiments to understand and resolve bottlenecks, build the benchmarks that make long-horizon progress measurable, and ship validated findings directly into production training.
            - paragraph [ref=f449e29]: This role lives at the boundary between research and engineering. The problems are open, the experiments run at frontier scale, and the path from a robust result to production is short.
            - heading [level=2] [ref=f449e30]:
              - strong [ref=f449e31]: Key responsibilities
            - list [ref=f449e32]:
              - listitem [ref=f449e33]: Design, run, and interpret large-scale RL experiments, reasoning rigorously about what the data does and doesn't show
              - listitem [ref=f449e34]: Investigate how RL improves as horizon, compute, and model size grow
              - listitem [ref=f449e35]: Build and maintain benchmarks for long-horizon RL so progress is measurable and reproducible
              - listitem [ref=f449e36]: Translate validated findings into production training recipes, exercising judgment about when a result is robust enough to ship
              - listitem [ref=f449e37]: Debug complex issues at the seam where research meets infrastructure - failures that only appear at scale
              - listitem [ref=f449e38]: Partner closely with adjacent RL teams across research and engineering and advance our overall RL stack
            - heading [level=2] [ref=f449e39]:
              - strong [ref=f449e40]: Minimum qualifications
            - list [ref=f449e41]:
              - listitem [ref=f449e42]: Strong empirical research skills in Reinforcement Learning, large-scale ML training, or a closely adjacent area
              - listitem [ref=f449e43]: Demonstrated ability to own large experiments end-to-end, from design through interpretation
              - listitem [ref=f449e44]: Proficiency in Python and experience working with large-scale or distributed ML systems
              - listitem [ref=f449e45]: Comfort operating at the research/systems boundary, including debugging where the two meet
              - listitem [ref=f449e46]: Care about the societal impacts of AI and responsible scaling
            - heading [level=2] [ref=f449e47]:
              - strong [ref=f449e48]: Preferred qualifications
            - list [ref=f449e49]:
              - listitem [ref=f449e50]: Published or shipped work in long-horizon RL or RL fundamentals
              - listitem [ref=f449e51]: Experience translating research findings into production training recipes
              - listitem [ref=f449e52]: Demonstrated large scale industry impact via RL interventions
              - listitem [ref=f449e53]: Experience working on frontier-scale training runs with long trajectories
            - heading [level=2] [ref=f449e54]:
              - strong [ref=f449e55]: Representative projects
            - list [ref=f449e56]:
              - listitem [ref=f449e57]: Design a benchmark suite for long-horizon RL that distinguishes genuine capability gains from artifacts of evaluation setup
              - listitem [ref=f449e58]: Take a promising experimental finding, stress-test it across model scales, and work with training teams to land it in a production recipe
              - listitem [ref=f449e59]: Investigate an unexpected scaling trend in an RL run and trace it to a root cause spanning algorithm, data, and infrastructure
            - paragraph [ref=f449e60]
