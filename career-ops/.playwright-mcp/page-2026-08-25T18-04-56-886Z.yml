            - heading "Machine Learning Engineering Manager - Ads Engagement Modeling" [level=1] [ref=f541e15]
            - generic [ref=f541e16]: Remote - United States
          - button "Apply" [ref=f541e20] [cursor=pointer]
        - generic [ref=f541e21]:
          - generic [ref=f541e28]:
            - text: Reddit is a community of communities. It’s built on shared interests, passion, and trust, and is home to the most open and authentic conversations on the internet. Every day, Reddit users submit, vote, and comment on the topics they care most about. With 100,000+ active communities and approximately 130 million daily active unique visitors, Reddit is one of the internet’s largest sources of information. For more information, visit
            - link "www.redditinc.com" [ref=f541e29] [cursor=pointer]:
              - /url: http://www.redditinc.com/
            - text: .
          - generic [ref=f541e30]:
            - paragraph [ref=f541e31]:
              - strong [ref=f541e32]: "Team overview:"
            - paragraph [ref=f541e33]: The Engagement Modeling Team at Reddit focuses on building machine learning models to drive on-platform user engagement with diverse media and content, with a focus on predictive modeling to improve interactions of click-throughs and video view-throughs. This role offers a unique opportunity to shape and scale Reddit’s Ads prediction models, in alignment with our product goals and driving SoTA modeling advancement.
            - paragraph [ref=f541e34]: This role is well-suited for a leader with deep machine learning expertise, strategic vision, and a collaborative mindset to engage with both technical and cross-functional stakeholders.
            - paragraph [ref=f541e35]: We’re a remote-friendly company, and this position is open to candidates anywhere in the U.S.
            - paragraph [ref=f541e36]:
              - strong [ref=f541e37]: "Responsibilities:"
            - list [ref=f541e38]:
              - listitem [ref=f541e39]:
                - strong [ref=f541e40]: "Set Technical Vision and Strategy:"
                - text: Define and execute a roadmap for engagement modeling, balancing innovative modeling approaches with business objectives.
              - listitem [ref=f541e41]:
                - strong [ref=f541e42]: "Drive Technical Execution:"
                - text: Oversee the model development lifecycle from ideation to deployment, ensuring high standards of ML performance and robustness.
              - listitem [ref=f541e43]:
                - strong [ref=f541e44]: "Lead and Mentor a High-Performing Team:"
                - text: Recruit, mentor, and retain top ML talent, fostering a culture of growth, collaboration, and technical excellence.
              - listitem [ref=f541e45]:
                - strong [ref=f541e46]: "Collaborate Cross-Functionally:"
                - text: Partner with PMs, data scientists, and other engineering teams to align on engagement strategies, data requirements, and model KPIs.
              - listitem [ref=f541e47]:
                - strong [ref=f541e48]: "Innovate in ML Architecture:"
                - text: Implement and optimize model architectures tailored to engagement prediction, leveraging deep learning and advanced ML techniques.
            - paragraph [ref=f541e49]:
              - strong [ref=f541e50]: "Candidate Profile:"
            - paragraph [ref=f541e51]: "The EM will lead a diverse, high-impact team and will need to navigate and foster collaboration with various teams such as PM, DS, and engineering functions within Ads. Ideal candidates will have:"
            - list [ref=f541e52]:
              - listitem [ref=f541e53]:
                - strong [ref=f541e54]: "People Management Experience:"
                - text: Prior experience managing engineering teams with a strong emphasis on technical mentorship and team growth.
              - listitem [ref=f541e55]:
                - strong [ref=f541e56]: "Set Technical Vision and Strategy:"
                - text: Ability to plan and execute a long-term technical strategy aligned with business objectives. Define and execute a roadmap for conversion modeling, balancing innovative modeling approaches with business objectives.
              - listitem [ref=f541e57]:
                - strong [ref=f541e58]: "Drive Technical Execution:"
                - text: Oversee the model development lifecycle from ideation to deployment, ensuring high standards of ML performance and robustness.
              - listitem [ref=f541e59]:
                - strong [ref=f541e60]: "Lead and Mentor a High-Performing Team:"
                - text: Recruit, mentor, and retain top ML talent, fostering a culture of growth, collaboration, and technical excellence.
              - listitem [ref=f541e61]:
                - strong [ref=f541e62]: "Collaborate Cross-Functionally:"
                - text: Partner with PMs, data scientists, and other engineering teams to align on engagement strategies, data requirements, and model KPIs.
              - listitem [ref=f541e63]:
                - strong [ref=f541e64]: "Innovate in ML Architecture:"
                - text: Implement and optimize model architectures tailored to conversion prediction, leveraging deep learning and advanced ML techniques.
            - paragraph [ref=f541e65]:
              - strong [ref=f541e66]: "Required qualifications:"
            - list [ref=f541e67]:
              - listitem [ref=f541e68]: At least 2+ of experience building and managing high-performing machine learning teams, ideally in the Ads domain. Will consider tech lead experience as well
              - listitem [ref=f541e69]: "Deep ML Expertise: Deep hands-on experience working with machine learning models and deploying them in large-scale production systems. Proven ability in training, evaluating, and deploying large-scale models."
              - listitem [ref=f541e70]: "End-to-End ML Lifecycle Experience: Proven ability in training, evaluating, and deploying large-scale models."
              - listitem [ref=f541e71]: 4+ years of hands-on experience with TensorFlow or PyTorch.
              - listitem [ref=f541e72]: "Strategic Thinking: Ability to develop and communicate a clear, compelling technical strategy that supports broader company objectives and addresses the needs of internal customers."
              - listitem [ref=f541e73]: "Impact-Driven Mindset: Passion for developing scalable, well-designed, and responsible AI solutions that drive business value."
              - listitem [ref=f541e74]: "Exceptional Communication & Collaboration: Strong interpersonal skills and a collaborative mindset, with the ability to effectively communicate complex technical topics to diverse audiences and build strong relationships with cross-functional partners"
            - list [ref=f541e75]:
              - listitem [ref=f541e76]:
                - strong [ref=f541e77]: Experience with Ads or Engagement Modeling is a plus.
            - paragraph [ref=f541e78]:
              - strong [ref=f541e79]: "Perks and Benefits:"
            - list [ref=f541e80]:
              - listitem [ref=f541e81]: 100% remote opportunity (we have 4 office locations for hybrid/onsite work preference in NY, SF, LA and Chicago)
              - listitem [ref=f541e82]: Competitive salary and equity options
              - listitem [ref=f541e83]: Comprehensive health benefits (medical, dental, vision) & workplace perks (home office set up stipend etc)
              - listitem [ref=f541e84]: Generous 401k matching
              - listitem [ref=f541e85]: Flexible vacation policy
              - listitem [ref=f541e86]: Paid parental leave (4+ months)
              - listitem [ref=f541e87]: Family planning support
              - listitem [ref=f541e88]: Paid volunteer time off
            - paragraph [ref=f541e89]: "#LI-AS1"
            - paragraph [ref=f541e90]:
              - strong [ref=f541e91]
            - paragraph [ref=f541e92]
          - generic [ref=f541e94]:
            - generic [ref=f541e97]:
              - paragraph [ref=f541e98]:
                - strong [ref=f541e99]: "Pay Transparency:"
              - paragraph [ref=f541e100]: This job posting may span more than one career level.
              - paragraph [ref=f541e101]:
                - text: In addition to base salary, this job is eligible to receive equity in the form of restricted stock units, and depending on the position offered, it may also be eligible to receive a commission. Additionally, Reddit offers a wide range of benefits to U.S.-based employees, including medical, dental, and vision insurance, 401(k) program with employer match, generous time off for vacation, and parental leave. To learn more, please visit
                - link "https://www.redditinc.com/careers/" [ref=f541e102] [cursor=pointer]:
                  - /url: https://www.redditinc.com/careers/
                - text: .
              - paragraph [ref=f541e103]: To provide greater transparency to candidates, we share base salary ranges for all US-based job postings regardless of state. We set standard base pay ranges for all roles based on function, level, and country location, benchmarked against similar stage growth companies. Final offer amounts are determined by multiple factors including, skills, depth of work experience and relevant licenses/credentials, and may vary from the amounts listed below.
            - paragraph [ref=f541e104]: "The base salary range for this position is:"
            - paragraph [ref=f541e105]: $230,000 - $322,000 USD
          - generic [ref=f541e106]:
            - paragraph [ref=f541e107]: In select roles and locations, the interviews will be recorded, transcribed and summarized by artificial intelligence (AI). You will have the opportunity to opt out of recording, transcription and summarization prior to any scheduled interviews.
            - paragraph [ref=f541e108]:
              - generic [ref=f541e109]:
                - text: "During the interview, we will collect the following categories of personal information: Identifiers, Professional and Employment-Related Information, Sensory Information (audio/video recording), and any other categories of personal information you choose to share with us. We will use this information to evaluate your application for employment or an independent contractor role, as applicable. We will not sell your personal information or disclose it to any third party for their marketing purposes. We will delete any recording of your interview promptly after making a hiring decision. For more information about how we will handle your personal information, including our retention of it, please refer to our"
                - link "Candidate Privacy Policy for Potential Employees and Contractors" [ref=f541e110] [cursor=pointer]:
                  - /url: https://redditinc.com/policies/candidate-privacy-policy
                - text: .
            - paragraph [ref=f541e111]:
              - emphasis [ref=f541e112]: Reddit is proud to be an equal opportunity employer, and is committed to building a workforce representative of the diverse communities we serve. Reddit is committed to providing reasonable accommodations for qualified individuals with disabilities and disabled veterans in our job application procedures. If, due to a disability, you need an accommodation during the interview process, please let your recruiter know.
