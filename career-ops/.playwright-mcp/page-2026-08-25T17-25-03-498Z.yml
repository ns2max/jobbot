            - generic [ref=f21e12]: San Francisco
          - button "Apply" [ref=f21e16] [cursor=pointer]
        - generic [ref=f21e18]:
          - heading "About the Role" [level=3] [ref=f21e19]
          - paragraph [ref=f21e20]: The Model Shaping team at Together AI works on products and research for tailoring open foundation models to downstream applications. We build services that allow machine learning developers to choose the best models for their tasks and further improve these models using domain-specific data. In addition, we develop new methods for more efficient model training and evaluation, drawing inspiration from a broad spectrum of ideas across machine learning, natural language processing, and ML systems.
          - paragraph [ref=f21e21]: As a Research Engineer on the Scaling Team within Model Shaping, you will turn cutting-edge research on efficient foundation model training into robust, high-performance systems. You will profile and optimize Together's training infrastructure, identify performance bottlenecks across the stack, and implement state-of-the-art techniques from both the research literature and our own scientists in production environments.
          - paragraph [ref=f21e22]: Your work will directly shape the fine-tuning experience of Together's customers. You will rapidly bring newly released open-source models onto the Model Shaping platform, ensuring they train efficiently and reliably across diverse customer workloads. Working closely with Research Scientists, you will also build the experimental infrastructure that accelerates research and enables validated ideas to be deployed reliably at scale.
          - heading "Responsibilities" [level=3] [ref=f21e23]
          - list [ref=f21e24]:
            - listitem [ref=f21e25]: Design, implement, and optimize core components of Together's large-scale training infrastructure.
            - listitem [ref=f21e26]: Integrate new model architectures, validate training correctness and convergence, and optimize performance for production fine-tuning workloads.
            - listitem [ref=f21e27]: Profile distributed training workloads to identify and eliminate bottlenecks across compute, memory, and communication.
            - listitem [ref=f21e28]: Design and execute experiments to validate performance hypotheses and benchmark new approaches against state-of-the-art methods.
            - listitem [ref=f21e29]: Partner closely with Research Scientists to productionize novel training methods and contribute to publications and open-source releases.
            - listitem [ref=f21e30]: Rapidly enable support for newly released open-source foundation models on the Together platform.
            - listitem [ref=f21e31]: Build and maintain experimental infrastructure that accelerates research while ensuring production-quality reliability and scalability.
          - heading "Requirements" [level=3] [ref=f21e32]
          - list [ref=f21e33]:
            - listitem [ref=f21e34]: Demonstrated ability to independently take ambiguous performance or infrastructure problems from investigation through deployment.
            - listitem [ref=f21e35]: Strong programming skills in Python and PyTorch, with an emphasis on writing efficient, maintainable code.
            - listitem [ref=f21e36]: Hands-on experience training or fine-tuning large neural networks in multi-GPU or multi-node environments.
            - listitem [ref=f21e37]: Solid understanding of ML systems fundamentals, including GPU architecture, mixed-precision training, and distributed training paradigms such as data, tensor, pipeline, or expert parallelism.
            - listitem [ref=f21e38]: Strong communication skills and the ability to collaborate effectively with both researchers and engineers.
            - listitem [ref=f21e39]: Passion for staying current with advances in AI research and applying them to real-world systems.
            - listitem [ref=f21e40]: Excitement about translating cutting-edge research into production systems that deliver customer impact.
          - heading [level=3] [ref=f21e41]:
            - strong [ref=f21e43]: Nice to Have
          - list [ref=f21e44]:
            - listitem [ref=f21e45]: Experience writing optimized NVIDIA GPU kernels using CUDA or Triton, or implementing communication collectives with technologies such as NCCL or NVSHMEM.
            - listitem [ref=f21e46]: Experience with large-scale training frameworks such as FSDP, DeepSpeed, Megatron-LM, or custom distributed training systems.
            - listitem [ref=f21e47]: Experience optimizing distributed training for compute efficiency, memory efficiency, or scalability.
            - listitem [ref=f21e48]: Experience running and managing large-scale GPU experiments, including scheduling, monitoring, and fault tolerance.
            - listitem [ref=f21e49]: Contributions to widely used open-source ML or ML systems projects.
            - listitem [ref=f21e50]: Experience building or operating ML products or managed services used by external customers.
          - heading [level=3] [ref=f21e51]:
            - strong [ref=f21e53]: About Together AI
          - paragraph [ref=f21e54]: Together AI is a research-driven artificial intelligence company. We believe open and transparent AI systems will drive innovation and create the best outcomes for society, and together we are on a mission to significantly lower the cost of modern AI systems by co-designing software, hardware, algorithms, and models. We have contributed to leading open-source research, models, and datasets to advance the frontier of AI, and our team has been behind technological advancement such as FlashAttention, ATLAS, RedPajama, and Mamba. We invite you to join a passionate group of researchers in our journey in building the next generation AI infrastructure.
          - heading [level=3] [ref=f21e55]:
            - strong [ref=f21e57]: Compensation
          - paragraph [ref=f21e58]: We offer competitive compensation, startup equity, health insurance, and other benefits. The US base salary range for this full-time position is $200,000 - $290,000. Our salary ranges are determined by location, level and role. Individual compensation will be determined by experience, skills, and job-related knowledge.
          - heading [level=3] [ref=f21e59]:
            - strong [ref=f21e61]: Equal Opportunity
          - paragraph [ref=f21e62]: Together AI is an Equal Opportunity Employer and is proud to offer equal employment opportunity to everyone regardless of race, color, ancestry, religion, sex, national origin, sexual orientation, age, citizenship, marital status, disability, gender identity, veteran status, and more.
          - paragraph [ref=f21e63]:
            - generic [ref=f21e64]:
              - text: Please see our privacy policy at
              - link "https://www.together.ai/privacy" [ref=f21e65] [cursor=pointer]:
                - /url: https://www.together.ai/privacy
