                - listitem [ref=f21e411]: Autoimmune disorder, for example, lupus, fibromyalgia, rheumatoid arthritis, HIV/AIDS
                - listitem [ref=f21e412]: Blind or low vision
                - listitem [ref=f21e413]: Cancer (past or present)
                - listitem [ref=f21e414]: Cardiovascular or heart disease
                - listitem [ref=f21e415]: Celiac disease
                - listitem [ref=f21e416]: Cerebral palsy
                - listitem [ref=f21e417]: Deaf or serious difficulty hearing
                - listitem [ref=f21e418]: Diabetes
                - listitem [ref=f21e419]: Disfigurement, for example, disfigurement caused by burns, wounds, accidents, or congenital disorders
                - listitem [ref=f21e420]: Epilepsy or other seizure disorder
                - listitem [ref=f21e421]: Gastrointestinal disorders, for example, Crohn's Disease, irritable bowel syndrome
                - listitem [ref=f21e422]: Intellectual or developmental disability
                - listitem [ref=f21e423]: Mental health conditions, for example, depression, bipolar disorder, anxiety disorder, schizophrenia, PTSD
                - listitem [ref=f21e424]: Missing limbs or partially missing limbs
                - listitem [ref=f21e425]: Mobility impairment, benefiting from the use of a wheelchair, scooter, walker, leg brace(s) and/or other supports
                - listitem [ref=f21e426]: Nervous system condition, for example, migraine headaches, Parkinson’s disease, multiple sclerosis (MS)
                - listitem [ref=f21e427]: Neurodivergence, for example, attention-deficit/hyperactivity disorder (ADHD), autism spectrum disorder, dyslexia, dyspraxia, other learning disabilities
                - listitem [ref=f21e428]: Partial or complete paralysis (any cause)
                - listitem [ref=f21e429]: Pulmonary or respiratory conditions, for example, tuberculosis, asthma, emphysema
                - listitem [ref=f21e430]: Short stature (dwarfism)
                - listitem [ref=f21e431]: Traumatic brain injury
