              - listitem [ref=f113e84]:
                - paragraph [ref=f113e85]: Excellent communication and organizational skills, both written and verbal.
              - listitem [ref=f113e86]:
                - paragraph [ref=f113e87]: A high level of experience and understanding of version control; preferably git.
              - listitem [ref=f113e88]:
                - paragraph [ref=f113e89]: Comprehensive experience with UNIX-style systems.
