          - generic [ref=f113e40]:
            - heading [level=1] [ref=f113e41]:
              - strong [ref=f113e42]: Company Overview
            - paragraph [ref=f113e43]: Deepgram is the leading platform underpinning the emerging trillion-dollar Voice AI economy, providing real-time APIs for speech-to-text (STT), text-to-speech (TTS), and building production-grade voice agents at scale. More than 200,000 developers and 1,300+ organizations build voice offerings that are ‘Powered by Deepgram’, including Twilio, Cloudflare, Sierra, Decagon, Vapi, Daily, Cresta, Granola, and Jack in the Box. Deepgram’s voice-native foundation models are accessed through cloud APIs or as self-hosted and on-premises software, with unmatched accuracy, low latency, and cost efficiency. Backed by a recent Series C led by leading global investors and strategic partners, Deepgram has processed over 50,000 years of audio and transcribed more than 1 trillion words. There is no organization in the world that understands voice better than Deepgram.
            - paragraph [ref=f113e44]
            - heading [level=1] [ref=f113e45]:
              - strong [ref=f113e46]: Company Operating Rhythm
            - paragraph [ref=f113e47]: At Deepgram, we expect an AI-first mindset—AI use and comfort aren’t optional, they’re core to how we operate, innovate, and measure performance.
            - paragraph [ref=f113e48]: Every team member who works at Deepgram is expected to actively use and experiment with advanced AI tools, and even build your own into your everyday work. We measure how effectively AI is applied to deliver results, and consistent, creative use of the latest AI capabilities is key to success here. Candidates should be comfortable adopting new models and modes quickly, integrating AI into their workflows, and continuously pushing the boundaries of what these technologies can do.
            - paragraph [ref=f113e49]: Additionally, we move at the pace of AI. Change is rapid, and you can expect your day-to-day work to evolve just as quickly. This may not be the right role if you’re not excited to experiment, adapt, think on your feet, and learn constantly, or if you’re seeking something highly prescriptive with a traditional 9-to-5.
            - paragraph [ref=f113e50]
            - paragraph [ref=f113e51]:
              - strong [ref=f113e52]: "Opportunity:"
            - paragraph [ref=f113e53]: Deepgram is looking for a Backend Software Engineer to join the Engine team to lead the design and implementation of Deepgram’s products. You will design and implement secure, robust, and scalable services for speech processing; efficient, distributed compute orchestration; optimized scheduling, and more. Your skill at building highly reusable code that overcomes technical challenges is paired with an intuition for delightful user experiences. You will be a critical voice in Deepgram’s Product and Engineering teams, driving high impact products from start to finish.
            - paragraph [ref=f113e54]
            - paragraph [ref=f113e55]:
              - strong [ref=f113e56]: What You’ll Do
            - list [ref=f113e57]:
              - listitem [ref=f113e58]:
                - paragraph [ref=f113e59]: Improve Deepgram’s core inference services including areas in networking, speech processing, audio transcoding, and latency and memory optimization
              - listitem [ref=f113e60]:
                - paragraph [ref=f113e61]: Develop processes for measuring, building, and optimizing services to maximize system performance
              - listitem [ref=f113e62]:
                - paragraph [ref=f113e63]: Debug complex system issues that include networking, scheduling, and high performance computing interactions
              - listitem [ref=f113e64]:
                - paragraph [ref=f113e65]: Rapidly customize backend services to support our customer needs
              - listitem [ref=f113e66]:
                - paragraph [ref=f113e67]: Partner with Product to design and implement new services, features, and/or products end to end
            - paragraph [ref=f113e68]
            - paragraph [ref=f113e69]:
              - strong [ref=f113e70]: You’ll Love This Role If You
            - list [ref=f113e71]:
              - listitem [ref=f113e72]:
                - paragraph [ref=f113e73]: Thrive in a fast-paced, impact-driven environment where learning new skills on-the-fly is not only encouraged but a regular necessity
              - listitem [ref=f113e74]:
                - paragraph [ref=f113e75]: Enjoy balancing decisions about product and feature maturity to decide when to make minimally invasive changes versus when to incorporate detailed design work
            - paragraph [ref=f113e76]
