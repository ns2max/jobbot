            - heading "Staff Data Scientist, Marketing" [level=1] [ref=f588e15]
            - generic [ref=f588e16]: Remote - Ontario, Canada
          - button "Apply" [ref=f588e20] [cursor=pointer]
        - generic [ref=f588e21]:
          - generic [ref=f588e28]:
            - text: Reddit is a community of communities. It’s built on shared interests, passion, and trust, and is home to the most open and authentic conversations on the internet. Every day, Reddit users submit, vote, and comment on the topics they care most about. With 100,000+ active communities and approximately 130 million daily active unique visitors, Reddit is one of the internet’s largest sources of information. For more information, visit
            - link "www.redditinc.com" [ref=f588e29] [cursor=pointer]:
              - /url: http://www.redditinc.com/
            - text: .
          - generic [ref=f588e30]:
            - paragraph [ref=f588e31]:
              - strong [ref=f588e32]:
                - text: "Location: At Reddit we continue to grow our teams with the best talent. We're completely"
                - link "remote friendly" [ref=f588e33] [cursor=pointer]:
                  - /url: https://www.redditinc.com/blog/evolving-reddits-workforce/
                - text: .
            - paragraph [ref=f588e34]:
              - strong [ref=f588e35]: "Team Description:"
            - paragraph [ref=f588e36]: The Marketing Science team at Reddit leverages data to maximize the impact of Reddit’s own marketing investments. We serve as the engine behind our growth, using advanced experimentation, causal inference, and econometrics to understand what drives users to Reddit and what brings advertisers to our platform. We work at the intersection of brand building and performance marketing, ensuring every dollar spent is an investment in the long-term health of our ecosystem.
            - paragraph [ref=f588e37]:
              - strong [ref=f588e38]: "Role Description:"
            - paragraph [ref=f588e39]:
              - text: "Reddit is looking for a highly experienced Staff Data Scientist to lead the strategy and technical execution of our Marketing Intelligence efforts. In this role, you will be the primary architect of how we measure and optimize Reddit’s marketing spend. You will focus on two critical flywheels:"
              - strong [ref=f588e40]: B2B Marketing
              - text: (acquiring and retaining advertisers) and
              - strong [ref=f588e41]: B2C Growth
              - text: (acquiring and engaging new Redditors).
            - paragraph [ref=f588e42]: This is a high-autonomy, high-impact role where you will set the long-term strategic goals for Reddit’s marketing measurement, influencing senior leadership and defining how we value our brand and performance efforts.
            - paragraph [ref=f588e43]:
              - strong [ref=f588e44]: "Responsibilities:"
            - list [ref=f588e45]:
              - listitem [ref=f588e46]:
                - strong [ref=f588e47]: "Set Long-Term Marketing Strategy:"
                - text: Define the 2–3 year technical roadmap for marketing measurement. Establish the "North Star" metrics and frameworks that determine how Reddit allocates hundreds of millions in marketing budget.
              - listitem [ref=f588e48]:
                - strong [ref=f588e49]: "Optimize Marketing ROI:"
                - text: Build and refine Media Mix Models (MMM) and Multi-Touch Attribution (MTA) systems to mathematically quantify the incremental impact of marketing spend.
              - listitem [ref=f588e50]:
                - strong [ref=f588e51]: "Bridge B2B & B2C Growth:"
                - text: Design unified frameworks to optimize marketing aimed at both new advertisers (driving revenue) and new users (driving engagement), identifying synergies where brand awareness for one fuels growth for the other.
              - listitem [ref=f588e52]:
                - strong [ref=f588e53]: "Advance Causal Inference & Experimentation:"
                - text: Lead the design of complex "always-on" incrementality testing and geo-holdout experiments. Develop methodologies to measure the long-term "halo effect" of brand marketing on organic growth.
              - listitem [ref=f588e54]:
                - strong [ref=f588e55]: "Lead Through Influence:"
                - text: Collaborate deeply with Marketing, Growth, and Finance to translate complex data insights into actionable budget shifts.
              - listitem [ref=f588e56]:
                - strong [ref=f588e57]: Be the Technical Guide for the Team
                - text: ": Mentor junior scientists and set the technical bar for code quality and statistical rigor across the Marketing organization."
            - paragraph [ref=f588e58]:
              - strong [ref=f588e59]: "Minimum Qualifications:"
            - list [ref=f588e60]:
              - listitem [ref=f588e61]:
                - strong [ref=f588e62]: "Education:"
                - text: Advanced degree (Master’s or Ph.D.) in Statistics, Economics, Mathematics, or a related quantitative field.
              - listitem [ref=f588e63]:
                - strong [ref=f588e64]: "Experience:"
              - list [ref=f588e65]:
                - listitem [ref=f588e66]: "For M.S. holders: 10+ years of industry experience in marketing science, growth data science, or econometrics."
                - listitem [ref=f588e67]: "For Ph.D. holders: 6+ years of industry experience."
              - listitem [ref=f588e68]:
                - strong [ref=f588e69]: "Domain Expertise:"
                - text: Deep understanding of the marketing ecosystem, including hands-on experience with Marketing Mix Modeling (MMM), Incrementality Testing, and Customer Lifetime Value (LTV) prediction.
              - listitem [ref=f588e70]:
                - strong [ref=f588e71]: "Technical Skills:"
                - text: Advanced proficiency in Python or R and SQL. Experience building production-grade data pipelines and using machine learning for predictive modeling (e.g., churn prediction, lead scoring).
              - listitem [ref=f588e72]:
                - strong [ref=f588e73]: "Strategic Communication:"
                - text: Proven track record of influencing C-suite stakeholders and "translating" complex statistical concepts into business strategy.
              - listitem [ref=f588e74]:
                - strong [ref=f588e75]: "Adaptability:"
                - text: Experience working in fast-paced environments where you must navigate ambiguity and build frameworks from the ground up.
            - paragraph [ref=f588e76]:
              - strong [ref=f588e77]: "Preferred Qualifications:"
            - list [ref=f588e78]:
              - listitem [ref=f588e79]: Experience with Bayesian structural time series or causal inference libraries.
              - listitem [ref=f588e80]: Previous experience in a high-growth marketplace or social media platform.
              - listitem [ref=f588e81]: A passion for the Reddit community and an understanding of our unique "Ads-as-Content" philosophy.
            - paragraph [ref=f588e82]:
              - strong [ref=f588e83]: "Benefits:"
            - list [ref=f588e84]:
              - listitem [ref=f588e85]: Global Benefit programs that fit your lifestyle, from workspace to professional development to caregiving support
              - listitem [ref=f588e86]: Family Planning Support
              - listitem [ref=f588e87]: Gender-Affirming Care
              - listitem [ref=f588e88]: Mental Health & Coaching Benefits
              - listitem [ref=f588e89]: Comprehensive Medical Benefits & Health Care Spending Account
              - listitem [ref=f588e90]: Registered Retirement Savings Plan with matching contributions
              - listitem [ref=f588e91]: Income Replacement Programs
              - listitem [ref=f588e92]: Flexible Vacation & Paid Volunteer Time Off
              - listitem [ref=f588e93]: Generous Paid Parental Leave
            - paragraph [ref=f588e94]
