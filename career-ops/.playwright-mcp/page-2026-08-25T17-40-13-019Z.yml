        - button "Apply Now" [ref=f233e40] [cursor=pointer]
      - generic [ref=f233e43]:
        - generic [ref=f233e44]:
          - heading "Samsara's Mission" [level=3] [ref=f233e45]
          - paragraph [ref=f233e46]: Improve the safety, efficiency, and sustainability of the operations that power the global economy.
          - link [ref=f233e47] [cursor=pointer]:
            - /url: /blog/the-samsara-culture-playbook
        - generic [ref=f233e51]:
          - generic [ref=f233e52]:
            - paragraph [ref=f233e53]:
              - strong [ref=f233e55]: Who we are
            - paragraph [ref=f233e56]: "Samsara (NYSE: IOT) is the pioneer of the Connected Operations™ Cloud, which is a platform that enables organizations that depend on physical operations to harness Internet of Things (IoT) data to develop actionable insights and improve their operations. At Samsara, we are helping improve the safety, efficiency and sustainability of the physical operations that power our global economy. Representing more than 40% of global GDP, these industries are the infrastructure of our planet, including agriculture, construction, field services, transportation, and manufacturing — and we are excited to help digitally transform their operations at scale."
            - paragraph [ref=f233e57]: Working at Samsara means you’ll help define the future of physical operations and be on a team that’s shaping an exciting array of product solutions, including Video-Based Safety, Vehicle Telematics, Apps and Driver Workflows, and Equipment Monitoring. As part of a recently public company, you’ll have the autonomy and support to make an impact as we build for the long term.
          - paragraph [ref=f233e58]:
            - strong [ref=f233e60]: "About the role:"
          - paragraph [ref=f233e61]: The Samsara Machine Learning / Computer Vision team builds end-to-end applications to power different product pillars at Samsara. We are looking for a talented applied scientist to generate insights and draw value from rich customer interactions, as well as from the 2T+ data points our sensors and cameras collect on an annual basis.
          - paragraph [ref=f233e62]:
            - strong [ref=f233e64]: This is a remote position open to candidates residing in the United States. This position requires travel up to 5% of the time. Relocation assistance will not be provided for this role.
          - paragraph [ref=f233e65]:
            - strong [ref=f233e67]: "You should apply if:"
          - list [ref=f233e68]:
            - listitem [ref=f233e69]:
              - generic [ref=f233e70]:
                - strong [ref=f233e71]: "You want to impact the industries that run our world:"
                - text: The software, firmware, and hardware you build will result in real-world impact—helping to keep the lights on, get food into grocery stores, and most importantly, ensure workers return home safely.
            - listitem [ref=f233e72]:
              - generic [ref=f233e73]:
                - strong [ref=f233e74]: "You are a life-long learner:"
                - text: We have ambitious goals. Every Samsarian has a growth mindset as we work with a wide range of technologies, challenges, and customers that push us to learn on the go.
            - listitem [ref=f233e75]:
              - generic [ref=f233e76]:
                - strong [ref=f233e77]: "You believe customers are more than a number:"
                - text: Samsara engineers enjoy a rare closeness to the end user and you will have the opportunity to participate in customer interviews, collaborate with customer success and product managers, and use metrics to ensure our work is translating into better customer outcomes.
            - listitem [ref=f233e78]:
              - generic [ref=f233e79]:
                - strong [ref=f233e80]: "You are a team player:"
                - text: Working on our Samsara Engineering teams requires a mix of independent effort and collaboration. Motivated by our mission, we’re all racing toward our connected operations vision, and we intend to win—together.
          - paragraph [ref=f233e81]:
            - strong [ref=f233e83]: "In this role, you will:"
          - list [ref=f233e84]:
            - listitem [ref=f233e85]: Build and improve the accuracy of ML / CV models, including retraining and optimizing models to solve Samsara-specific problems.
            - listitem [ref=f233e86]:
              - text: "This will contribute to our R&D roadmap across our four product categories including:"
              - list [ref=f233e87]:
                - listitem [ref=f233e88]:
                  - strong [ref=f233e90]: Video-based safety - Key focus.
                - listitem [ref=f233e91]: Vehicle telematics.
                - listitem [ref=f233e92]: Equipment monitoring.
                - listitem [ref=f233e93]: Workforce apps and Site Visibility.
            - listitem [ref=f233e94]: Work with petabyte-scale data from Samsara camera and sensor devices to develop new models.
            - listitem [ref=f233e95]: Optimize models for inference on the backend and/or on edge devices.
            - listitem [ref=f233e96]: Partner with firmware and full-stack teams to deploy model for optimal performance and cost.
            - listitem [ref=f233e97]: Stay connected to industry and academic research and adopt novel technology that suits Samsara’s needs.
            - listitem [ref=f233e98]: Collaborate with product team to translate customer needs to ML / CV solutions.
            - listitem [ref=f233e99]: Champion, role model, and embed Samsara’s cultural principles (Focus on Customer Success, Build for the Long Term, Adopt a Growth Mindset, Be Inclusive, Win as a Team) as we scale globally and across new offices.
          - paragraph [ref=f233e100]:
            - strong [ref=f233e102]: "Minimum requirements for the role:"
          - list [ref=f233e103]:
            - listitem [ref=f233e104]: BS or MS in Computer Science or other technical degree with 5+ years of experience as an Applied Scientist, Machine Learning Engineer, or similar role working on Computer Vision; or
            - listitem [ref=f233e105]: Ph.D. in Computer Science or quantitative discipline (e.g., Applied Math, Physics, Statistics) with 3+ years of experience working on Computer Vision.
            - listitem [ref=f233e106]: Strong proficiency in one or more common languages (e.g., C++, Golang, Java, Python).
            - listitem [ref=f233e107]: Proficiency with common ML tools (e.g., Spark, TensorFlow, PyTorch).
            - listitem [ref=f233e108]: Familiarity with managing data processing and machine learning code via GitHub.
            - listitem [ref=f233e109]: Excellent problem-solving skills and the ability to work alone and collaboratively.
          - paragraph [ref=f233e110]:
            - strong [ref=f233e112]: "An ideal candidate also has:"
          - list [ref=f233e113]:
            - listitem [ref=f233e114]: Experience implementing ML models on large datasets 100K to 1M and more on the edge.
            - listitem [ref=f233e115]: Experience building, deploying, and optimizing ML models on the edge.
            - listitem [ref=f233e116]: Experience in state-of-the-art models for road segmentation, road object detection and tracking.
            - listitem [ref=f233e117]: Experience working with cross-functional teams on a project.
            - listitem [ref=f233e118]: Comfortable with full-stack/backend development code to build a strong understanding of underlying data structures and other dependencies.
          - generic [ref=f233e120]:
            - paragraph [ref=f233e122]: The range of annual base salary for full-time employees for this position is below. Please note that base pay offered may vary depending on factors including your city of residence, job-related knowledge, skills, and experience. This role is also eligible for an initial RSU grant with no vesting cliff, and ongoing refresh opportunities tied to performance, subject to plan terms and conditions. Learn more about our total rewards and benefits below.
            - generic [ref=f233e123]: Annual Base Salary
            - generic [ref=f233e124]: $170,170—$319,000 USD
          - generic [ref=f233e125]:
            - paragraph [ref=f233e126]:
              - strong [ref=f233e127]: Total Rewards
            - paragraph [ref=f233e128]:
              - text: At Samsara, we build for the people who keep the global economy moving. We want owners, not passengers, which is why
              - link "our rewards" [ref=f233e129] [cursor=pointer]:
                - /url: https://www.samsara.com/company/careers/benefits
              - text: are designed to fuel high-impact builders. Our compensation program delivers above-market total compensation through a combination of base salary, performance-based bonus/variable pay, and equity (for eligible roles) in a high-growth public company. We meaningfully differentiate pay for our top performers, who have the opportunity to earn above-market compensation that can outpace the broader market over time.
            - paragraph [ref=f233e130]: "Beyond compensation, we provide the foundations that enable long-term success: a flexible, employee-led remote model, a professional development stipend, comprehensive health and parental leave plans, and more. If you’re ready to build for the long term and own the outcome, your journey starts here."
            - paragraph [ref=f233e131]:
              - strong [ref=f233e132]: Flexible Working
            - paragraph [ref=f233e133]: At Samsara, we embrace a flexible working model that caters to the diverse needs of our teams. Our offices are open for those who prefer to work in-person and we also support remote work where it aligns with our operational requirements. For certain positions, being close to one of our offices or within a specific geographic area is important to facilitate collaboration, access to resources, or alignment with our service regions. In these cases, the job description will clearly indicate any working location requirements. Our goal is to ensure that all members of our team can contribute effectively, whether they are working on-site, in a hybrid model, or fully remotely. All offers of employment are contingent upon an individual’s ability to secure and maintain the legal right to work at the company and in the specified work location, if applicable.
            - paragraph [ref=f233e134]:
              - strong [ref=f233e135]: Belonging at Samsara
            - paragraph [ref=f233e136]: At Samsara, we welcome everyone regardless of their background. All qualified applicants will receive consideration for employment without regard to race, color, religion, national origin, sex, gender, gender identity, sexual orientation, protected veteran status, disability, age, and other characteristics protected by law. We depend on the unique approaches of our team members to help us solve complex problems and want to ensure that Samsara is a place where people from all backgrounds can make an impact.
            - paragraph [ref=f233e137]:
              - strong [ref=f233e138]: Accommodations
            - paragraph [ref=f233e139]:
              - text: Samsara is an inclusive work environment, and we are committed to ensuring equal opportunity in employment for qualified persons with disabilities. Please email
              - link "accessibleinterviewing@samsara.com" [ref=f233e140] [cursor=pointer]:
                - /url: mailto:accessibleinterviewing@samsara.com
              - text: or
              - link "click here" [ref=f233e141] [cursor=pointer]:
                - /url: https://forms.gle/DrM6DFQUiSgfPtCVA
              - text: if you require any reasonable accommodations throughout the recruiting process.
            - paragraph [ref=f233e142]:
              - strong [ref=f233e143]: Our Commitment to Authenticity
            - paragraph [ref=f233e144]:
              - text: We use
              - link "Tofu" [ref=f233e145] [cursor=pointer]:
                - /url: https://hiretofu.com/privacyPolicy
              - text: ", a fraud detection tool, to validate the authenticity of applications and protect against identity fraud. This ensures we are connecting with real people and allows us to prioritize genuine candidates. Please see Samsara’s"
              - link "Candidate Privacy Notice" [ref=f233e146] [cursor=pointer]:
                - /url: https://www.samsara.com/legal/candidate-privacy-notice
              - text: for more information.
            - paragraph [ref=f233e147]:
              - strong [ref=f233e148]: Fraudulent Employment Offers
            - paragraph [ref=f233e149]:
              - text: Samsara is aware of scams involving fake job interviews and offers. Please know we do not charge fees to applicants at any stage of the hiring process. Official communication about your application will only come from emails ending in @samsara.com, @us-greenhouse-mail.io or @mail3.guide.co. For more information regarding fraudulent employment offers, please visit our
              - link "blog post here" [ref=f233e150] [cursor=pointer]:
                - /url: https://samsara.com/blog/avoiding-fake-job-offers
              - text: .
