        - generic [ref=f119e19]:
          - generic [ref=f119e20]:
            - strong [ref=f119e23]: "About Glean:"
            - generic [ref=f119e25]: Glean is the Work AI platform that helps everyone work smarter with AI. What began as the industry’s most advanced enterprise search has evolved into a full-scale Work AI ecosystem, powering intelligent Search, an AI Assistant, and scalable AI agents on one secure, open platform. With over 100 enterprise SaaS connectors, flexible LLM choice, and robust APIs, Glean gives organizations the infrastructure to govern, scale, and customize AI across their entire business - without vendor lock-in or costly implementation cycles.
            - generic [ref=f119e27]: "At its core, Glean is redefining how enterprises find, use, and act on knowledge. Its Enterprise Graph and Personal Knowledge Graph map the relationships between people, content, and activity, delivering deeply personalized, context-aware responses for every employee. This foundation powers Glean’s agentic capabilities - AI agents that automate real work across teams by accessing the industry’s broadest range of data: enterprise and world, structured and unstructured, historical and real-time. The result: measurable business impact through faster onboarding, hours of productivity gained each week, and smarter, safer decisions at every level."
            - generic [ref=f119e29]: Recognized by Fast Company as one of the World’s Most Innovative Companies (Top 10, 2025), by CNBC’s Disruptor 50, Bloomberg’s AI Startups to Watch (2026), Forbes AI 50, and Gartner’s Tech Innovators in Agentic AI, Glean continues to accelerate its global impact. With customers across 50+ industries and 1,000+ employees in more than 25 countries, we’re helping the world’s largest organizations make every employee AI-fluent, and turning the superintelligent enterprise from concept into reality.
            - generic [ref=f119e31]: If you’re excited to shape how the world works, you’ll help build systems used daily across Microsoft Teams, Zoom, ServiceNow, Zendesk, GitHub, and many more - deeply embedded where people get things done. You’ll ship agentic capabilities on an open, extensible stack, with the craft and care required for enterprise trust, as we bring Work AI to every employee, in every company.
          - generic [ref=f119e33]:
            - strong [ref=f119e37]: "About the Role:"
            - generic [ref=f119e39]:
              - text: Glean is seeking a Machine Learning Engineer to improve the quality of our AI Assistant and autonomous agents. This role sits at the intersection of production machine learning, LLM-powered systems, and product engineering, with a focus on building, evaluating, and iterating on assistant experiences that are useful, reliable, and grounded in real enterprise workflows.
              - paragraph [ref=f119e40]: You will work on applied problems across agent quality, evaluation, personalization, retrieval, and orchestration. The ideal person is excited by shipping production systems, not pure research, and wants to help shape how Glean’s assistant gets better over time through stronger signals, tighter feedback loops, and better end-to-end execution quality.
            - strong [ref=f119e44]: "You will:"
            - list [ref=f119e46]:
              - listitem [ref=f119e47]: Build and improve ML and LLM-powered systems that raise the quality of Glean’s AI Assistant and autonomous agents across real user workflows.
              - listitem [ref=f119e48]: Design evaluation, benchmarking, and monitoring loops to measure assistant quality, model quality, and end-to-end system performance.
              - listitem [ref=f119e49]: Develop and iterate on signals, prompts, workflows, and model-driven logic that improve reasoning, planning, personalization, and task completion quality.
              - listitem [ref=f119e50]: Work across areas such as RAG, semantic search, recommendation-style systems, post-training or reinforcement learning, and agent orchestration where they materially improve product outcomes.
              - listitem [ref=f119e51]: Partner closely with product, design, and engineering teammates to understand customer pain points and ship high-quality production systems quickly.
              - listitem [ref=f119e52]: Contribute to the data and ML infrastructure needed to support robust experimentation, offline and online evaluation, and continuous model improvement.
            - strong [ref=f119e55]: "About you:"
            - list [ref=f119e57]:
              - listitem [ref=f119e58]: 2+ years of industry experience in machine learning, applied AI, or software engineering with significant ML ownership.
              - listitem [ref=f119e59]: Strong hands-on coding ability and a track record of shipping production systems, not just prototypes or research projects.
              - listitem [ref=f119e60]: "Experience in one or more of the following areas: LLM applications, NLP, search, retrieval, recommendations, evaluation frameworks, agent systems, or personalization."
              - listitem [ref=f119e61]: Comfort working across both modeling and product engineering details, including experimentation, quality measurement, and production iteration.
              - listitem [ref=f119e62]: Proficiency in common ML tooling and strong software engineering fundamentals in languages such as Python, Go, Java, or C++.
              - listitem [ref=f119e63]: A pragmatic, product-minded approach. You know when to use sophisticated ML techniques and when simple, reliable systems are the better answer.
              - listitem [ref=f119e64]: A proactive, low-ego working style and excitement about learning quickly in a high-velocity environment.
            - strong [ref=f119e67]: "Location:"
            - list [ref=f119e69]:
              - listitem [ref=f119e70]: This role is hybrid (4 days a week in our San Francisco office)
            - strong [ref=f119e73]: "Compensation & Benefits:"
            - generic [ref=f119e75]: The standard base salary range for this position is $180,000 - $205,000 annually. Compensation offered will be determined by factors such as location, level, job-related knowledge, skills, and experience. Certain roles may be eligible for variable compensation, equity, and benefits.
            - generic [ref=f119e77]: We offer a comprehensive benefits package including competitive compensation, Medical, Vision, and Dental coverage, generous time-off policy, and the opportunity to contribute to your 401k plan to support your long-term goals. When you join, you'll receive a home office improvement stipend, as well as an annual education and wellness stipends to support your growth and wellbeing. We foster a vibrant company culture through regular events, and provide healthy lunches daily to keep you fueled and focused.
            - generic [ref=f119e79]: We’re committed to building and sustaining a diverse, inclusive workplace. We strive to attract and retain people with a wide range of backgrounds, experiences, and perspectives, and we do not discriminate on the basis of gender, ethnicity, sexual orientation, religion, civil or family status, age, disability, or race.
            - generic [ref=f119e82]: "#LI-HYBRID"
          - generic [ref=f119e84]:
            - strong [ref=f119e88]: "AI-First Mindset at Glean:"
            - generic [ref=f119e91]:
              - text: At Glean, AI fluency is core to how we work and we're committed to ensuring every new hire feels confident integrating AI into their everyday work.
              - strong [ref=f119e92]: As part of the interview process, you'll complete a brief AI-focused exercise or discussion so we can understand how you think about, design, and use AI to drive impact in your role.
              - text: Feel free to reference any tools, platforms, or workflows you use today — prior Glean experience isn't required.
            - strong [ref=f119e96]: "Global Data Privacy Notice for Job Candidates and Applicants:"
            - generic [ref=f119e99]:
              - text: Depending on your location, the General Data Protection Regulation (GDPR), California Consumer Privacy Act (CCPA), or other privacy laws may regulate the way we manage the data of job applicants. Our full notice outlining how data will be processed as part of the application procedure for applicable locations is available in our
              - link [ref=f119e100] [cursor=pointer]:
                - /url: https://www.glean.com/privacy
                - strong [ref=f119e101]: Privacy Policy
              - text: . By submitting your application, you are agreeing to our use and processing of your data as required. US applicants and their applications are subject to arbitration of disputes as outlined in our
              - link [ref=f119e102] [cursor=pointer]:
                - /url: https://www.glean.com/arbitrationagreement
                - strong [ref=f119e103]: Applicant Arbitration Agreement
              - text: .
            - generic [ref=f119e105]:
              - text: By clicking “Submit Application,” I confirm that I have read the Global Data Privacy Notice and the
              - link [ref=f119e106] [cursor=pointer]:
                - /url: https://www.glean.com/arbitrationagreement
                - strong [ref=f119e107]: Applicant Arbitration Agreement
              - text: ", and I agree to the terms."
