        - generic [ref=f568e13]:
          - generic [ref=f568e14]:
            - heading "Senior Machine Learning Systems Engineer, Ranking Platform" [level=1] [ref=f568e15]
            - generic [ref=f568e16]: Remote - United States
          - button "Apply" [ref=f568e20] [cursor=pointer]
        - generic [ref=f568e21]:
          - generic [ref=f568e28]:
            - text: Reddit is a community of communities. It’s built on shared interests, passion, and trust, and is home to the most open and authentic conversations on the internet. Every day, Reddit users submit, vote, and comment on the topics they care most about. With 100,000+ active communities and approximately 130 million daily active unique visitors, Reddit is one of the internet’s largest sources of information. For more information, visit
            - link "www.redditinc.com" [ref=f568e29] [cursor=pointer]:
              - /url: http://www.redditinc.com/
            - text: .
          - generic [ref=f568e30]:
            - paragraph [ref=f568e31]: At Reddit, ML Ranking Platform is the brain behind how millions of people discover content every day. ML Ranking Platform powers 40+ Reddit products including home feed, search, subreddit feeds, push notifications and others. It runs a scatter-gather ranking orchestration service that coordinates contextualized and personalized ranking on Reddit. We provide Product Engineers and ML Modeling Engineers with a platform to develop the ranking, recommendation and personalization products to delight, engage and retain Reddit users.
            - heading [level=4] [ref=f568e32]:
              - strong [ref=f568e33]: How You'll Have Impact
            - paragraph [ref=f568e34]:
              - text: As a
              - strong [ref=f568e35]: Senior Software Engineer, ML Ranking Platform
              - text: ", you will design, implement and maintain highly robust, scalable, reliable and performant ranking systems that power personalized feeds, search, and other products at Reddit scale. You’ll drive and deliver high-impact projects, building the ranking engines that orchestrate workflows for a reliable and performant ML-based system. Your work not only powers Reddit feeds; it’ll also shape how communities connect, grow, and thrive across Reddit!"
            - list [ref=f568e36]:
              - listitem [ref=f568e37]: Design and implement the next generation ML ranking system that powers the personalized feeds, search and other products at Reddit
              - listitem [ref=f568e38]: Design and develop ML and Generative AI systems in cloud-based production environments at scale
              - listitem [ref=f568e39]: Partner closely with Product, Infrastructure and Engineering teams and translate requirements into scalable ML systems
              - listitem [ref=f568e40]: Write efficient, scalable and maintainable code that will help us iterate quickly and safely
              - listitem [ref=f568e41]: Champion and drive engineering processes and best practices
              - listitem [ref=f568e42]: Raise the bar for engineering across the team through code reviews, mentorship and knowledge sharing
            - heading [level=4] [ref=f568e43]:
              - strong [ref=f568e44]: "Who You Might Have:"
            - list [ref=f568e45]:
              - listitem [ref=f568e46]: 5+ years of experience as a software engineer developing large-scale distributed systems and data intensive ML based system, using Go, Python, C++ or any object oriented programming language
              - listitem [ref=f568e47]: 5+ years of experience with designing and implementing large-scale performant and reliable machine learning systems. Experience with recommendation systems is preferred.
              - listitem [ref=f568e48]: Experience with developing and improving tools such as deployment, automation, system diagnosis, ML monitoring etc.
              - listitem [ref=f568e49]: Strong organizational skills with the ability to prioritize tasks and keep projects on schedule with a strong attention to detail
              - listitem [ref=f568e50]: BS degree in Computer Science, a similar technical field of study or equivalent practical experience
              - listitem [ref=f568e51]: Familiar with software engineering best practices such as unit testing and code reviews, design, and documentation
              - listitem [ref=f568e52]: Entrepreneurial spirit. You are self-directed, innovative, and biased towards action in fast-paced environments. You love to build new things and thrive in ambiguity and even failure
              - listitem [ref=f568e53]: Excellent communication skills. You collaborate effectively with teams in a fully remote environment and discuss complex topics with technical and non-technical audiences
            - paragraph [ref=f568e54]:
              - strong [ref=f568e55]: "Benefits:"
            - list [ref=f568e56]:
              - listitem [ref=f568e57]: Comprehensive Healthcare Benefits and Income Replacement Programs
              - listitem [ref=f568e58]: 401k with Employer Match
              - listitem [ref=f568e59]: Global Benefit programs that fit your lifestyle, from workspace to professional development to caregiving support
              - listitem [ref=f568e60]: Family Planning Support
              - listitem [ref=f568e61]: Gender-Affirming Care
              - listitem [ref=f568e62]: Mental Health & Coaching Benefits
              - listitem [ref=f568e63]: Flexible Vacation & Paid Volunteer Time Off
              - listitem [ref=f568e64]: Generous Paid Parental Leave
            - paragraph [ref=f568e65]: "#LI-Remote"
          - generic [ref=f568e67]:
            - generic [ref=f568e70]:
              - paragraph [ref=f568e71]:
                - strong [ref=f568e72]: "Pay Transparency:"
              - paragraph [ref=f568e73]: This job posting may span more than one career level.
              - paragraph [ref=f568e74]:
                - text: In addition to base salary, this job is eligible to receive equity in the form of restricted stock units, and depending on the position offered, it may also be eligible to receive a commission. Additionally, Reddit offers a wide range of benefits to U.S.-based employees, including medical, dental, and vision insurance, 401(k) program with employer match, generous time off for vacation, and parental leave. To learn more, please visit
                - link "https://www.redditinc.com/careers/" [ref=f568e75] [cursor=pointer]:
                  - /url: https://www.redditinc.com/careers/
                - text: .
              - paragraph [ref=f568e76]: To provide greater transparency to candidates, we share base salary ranges for all US-based job postings regardless of state. We set standard base pay ranges for all roles based on function, level, and country location, benchmarked against similar stage growth companies. Final offer amounts are determined by multiple factors including, skills, depth of work experience and relevant licenses/credentials, and may vary from the amounts listed below.
            - paragraph [ref=f568e77]: "The base salary range for this position is:"
            - paragraph [ref=f568e78]: $216,700 - $303,400 USD
          - generic [ref=f568e79]:
            - paragraph [ref=f568e80]: In select roles and locations, the interviews will be recorded, transcribed and summarized by artificial intelligence (AI). You will have the opportunity to opt out of recording, transcription and summarization prior to any scheduled interviews.
            - paragraph [ref=f568e81]:
              - generic [ref=f568e82]:
                - text: "During the interview, we will collect the following categories of personal information: Identifiers, Professional and Employment-Related Information, Sensory Information (audio/video recording), and any other categories of personal information you choose to share with us. We will use this information to evaluate your application for employment or an independent contractor role, as applicable. We will not sell your personal information or disclose it to any third party for their marketing purposes. We will delete any recording of your interview promptly after making a hiring decision. For more information about how we will handle your personal information, including our retention of it, please refer to our"
                - link "Candidate Privacy Policy for Potential Employees and Contractors" [ref=f568e83] [cursor=pointer]:
                  - /url: https://redditinc.com/policies/candidate-privacy-policy
                - text: .
            - paragraph [ref=f568e84]:
              - emphasis [ref=f568e85]: Reddit is proud to be an equal opportunity employer, and is committed to building a workforce representative of the diverse communities we serve. Reddit is committed to providing reasonable accommodations for qualified individuals with disabilities and disabled veterans in our job application procedures. If, due to a disability, you need an accommodation during the interview process, please let your recruiter know.
