        - generic [ref=f411e18]:
          - heading [level=3] [ref=f411e19]:
            - strong [ref=f411e20]: About the role
          - paragraph [ref=f411e21]: The Model Shaping team at Together AI works on products and research focused on tailoring open foundation models to downstream applications. We build services that enable machine learning developers to choose the best models for their tasks and further improve these models using domain-specific data. In addition, we develop new methods for more efficient model training and evaluation, drawing inspiration from a broad range of ideas across machine learning, natural language processing, and ML systems.
          - paragraph [ref=f411e22]: As a Research Engineer within Model Shaping, you will develop a platform that enables users to customize open-source models with their own data. Working across the training and inference stacks, you will build and improve our Fine-Tuning, Reinforcement Learning, and Evaluation services – from ensuring a seamless path from post-training to production serving, to optimizing the inference engine for RL training workloads. You will collaborate closely with our product, research, and engineering teams to keep the API reliable, performant, and well integrated into the company's technical infrastructure. Above all, you will help build the foundational layer of the open-source AI ecosystem, enabling developers around the world to efficiently create high-quality models tailored to their specific applications.
          - heading [level=3] [ref=f411e23]:
            - strong [ref=f411e24]: Responsibilities
          - list [ref=f411e25]:
            - listitem [ref=f411e26]: Design and build Together’s systems for customizing open-source models
            - listitem [ref=f411e27]: Build integrations between the Model Shaping and Inference platforms to ensure a seamless path from post-training to serving production workloads
            - listitem [ref=f411e28]: Add features to inference engines for large-scale post-training experiments, including optimizations for RL workloads
            - listitem [ref=f411e29]: Make sure the service is stable and robust, participating in an on-call rotation and ensuring 24/7 availability of our platform
          - heading [level=3] [ref=f411e30]:
            - strong [ref=f411e31]: Requirements
          - list [ref=f411e32]:
            - listitem [ref=f411e33]: Have 2+ years of experience building and deploying machine learning-based services in a production environment
            - listitem [ref=f411e34]: Have hands-on experience with modern inference engines, such as SGLang, vLLM, and TensorRT-LLM
            - listitem [ref=f411e35]: Are familiar with the latest methods for fine-tuning LLMs and other AI models
            - listitem [ref=f411e36]: Have a strong software engineering background in Python or Go
            - listitem [ref=f411e37]: Stay up to date with the latest advances and trends in the machine learning community
          - heading [level=3] [ref=f411e38]:
            - strong [ref=f411e39]: Experience in any of the following will make you stand out
          - list [ref=f411e40]:
            - listitem [ref=f411e41]: Serving low-precision (FP4/FP8) models, multiple LoRA adapters within one model instance (Multi-LoRA), or models distributed across several GPU nodes
            - listitem [ref=f411e42]: Optimizing the performance of RL training workloads
            - listitem [ref=f411e43]: Developing CUDA/Triton/CuTE DSL kernels for inference
            - listitem [ref=f411e44]: Developing large-scale and high-load production systems
            - listitem [ref=f411e45]: Maintaining or contributing to open-source ML projects
            - listitem [ref=f411e46]: Managing machine learning workloads on Kubernetes clusters
          - heading [level=3] [ref=f411e47]:
            - strong [ref=f411e48]: About Together AI
          - paragraph [ref=f411e49]: Together AI is a research-driven artificial intelligence company. We believe open and transparent AI systems will drive innovation and create the best outcomes for society, and together we are on a mission to significantly lower the cost of modern AI systems by co-designing software, hardware, algorithms, and models. We have contributed to leading open-source research, models, and datasets to advance the frontier of AI, and our team has been behind technological advancement such as FlashAttention, ATLAS, RedPajama, and Mamba. We invite you to join a passionate group of researchers in our journey in building the next generation AI infrastructure.
          - heading [level=3] [ref=f411e50]:
            - strong [ref=f411e51]: Compensation
          - paragraph [ref=f411e52]: We offer competitive compensation, startup equity, health insurance, and other benefits. The US base salary range for this full-time position is $200,000 - $290,000. Our salary ranges are determined by location, level and role. Individual compensation will be determined by experience, skills, and job-related knowledge.
          - heading [level=3] [ref=f411e53]:
            - strong [ref=f411e54]: Equal Opportunity
          - paragraph [ref=f411e55]: Together AI is an Equal Opportunity Employer and is proud to offer equal employment opportunity to everyone regardless of race, color, ancestry, religion, sex, national origin, sexual orientation, age, citizenship, marital status, disability, gender identity, veteran status, and more.
          - paragraph [ref=f411e56]:
            - text: Please see our privacy policy at
            - link "https://www.together.ai/privacy" [ref=f411e57] [cursor=pointer]:
              - /url: https://www.together.ai/privacy
          - paragraph
