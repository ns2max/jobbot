                - listitem [ref=f411e420]: Epilepsy or other seizure disorder
                - listitem [ref=f411e421]: Gastrointestinal disorders, for example, Crohn's Disease, irritable bowel syndrome
                - listitem [ref=f411e422]: Intellectual or developmental disability
                - listitem [ref=f411e423]: Mental health conditions, for example, depression, bipolar disorder, anxiety disorder, schizophrenia, PTSD
                - listitem [ref=f411e424]: Missing limbs or partially missing limbs
                - listitem [ref=f411e425]: Mobility impairment, benefiting from the use of a wheelchair, scooter, walker, leg brace(s) and/or other supports
                - listitem [ref=f411e426]: Nervous system condition, for example, migraine headaches, Parkinson’s disease, multiple sclerosis (MS)
                - listitem [ref=f411e427]: Neurodivergence, for example, attention-deficit/hyperactivity disorder (ADHD), autism spectrum disorder, dyslexia, dyspraxia, other learning disabilities
                - listitem [ref=f411e428]: Partial or complete paralysis (any cause)
