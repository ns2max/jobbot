          - generic [ref=f495e39]:
            - heading [level=1] [ref=f495e40]:
              - strong [ref=f495e41]: About Suno
            - paragraph [ref=f495e42]: "We're building the world's first creative entertainment platform, where the entire world can feel the joy and fulfillment of making music. Music is for everyone: Our users include everyone from grandmothers creating songs for their loved ones, to Grammy winners using Suno Studio, our power tool, to make the most popular hits in the world."
            - paragraph [ref=f495e43]: "Building the future of entertainment requires ambition. The pace is fast, the problems are hard, and the work demands ownership and intensity. For the right people, it’s incredibly rewarding: a chance to shape a new medium, work with a small team that cares deeply about quality, make music, drink too much coffee, and build something that millions of people use to express themselves in ways that were never before possible."
            - paragraph [ref=f495e44]: Suno is the fastest growing consumer entertainment company and the leader in AI music. We are backed by leading investors including Bond Capital, Menlo Ventures, Lightspeed Venture Partners, IVP, Forerunner, Union Square Ventures, Alkeon, Quiet, Matrix Partners, Schroders Capital and, NVentures (venture arm of NVIDIA).
            - paragraph [ref=f495e45]
            - paragraph [ref=f495e46]:
              - strong [ref=f495e47]: About the Role
            - paragraph [ref=f495e48]: "Suno is hiring a Senior-Staff Software Engineer, AI Engineering - responsible for writing the software that helps our non-engineering functions move faster, work smarter, and scale. As an engineer on this team, you'll own the AI-powered systems that support our operations functions: support, legal, finance and beyond. You'll work closely with partners across the business to understand what they actually need, then build and maintain the systems that deliver it. This is a 0→1 role with real ownership, real infrastructure, and a direct line to company-wide impact."
            - paragraph [ref=f495e49]
            - paragraph [ref=f495e50]:
              - strong [ref=f495e51]: What You'll Do
            - list [ref=f495e52]:
              - listitem [ref=f495e53]:
                - paragraph [ref=f495e54]: Design and build AI-powered internal systems for a range of functions across Suno
              - listitem [ref=f495e55]:
                - paragraph [ref=f495e56]: Own the underlying infrastructure that keeps those systems running in production — reliable, observable, and easy to extend to new use cases
              - listitem [ref=f495e57]:
                - paragraph [ref=f495e58]: Embed with cross-functional partners to understand their workflows, surface the right problems to solve, and prioritize what gets built next
              - listitem [ref=f495e59]:
                - paragraph [ref=f495e60]: Partner with engineering teams to expand AI-enabled tooling and ensure our internal systems benefit from the company's broader AI infrastructure
              - listitem [ref=f495e61]:
                - paragraph [ref=f495e62]: Help non-engineering teams move faster and with more capability, contributing to Suno's mission of making creative fulfillment a daily reality for everyone
              - listitem [ref=f495e63]:
                - paragraph [ref=f495e64]: Establish the engineering foundation and operational patterns for a function that will grow alongside the company
            - paragraph [ref=f495e65]
            - paragraph [ref=f495e66]:
              - strong [ref=f495e67]: What You'll Need
            - paragraph [ref=f495e68]:
              - emphasis [ref=f495e69]: Must-Haves
            - list [ref=f495e70]:
              - listitem [ref=f495e71]:
                - paragraph [ref=f495e72]: 5-7+ years of full-stack software engineering experience
              - listitem [ref=f495e73]:
                - paragraph [ref=f495e74]: Demonstrated experience building and shipping internal tooling or systems that support business functions
              - listitem [ref=f495e75]:
                - paragraph [ref=f495e76]: Hands-on familiarity with the current landscape of AI for software engineering, including LLMs, AI APIs, and agentic workflows - you've actually built and shipped something with these tools, not just used AI as a coding assistant
              - listitem [ref=f495e77]:
                - paragraph [ref=f495e78]: Strong communicator who can work effectively with non-engineering partners - you can translate between technical and business contexts without losing either audience
            - paragraph [ref=f495e79]:
              - emphasis [ref=f495e80]: Nice-to-Haves
            - list [ref=f495e81]:
              - listitem [ref=f495e82]:
                - paragraph [ref=f495e83]: Experience on a platform, developer experience, or enterprise engineering team where internal teams were your primary customers
              - listitem [ref=f495e84]:
                - paragraph [ref=f495e85]: Familiarity with support tooling, CRM systems, or workflow automation platforms
              - listitem [ref=f495e86]:
                - paragraph [ref=f495e87]: Experience standing up observability and operational practices for internal systems from scratch
              - listitem [ref=f495e88]:
                - paragraph [ref=f495e89]: Comfort operating in an early-stage, 0→1 environment where the problem space is still being defined
                - paragraph [ref=f495e90]
            - paragraph [ref=f495e91]:
              - strong [ref=f495e92]: Work Location Policy
              - text: This role is expected to work from the designated Suno office 5 days a week, per Suno's company policy. Full-time employees will receive competitive equity packages, and comprehensive benefits. The actual base salary offered may vary depending on location, skills, qualifications, and experience.
