        - tabpanel "Overview" [ref=f493e36]:
          - generic [ref=f493e37]:
            - paragraph [ref=f493e38]:
              - strong [ref=f493e39]: Who are we?
            - paragraph [ref=f493e40]: Cohere is the leading security-first enterprise AI company. We build cutting-edge foundation AI models and end-to-end products that are designed to solve real-world business problems.
            - paragraph [ref=f493e41]: We’re training and deploying frontier models for enterprises who are building AI systems. We believe that our work is instrumental to the widespread adoption of AI and we are looking for folks that want to be part of that.
            - paragraph [ref=f493e42]: We obsess over what we build. Each one of us is responsible for contributing to increasing the capabilities of our models and the value they drive for our customers. Cohere is a team of researchers, engineers, designers, and more, who are all passionate about their craft.
            - paragraph [ref=f493e43]: We are a global technology company headquartered in Toronto with key offices in London, New York City, San Francisco, Montreal, Paris, Berlin and Seoul. Join us!
            - paragraph [ref=f493e44]
            - heading "Why this role?" [level=1] [ref=f493e45]
            - paragraph [ref=f493e46]: As Cohere continues to grow, the size and complexity of our programs has continued increasing over time. To help us manage this, we are looking to bring in exceptional Technical Program Managers (TPM) to manage this!
            - paragraph [ref=f493e47]: At Cohere, TPMs are pivotal to our success, being seen as operational experts specializing in cross-functional efforts. Great TPMs at Cohere are well-rounded, executing with precision at the tactical level, while partnering with senior leaders and shaping the big picture at a strategic level, and the opportunities are endless in growing the scale and impact of their work. Cohere’s TPMs are often described by their stakeholders as organized, execution-oriented, pragmatic, and adaptable to the needs of the company and the programs they lead.
            - paragraph [ref=f493e48]: As a reward for the depth and breadth of expertize that you bring to the table, you will get to work alongside some of the most talented engineers in the world on building cutting edge AI technology. No day will be the same as the one before, and the dynamic high growth environment will be absolutely perfect for anyone excited about solving novel problems, bringing structure to oftentimes chaotic and fast-paced environments, and ambitious about scaling their own impact and growth alongside the company!
            - paragraph [ref=f493e49]
            - paragraph [ref=f493e50]:
              - strong [ref=f493e51]: "Please note: While we are remote-first and accept candidates from all over the world, we are strongly prioritizing hiring for candidates in the Eastern Time (ET) timezone."
            - paragraph [ref=f493e52]
            - heading "As a Technical Program Manager for Machine Learning Infrastructure, you will:" [level=1] [ref=f493e53]
            - list [ref=f493e54]:
              - listitem [ref=f493e55]:
                - paragraph [ref=f493e56]: Manage the program portfolio covering inference, efficiency, serving, and endpoints to guarantee that Cohere’s infrastructure continues to scale for a rapidly expanding user base of internal and external users
              - listitem [ref=f493e57]:
                - paragraph [ref=f493e58]: Lead the end-to-end coordination and execution across the program, with a particular focus on cross-functional collaboration with Modeling and customer-facing teams
              - listitem [ref=f493e59]:
                - paragraph [ref=f493e60]: Identify pain points and establish processes to ensure that the team can focus on development, while meeting needs of internal and external users of the models, and improving engineering best practices
              - listitem [ref=f493e61]:
                - paragraph [ref=f493e62]: Build a strong culture around continuous improvement, such as liaising with incident management leads, ensuring that problems are accurately root caused, and that required fixes are provided in a timely manner
              - listitem [ref=f493e63]:
                - paragraph [ref=f493e64]: Manage various overlapping projects and programs, ruthlessly prioritizing asks, to ensure that the company’s top priorities are met
              - listitem [ref=f493e65]:
                - paragraph [ref=f493e66]: Collaborate with stakeholders across the company to set, track, and manage timelines, deliverables, budgets, and scope to ensure successful program execution
              - listitem [ref=f493e67]:
                - paragraph [ref=f493e68]: Deliver clear, timely, and consistent updates across engineering, leadership, and non–technical teams on the progress, plans, and incidents
              - listitem [ref=f493e69]:
                - paragraph [ref=f493e70]: Act as a strong tactical and strategic partner to the senior leads across your program, whether that be providing low-level tactical support or help answer high-level strategic problems that drives impact at the company-level.
            - paragraph [ref=f493e71]
            - heading "You may be a good fit if you have:" [level=1] [ref=f493e72]
            - list [ref=f493e73]:
              - listitem [ref=f493e74]:
                - paragraph [ref=f493e75]:
                  - strong [ref=f493e76]: 5+ years of Technical Program Management
                  - strong [ref=f493e77]: experience
                  - text: focusing on Machine Learning Infrastructure, specifically covering areas such as model inference, serving, efficiency, and endpoints design & implementation
              - listitem [ref=f493e78]:
                - paragraph [ref=f493e79]: In-depth technical knowledge around ML infrastructure design and implementation, as well as engineering best practices, supporting a balance of velocity and structure in rapidly growing organizations
              - listitem [ref=f493e80]:
                - paragraph [ref=f493e81]: Experience working in a chaotic, fast paced, low structure environment. We need an EPM who is pragmatic, can roll up their sleeves when needed, and can function at the tactical and strategic level to do whatever it takes to make Cohere’s models succeed
              - listitem [ref=f493e82]:
                - paragraph [ref=f493e83]:
                  - text: (optional, but
                  - strong [ref=f493e84]: strongly
                  - text: preferred) Have technical experience in a hands-on capacity. We don’t necessarily need someone who has been working hands-on in a technical role, but the programs are inherently extremely technical. You need to dive into the depths of internal systems, and develop a reputation as a subject matter expert who brings in engineering best practices and the right amount of structure to continuously improve the program
              - listitem [ref=f493e85]:
                - paragraph [ref=f493e86]: (optional, but preferred) Experience working with ML teams, and a working understanding of how machine learning models are built in order to advocate for both the needs of the infrastructure teams and modeling teams in building scalable, highly performant ML infrastructure.
            - paragraph [ref=f493e87]: If some of the above - other than the ML Infrastructure experience - doesn’t line up perfectly with your experience, we still encourage you to apply! If you consider yourself a thoughtful worker, a lifelong learner, and a kind and playful team member, Cohere is the place for you.
            - paragraph [ref=f493e88]: We welcome applicants of all kinds and are committed to providing both an equal opportunity process and work environment. We value and celebrate diversity and strive to create an inclusive work environment for all.
            - paragraph [ref=f493e89]
            - heading [level=2] [ref=f493e90]:
              - strong [ref=f493e91]: "Full-Time Employees at Cohere enjoy these Perks:"
            - list [ref=f493e92]:
              - listitem [ref=f493e93]:
                - paragraph [ref=f493e94]: A weekly lunch stipend of $75/£75 or equivalent in your local currency for lunch.
              - listitem [ref=f493e95]:
                - paragraph [ref=f493e96]: Full health and dental benefits, including a separate budget for mental health.
              - listitem [ref=f493e97]:
                - paragraph [ref=f493e98]: RRSP matching, 401K, Pension Scheme.
              - listitem [ref=f493e99]:
                - paragraph [ref=f493e100]: 100% Parental Leave top-up for up to 6 months, for either parent.
              - listitem [ref=f493e101]:
                - paragraph [ref=f493e102]: "Annual enrichment benefits:"
                - paragraph [ref=f493e103]: Arts & culture, fitness/wellness, quality time, and a workspace improvement credit.
                - paragraph [ref=f493e104]: Education & learning stipend for conferences, courses, and coaching.
            - list [ref=f493e105]:
              - listitem [ref=f493e106]:
                - paragraph [ref=f493e107]: 6 weeks of paid vacation (30 working days!)
              - listitem [ref=f493e108]:
                - paragraph [ref=f493e109]: Budget for traveling to other offices if you are remote, plus an annual company offsite.
            - paragraph [ref=f493e110]
            - heading [level=2] [ref=f493e111]:
              - strong [ref=f493e112]: "How and Where We Work:"
            - list [ref=f493e113]:
              - listitem [ref=f493e114]:
                - paragraph [ref=f493e115]: Cohere is remote-friendly, but we also have offices in Toronto, London, New York City, San Francisco, Montreal, Paris, Berlin and Seoul with more opening soon.
              - listitem [ref=f493e116]:
                - paragraph [ref=f493e117]: "For those in the office: a daily lunch program, plenty of snacks, and regular community and social events."
              - listitem [ref=f493e118]:
                - paragraph [ref=f493e119]: "For those not near an office: a co-working benefit so you can work alongside others in your city."
              - listitem [ref=f493e120]:
                - paragraph [ref=f493e121]: Everyone receives a $500 home office stipend to set up your workspace properly.
                - paragraph [ref=f493e122]
            - paragraph [ref=f493e123]: If any of the above doesn’t line up exactly with your experience, we still encourage you to apply.
            - paragraph [ref=f493e124]:
              - text: We strive to create an inclusive work environment for all; we welcome applicants from all backgrounds and are committed to providing equal opportunities. Should you require any accommodations during the recruitment process, please submit an
              - link "Accommodations Request Form" [ref=f493e125] [cursor=pointer]:
                - /url: https://docs.google.com/forms/d/12a6IrLdF3kI2nonKSr4tiFuz18rLQbaeYV-JM9L4o9Q/edit
              - text: ", and we will work together to meet your needs."
            - paragraph [ref=f493e126]
            - paragraph [ref=f493e127]: We may use AI-enabled tools to screen and assess applicants against the criteria for this position. This helps our recruiters identify potentially qualified candidates, but it doesn't limit the applications our recruiters may review or consider.
            - paragraph [ref=f493e128]
            - paragraph [ref=f493e129]:
              - emphasis [ref=f493e130]: "Beware of Scams: Cohere will never ask for payment or third-party services (e.g., CV writing) as part of our hiring process. All legitimate roles are listed on the Cohere careers page and LinkedIn only, with all communications from Cohere employees coming from an @cohere.com or @cw.cohere email alias. If jobs are viewed on other sites then please verify these through our"
              - link [ref=f493e131] [cursor=pointer]:
