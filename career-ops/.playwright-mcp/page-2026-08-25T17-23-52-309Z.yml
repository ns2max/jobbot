        - generic [ref=e21]:
          - generic [ref=e28]:
            - text: Reddit is a community of communities. It’s built on shared interests, passion, and trust, and is home to the most open and authentic conversations on the internet. Every day, Reddit users submit, vote, and comment on the topics they care most about. With 100,000+ active communities and approximately 130 million daily active unique visitors, Reddit is one of the internet’s largest sources of information. For more information, visit
            - link "www.redditinc.com" [ref=e29] [cursor=pointer]:
              - /url: http://www.redditinc.com/
            - text: .
          - generic [ref=e30]:
            - paragraph [ref=e31]: The Notifications Relevance team at Reddit is building the next generation of notifications focused on delivering the right content to the right user at the right time using the right channel (push notification, email digest and in-app). We are the second largest growth lever at Reddit and a core component to understanding how to delight our current user base and bring new users to discover all that Reddit has to offer.
            - paragraph [ref=e32]:
              - text: Reddit is home to some of the most valuable and engaging conversations on the internet. As a
              - strong [ref=e33]: Staff Machine Learning Engineer on Notifications Relevance
              - text: ", you'll serve as a technical leader for one of Reddit's highest-leverage ML systems, helping millions of users discover relevant content, communities, and conversations every day. You'll drive the strategy, architecture, and execution of large-scale recommendation systems spanning targeting, budget optimization, retrieval, ranking, measurement, and emerging LLM-powered experiences. This role offers the opportunity to shape the future of engagement and retention at Reddit while pushing the boundaries of personalization and machine learning at massive scale."
            - paragraph [ref=e34]:
              - strong [ref=e35]: What You’ll Do
            - list [ref=e36]:
              - listitem [ref=e37]: Contribute to advancing Reddit's growth by designing and implementing content discovery algorithms that prioritize a seamless and highly personalized user experience.
              - listitem [ref=e38]: Deeply understand the Reddit Notifications product and drive the vision for the notifications relevance team.
              - listitem [ref=e39]: Enhance core recommendation capabilities, including candidate retrieval, ranking models, and budgeting optimization, while designing and testing new pipeline components. You will also deploy ML models, integrate LLMs, and ensure robust monitoring and smooth product integration throughout the process.
              - listitem [ref=e40]: Serve as the primary ML domain expert, deploying state-of-the-art models at scale, driving architectural decisions, and ensuring robust monitoring and smooth product integration across the engineering organization.
              - listitem [ref=e41]: Collaborate across disciplines and with ML, Product, Infrastructure, and DS teams at Reddit to find technical solutions to complex challenges
            - paragraph [ref=e42]:
              - strong [ref=e43]: Who You Are
            - list [ref=e44]:
              - listitem [ref=e45]: 8+ years of industry experience with deep expertise in large-scale recommendation systems, notifications experience preferred.
              - listitem [ref=e46]: Proven ability to identify key opportunities, define roadmaps and drive scalable improvement in notifications relevance.
              - listitem [ref=e47]: Strong experience in building and deploying large-scale ML models using frameworks such as PyTorch or Tensorflow.
              - listitem [ref=e48]: Experience working with LLM in production and utilizing generative AI to augment recommendation systems
              - listitem [ref=e49]: Proficiency in object-oriented programming (Python, Golang).
              - listitem [ref=e50]:
                - strong [ref=e51]: "Big Plus:"
                - text: experience with state of the art model architectures
              - listitem [ref=e52]:
                - strong [ref=e53]: "Big Plus:"
                - text: experience building production Agentic AI frameworks.
            - paragraph [ref=e54]:
              - strong [ref=e55]: "Benefits:"
            - list [ref=e56]:
              - listitem [ref=e57]: Comprehensive Healthcare Benefits and Income Replacement Programs
              - listitem [ref=e58]: 401k with Employer Match
              - listitem [ref=e59]: Global Benefit programs that fit your lifestyle, from workspace to professional development to caregiving support
              - listitem [ref=e60]: Family Planning Support
              - listitem [ref=e61]: Gender-Affirming Care
              - listitem [ref=e62]: Mental Health & Coaching Benefits
              - listitem [ref=e63]: Flexible Vacation & Paid Volunteer Time Off
              - listitem [ref=e64]: Generous Paid Parental Leave
            - paragraph [ref=e65]: "#LI-remote, #LI-DB"
          - generic [ref=e67]:
            - generic [ref=e70]:
              - paragraph [ref=e71]:
                - strong [ref=e72]: "Pay Transparency:"
              - paragraph [ref=e73]: This job posting may span more than one career level.
              - paragraph [ref=e74]:
                - text: In addition to base salary, this job is eligible to receive equity in the form of restricted stock units, and depending on the position offered, it may also be eligible to receive a commission. Additionally, Reddit offers a wide range of benefits to U.S.-based employees, including medical, dental, and vision insurance, 401(k) program with employer match, generous time off for vacation, and parental leave. To learn more, please visit
                - link "https://www.redditinc.com/careers/" [ref=e75] [cursor=pointer]:
                  - /url: https://www.redditinc.com/careers/
                - text: .
              - paragraph [ref=e76]: To provide greater transparency to candidates, we share base salary ranges for all US-based job postings regardless of state. We set standard base pay ranges for all roles based on function, level, and country location, benchmarked against similar stage growth companies. Final offer amounts are determined by multiple factors including, skills, depth of work experience and relevant licenses/credentials, and may vary from the amounts listed below.
            - paragraph [ref=e77]: "The base salary range for this position is:"
            - paragraph [ref=e78]: $230,000 - $322,000 USD
          - generic [ref=e79]:
            - paragraph [ref=e80]: In select roles and locations, the interviews will be recorded, transcribed and summarized by artificial intelligence (AI). You will have the opportunity to opt out of recording, transcription and summarization prior to any scheduled interviews.
            - paragraph [ref=e81]:
              - generic [ref=e82]:
                - text: "During the interview, we will collect the following categories of personal information: Identifiers, Professional and Employment-Related Information, Sensory Information (audio/video recording), and any other categories of personal information you choose to share with us. We will use this information to evaluate your application for employment or an independent contractor role, as applicable. We will not sell your personal information or disclose it to any third party for their marketing purposes. We will delete any recording of your interview promptly after making a hiring decision. For more information about how we will handle your personal information, including our retention of it, please refer to our"
                - link "Candidate Privacy Policy for Potential Employees and Contractors" [ref=e83] [cursor=pointer]:
                  - /url: https://redditinc.com/policies/candidate-privacy-policy
                - text: .
            - paragraph [ref=e84]:
