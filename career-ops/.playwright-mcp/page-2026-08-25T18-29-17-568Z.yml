      - heading "Machine Learning Scientist, Training" [level=1] [ref=f799e56]
      - generic [ref=f799e58]:
        - text: at
        - link "Alberta Machine Intelligence Institute" [ref=f799e59] [cursor=pointer]:
          - /url: https://employmenthero.com/en-ca/jobs/organisations/alberta-machine-intelligence-institute/
      - generic [ref=f799e60]: Edmonton, Alberta, Canada • Full-time
    - main [ref=f799e61]:
      - generic [ref=f799e62]:
        - generic [ref=f799e63]:
          - generic [ref=f799e64]:
            - generic [ref=f799e70]: AI Job Summary
            - button "About AI Job Summary" [ref=f799e71] [cursor=pointer]
          - list [ref=f799e77]:
            - listitem [ref=f799e78]: • Master’s in Computer Science with specialization in Machine Learning or a related field.
            - listitem [ref=f799e79]: • 3+ years of experience directly leading people and teams.
            - listitem [ref=f799e80]: • 3+ years of applied AI experience and proficiency in Python and ML tools/frameworks.
          - button "Sign up or log in to analyse my fit" [ref=f799e82] [cursor=pointer]
        - generic [ref=f799e87]:
          - heading "Role Type" [level=3] [ref=f799e88]
          - generic [ref=f799e89]: Permanent • Full-time • Mid-level
        - generic [ref=f799e90]:
          - heading "Description" [level=3] [ref=f799e91]
          - generic [ref=f799e92]:
            - paragraph [ref=f799e93]:
              - emphasis [ref=f799e94]: “Are you a seasoned technical leader ready to guide a high-performing group of ML Educators in crafting world-class AI literacy content? We are seeking a leader with proven experience in building and mentoring top-tier technical teams to serve as a pivotal force in making Canada the world’s most AI-literate workforce.”
            - paragraph [ref=f799e95]: Adam Danyleyko, Product Owner – Training
            - paragraph [ref=f799e96]
            - heading [level=2] [ref=f799e97]:
              - strong [ref=f799e98]: About Amii
            - paragraph [ref=f799e99]: Alberta Machine Intelligence Institute (Amii) is one of Canada’s three main institutes for artificial intelligence (AI) and machine learning. Our world-renowned researchers drive fundamental and applied research at the University of Alberta (and other academic institutions), training some of the world’s top scientific talent. Our cross-functional teams collaborate with Alberta-based businesses and organizations to build AI capacity and translate scientific advances into industry adoption and economic impact.
            - heading [level=2] [ref=f799e100]:
              - strong [ref=f799e101]: About the Role
            - paragraph [ref=f799e102]: We are looking for a seasoned technical leader to guide our high-performing group of ML Educators in crafting world-class AI literacy content. As the Machine Learning Scientist, you will serve as a pivotal force in making Canada the world’s most AI-literate workforce, leveraging your proven experience in building and mentoring top-tier technical teams.
            - paragraph [ref=f799e103]: Reporting to the Product Owner, Training, you will lead the technical and people-management functions essential to Amii’s AI literacy mission. You will be responsible for scaling the technical capabilities of the ML Educator team, ensuring the reliability of Amii’s world-class training programs through robust leadership, deep subject-matter expertise, and strategic resource allocation. By fostering excellence in content development and standardizing technical best practices, you will ensure our educational programs remain cutting-edge and impactful, directly advancing our audience’s AI literacy journey and enabling them to deploy ethical solutions aligned with the mission of ‘AI for good and for all.’
            - paragraph [ref=f799e104]: "The position focuses on achieving excellence in four main accountabilities:"
            - list [ref=f799e105]:
              - listitem [ref=f799e106]: Full Cycle People Leadership
              - listitem [ref=f799e107]: Machine Learning Expertise
              - listitem [ref=f799e108]: Technical Coaching & Mentorship
              - listitem [ref=f799e109]: Resource Planning & Project Management
            - heading [level=2] [ref=f799e110]:
              - strong [ref=f799e111]: Required Skills / Expertise
            - heading [level=2] [ref=f799e112]:
              - strong [ref=f799e113]: "Key Responsibilities:"
            - list [ref=f799e114]:
              - listitem [ref=f799e115]: Establishes and leads an internal technical Community of Practice (CoP) for ML Educators to share knowledge, discuss complex technical challenges, and standardize best practices across all content
              - listitem [ref=f799e116]: Provides regular, structured technical mentorship and coaching for the team of ML Educators, focusing on advanced ML concepts, instructional best practices, and technical teaching methodologies
              - listitem [ref=f799e117]: Establishes, documents, and enforces rigorous technical standards for content development, covering code quality, theoretical model explanations, and data usage best practices
              - listitem [ref=f799e118]: Liaises with teams across Amii to ensure that AI Literacy materials reflect the most current, relevant, and validated ML and AI methodologies
              - listitem [ref=f799e119]: Serves as the final technical review for all AI Literacy materials (e.g., advanced workshops, executive summaries, public talks) to ensure accuracy and integrity
              - listitem [ref=f799e120]: Designs and implements quality assurance processes for integrating internal and external technical feedback, ensuring continuous improvement of the content catalogue
              - listitem [ref=f799e121]: Identifies, recommends, and approves relevant technical training, certifications, and conferences to proactively ensure the team’s skills drive cutting-edge thought and are aligned with Amii’s strategic focus
              - listitem [ref=f799e122]: Fosters a collaborative and inclusive environment within the ML Educator team, promoting knowledge sharing, peer learning, and continuous technical skill development
              - listitem [ref=f799e123]: Reviews and validates all incoming technical training requests to accurately define the necessary scope, technical resource requirements, and realistic delivery timelines in alignment with established best practices for content development
              - listitem [ref=f799e124]: Determines and assigns ML Educators to projects based on their specific technical expertise, current workload, and professional development objectives
              - listitem [ref=f799e125]: Oversees and tracks project progress against defined milestones for content development (e.g., curriculum design, code sample creation, slide finalization), proactively identifies and mitigates technical or timeline risks
              - listitem [ref=f799e126]: Manages the team’s technical environment (e.g., cloud access, specialized software, ML tooling) to ensure educators have the necessary, reliable resources to develop and deliver content effectively
              - listitem [ref=f799e127]: Enables efficient communication, removes roadblocks, and ensures the team is set up for success in delivering high-quality technical content
              - listitem [ref=f799e128]: Provides supervision to junior team members by overseeing and refining their work, and managing approval processes
              - listitem [ref=f799e129]: Mentors direct reports on career development and progression, drawing lessons for coaching opportunities
              - listitem [ref=f799e130]: Fosters a collaborative work environment by facilitating teamwork and the exchange of ideas among team members
              - listitem [ref=f799e131]: Encourages and maintains a problem-solving approach to work while acting as a coach and collaborator
              - listitem [ref=f799e132]: Identifies and addresses knowledge gaps, providing solutions or resources to bridge them
              - listitem [ref=f799e133]: Functions as a point of escalation for addressing challenges and facilitating the resolution of problems
            - heading [level=2] [ref=f799e134]:
              - strong [ref=f799e135]: "Required Qualifications:"
            - list [ref=f799e136]:
              - listitem [ref=f799e137]: Masters in Computer Science with a specialization in Machine Learning or a related field
              - listitem [ref=f799e138]: 3 + years of experience directly leading people and teams
              - listitem [ref=f799e139]: 3+ years of applied AI experience
              - listitem [ref=f799e140]: Proficient in Python, experience in other programming languages i.e. Java or SQL
              - listitem [ref=f799e141]: Proficient with machine learning tools and frameworks such as Scikit-learn, Pytorch/Tensorflow, Pandas, Optuna, Wandb, lightgbm/XGBoost, and SciPy
              - listitem [ref=f799e142]: Publication record in peer-reviewed academic conferences or relevant journals
              - listitem [ref=f799e143]: Ability to explain complex technical concepts clearly to non-technical audiences
              - listitem [ref=f799e144]: Thorough understanding of the strengths and weaknesses of a range of ML techniques across supervised learning, unsupervised learning, and reinforcement learning
              - listitem [ref=f799e145]: Experience with developing and delivering curriculum; designing effective learning exercises, illustrations of technical concepts, training and evaluation tools (nice to have)
              - listitem [ref=f799e146]: PMP or PMI-ACP Certificate (nice to have)
            - heading [level=2] [ref=f799e147]:
              - strong [ref=f799e148]: "Attributes and Expectations:"
            - list [ref=f799e149]:
              - listitem [ref=f799e150]: Successfully manages multiple competing priorities in a fast-paced environment
              - listitem [ref=f799e151]: Works independently and makes informed decisions through a collaborative lens
              - listitem [ref=f799e152]: Demonstrates strong interpersonal communication skills, both verbal and written
              - listitem [ref=f799e153]: Establishes credibility while influencing team members to achieve common goals
              - listitem [ref=f799e154]: Identifies the needs of stakeholders and creates/drives new solutions
              - listitem [ref=f799e155]: Able to identify gaps in knowledge and triage their own learning appropriately
              - listitem [ref=f799e156]: Leads with resilience, maintaining team performance through challenges and change
              - listitem [ref=f799e157]: Exhibits confidence and sound judgment while collaborating with subject matter experts
            - heading [level=2] [ref=f799e158]:
              - strong [ref=f799e159]: What you’ll love about us
            - list [ref=f799e160]:
              - listitem [ref=f799e161]: A professional yet casual work environment that encourages the growth and development of your skills
              - listitem [ref=f799e162]: Participate in professional development activities
              - listitem [ref=f799e163]: Gain access to the Amii community and events
              - listitem [ref=f799e164]: A chance to learn from amazing teammates who support one another to succeed
              - listitem [ref=f799e165]: Competitive compensation, including paid time off and flexible health benefits
              - listitem [ref=f799e166]: A modern office located in downtown Edmonton, Alberta
            - heading [level=2] [ref=f799e167]:
              - strong [ref=f799e168]: How to Apply
            - paragraph [ref=f799e169]:
              - text: If this sounds like the opportunity you’ve been waiting for, please don’t wait for the closing on June 22, 2026 to apply – we’re excited to add a new member to the Amii team for this role, and the posting may come down sooner than the closing date if we find the right candidate before the posting closes! When sending your application, please send your
              - strong [ref=f799e170]: resume and cover letter
              - text: indicating why you think you’d be a fit for Amii. In your cover letter, please include one professional accomplishment you are most proud of and why.
            - paragraph [ref=f799e171]:
              - strong [ref=f799e172]: Applicants must be legally eligible to work in Canada at the time of application.
            - paragraph [ref=f799e173]: Amii is an equal opportunity employer and values a diverse workforce. We encourage applications from all qualified individuals without regard to ethnicity, religion, gender identity, sexual orientation, age or disability. Accommodations for disability-related needs throughout the recruitment and selection process are available upon request. Any information provided by you for accommodations will be kept confidential and won’t be used in the selection process.
            - paragraph [ref=f799e174]
