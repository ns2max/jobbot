              - text: ", and we will work together to meet your needs."
            - paragraph [ref=f378e139]
            - paragraph [ref=f378e140]: We may use AI-enabled tools to screen and assess applicants against the criteria for this position. This helps our recruiters identify potentially qualified candidates, but it doesn't limit the applications our recruiters may review or consider.
            - paragraph [ref=f378e141]
            - paragraph [ref=f378e142]:
