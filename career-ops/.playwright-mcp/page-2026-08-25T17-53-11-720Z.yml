        - tabpanel "Overview" [ref=f378e36]:
          - generic [ref=f378e37]:
            - paragraph [ref=f378e38]:
              - strong [ref=f378e39]: Who are we?
            - paragraph [ref=f378e40]: Cohere is the leading security-first enterprise AI company. We build cutting-edge foundation AI models and end-to-end products that are designed to solve real-world business problems.
            - paragraph [ref=f378e41]: We’re training and deploying frontier models for enterprises who are building AI systems. We believe that our work is instrumental to the widespread adoption of AI and we are looking for folks that want to be part of that.
            - paragraph [ref=f378e42]: We obsess over what we build. Each one of us is responsible for contributing to increasing the capabilities of our models and the value they drive for our customers. Cohere is a team of researchers, engineers, designers, and more, who are all passionate about their craft.
            - paragraph [ref=f378e43]: We are a global technology company headquartered in Toronto with key offices in London, New York City, San Francisco, Montreal, Paris, Berlin and Seoul. Join us!
            - paragraph [ref=f378e44]
            - paragraph [ref=f378e45]:
              - strong [ref=f378e46]: "Role Overview:"
            - paragraph [ref=f378e47]: We are looking for world-class research scientists and research engineers to build cutting-edge multilingual AI to serve the world!
            - paragraph [ref=f378e48]: At Cohere, we care deeply about building technologies that are broadly accessible and useful, regardless of language. As a Member of Technical Staff on the Multilingual team, you'll be at the forefront of advancing language models that serve the world. You’ll push the boundaries of what's possible in natural language processing. This isn't just a technical role—it's an opportunity to contribute to groundbreaking research that will define the next generation of AI.
            - paragraph [ref=f378e49]
            - paragraph [ref=f378e50]:
              - strong [ref=f378e51]: "Key Responsibilities:"
            - list [ref=f378e52]:
              - listitem [ref=f378e53]:
                - paragraph [ref=f378e54]: Lead the design and implementation of scalable solutions to improve multilingual LLM performance across a wide variety of skills – if we need it to make a great multilingual model, you can build it!
              - listitem [ref=f378e55]:
                - paragraph [ref=f378e56]: Is perfect for someone passionate about languages and AI, with a keen eye for detail and strong technical skills.
              - listitem [ref=f378e57]:
                - paragraph [ref=f378e58]: Offers the opportunity to contribute to cutting-edge language technology, making a global impact.
              - listitem [ref=f378e59]:
                - paragraph [ref=f378e60]: Requires a self-starter who can work independently and deliver results efficiently.
              - listitem [ref=f378e61]:
                - paragraph [ref=f378e62]: Publish research findings and contribute to academic discourse in top-tier venues
              - listitem [ref=f378e63]:
                - paragraph [ref=f378e64]: Mentor junior team members and shape global best practices in multilingual AI / NLP
                - paragraph [ref=f378e65]
            - paragraph [ref=f378e66]:
              - strong [ref=f378e67]: "Qualifications:"
            - list [ref=f378e68]:
              - listitem [ref=f378e69]:
                - paragraph [ref=f378e70]: PhD in Computer Science, Linguistics, or related field (or equivalent experience)
              - listitem [ref=f378e71]:
                - paragraph [ref=f378e72]: Proven track record in large-scale data processing and ML pipeline development
              - listitem [ref=f378e73]:
                - paragraph [ref=f378e74]: Expert in Python and software engineering best practice
              - listitem [ref=f378e75]:
                - paragraph [ref=f378e76]: Deep understanding of multilingual data challenges and NLP fundamentals
              - listitem [ref=f378e77]:
                - paragraph [ref=f378e78]: Passion for advancing language technology and making global impact
              - listitem [ref=f378e79]:
                - paragraph [ref=f378e80]: Strong publication record or demonstrated research potential
              - listitem [ref=f378e81]:
                - paragraph [ref=f378e82]: Excellent communicator able to bridge technical and research communities
                - paragraph [ref=f378e83]
            - paragraph [ref=f378e84]:
              - strong [ref=f378e85]: "Note:"
            - list [ref=f378e86]:
              - listitem [ref=f378e87]:
                - paragraph [ref=f378e88]: This role can be based remotely or from one of our office locations listed on the job description - there is no minimum in-office qualification requirement. We care most about hiring exceptional people regardless of locations, though please check the location listed on the posting for guidance around the core time zone or working hours alignment expected for the role.
              - listitem [ref=f378e89]:
                - paragraph [ref=f378e90]: If some of the above doesn’t line up perfectly with your experience, we still encourage you to apply.
            - paragraph [ref=f378e91]: We value and celebrate diversity and strive to create an inclusive work environment for all. We welcome applicants from all backgrounds and are committed to providing equal opportunities. Should you require any accommodations during the recruitment process, please submit an Accommodations request form and we will work together to meet your needs.
            - paragraph [ref=f378e92]
            - paragraph [ref=f378e93]:
              - strong [ref=f378e94]: Compensation
              - text: ":"
            - paragraph [ref=f378e95]: Cohere is committed to fair and transparent pay practices. The salary range listed for this role reflects the expected base compensation. Actual compensation offered will be determined by factors such as location, level, job-related knowledge, skills, education, and experience.
            - list [ref=f378e96]:
              - listitem [ref=f378e97]:
                - paragraph [ref=f378e98]: "For candidates in the US, the Compensation Range is: $110,000 - $370,000 [USD]"
              - listitem [ref=f378e99]:
                - paragraph [ref=f378e100]: "For candidates in Canada, the Compensation Range is: $165,000 - $460,000 [CAD]"
            - paragraph [ref=f378e101]
            - paragraph [ref=f378e102]
            - heading [level=2] [ref=f378e103]:
              - strong [ref=f378e104]: "Full-Time Employees at Cohere enjoy these Perks:"
            - list [ref=f378e105]:
              - listitem [ref=f378e106]:
                - paragraph [ref=f378e107]: A weekly lunch stipend of $75/£75 or equivalent in your local currency for lunch.
              - listitem [ref=f378e108]:
                - paragraph [ref=f378e109]: Full health and dental benefits, including a separate budget for mental health.
              - listitem [ref=f378e110]:
                - paragraph [ref=f378e111]: RRSP matching, 401K, Pension Scheme.
              - listitem [ref=f378e112]:
                - paragraph [ref=f378e113]: 100% Parental Leave top-up for up to 6 months, for either parent.
              - listitem [ref=f378e114]:
                - paragraph [ref=f378e115]: "Annual enrichment benefits:"
                - paragraph [ref=f378e116]: Arts & culture, fitness/wellness, quality time, and a workspace improvement credit.
                - paragraph [ref=f378e117]: Education & learning stipend for conferences, courses, and coaching.
            - list [ref=f378e118]:
              - listitem [ref=f378e119]:
                - paragraph [ref=f378e120]: 6 weeks of paid vacation (30 working days!)
              - listitem [ref=f378e121]:
                - paragraph [ref=f378e122]: Budget for traveling to other offices if you are remote, plus an annual company offsite.
            - paragraph [ref=f378e123]
            - heading [level=2] [ref=f378e124]:
              - strong [ref=f378e125]: "How and Where We Work:"
            - list [ref=f378e126]:
              - listitem [ref=f378e127]:
                - paragraph [ref=f378e128]: Cohere is remote-friendly, but we also have offices in Toronto, London, New York City, San Francisco, Montreal, Paris, Berlin and Seoul with more opening soon.
              - listitem [ref=f378e129]:
                - paragraph [ref=f378e130]: "For those in the office: a daily lunch program, plenty of snacks, and regular community and social events."
              - listitem [ref=f378e131]:
                - paragraph [ref=f378e132]: "For those not near an office: a co-working benefit so you can work alongside others in your city."
              - listitem [ref=f378e133]:
                - paragraph [ref=f378e134]: Everyone receives a $500 home office stipend to set up your workspace properly.
                - paragraph [ref=f378e135]
            - paragraph [ref=f378e136]: If any of the above doesn’t line up exactly with your experience, we still encourage you to apply.
            - paragraph [ref=f378e137]:
              - text: We strive to create an inclusive work environment for all; we welcome applicants from all backgrounds and are committed to providing equal opportunities. Should you require any accommodations during the recruitment process, please submit an
