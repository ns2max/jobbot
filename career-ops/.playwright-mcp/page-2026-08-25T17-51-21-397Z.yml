        - generic [ref=f346e20]:
          - generic [ref=f346e21]:
            - heading [level=2] [ref=f346e22]:
              - strong [ref=f346e23]: About Anthropic
            - paragraph [ref=f346e24]: Anthropic’s mission is to create reliable, interpretable, and steerable AI systems. We want AI to be safe and beneficial for our users and for society as a whole. Our team is a quickly growing group of committed researchers, engineers, policy experts, and business leaders working together to build beneficial AI systems.
          - generic [ref=f346e25]:
            - heading "About the role" [level=2] [ref=f346e26]
            - paragraph [ref=f346e27]: Our Inference team is responsible for building and maintaining the critical systems that serve Claude to millions of users worldwide. We bring Claude to life by serving our models via the industry’s largest compute-agnostic inference deployments. We are responsible for the entire stack from intelligent request routing to fleet-wide orchestration across diverse AI accelerators.
            - paragraph [ref=f346e28]:
              - text: "The team has a dual mandate:"
              - strong [ref=f346e29]: maximizing compute efficiency
              - text: to reliably serve our explosive customer growth, while
              - strong [ref=f346e30]: enabling breakthrough research
              - text: by giving our scientists the high-performance inference infrastructure they need to develop next-generation models. We tackle complex, distributed systems challenges across multiple accelerator families and emerging AI hardware running in multiple cloud platforms.
            - paragraph [ref=f346e31]: Inference systems are highly performance sensitive distributed systems. Inference serves hundreds of thousands of customers every day, and the size & span of the inference fleet requires sophisticated routing, scaling, and networking systems.
            - heading "Key responsibilities" [level=2] [ref=f346e32]
            - list [ref=f346e33]:
              - listitem [ref=f346e34]: Design, build, and maintain the distributed systems that serve Claude to millions of users worldwide
              - listitem [ref=f346e35]: Develop resilient, flexible systems that adapt in real time to real world events
              - listitem [ref=f346e36]: Develop intelligent request routing, load balancing, and traffic management systems across thousands of accelerators
              - listitem [ref=f346e37]: Maximize compute efficiency across the fleet by autoscaling and orchestrating production, research, and experimental workloads
              - listitem [ref=f346e38]: Build and operate production-grade deployment pipelines for releasing new models to users
              - listitem [ref=f346e39]: Provide high-performance inference infrastructure that enables researchers to develop next-generation models
              - listitem [ref=f346e40]: Integrate new AI accelerator platforms and support inference for new model architectures
            - heading "Minimum qualifications" [level=2] [ref=f346e41]
            - list [ref=f346e42]:
              - listitem [ref=f346e43]: Significant software engineering experience, particularly with distributed systems
              - listitem [ref=f346e44]: Results-oriented, with a bias towards flexibility and impact
              - listitem [ref=f346e45]: Willingness to pick up slack, even if it goes outside your job description
              - listitem [ref=f346e46]: Desire to learn more about machine learning systems and infrastructure
              - listitem [ref=f346e47]: Thrive in environments where technical excellence directly drives both business results and research breakthroughs
              - listitem [ref=f346e48]: Care about the societal impacts of your work
            - heading "Preferred qualifications" [level=2] [ref=f346e49]
            - list [ref=f346e50]:
              - listitem [ref=f346e51]: Experience with high-performance, large-scale distributed systems
              - listitem [ref=f346e52]: Experience implementing and deploying machine learning systems at scale
              - listitem [ref=f346e53]: Experience with load balancing, request routing, or traffic management systems
              - listitem [ref=f346e54]: Familiarity with LLM inference optimization, batching, and caching strategies
              - listitem [ref=f346e55]: Experience with Kubernetes and cloud infrastructure (AWS, GCP, Azure)
              - listitem [ref=f346e56]: Proficiency in Python or Rust
            - heading "Representative projects" [level=2] [ref=f346e57]
            - list [ref=f346e58]:
              - listitem [ref=f346e59]: Designing intelligent routing algorithms that optimize request distribution across many accelerators in different environments
              - listitem [ref=f346e60]: Autoscaling our compute fleet to dynamically match supply with demand across production, research, and experimental workloads
              - listitem [ref=f346e61]: Building production-grade deployment pipelines for releasing new models to millions of users reliably
              - listitem [ref=f346e62]: Contributing to new inference features
              - listitem [ref=f346e63]: Supporting inference for new model architectures
              - listitem [ref=f346e64]: Analyzing observability data to tune performance based on real-world production workloads
              - listitem [ref=f346e65]: Managing multi-region deployments and geographic routing for global customers
            - paragraph [ref=f346e66]:
              - strong [ref=f346e67]: "Deadline to apply:"
              - text: None. Applications will be reviewed on a rolling basis.
          - generic [ref=f346e69]:
