              - paragraph [ref=f346e74]: For sales roles, the range provided is the role’s On Target Earnings ("OTE") range, meaning that the range includes both the sales commissions/sales bonuses target and annual base salary for the role.
            - paragraph [ref=f346e75]: "Annual Salary:"
