                - paragraph [ref=f346e380]:
                  - strong [ref=f346e381]:
                    - emphasis [ref=f346e382]: Agreement to Arbitrate
                - paragraph [ref=f346e383]:
                  - emphasis [ref=f346e384]: I understand and agree that both Anthropic and I waive our respective rights to trial by jury in connection with any claims covered by this agreement to arbitrate. Instead, any disputes arising out of or related to my application for employment with Anthropic shall be settled by final and binding arbitration pursuant to the Federal Arbitration Act. I understand and agree that Anthropic’s employees/agents, Anthropic’s clients, and their employees/agents are third-party beneficiaries to this agreement.
                - paragraph [ref=f346e385]:
                  - emphasis [ref=f346e386]: The arbitration shall be conducted in accordance with the Employment Arbitration Rules & Procedures of Judicial Arbitration and Mediation Services, Inc. (“JAMS Rules”), available via the internet at
                  - link [ref=f346e387] [cursor=pointer]:
                    - /url: https://www.jamsadr.com/rules-employment-arbitration
                    - emphasis [ref=f346e388]: https://www.jamsadr.com/rules-employment-arbitration
                  - emphasis [ref=f346e389]: or by searching for “JAMS Employment Arbitration Rules” in an online search service such as
                  - link [ref=f346e390] [cursor=pointer]:
                    - /url: http://www.google.com/
                    - emphasis [ref=f346e391]: www.google.com
                  - emphasis [ref=f346e392]: . To the extent the JAMS Rules are inconsistent with the terms of this Agreement, this Agreement shall govern to the extent permitted by law. The parties will select one neutral arbitrator, who will have the authority to award all relief in law or equity that is requested by the parties and supported by credible, relevant, and admissible evidence. The arbitrator shall allow adequate discovery and issue a written, signed, and reasoned award. Judgement may be entered on the arbitrator’s award in any court having jurisdiction, and the award shall be subject to correction, confirmation, or vacation as provided by the applicable law concerning judicial review of arbitration awards. Anthropic will bear the costs that are particular to the arbitration, such as the arbitrator fees. The arbitrator will apply the substantive law of the state in which I sought employment with Anthropic. The arbitrator will determine the arbitration venue, based on fairness and convenience to the parties and witnesses, unless otherwise mutually agreed upon by the parties. The Party initiating a claim under this Agreement must make a written demand for arbitration to the other Party. The demand for arbitration shall identify the claims asserted, the facts upon which such claims are based, and any relief or remedy sought. Written demand for arbitration to Anthropic must be sent to Anthropic PBC at
                  - link [ref=f346e393] [cursor=pointer]:
                    - /url: mailto:arbdemands@anthropic.com
                    - emphasis [ref=f346e394]: arbdemands@anthropic.com
                  - emphasis [ref=f346e395]: . Anthropic’s demand for arbitration shall be sent to the most recent mailing address and/or email address that Anthropic has on file for you.
                - paragraph [ref=f346e396]:
                  - emphasis [ref=f346e397]: This agreement to arbitrate does not apply to claims for workers’ compensation, unemployment compensation benefits, claims or charges before any administrative agency having jurisdiction over such claims, or any other claim that is not subject to arbitration under federal law. If any claims are deemed non-arbitrable, then those claims will be stayed until resolution of any arbitrable claims.
                - paragraph [ref=f346e398]:
                  - emphasis [ref=f346e399]: I understand and agree that, except where prohibited by federal law, all claims subject to this agreement to arbitrate must be pursued on an individual basis, and that both I and Anthropic waive any right to bring or be a party to any class or collective action. I agree that any issues pertaining to the enforceability, application or validity of this agreement to arbitrate shall be decided only by a court of competent jurisdiction and not by an arbitrator. This agreement to arbitrate applies only in the United States.
