            - heading "Senior Machine Learning Engineer" [level=1] [ref=f555e15]
            - generic [ref=f555e16]: Remote - Ontario, Canada
          - button "Apply" [ref=f555e20] [cursor=pointer]
        - generic [ref=f555e21]:
          - generic [ref=f555e28]:
            - text: Reddit is a community of communities. It’s built on shared interests, passion, and trust, and is home to the most open and authentic conversations on the internet. Every day, Reddit users submit, vote, and comment on the topics they care most about. With 100,000+ active communities and approximately 130 million daily active unique visitors, Reddit is one of the internet’s largest sources of information. For more information, visit
            - link "www.redditinc.com" [ref=f555e29] [cursor=pointer]:
              - /url: http://www.redditinc.com/
            - text: .
          - generic [ref=f555e30]:
            - paragraph [ref=f555e31]: At Reddit, machine learning sits at the heart of how millions of people discover, connect, and engage with the world’s largest collection of human conversations. From powering personalized recommendations and search to optimizing advertising systems and marketplace dynamics, our ML engineers tackle some of the most interesting and impactful problems in large-scale applied machine learning.
            - paragraph [ref=f555e32]: We hire Machine Learning Engineers across both our Consumer and Ads organizations, giving you the opportunity to work on a wide range of high-impact problems across the Reddit ecosystem.
            - paragraph [ref=f555e33]: We are looking for Machine Learning Engineers who are excited to build systems end-to-end, from research and modeling to production deployment, — and who want to help shape the future of discovery, relevance, and monetization at Reddit.
            - paragraph [ref=f555e34]: If you love working on complex, real-world ML problems at massive scale, this role is for you.
            - paragraph [ref=f555e35]:
              - strong [ref=f555e37]: What You’ll Work On
            - paragraph [ref=f555e38]: "As a Machine Learning Engineer at Reddit, you will design and build production ML systems that power core experiences across the platform, including:"
            - list [ref=f555e39]:
              - listitem [ref=f555e40]: Personalized recommendations, search, and ranking systems that help users discover the most relevant content and communities
              - listitem [ref=f555e41]: Intelligent advertising systems including ranking, bidding, measurement, and optimization
              - listitem [ref=f555e42]: Content, Advertisers, and User understanding, from building foundational content/user representations to deriving insightful signals
              - listitem [ref=f555e43]: Large-scale machine learning pipelines, model serving infrastructure, and real-time decision systems
              - listitem [ref=f555e44]: Applied AI and LLM-driven experiences that improve relevance, discovery, and user engagement
            - paragraph [ref=f555e45]: You’ll work on high-impact systems that operate at internet scale and directly influence user experience, advertiser value, and business outcomes.
            - paragraph [ref=f555e46]:
              - strong [ref=f555e48]: What You’ll Do
            - list [ref=f555e49]:
              - listitem [ref=f555e50]: Design, build, and deploy production-grade machine learning models and systems at scale
              - listitem [ref=f555e51]: "Own the full ML lifecycle: from problem definition and feature engineering to training, evaluation, deployment, and monitoring"
              - listitem [ref=f555e52]: Build scalable data and model pipelines with strong reliability, observability, and automated retraining
              - listitem [ref=f555e53]: Work with large-scale datasets to improve ranking, recommendations, search relevance, prediction, content/user understanding, and optimization systems.
              - listitem [ref=f555e54]: Partner cross-functionally with Product, Data Science, Infrastructure, and Engineering teams to translate complex problems into ML solutions
              - listitem [ref=f555e55]: Improve system performance across latency, throughput, and model quality metrics
              - listitem [ref=f555e56]: Research and apply state-of-the-art machine learning and AI techniques, including deep learning, graph & transformers based, and LLM evaluation/alignment
              - listitem [ref=f555e57]: Contribute to technical strategy, architecture, and long-term ML roadmap
            - paragraph [ref=f555e58]:
              - strong [ref=f555e60]: Basic Qualifications
            - list [ref=f555e61]:
              - listitem [ref=f555e62]: 3-5+ years of experience building, deploying, and operating machine learning systems in production
              - listitem [ref=f555e63]: Strong programming skills in Python, Java, Go, or similar languages, with solid software engineering fundamentals
              - listitem [ref=f555e64]: "ML Fundamentals: a strong grasp of algorithms, from classic statistical learning (XGBoost, Random Forests, regressions) to DL architectures (Transformers, CNNs, GNNs)"
              - listitem [ref=f555e65]: Hands-on experience with modern ML frameworks (e.g., PyTorch, TensorFlow)
              - listitem [ref=f555e66]: Experience designing scalable ML pipelines, data processing systems, and model serving infrastructure
              - listitem [ref=f555e67]: Ability to work cross-functionally and translate ambiguous product or business problems into technical solutions
              - listitem [ref=f555e68]: Experience improving measurable metrics through applied machine learning
            - paragraph [ref=f555e69]:
              - strong [ref=f555e71]: Preferred Qualifications
            - list [ref=f555e72]:
              - listitem [ref=f555e73]: Experience with recommender systems, search/ranking systems, advertising/auction systems, large-scale representation learning, or multimodal embedding systems
              - listitem [ref=f555e74]: Familiarity with distributed systems and large-scale data processing (Spark, Kafka, Ray, Airflow, BigQuery, Redis, etc.)
              - listitem [ref=f555e75]: Experience working with real-time systems and low-latency production environments
              - listitem [ref=f555e76]: Background in feature engineering, model optimization, and production monitoring
              - listitem [ref=f555e77]: Experience with LLM/Gen AI techniques, including but not limited to LLM evaluation, alignment, fine-tuning, knowledge distillation, RAG/agentic systems and productionizing LLM-powered products at scale
              - listitem [ref=f555e78]: Advanced degree in Computer Science, Machine Learning, or related quantitative field
            - paragraph [ref=f555e79]:
              - strong [ref=f555e81]: Potential Teams
            - list [ref=f555e82]:
              - listitem [ref=f555e83]: Ads Measurement Modeling
              - listitem [ref=f555e84]: Ads Targeting and Retrieval
              - listitem [ref=f555e85]: Advertiser Optimization
              - listitem [ref=f555e86]: Ads Marketplace Quality
              - listitem [ref=f555e87]: Ads Creative Effectiveness
              - listitem [ref=f555e88]: Ads Foundational Representations
              - listitem [ref=f555e89]: Ads Content Understanding
              - listitem [ref=f555e90]: Ads Ranking
              - listitem [ref=f555e91]: Feed Relevance
              - listitem [ref=f555e92]: Search and Answers Relevance
              - listitem [ref=f555e93]: ML Understanding
              - listitem [ref=f555e94]: Notifications Relevance
            - paragraph [ref=f555e95]:
              - strong [ref=f555e97]: Benefits
            - list [ref=f555e98]:
              - listitem [ref=f555e99]: Comprehensive Healthcare Benefits and Income Replacement Programs
              - listitem [ref=f555e100]: 401k with Employer Match
              - listitem [ref=f555e101]: Global Benefit programs that fit your lifestyle, from workspace to professional development to caregiving support
              - listitem [ref=f555e102]: Family Planning Support
              - listitem [ref=f555e103]: Gender-Affirming Care
              - listitem [ref=f555e104]: Mental Health & Coaching Benefits
              - listitem [ref=f555e105]: Flexible Vacation & Paid Volunteer Time Off
              - listitem [ref=f555e106]: Generous Paid Parental Leave
          - generic [ref=f555e107]:
            - paragraph [ref=f555e108]: In select roles and locations, the interviews will be recorded, transcribed and summarized by artificial intelligence (AI). You will have the opportunity to opt out of recording, transcription and summarization prior to any scheduled interviews.
            - paragraph [ref=f555e109]:
              - generic [ref=f555e110]:
                - text: "During the interview, we will collect the following categories of personal information: Identifiers, Professional and Employment-Related Information, Sensory Information (audio/video recording), and any other categories of personal information you choose to share with us. We will use this information to evaluate your application for employment or an independent contractor role, as applicable. We will not sell your personal information or disclose it to any third party for their marketing purposes. We will delete any recording of your interview promptly after making a hiring decision. For more information about how we will handle your personal information, including our retention of it, please refer to our"
                - link "Candidate Privacy Policy for Potential Employees and Contractors" [ref=f555e111] [cursor=pointer]:
                  - /url: https://redditinc.com/policies/candidate-privacy-policy
                - text: .
