        - generic [ref=f535e21]:
          - generic [ref=f535e28]:
            - text: Reddit is a community of communities. It’s built on shared interests, passion, and trust, and is home to the most open and authentic conversations on the internet. Every day, Reddit users submit, vote, and comment on the topics they care most about. With 100,000+ active communities and approximately 130 million daily active unique visitors, Reddit is one of the internet’s largest sources of information. For more information, visit
            - link "www.redditinc.com" [ref=f535e29] [cursor=pointer]:
              - /url: http://www.redditinc.com/
            - text: .
          - generic [ref=f535e30]:
            - heading "Team Description" [level=2] [ref=f535e31]
            - paragraph [ref=f535e32]:
              - text: This role sits in the
              - strong [ref=f535e33]: Ads Optimization
              - text: "organizations, which are responsible for the health and performance of Reddit’s ads marketplace. We focus on:"
            - list [ref=f535e34]:
              - listitem [ref=f535e35]:
                - text: Designing the
                - strong [ref=f535e36]: auction and bidding mechanisms
                - text: that decide which ads show to which users and at what price.
              - listitem [ref=f535e37]:
                - text: Building
                - strong [ref=f535e38]: optimization systems
                - text: that help advertisers achieve their goals (e.g., conversions, ROAS) under budget and delivery constraints.
              - listitem [ref=f535e39]:
                - text: Ensuring
                - strong [ref=f535e40]: marketplace quality
                - text: by improving user experience with ads, fighting ad blindness, and increasing valuable ad opportunities on the platform.
            - paragraph [ref=f535e41]: You’ll join a set of tight-knit engineers working on high-impact, internet-scale problems at the core of Reddit’s revenue engine, collaborating closely with Product, Data Science, and Infra partners across Reddit Ads.
            - heading "Role Description" [level=2] [ref=f535e42]
            - paragraph [ref=f535e43]:
              - text: We are hiring
              - strong [ref=f535e44]: Machine Learning Engineers (IC4)
              - text: to build and evolve the
              - strong [ref=f535e45]: auction, bidding and budgeting
              - text: systems that power Reddit Ads.
            - paragraph [ref=f535e46]: "In this role, you will:"
            - list [ref=f535e47]:
              - listitem [ref=f535e48]:
                - text: Design and implement
                - strong [ref=f535e49]: optimization algorithms
                - text: for auctions, bidding strategies, and pacing that balance advertiser performance, user experience, and marketplace efficiency.
              - listitem [ref=f535e50]: "Own systems end-to-end: from problem formulation and algorithm design to experimentation, production deployment, and ongoing iteration."
              - listitem [ref=f535e51]:
                - text: Work across
                - strong [ref=f535e52]: Ads Optimization
                - text: (bid strategies, budget optimization, pacing) to deliver measurable wins for advertisers and Redditors.
            - paragraph [ref=f535e53]: "We are hiring a Senior (IC4) level:"
            - list [ref=f535e54]:
              - listitem [ref=f535e55]:
                - strong [ref=f535e56]: IC4
                - text: MLEs lead more complex or multi-quarter initiatives, set technical direction for key parts of the bidding/auction/pacing stack, and mentor other engineers while remaining hands-on.
            - heading "Responsibilities" [level=2] [ref=f535e57]
            - heading "Auction, Bidding, and Pacing Systems" [level=3] [ref=f535e58]
            - list [ref=f535e59]:
              - listitem [ref=f535e60]: "Design and implement models and policies that:"
              - list [ref=f535e61]:
                - listitem [ref=f535e62]: Compute bids for different optimization objectives (e.g., CPC, CPA, ROAS-based strategies).
                - listitem [ref=f535e63]: Pace budgets smoothly over time across accounts, campaigns, and ad groups while preventing overspend or underspend.
                - listitem [ref=f535e64]: Allocate spend and auction participation intelligently across segments, surfaces, and time zones.
              - listitem [ref=f535e65]: Translate product and marketplace goals into concrete optimization problems and constraints (e.g., ROI, revenue, delivery smoothness, fairness, and user experience).
            - heading "Required Qualifications" [level=2] [ref=f535e66]
            - paragraph [ref=f535e67]:
              - emphasis [ref=f535e68]: (Level will be determined during the interview process; IC4 expectations assume deeper experience and broader scope.)
            - list [ref=f535e69]:
              - listitem [ref=f535e70]:
                - strong [ref=f535e71]: 3–5+ years
                - text: of experience building, deploying, and operating machine learning systems in production (for IC4, typically 5+ years).
              - listitem [ref=f535e72]:
                - text: Strong programming skills in
                - strong [ref=f535e73]: Python
                - text: ","
                - strong [ref=f535e74]: Java
                - text: ","
                - strong [ref=f535e75]: Go
                - text: ", or similar languages, with solid software engineering fundamentals."
              - listitem [ref=f535e76]: Experience designing scalable data processing systems (e.g., Spark, Kafka, Airflow, BigQuery, Redis).
              - listitem [ref=f535e77]: Demonstrated ability to translate ambiguous product or business problems into solutions and to improve measurable metrics.
            - heading [level=4] [ref=f535e78]
            - paragraph [ref=f535e79]:
              - strong [ref=f535e80]: "Additional expectations for strong bidding/auction candidates:"
            - list [ref=f535e81]:
              - listitem [ref=f535e82]:
                - text: Evidence of stronger
                - strong [ref=f535e83]: math and optimization skills
                - text: "than a generic MLE, such as:"
              - list [ref=f535e84]:
                - listitem [ref=f535e85]: Degree or equivalent background in a quantitative field (math, physics, quantitative finance, economics, operations research, or similar).
                - listitem [ref=f535e86]: Work experience in optimization-heavy domains (e.g., bidding/auctions, pacing, pricing, logistics optimization, quantitative finance).
              - listitem [ref=f535e87]: Comfort reasoning about and implementing custom optimization logic (e.g., gradient-based methods, constraint handling), not just applying black-box tooling.
            - heading "Preferred Qualifications" [level=2] [ref=f535e88]
            - list [ref=f535e89]:
              - listitem [ref=f535e90]:
                - text: Experience with
                - strong [ref=f535e91]: advertising/auction systems
                - text: ", online marketplaces, or search/ranking systems at scale, particularly in:"
              - list [ref=f535e92]:
                - listitem [ref=f535e93]: Bidding, pacing, or budget optimization
                - listitem [ref=f535e94]: Auction design, mechanism design, or marketplace quality
                - listitem [ref=f535e95]: Campaign performance optimization (e.g., CTR/CVR, CPA, ROAS)
              - listitem [ref=f535e96]:
                - text: Familiarity with large-scale,
                - strong [ref=f535e97]: real-time decision systems
                - text: and low-latency production environments.
              - listitem [ref=f535e98]: Background in feature engineering, model optimization, and production monitoring for ML systems.
              - listitem [ref=f535e99]: Experience collaborating with cross-functional partners (Product, DS, Eng) in Ads or marketplace contexts and leading projects from design through rollout.
              - listitem [ref=f535e100]: Advanced degree (MS or PhD) in Computer Science, Machine Learning, Operations Research, Applied Math, or a related quantitative field.
            - heading "Potential Teams" [level=2] [ref=f535e101]
            - list [ref=f535e102]:
              - listitem [ref=f535e103]:
                - strong [ref=f535e104]: Ads Optimization
                - text: (bid strategies, conversion/ROAS optimization, pacing and budget allocation)
            - heading [level=2] [ref=f535e105]:
              - strong [ref=f535e106]: "Benefits:"
            - list [ref=f535e107]:
              - listitem [ref=f535e108]: Comprehensive Healthcare Benefits and Income Replacement Programs
              - listitem [ref=f535e109]: 401k with Employer Match
              - listitem [ref=f535e110]: Global Benefit programs that fit your lifestyle, from workspace to professional development to caregiving support
              - listitem [ref=f535e111]: Family Planning Support
              - listitem [ref=f535e112]: Gender-Affirming Care
              - listitem [ref=f535e113]: Mental Health & Coaching Benefits
              - listitem [ref=f535e114]: Flexible Vacation & Paid Volunteer Time Off
              - listitem [ref=f535e115]: Generous Paid Parental Leave
          - generic [ref=f535e117]:
            - generic [ref=f535e120]:
              - paragraph [ref=f535e121]:
                - strong [ref=f535e122]: "Pay Transparency:"
              - paragraph [ref=f535e123]: This job posting may span more than one career level.
              - paragraph [ref=f535e124]:
                - text: In addition to base salary, this job is eligible to receive equity in the form of restricted stock units, and depending on the position offered, it may also be eligible to receive a commission. Additionally, Reddit offers a wide range of benefits to U.S.-based employees, including medical, dental, and vision insurance, 401(k) program with employer match, generous time off for vacation, and parental leave. To learn more, please visit
                - link "https://www.redditinc.com/careers/" [ref=f535e125] [cursor=pointer]:
                  - /url: https://www.redditinc.com/careers/
                - text: .
              - paragraph [ref=f535e126]: To provide greater transparency to candidates, we share base salary ranges for all US-based job postings regardless of state. We set standard base pay ranges for all roles based on function, level, and country location, benchmarked against similar stage growth companies. Final offer amounts are determined by multiple factors including, skills, depth of work experience and relevant licenses/credentials, and may vary from the amounts listed below.
            - paragraph [ref=f535e127]: "The base salary range for this position is:"
            - paragraph [ref=f535e128]: $216,700 - $303,400 USD
          - generic [ref=f535e129]:
            - paragraph [ref=f535e130]: In select roles and locations, the interviews will be recorded, transcribed and summarized by artificial intelligence (AI). You will have the opportunity to opt out of recording, transcription and summarization prior to any scheduled interviews.
            - paragraph [ref=f535e131]:
