                - listitem [ref=f509e455]: Blind or low vision
                - listitem [ref=f509e456]: Cancer (past or present)
                - listitem [ref=f509e457]: Cardiovascular or heart disease
                - listitem [ref=f509e458]: Celiac disease
                - listitem [ref=f509e459]: Cerebral palsy
