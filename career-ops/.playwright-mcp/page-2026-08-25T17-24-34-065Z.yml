          - generic [ref=f12e30]:
            - paragraph [ref=f12e31]:
              - strong [ref=f12e32]: "Location:"
              - text: "Reddit has a flexible first workforce. Don't live near our office? No worries: you can work remotely from anywhere in the UK or the Netherlands."
            - paragraph [ref=f12e33]:
              - strong [ref=f12e34]: About the Team
            - paragraph [ref=f12e35]: The ML Efficiency team builds the infrastructure, tooling, and optimization systems that enable machine learning engineers and researchers to train, evaluate, deploy, and operate models efficiently at scale. We focus on improving developer productivity, reducing infrastructure costs, increasing hardware utilization, and accelerating experimentation across the company’s ML ecosystem.
            - paragraph [ref=f12e36]:
              - strong [ref=f12e37]: Responsibilities
            - list [ref=f12e38]:
              - listitem [ref=f12e39]: Design and build systems that improve the efficiency of ML training and inference workloads.
              - listitem [ref=f12e40]: Develop tooling that helps ML engineers debug, profile, optimize, and monitor model performance.
              - listitem [ref=f12e41]: Improve GPU and general resource utilization through scheduling, resource management, caching, and workload optimization.
              - listitem [ref=f12e42]: Partner with ML researchers and product teams to identify bottlenecks and drive performance improvements.
              - listitem [ref=f12e43]: Build benchmarking frameworks and performance dashboards for training and serving systems.
              - listitem [ref=f12e44]: Optimize distributed training infrastructure, data pipelines, and model serving architectures.
              - listitem [ref=f12e45]: Lead cross-functional initiatives that improve the productivity of Reddit ML engineers.
              - listitem [ref=f12e46]: Drive technical strategy for ML platform scalability, reliability, and cost efficiency.
            - paragraph [ref=f12e47]:
              - strong [ref=f12e48]: Qualifications
            - paragraph [ref=f12e49]:
              - strong [ref=f12e50]: Required
            - list [ref=f12e51]:
              - listitem [ref=f12e52]: BS, MS, or PhD in Computer Science or a related field.
              - listitem [ref=f12e53]: 5+ years of software engineering experience.
              - listitem [ref=f12e54]: Strong proficiency in Python
              - listitem [ref=f12e55]: Profiency in at least one systems language (Go, C++, Rust, or Java) preferred
              - listitem [ref=f12e56]: Experience building distributed systems at scale.
              - listitem [ref=f12e57]: Experience with machine learning infrastructure, training systems, or model serving platforms.
              - listitem [ref=f12e58]: Deep understanding of performance engineering and systems optimization.
              - listitem [ref=f12e59]: Strong debugging and profiling skills.
            - paragraph [ref=f12e60]:
              - strong [ref=f12e61]: Preferred
            - list [ref=f12e62]:
              - listitem [ref=f12e63]: Experience with large-scale recommendation, ranking, generative AI, or foundation model systems.
              - listitem [ref=f12e64]: Experience with distributed training frameworks such as PyTorch Distributed, Ray, Tensorflow, Spark
              - listitem [ref=f12e65]: Familiarity with GPU architectures and performance analysis tools.
              - listitem [ref=f12e66]: Experience optimizing cloud infrastructure costs across large ML workloads.
              - listitem [ref=f12e67]: Contributions to internal platforms used by multiple ML teams.
              - listitem [ref=f12e68]: Experience with building real time ML inference applications
            - paragraph [ref=f12e69]:
              - strong [ref=f12e70]: What Success Looks Like
            - list [ref=f12e71]:
              - listitem [ref=f12e72]: ML engineers can move from idea to experiment faster.
              - listitem [ref=f12e73]: Training and inference costs decrease, performance increases, while model quality is maintained or improved.
              - listitem [ref=f12e74]: GPU utilization and cluster efficiency increase.
              - listitem [ref=f12e75]: Platform reliability improves as ML workloads scale.
              - listitem [ref=f12e76]: Teams spend less time managing infrastructure and more time building models.
              - listitem [ref=f12e77]: Average recommendation model size increases.
            - paragraph [ref=f12e78]:
              - strong [ref=f12e79]: "Benefits:"
            - list [ref=f12e80]:
              - listitem [ref=f12e81]: Global Benefit programs that fit your lifestyle, from workspace to professional development to caregiving support
              - listitem [ref=f12e82]: Family Planning Support
              - listitem [ref=f12e83]: Gender-Affirming Care
              - listitem [ref=f12e84]: Mental Health & Coaching Benefits
              - listitem [ref=f12e85]: Private Pension plan with Employer-matching
              - listitem [ref=f12e86]: 100% employer-sponsored group medical plan
              - listitem [ref=f12e87]: Income Replacement Programs
              - listitem [ref=f12e88]: Flexible Vacation & Paid Volunteer Time Off
              - listitem [ref=f12e89]: Generous Paid Parental Leave
