          - button "Apply" [ref=f26e15] [cursor=pointer]
        - generic [ref=f26e16]:
          - generic [ref=f26e17]:
            - paragraph [ref=f26e18]:
              - strong [ref=f26e20]: About Faire
            - paragraph [ref=f26e21]: Faire is a technology wholesale platform built on the belief that the future is local. Independent retailers around the globe collectively represent a multi-hundred-billion-dollar wholesale market that has historically been fragmented and offline. At Faire, we're using the power of tech, data, and machine learning to connect this thriving community of entrepreneurs across the globe. Picture your favorite boutique in town — we help them discover the best products from around the world to sell in their stores. With the right tools and insights, we believe that we can level the playing field so businesses can grow and local communities can thrive.
            - paragraph [ref=f26e22]: We’re looking for smart, resourceful and passionate people to join us as we power the shop local movement. If you believe in community, come join ours.
          - generic [ref=f26e23]:
            - paragraph [ref=f26e24]:
              - strong [ref=f26e25]: "About the Role:"
            - paragraph [ref=f26e26]: The Ads Supply pod grows Faire's Ads business by expanding where, how, and in what format ads show up. Almost all of Faire's ads today are promoted product listings, and we'll unlock top-of-market opportunities for our advertisers with premium creative formats.
            - paragraph [ref=f26e27]: As a technical leader, you'll own building the high-scale, low-latency systems that serve and render premium formats like video and brand creative across every surface and device. Working hands-on across the full stack and co-shaping the experience with Product and Design, you'll unify creative serving, formats, and rendering into one cohesive system, partnering closely with Ads Delivery and Ads Bidding and enabling fast, measurable experimentation. You'll also set the technical direction for ad formats at Faire and shape the roadmap for what we build next.
            - paragraph [ref=f26e28]:
              - strong [ref=f26e29]: "What You'll Do:"
            - list [ref=f26e30]:
              - listitem [ref=f26e31]:
                - strong [ref=f26e32]: "Own the technical vision:"
                - text: Define the end-to-end architecture for our next-generation ad formats, including a unified serving layer that keeps the experience fast, scalable, and reliable across surfaces and devices.
              - listitem [ref=f26e33]:
                - strong [ref=f26e34]: "Build the systems behind every format:"
                - text: Design highly automated systems for ad format serving, optimization, and A/B testing that maximize business outcomes.
              - listitem [ref=f26e35]:
                - strong [ref=f26e36]: "Lay the foundations for future formats:"
                - text: Build the framework-level solutions that make new formats faster to ship and deepen how well we understand our users.
              - listitem [ref=f26e37]:
                - strong [ref=f26e38]: "Invent what comes next:"
                - text: Conceptualize, prototype, and run experiments on new ad format ideas, drawing on market trends, user behavior, and advertiser needs to find the opportunities with real business impact.
              - listitem [ref=f26e39]:
                - strong [ref=f26e40]: "Drive cross-functional impact:"
                - text: Operate as a product builder who brings customer understanding to the work, partnering closely with Product, Design, Data Science, and other engineering teams to deliver cohesive, high-impact solutions.
              - listitem [ref=f26e41]:
                - strong [ref=f26e42]: "Raise the engineering bar:"
                - text: Advocate for and apply best practices across availability, scalability, operational excellence, and cost management.
              - listitem [ref=f26e43]:
                - strong [ref=f26e44]: "Mentor and lead:"
                - text: Guide and upskill other engineers, fostering a culture of technical excellence, ownership, and continuous learning.
            - paragraph [ref=f26e45]:
              - strong [ref=f26e46]: "Qualifications:"
            - list [ref=f26e47]:
              - listitem [ref=f26e48]: 7+ years of professional software engineering experience, with 3+ years as a technical leader driving complex, cross-team projects.
              - listitem [ref=f26e49]: Deep expertise in building and scaling ad formats or similar user-facing content delivery systems.
              - listitem [ref=f26e50]: Excellent programming and system design skills, with a proven track record of leading and operating highly available, high-performance, low-latency backend systems at scale.
              - listitem [ref=f26e51]: AI-native, using modern AI tooling as a core part of how you deliver impact and embedding AI best practices into your daily workflow.
              - listitem [ref=f26e52]: A product builder who understands customers deeply, helps shape what gets built, and turns ambiguous business problems into clear product and technical direction.
              - listitem [ref=f26e53]: "Strong collaboration, mentorship, and leadership: a compelling vision, clear communication, and the ability to drive concurrent projects and influence strategy with a collaborative leadership style."
            - paragraph [ref=f26e54]:
              - strong [ref=f26e55]: "Nice to have:"
            - list [ref=f26e56]:
              - listitem [ref=f26e57]: Experience with cross-platform development.
              - listitem [ref=f26e58]: Prior experience building or operating creative serving infrastructure for digital advertising, especially for new and rich ad formats (e.g., video or interactive creative).
              - listitem [ref=f26e59]: Experience with machine learning and gen-AI in advertising, such as ranking, retrieval, and optimization.
            - paragraph [ref=f26e60]:
              - strong [ref=f26e61]: "Technologies we use and teach:"
            - list [ref=f26e62]:
              - listitem [ref=f26e63]:
                - strong [ref=f26e64]: "Backend:"
                - text: Kotlin, Java 16, Hibernate, Guice, Jersey
              - listitem [ref=f26e65]:
                - strong [ref=f26e66]: "Search and data:"
                - text: Elasticsearch, FAISS, Redis, DynamoDB
              - listitem [ref=f26e67]:
                - strong [ref=f26e68]: "Communication:"
                - text: Protocol Buffers, HTTP, JSON
              - listitem [ref=f26e69]:
                - strong [ref=f26e70]: "Infrastructure:"
                - text: AWS, Kubernetes, Buildkite, Datadog
            - heading [level=4] [ref=f26e71]:
              - strong [ref=f26e72]: "Salary Range:"
            - paragraph [ref=f26e73]: "Canada: the pay range for this role is $190,500 - $262,000 per year."
            - paragraph [ref=f26e74]: This role will also be eligible for equity and benefits. Actual base pay will be determined based on permissible factors such as transferable skills, work experience, market demands, and primary work location. The base pay range provided is subject to change and may be modified in the future.
          - generic [ref=f26e75]:
            - paragraph [ref=f26e76]:
              - emphasis [ref=f26e77]:
                - generic [ref=f26e78]:
                  - emphasis [ref=f26e79]: Hybrid Faire employees currently go into the office 3 days per week on Tuesdays, Thursdays, and a third flex day of their choosing (Monday, Wednesday, or Friday).
                  - text: Additionally, hybrid in-office roles will have the flexibility to work remotely up to 4 weeks per year. Specific Workplace and Information Technology positions may require onsite attendance 5 days per week as will be indicated in the job posting.
            - paragraph [ref=f26e80]:
              - strong [ref=f26e81]: Why you’ll love working at Faire
            - list [ref=f26e82]:
              - listitem [ref=f26e83]:
                - strong [ref=f26e84]: "Move fast:"
                - text: You'll own meaningful problems that serve customers around the globe with the agency to move fast and see your results clearly.
              - listitem [ref=f26e85]:
                - strong [ref=f26e86]: "Equipped to scale:"
                - text: We invest in what matters, including the latest enterprise AI tools, to help you work smarter and get more out of every day.
              - listitem [ref=f26e87]:
                - strong [ref=f26e88]: "Best in class:"
                - text: Our team is full of sharp, kind, and generous colleagues who care about their craft and about helping you grow in yours.
              - listitem [ref=f26e89]:
                - strong [ref=f26e90]: Real rewards.
                - text: Competitive pay, equity, and comprehensive benefits designed to support your life inside and outside of work.
              - listitem [ref=f26e91]:
                - strong [ref=f26e92]: "Belonging:"
                - text: We're intentional about building an environment where every Faire employee has equal access to opportunities, growth, and success.
            - paragraph [ref=f26e93]:
              - text: "Faire was founded in 2017 by a team of early product and engineering leads from Square. We’re backed by some of the top investors in retail and tech including: Y Combinator, Lightspeed Venture Partners, Forerunner Ventures, Khosla Ventures, Sequoia Capital, Founders Fund, and DST Global. We have headquarters in San Francisco and Kitchener-Waterloo, and a global employee presence across offices in Toronto, London, and New York. To learn more about Faire and our customers, you can read more on our"
              - link "blog" [ref=f26e94] [cursor=pointer]:
                - /url: https://blog.faire.com/
              - text: .
            - paragraph
            - paragraph [ref=f26e95]: Faire provides equal employment opportunities (EEO) to all employees and applicants for employment without regard to race, color, religion, sex, national origin, age, disability, genetics, sexual orientation, gender identity or gender expression.
            - paragraph [ref=f26e96]:
              - text: Faire is committed to providing access, equal opportunity and reasonable accommodation for individuals with disabilities in employment, its services, programs, and activities. Accommodations are available throughout the recruitment process and applicants with a disability may request to be accommodated throughout the recruitment process. We will work with all applicants to accommodate their individual accessibility needs. To request reasonable accommodation, please fill out our
