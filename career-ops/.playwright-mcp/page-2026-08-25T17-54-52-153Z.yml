              - strong [ref=f382e45]: ABOUT BASETEN
            - paragraph [ref=f382e46]:
              - text: Baseten powers mission-critical inference for the world's most dynamic AI companies, like Cursor, Notion, OpenEvidence, Abridge, Clay, Gamma and Writer. By uniting applied AI research, flexible infrastructure, and seamless developer tooling, we enable companies operating at the frontier of AI to bring cutting-edge models into production. We're growing quickly and recently raised our
              - link "$1.5B Series F" [ref=f382e47] [cursor=pointer]:
                - /url: https://www.baseten.co/blog/announcing-our-series-f/
              - text: ", led by Altimeter Capital, Conviction Partners, and Spark Capital. Join us and help build the platform engineers turn to to ship AI products."
            - paragraph [ref=f382e48]
            - paragraph [ref=f382e49]:
              - strong [ref=f382e50]: THE ROLE
            - paragraph [ref=f382e51]: As a Product Engineer on the Dedicated Inference team, you'll shape the state-of-the-art developer experience for deploying and operating AI workloads in production. From the CLI and SDKs to APIs, observability, and debugging workflows, you'll build the tools customers rely on every day to manage mission-critical inference deployments.
            - paragraph [ref=f382e52]: Few teams at Baseten have as much breadth and visibility as Dedicated Inference. The team is often at the forefront of new product development, giving engineers the opportunity to shape the experience of some of our most important customers.
            - paragraph [ref=f382e53]
