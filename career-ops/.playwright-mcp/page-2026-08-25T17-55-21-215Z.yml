            - paragraph [ref=f384e43]:
              - strong [ref=f384e44]: ABOUT BASETEN
            - paragraph [ref=f384e45]:
              - text: Baseten powers mission-critical inference for the world's most dynamic AI companies, like Cursor, Notion, OpenEvidence, Abridge, Clay, Gamma and Writer. By uniting applied AI research, flexible infrastructure, and seamless developer tooling, we enable companies operating at the frontier of AI to bring cutting-edge models into production. We're growing quickly and recently raised our
              - link "$1.5B Series F" [ref=f384e46] [cursor=pointer]:
                - /url: https://www.baseten.co/blog/announcing-our-series-f/
              - text: ", led by Altimeter Capital, Conviction Partners, and Spark Capital. Join us and help build the platform engineers turn to to ship AI products."
            - paragraph [ref=f384e47]
            - paragraph [ref=f384e48]:
              - strong [ref=f384e49]: THE ROLE
            - paragraph [ref=f384e50]: Baseten’s Inference Stack team builds the distributed runtime that powers large-scale LLM inference across our platform. We operate at the intersection of distributed systems, model performance, infrastructure, and developer experience. We enable customers to deploy and operate cutting-edge LLM models with industry-leading performance, scalability, reliability, and ease of use.
            - paragraph [ref=f384e51]: As a Software Engineer on the Inference Stack team, you’ll work across the stack - from the developer experience customers use to deploy models, the libraries used for features like tool calling and reasoning, all the way down to the systems we use to orchestrate deployments in Kubernetes and route traffic efficiently.
            - paragraph [ref=f384e52]: This is an ideal role for engineers who enjoy owning systems in production, solving hard integration problems, and making complex infrastructure simple and reliable for users.
