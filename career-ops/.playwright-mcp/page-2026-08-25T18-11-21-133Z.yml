          - generic [ref=f619e21]:
            - paragraph [ref=f619e22]: Hume AI is seeking a talented senior software engineer with experience in backend services and ML infrastructure who is interested in working with our team to build state-of-the-art audio models and evaluation tools. Join us in the heart of New York City and contribute to our endeavor to ensure that AI is guided by human values, the most pivotal challenge (and opportunity) of the 21st century.
            - paragraph [ref=f619e23]:
              - strong [ref=f619e24]: About Us
            - paragraph [ref=f619e25]:
              - text: Hume AI is a Series B startup dedicated to building artificial intelligence that is directly optimized for human well-being. As the first company to release speech language models, we’re focused on expanding our research to encompass audio understanding models and evaluation platforms for enterprises.Our goal is to enable a future in which technology draws on an understanding of human emotional expression to better serve human goals. As part of our mission, we also conduct groundbreaking scientific research, publish in leading scientific journals like
              - link "Nature" [ref=f619e26] [cursor=pointer]:
                - /url: https://www.nature.com/articles/s41562-022-01489-2
              - text: ", and support a non-profit, The Hume Initiative, that has released the first concrete ethical guidelines for empathic AI ("
              - link "www.thehumeinitiative.org" [ref=f619e27] [cursor=pointer]:
                - /url: http://www.thehumeinitiative.org/
              - text: ). You can learn more about us on our website (
              - link "https://hume.ai/" [ref=f619e28] [cursor=pointer]:
                - /url: https://hume.ai/
              - text: ) and read about us in
              - link "WIRED" [ref=f619e29] [cursor=pointer]:
                - /url: https://www.wired.com/story/hume-ai-emotional-intelligence/
              - text: ","
              - link "Forbes" [ref=f619e30] [cursor=pointer]:
                - /url: https://www.forbes.com/sites/rashishrivastava/2024/03/27/feeling-sad-excited-or-bored-this-startup-claims-its-ai-can-mostly-tell/
              - text: ", and"
              - link "Venturebeat" [ref=f619e31] [cursor=pointer]:
                - /url: https://venturebeat.com/ai/who-needs-gpt-4o-voice-mode-humes-evi-2-is-here-with-emotionally-inflected-voice-ai-and-api/
              - text: .
            - paragraph [ref=f619e32]:
              - strong [ref=f619e33]: About the Role
            - paragraph [ref=f619e34]: We are looking for an experienced and motivated senior engineer with experience in backend services and ML infrastructure. In this role you will help us integrate cutting edge AI models into services and toolkits for researchers and developers. You will work closely with research scientists and other engineers to build new capabilities into the Hume platform, and you will have the opportunity to take part in a wide range of engineering initiatives across backend applications, cloud infrastructure, and the ML lifecycle, including evaluation and deployment at scale.
            - paragraph [ref=f619e35]
            - paragraph [ref=f619e36]:
              - strong [ref=f619e37]: Requirements
            - list [ref=f619e38]:
              - listitem [ref=f619e39]: Expertise in the Python ecosystem and popular ML libraries and tools (e.g. PyTorch, JAX, TensorFlow, XGBoost, sklearn, pandas, numpy).
              - listitem [ref=f619e40]: Experience building and deploying models for inference services.
              - listitem [ref=f619e41]: Experience writing backend services in multiple languages (e.g. Kotlin, Go, Rust, Java, C++).
              - listitem [ref=f619e42]: Understanding of core ML concepts including model architecture, training, and evaluation.
              - listitem [ref=f619e43]: Expertise working with storage and compute on a cloud platform (e.g.Google Cloud, AWS).
              - listitem [ref=f619e44]: Excellent communication and collaboration skills.
            - paragraph [ref=f619e45]:
              - strong [ref=f619e46]: Bonus
            - list [ref=f619e47]:
              - listitem [ref=f619e48]: Familiarity with data engineering principles and/or building large-scale data pipelines.
              - listitem [ref=f619e49]: Familiarity with building and deploying LLM-integrated products.
              - listitem [ref=f619e50]: Experience working at the intersection of machine learning research and engineering.
              - listitem [ref=f619e51]: Understanding of modern deployment strategies utilizing cloud technologies. (e.g. blue/green, canary deployments, etc).
              - listitem [ref=f619e52]: Experience using service deployment tooling (e.g. Kubernetes, Helm, Docker, Argo).
            - paragraph [ref=f619e53]:
              - strong [ref=f619e54]: Application Note
            - paragraph [ref=f619e55]:
              - emphasis [ref=f619e56]: Please apply only to the position that best aligns with your qualifications. If you submit multiple applications or have applied within the past 6 months, only your initial submission will be considered.
