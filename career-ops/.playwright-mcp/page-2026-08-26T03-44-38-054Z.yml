            - heading "Senior Applied AI/ML Scientist - Compass" [level=1] [ref=f14e10]
            - generic [ref=f14e11]: Kitchener-Waterloo, ON; Toronto, ON
          - button "Apply" [ref=f14e15] [cursor=pointer]
        - generic [ref=f14e16]:
          - generic [ref=f14e17]:
            - paragraph [ref=f14e18]:
              - strong [ref=f14e20]: About Faire
            - paragraph [ref=f14e21]: Faire is a technology wholesale platform built on the belief that the future is local. Independent retailers around the globe collectively represent a multi-hundred-billion-dollar wholesale market that has historically been fragmented and offline. At Faire, we're using the power of tech, data, and machine learning to connect this thriving community of entrepreneurs across the globe. Picture your favorite boutique in town — we help them discover the best products from around the world to sell in their stores. With the right tools and insights, we believe that we can level the playing field so businesses can grow and local communities can thrive.
            - paragraph [ref=f14e22]: We’re looking for smart, resourceful and passionate people to join us as we power the shop local movement. If you believe in community, come join ours.
          - generic [ref=f14e23]:
            - paragraph [ref=f14e24]:
              - strong [ref=f14e25]: About the role
            - paragraph [ref=f14e26]:
              - text: Faire is building the future of wholesale, connecting independent retailers with the brands that will define their stores. At the heart of this mission is
              - strong [ref=f14e27]: Compass
              - text: — Faire’s user facing AI bet within the Discovery Pillar — building an always-present, context-aware retailer assistant along the enagement journey. Compass helps retailers make smarter buying decisions by combining Faire’s rich proprietary data with agentic AI and web search, and is increasingly able to take action on retailers’ behalf.
            - paragraph [ref=f14e28]:
              - text: As a
              - strong [ref=f14e29]: Senior Applied AI/ML Scientist
              - text: "on the Compass team, you will be the science and technical lead for this product — driving agent quality through data, evaluation, and modeling, while shipping product features end-to-end with high velocity. This is a deeply hands-on individual contributor role: no direct reports, keyboard first. You will set the data-grounded direction for how the assistant works, while also being a full-stack (AI, ML, backend) builder who turns ideas into shipped product fast."
            - paragraph [ref=f14e30]: You will work at the frontier of agentic AI, blending applied science rigor (eval-driven development, experimentation, data strategy) with cross-stack engineering range to build the retailer assistant of the future. This is a rare opportunity to shape a product from near-zero — where your judgment, speed, and instincts will define the outcomes.
            - paragraph [ref=f14e31]:
              - strong [ref=f14e32]: What you’ll do
            - list [ref=f14e33]:
              - listitem [ref=f14e34]:
                - strong [ref=f14e35]: Own the science and technical north star
                - text: "for Compass’s agentic products — the retailer assistant today and whatever comes next: how to leverage Faire’s proprietary data, agent + tool + context strategy (preload vs. tool-calling vs. hybrid), and how to measure and raise agent quality as systems gain the ability to act."
              - listitem [ref=f14e36]:
                - text: Ship retailer-assistant features
                - strong [ref=f14e37]: end-to-end
                - text: — across the FLARE Python app, data plumbing, tool wrappers, and the frontend surfaces where the assistant appears, using AI-native workflows to multiply your output.
              - listitem [ref=f14e38]:
                - text: Translate ambiguous product bets into
                - strong [ref=f14e39]: sequenced, de-risked tactical plans
                - text: — what to build now, what to defer, and which bets carry the highest impact × probability-of-success.
              - listitem [ref=f14e40]:
                - text: Set and raise the bar for
                - strong [ref=f14e41]: eval- and experiment-driven development
                - text: — define how the team knows an agent is good, including offline eval suites, LLM-as-judge metrics, and quality criteria per surface and retailer journey.
              - listitem [ref=f14e42]:
                - text: Make
                - strong [ref=f14e43]: pragmatic engineering choices
                - text: ": simple enough to ship now, designed to evolve — not over-engineered for imagined future scale, but not throwaway either."
              - listitem [ref=f14e44]: Partner closely with engineers on architecture and serving tradeoffs, and act as the science/technical interface to adjacent teams (Search, Personalization, Platform/FLARE).
              - listitem [ref=f14e45]: Raise the team’s collective judgment through prototypes, analyses, design reviews, and pairing.
            - paragraph [ref=f14e46]:
              - strong [ref=f14e47]: You’re a great fit if you have…
            - list [ref=f14e48]:
              - listitem [ref=f14e49]:
                - strong [ref=f14e50]: 5+ years
                - text: of industry experience building and shipping production ML/AI systems with measurable business impact — including
                - strong [ref=f14e51]: hands-on ownership
                - text: of the applied-science side (data, evaluation, modeling, quality), not just system plumbing.
              - listitem [ref=f14e52]:
                - text: Has shipped
                - strong [ref=f14e53]: agentic / LLM-powered features
                - text: "in a core production product — with a deep, opinionated grasp of agent design tradeoffs: eval strategy, latency/cost/quality tension, tool-calling vs. context preload, guardrails, and failure containment."
              - listitem [ref=f14e54]:
                - text: Strong
                - strong [ref=f14e55]: applied ML / data science foundation
                - text: — reasons from data, designs experiments and evals, and has turned proprietary or structured data into product capability.
              - listitem [ref=f14e56]:
                - text: Track record of
                - strong [ref=f14e57]: shipping fast across multiple stacks
                - text: (backend, data, and ideally frontend) with quality — not a single-layer specialist; demonstrates cross-stack range.
              - listitem [ref=f14e58]:
                - strong [ref=f14e59]: AI-native
                - text: "in practice: uses AI coding tools and agent workflows as a force multiplier in day-to-day work."
              - listitem [ref=f14e60]: Architectural maturity — can explain design choices that work simply today but won’t need to be thrown away when requirements grow.
              - listitem [ref=f14e61]: Operates with high autonomy and resourcefulness, with good judgment about when to escalate and when to just solve it.
              - listitem [ref=f14e62]: Fluent enough in engineering to make sound architecture calls.
            - paragraph [ref=f14e63]:
              - strong [ref=f14e64]: Bonus points for…
            - list [ref=f14e65]:
              - listitem [ref=f14e66]: E-commerce, marketplace, or two-sided platform context — understanding of both sides of the retailer/brand dynamic.
              - listitem [ref=f14e67]:
                - text: Experience evolving a
                - strong [ref=f14e68]: read-only assistant into one that takes actions safely
                - text: — confirm-first patterns, guardrails, and failure containment.
              - listitem [ref=f14e69]:
                - text: Hands-on experience with the
                - strong [ref=f14e70]: OpenAI Agents SDK
                - text: or similar agentic frameworks in production.
              - listitem [ref=f14e71]:
                - text: Familiarity with
                - strong [ref=f14e72]: preload-over-RAG context strategies
                - text: ", Snowflake-backed grounding, or hybrid approaches."
              - listitem [ref=f14e73]: Prior 0→1 / early-stage product experience — has built something meaningful from scratch.
              - listitem [ref=f14e74]: Recommendation, retrieval, or personalization modeling background.
              - listitem [ref=f14e75]: Public writing, open-source contributions, or talks that show structured thinking about agentic / applied-AI systems.
            - paragraph [ref=f14e76]:
              - strong [ref=f14e77]: Salary Range
            - paragraph [ref=f14e78]: "Canada: the pay range for this role is $180,000 to $247,500 per year."
            - paragraph [ref=f14e79]: This role will also be eligible for equity and benefits. Actual base pay will be determined based on permissible factors such as transferable skills, work experience, market demands, and primary work location. The base pay range provided is subject to change and may be modified in the future.
            - paragraph [ref=f14e80]: Faire uses Artificial Intelligence (AI) to screen and select applicants for this position.
            - paragraph [ref=f14e81]: This job posting is for an existing vacancy.
          - generic [ref=f14e82]:
