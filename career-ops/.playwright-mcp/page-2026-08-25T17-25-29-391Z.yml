        - generic [ref=f33e9]:
          - generic [ref=f33e10]:
            - heading "Technical Support Engineer (Inference) - US Weekends" [level=1] [ref=f33e11]
            - generic [ref=f33e12]: Remote
          - button "Apply" [ref=f33e16] [cursor=pointer]
        - generic [ref=f33e18]:
          - heading [level=3] [ref=f33e19]:
            - strong [ref=f33e21]: About the role
          - paragraph [ref=f33e22]: As a Technical Support Engineer at a pioneering AI company, you'll be the first line of defense to support customers as they build out training, fine tuning, and inference solutions with Together AI. You'll dive deep into complex technical challenges, providing swift and effective solutions while serving as a product expert. As a part of the Customer Experience organization, you will collaborate closely with product and sales, driving continuous improvement of our offerings. This is an exciting opportunity for a deeply technical professional passionate about AI and customer success to make a significant impact in a fast-paced, innovative environment.
          - heading [level=3] [ref=f33e23]:
            - strong [ref=f33e25]: Required hours
          - list [ref=f33e26]:
            - listitem [ref=f33e27]: This is a fulltime position working US daytime hours. The role will work both weekend days (Saturday and Sunday) as well as two additional weekdays.
            - listitem [ref=f33e28]: This is a 4-day shift, 10 hours per day, with 2 additional hours of on-call coverage on Saturdays and Sundays.
            - listitem [ref=f33e29]: The role would start as a Monday to Friday role for the first few months to allow for ramping up and learning from teammates. After being considered fully ramped, the role would transition to the 4-day weekend shift.
          - heading [level=3] [ref=f33e30]:
            - strong [ref=f33e32]: Responsibilities
          - list [ref=f33e33]:
            - listitem [ref=f33e34]: Engage directly with customers to tackle and resolve complex technical challenges involving our cutting-edge GPU clusters and our inference and fine-tuning services; ensure swift and effective solutions every time.
            - listitem [ref=f33e35]: Act as a customer facing SRE to ensure our customer’s Inference endpoints (running on Kubernetes) remain healthy, stable, and performant
            - listitem [ref=f33e36]: Become a product expert in all of our Gen AI solutions, serving as the last line of technical defense before issues are escalated to Engineering and Product teams.
            - listitem [ref=f33e37]: Assist with hardware and platform migrations by validating system health and traffic routing. Monitor dashboards to detect anomalies and escalate with data-backed analysis
            - listitem [ref=f33e38]: Manage customer-facing communications during incidents and degradations; translate deep technical findings (latency regressions, provider issues, network reachability drops) into clear, evidence-backed updates without exposing platform internals
            - listitem [ref=f33e39]: Contribute infrastructure changes for model deployment, capacity rebalancing, and cluster configuration. You will execute infrastructure changes via pull requests (infra-as-code) for tasks such as endpoint configuration, model bringup/bringdown, and capacity scaling
            - listitem [ref=f33e40]: Flag engine-level bugs with logs and reproduction steps for engineering
            - listitem [ref=f33e41]: Collaborate seamlessly across Engineering, Research, and Product teams to address customer concerns; collaborate with senior leaders both internally and externally to ensure the highest levels of customer satisfaction.
            - listitem [ref=f33e42]: Transform customer insights into action by identifying patterns in support cases and working with Engineering and Go-To-Market teams to drive Together’s roadmap (e.g., future models to support)
            - listitem [ref=f33e43]: Maintain detailed documentation of system configurations, procedures, troubleshooting guides, and FAQs to facilitate knowledge sharing with team and customers.
            - listitem [ref=f33e44]: Be flexible in providing support coverage during holidays, nights and weekends as required by business needs to ensure consistent and reliable service for our customers.
          - heading [level=3] [ref=f33e45]:
            - strong [ref=f33e47]: Requirements
          - list [ref=f33e48]:
            - listitem [ref=f33e49]: 6+ years of experience in a customer-facing technical role, SRE, DevOps, or infrastructure engineering, with at least 1 year in a support role for an AI service
            - listitem [ref=f33e50]: Experience as an SRE or DevOps engineer working with Kubernetes
            - listitem [ref=f33e51]: Strong technical background, with knowledge of AI, ML, GPU technologies and their integration into high-performance computing (HPC) environments.
            - listitem [ref=f33e52]: Advanced, production-level experience with infrastructure services (e.g., Kubernetes, SLURM), infrastructure as code solutions (e.g., Ansible) high-performance network fabrics, NFS-based storage management, and container infrastructure
            - listitem [ref=f33e53]: Familiarity with operating storage systems in HPC environments such as Vast and Weka
            - listitem [ref=f33e54]: Proven ability to diagnose complex network-layer issues and read traces
            - listitem [ref=f33e55]: Strong knowledge of Python, TypeScript, and/or JavaScript with testing/debugging experience using curl and Postman-like tools
            - listitem [ref=f33e56]: Demonstrated expertise with observability tooling (e.g., Prometheus, Grafana) at scale
            - listitem [ref=f33e57]: Deep familiarity with REST API debugging and HTTP semantics
            - listitem [ref=f33e58]: Experience with LLM inference frameworks and LoRA fine-tuning and common training failure modes
            - listitem [ref=f33e59]: Experience with Infrastructure as Code and Git-based workflows
            - listitem [ref=f33e60]: Background in GPU cluster management
            - listitem [ref=f33e61]: Cloud platform experience (AWS, GCP, and/or Azure)
            - listitem [ref=f33e62]: Foundational understanding in the installation, configuration, administration, troubleshooting, and securing of compute clusters.
            - listitem [ref=f33e63]: Complex technical problem solving and troubleshooting, with a proactive approach to issue resolution
            - listitem [ref=f33e64]: Ability to work cross-functionally with teams such as Sales, Engineering, Support, Product and Research to drive customer success.
            - listitem [ref=f33e65]: Strong sense of ownership and willingness to learn new skills to ensure both team and customer success.
            - listitem [ref=f33e66]: Excellent communication and interpersonal skills, with the ability to explain complex technical concepts to non-technical stakeholders.
            - listitem [ref=f33e67]: Ability to operate in dynamic environments, adept at managing multiple projects, and comfortable with frequent context switching and prioritization.
          - heading [level=3] [ref=f33e68]:
            - strong [ref=f33e70]: About Together AI
          - paragraph [ref=f33e71]: Together AI is a research-driven artificial intelligence company. We believe open and transparent AI systems will drive innovation and create the best outcomes for society, and together we are on a mission to significantly lower the cost of modern AI systems by co-designing software, hardware, algorithms, and models. We have contributed to leading open-source research, models, and datasets to advance the frontier of AI, and our team has been behind technological advancement such as FlashAttention, Hyena, FlexGen, and RedPajama. We invite you to join a passionate group of researchers in our journey in building the next generation AI infrastructure.
          - heading [level=3] [ref=f33e72]:
            - strong [ref=f33e74]: Compensation
          - paragraph [ref=f33e75]: "We offer competitive compensation, startup equity, health insurance, and other benefits, as well as flexibility in terms of remote work. The US base salary range for this full-time position is: $160K - $230K + equity + benefits. Our salary ranges are determined by location, level and role. Individual compensation will be determined by experience, skills, and job-related knowledge."
          - heading [level=3] [ref=f33e76]:
            - strong [ref=f33e78]: Equal Opportunity
          - paragraph [ref=f33e79]: Together AI is an Equal Opportunity Employer and is proud to offer equal employment opportunity to everyone regardless of race, color, ancestry, religion, sex, national origin, sexual orientation, age, citizenship, marital status, disability, gender identity, veteran status, and more.
          - paragraph [ref=f33e80]:
            - generic [ref=f33e81]:
              - text: Please see our Privacy Policy at
              - link "https://www.together.ai/privacy" [ref=f33e82] [cursor=pointer]:
                - /url: https://www.together.ai/privacy
