          - generic [ref=f237e14]:
            - heading "Machine Learning Manager, Feed Ecosystems" [level=1] [ref=f237e15]
            - generic [ref=f237e16]: Remote - United States
          - button "Apply" [ref=f237e20] [cursor=pointer]
        - generic [ref=f237e21]:
          - generic [ref=f237e28]:
            - text: Reddit is a community of communities. It’s built on shared interests, passion, and trust, and is home to the most open and authentic conversations on the internet. Every day, Reddit users submit, vote, and comment on the topics they care most about. With 100,000+ active communities and approximately 130 million daily active unique visitors, Reddit is one of the internet’s largest sources of information. For more information, visit
            - link "www.redditinc.com" [ref=f237e29] [cursor=pointer]:
              - /url: http://www.redditinc.com/
            - text: .
          - generic [ref=f237e30]:
            - paragraph [ref=f237e31]: Reddit is looking for an experienced Engineering Manager to lead our Feed Ecosystems team. In this role, you’ll lead a high-impact team of Machine Learning Engineers focused on building recommendation systems that support sustainable growth across users, posts, and communities. Your team will improve relevance for new, low-signal, and logged-out users; help new posts and communities find the right audiences; and develop ML systems that balance personalization, discovery, and ecosystem quality across Reddit’s 100,000+ active communities.
            - paragraph [ref=f237e32]: If applying ML / AI in production to improve Reddit Relevance and strengthen Reddit’s community ecosystem excites you, then you’ve found the right place.
            - paragraph [ref=f237e33]:
              - strong [ref=f237e34]: "Responsibilities:"
            - list [ref=f237e35]:
              - listitem [ref=f237e36]:
                - strong [ref=f237e37]: "Define Technical Vision & Strategy:"
                - text: Define the technical vision and long-term roadmap for Feed Ecosystems, aligning recommender-system investments with Reddit’s goals around user growth, contribution, community health, and high-quality discovery.
              - listitem [ref=f237e38]:
                - strong [ref=f237e39]: "Team Leadership & Development:"
                - text: Coach and support the development of your team, constantly seeking opportunities to grow their skills and impact.
              - listitem [ref=f237e40]:
                - strong [ref=f237e41]: "Cross-Functional Partnership:"
                - text: Work closely with product, design, data science, safety, community, ads, and platform partners to identify opportunities, set expectations, and communicate your team’s work.
              - listitem [ref=f237e42]:
                - strong [ref=f237e43]: "Technical Execution & Delivery:"
                - text: Oversee the design, development, and optimization of ML systems that improve cold-start relevance, new post and community distribution, community discovery, and feed quality.
              - listitem [ref=f237e44]:
                - strong [ref=f237e45]: "Quality & Ecosystem Measurement:"
                - text: Help define and operationalize signals for subjective and objective quality, ensuring Feed systems optimize not only for engagement, but also for user value, community health, contribution, and long-term ecosystem outcomes.
              - listitem [ref=f237e46]:
                - strong [ref=f237e47]: "Platform & Infrastructure Collaboration:"
                - text: Collaborate with platform and infrastructure teams to build scalable AI-powered systems that support discovery, personalization, and healthy content distribution across Reddit.
              - listitem [ref=f237e48]:
                - strong [ref=f237e49]: "Operational Excellence:"
                - text: Maintain high standards for system performance, reliability, efficiency, and responsible AI practices in alignment with user needs and ecosystem health.
              - listitem [ref=f237e50]:
                - strong [ref=f237e51]: "Recruiting & Growth:"
                - text: Partner with our recruiting team to attract, interview, and hire diverse and talented machine learning engineers, growing a world-class team.
            - paragraph [ref=f237e52]:
              - strong [ref=f237e53]: "Qualifications:"
            - list [ref=f237e54]:
              - listitem [ref=f237e55]:
                - strong [ref=f237e56]: "Experience Leading ML Teams:"
                - text: 2+ years of experience building and managing high-performing ML or recommender-systems teams.
              - listitem [ref=f237e57]:
                - strong [ref=f237e58]: "Deep ML Expertise:"
                - text: Hands-on experience with large-scale production ML systems, ideally including recommender systems, personalization, cold-start modeling, content understanding, or LLM-powered recommendation applications.
              - listitem [ref=f237e59]:
                - strong [ref=f237e60]: "Technical Domain Knowledge:"
                - text: Strong understanding of recommender systems, including candidate retrieval, ranking, value modeling, ecosystem dynamics, and measurement strategies.
              - listitem [ref=f237e61]:
                - strong [ref=f237e62]: "Strategic Thinking:"
                - text: Ability to develop and communicate a clear, compelling technical strategy across ambiguous problem spaces, balancing user relevance, community growth, content quality, safety, and business impact.
              - listitem [ref=f237e63]:
                - strong [ref=f237e64]: "Impact-Driven Mindset:"
                - text: Passion for developing scalable, well-designed, and responsible AI systems that improve user value while supporting a healthy and sustainable content ecosystem.
              - listitem [ref=f237e65]:
                - strong [ref=f237e66]: "Exceptional Communication & Collaboration:"
                - text: Strong interpersonal skills and a collaborative mindset, with the ability to effectively communicate complex technical topics to diverse audiences and build strong relationships with cross-functional partners.
            - paragraph [ref=f237e67]:
              - strong [ref=f237e68]: "Benefits:"
            - list [ref=f237e69]:
              - listitem [ref=f237e70]: Comprehensive Healthcare Benefits and Income Replacement Programs
              - listitem [ref=f237e71]: 401k with Employer Match
              - listitem [ref=f237e72]: Global Benefit programs that fit your lifestyle, from workspace to professional development to caregiving support
              - listitem [ref=f237e73]: Family Planning Support
              - listitem [ref=f237e74]: Gender-Affirming Care
              - listitem [ref=f237e75]: Mental Health & Coaching Benefits
              - listitem [ref=f237e76]: Flexible Vacation & Paid Volunteer Time Off
              - listitem [ref=f237e77]: Generous Paid Parental Leave
            - paragraph [ref=f237e78]: "#LI-remote, #LI-JS5"
          - generic [ref=f237e80]:
            - generic [ref=f237e83]:
              - paragraph [ref=f237e84]:
                - strong [ref=f237e85]: "Pay Transparency:"
              - paragraph [ref=f237e86]: This job posting may span more than one career level.
              - paragraph [ref=f237e87]:
                - text: In addition to base salary, this job is eligible to receive equity in the form of restricted stock units, and depending on the position offered, it may also be eligible to receive a commission. Additionally, Reddit offers a wide range of benefits to U.S.-based employees, including medical, dental, and vision insurance, 401(k) program with employer match, generous time off for vacation, and parental leave. To learn more, please visit
                - link "https://www.redditinc.com/careers/" [ref=f237e88] [cursor=pointer]:
                  - /url: https://www.redditinc.com/careers/
                - text: .
              - paragraph [ref=f237e89]: To provide greater transparency to candidates, we share base salary ranges for all US-based job postings regardless of state. We set standard base pay ranges for all roles based on function, level, and country location, benchmarked against similar stage growth companies. Final offer amounts are determined by multiple factors including, skills, depth of work experience and relevant licenses/credentials, and may vary from the amounts listed below.
            - paragraph [ref=f237e90]: "The base salary range for this position is:"
            - paragraph [ref=f237e91]: $253,300 - $354,600 USD
          - generic [ref=f237e92]:
            - paragraph [ref=f237e93]: In select roles and locations, the interviews will be recorded, transcribed and summarized by artificial intelligence (AI). You will have the opportunity to opt out of recording, transcription and summarization prior to any scheduled interviews.
            - paragraph [ref=f237e94]:
              - generic [ref=f237e95]:
                - text: "During the interview, we will collect the following categories of personal information: Identifiers, Professional and Employment-Related Information, Sensory Information (audio/video recording), and any other categories of personal information you choose to share with us. We will use this information to evaluate your application for employment or an independent contractor role, as applicable. We will not sell your personal information or disclose it to any third party for their marketing purposes. We will delete any recording of your interview promptly after making a hiring decision. For more information about how we will handle your personal information, including our retention of it, please refer to our"
                - link "Candidate Privacy Policy for Potential Employees and Contractors" [ref=f237e96] [cursor=pointer]:
                  - /url: https://redditinc.com/policies/candidate-privacy-policy
                - text: .
            - paragraph [ref=f237e97]:
              - emphasis [ref=f237e98]: Reddit is proud to be an equal opportunity employer, and is committed to building a workforce representative of the diverse communities we serve. Reddit is committed to providing reasonable accommodations for qualified individuals with disabilities and disabled veterans in our job application procedures. If, due to a disability, you need an accommodation during the interview process, please let your recruiter know.
