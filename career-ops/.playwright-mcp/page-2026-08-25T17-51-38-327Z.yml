              - paragraph [ref=f352e92]: The annual compensation range for this role is listed below.
              - paragraph [ref=f352e93]: For sales roles, the range provided is the role’s On Target Earnings ("OTE") range, meaning that the range includes both the sales commissions/sales bonuses target and annual base salary for the role.
            - paragraph [ref=f352e94]: "Annual Salary:"
