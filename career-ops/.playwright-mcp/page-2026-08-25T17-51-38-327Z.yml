          - generic [ref=f352e21]:
            - heading [level=2] [ref=f352e22]:
              - strong [ref=f352e23]: About Anthropic
            - paragraph [ref=f352e24]: Anthropic’s mission is to create reliable, interpretable, and steerable AI systems. We want AI to be safe and beneficial for our users and for society as a whole. Our team is a quickly growing group of committed researchers, engineers, policy experts, and business leaders working together to build beneficial AI systems.
          - generic [ref=f352e25]:
            - heading [level=2] [ref=f352e26]:
              - strong [ref=f352e27]: "About the role:"
            - paragraph [ref=f352e28]: Our Inference team is responsible for building and maintaining the critical systems that serve Claude to millions of users worldwide. We bring Claude to life by serving our models via the industry's largest compute-agnostic inference deployments. We are responsible for the entire stack from intelligent request routing to fleet-wide orchestration across diverse AI accelerators.
            - paragraph [ref=f352e29]:
              - text: "The team has a dual mandate:"
              - strong [ref=f352e30]: maximizing compute efficiency
              - text: to serve our explosive customer growth, while
              - strong [ref=f352e31]: enabling breakthrough research
              - text: by giving our scientists the high-performance inference infrastructure they need to develop next-generation models. We tackle complex, distributed systems challenges across multiple accelerator families and emerging AI hardware running in multiple cloud platforms.
            - paragraph [ref=f352e32]:
              - strong [ref=f352e33]: As a Staff Software Engineer on our Inference team
              - text: ", you will work end to end, identifying and addressing key infrastructure blockers to serve Claude to millions of users while enabling breakthrough AI research. Strong candidates should have familiarity with performance optimization, distributed systems, large-scale service orchestration, and intelligent request routing. Familiarity with LLM inference optimization, batching strategies, and multi-accelerator deployments is highly encouraged but not strictly necessary."
            - heading [level=2] [ref=f352e34]:
              - strong [ref=f352e35]: "Strong candidates may also have experience with:"
            - list [ref=f352e36]:
              - listitem [ref=f352e37]:
                - paragraph [ref=f352e38]: High-performance, large-scale distributed systems
              - listitem [ref=f352e39]:
                - paragraph [ref=f352e40]: Implementing and deploying machine learning systems at scale
              - listitem [ref=f352e41]:
                - paragraph [ref=f352e42]: Load balancing, request routing, or traffic management systems
              - listitem [ref=f352e43]:
                - paragraph [ref=f352e44]: LLM inference optimization, batching, and caching strategies
              - listitem [ref=f352e45]:
                - paragraph [ref=f352e46]: Kubernetes and cloud infrastructure (AWS, GCP)
              - listitem [ref=f352e47]:
                - paragraph [ref=f352e48]: Python or Rust
            - heading [level=2] [ref=f352e49]:
              - strong [ref=f352e50]: "You may be a good fit if you:"
            - list [ref=f352e51]:
              - listitem [ref=f352e52]:
                - paragraph [ref=f352e53]: Have significant software engineering experience, particularly with distributed systems
              - listitem [ref=f352e54]:
                - paragraph [ref=f352e55]: Are results-oriented, with a bias towards flexibility and impact
              - listitem [ref=f352e56]:
                - paragraph [ref=f352e57]: Pick up slack, even if it goes outside your job description
              - listitem [ref=f352e58]:
                - paragraph [ref=f352e59]: Want to learn more about machine learning systems and infrastructure
              - listitem [ref=f352e60]:
                - paragraph [ref=f352e61]: Thrive in environments where technical excellence directly drives both business results and research breakthroughs
              - listitem [ref=f352e62]:
                - paragraph [ref=f352e63]: Care about the societal impacts of your work
            - heading [level=2] [ref=f352e64]:
              - strong [ref=f352e65]: "Representative projects across the org:"
            - list [ref=f352e66]:
              - listitem [ref=f352e67]:
                - paragraph [ref=f352e68]: Designing intelligent routing algorithms that optimize request distribution across thousands of accelerators
              - listitem [ref=f352e69]:
                - paragraph [ref=f352e70]: Autoscaling our compute fleet to dynamically match supply with demand across production, research, and experimental workloads
              - listitem [ref=f352e71]:
                - paragraph [ref=f352e72]: Building production-grade deployment pipelines for releasing new models to millions of users
              - listitem [ref=f352e73]:
                - paragraph [ref=f352e74]: Integrating new AI accelerator platforms to maintain our hardware-agnostic competitive advantage
              - listitem [ref=f352e75]:
                - paragraph [ref=f352e76]: Contributing to new inference features (e.g., structured sampling, prompt caching)
              - listitem [ref=f352e77]:
                - paragraph [ref=f352e78]: Supporting inference for new model architectures
              - listitem [ref=f352e79]:
                - paragraph [ref=f352e80]: Analyzing observability data to tune performance based on real-world production workloads
              - listitem [ref=f352e81]:
                - paragraph [ref=f352e82]: Managing multi-region deployments and geographic routing for global customers
                - paragraph [ref=f352e83]
            - paragraph [ref=f352e84]:
              - strong [ref=f352e85]: "Deadline to apply:"
              - text: None. Applications will be reviewed on a rolling basis.
            - paragraph [ref=f352e86]
          - generic [ref=f352e88]:
