            - heading "Staff Data Scientist, Consumer" [level=1] [ref=f582e15]
            - generic [ref=f582e16]: Remote - United States
          - button "Apply" [ref=f582e20] [cursor=pointer]
        - generic [ref=f582e21]:
          - generic [ref=f582e28]:
            - text: Reddit is a community of communities. It’s built on shared interests, passion, and trust, and is home to the most open and authentic conversations on the internet. Every day, Reddit users submit, vote, and comment on the topics they care most about. With 100,000+ active communities and approximately 130 million daily active unique visitors, Reddit is one of the internet’s largest sources of information. For more information, visit
            - link "www.redditinc.com" [ref=f582e29] [cursor=pointer]:
              - /url: http://www.redditinc.com/
            - text: .
          - generic [ref=f582e30]:
            - paragraph [ref=f582e31]:
              - strong [ref=f582e32]: "Location: US remote-friendly or any office location - SF, LA, CHI, NY"
            - paragraph [ref=f582e33]: Reddit is poised to rapidly innovate and grow like no other time in its history. This is a unique opportunity to leave your mark on one of the most influential and trafficked corners of the internet.
            - paragraph [ref=f582e34]: Consumer data science plays a key role in fulfilling Reddit’s mission of bringing community & belonging to the world through deep understanding of how we can better connect people to the best information and communities for them - the heart of Reddit’s product - from crypto to support groups, gaming to AMAs, travel tips to memes.
            - paragraph [ref=f582e35]: As a Staff Data Scientist on the team, you will play an influential role in guiding product strategy through proactively identifying opportunities, conducting exploratory analyses and sharing insights, and driving learning through experimentation.
            - paragraph [ref=f582e36]:
              - strong [ref=f582e37]: "Responsibilities:"
            - list [ref=f582e38]:
              - listitem [ref=f582e39]: Help build the long term product strategy by identifying opportunities to attract new users, increase engagement, and drive retention
              - listitem [ref=f582e40]: Influence strategic roadmaps through data-driven insights into user behaviors and needs
              - listitem [ref=f582e41]: Design metrics that help evaluate the health of the business and the success of our products, including any ETL development needed for consistent and robust analysis
              - listitem [ref=f582e42]: Drive experimentation from design through execution and analysis to maximize learnings and guide future investment decisions
              - listitem [ref=f582e43]: Build self-serve tools for product and engineering partners that answer common questions and/or increase data literacy in the organization
              - listitem [ref=f582e44]: Work cross functionally with product, engineering, and design teams to ensure insights make it to the product
              - listitem [ref=f582e45]: Scale your work to other parts of the data organization through mentoring more junior data scientists, improving processes, and providing perspective on the most important problems
            - paragraph [ref=f582e46]:
              - strong [ref=f582e47]: "Required Qualifications:"
            - list [ref=f582e48]:
              - listitem [ref=f582e49]: Advanced degree (Master's or Ph.D.) in Statistics, Mathematics, Physics, Economics, or Operations Research
              - listitem [ref=f582e50]: "For M.S. holders: 10+ years of industry experience in applied science or data science roles"
              - listitem [ref=f582e51]: "For Ph.D. holders: 6+ years of industry experience in applied science or data science roles"
              - listitem [ref=f582e52]: Expert knowledge of SQL and relational databases
              - listitem [ref=f582e53]: Familiarity with statistical analysis and the preferred programming languages of the team (R / Python)
              - listitem [ref=f582e54]: Demonstrated ability to influence and guide product strategy with data
              - listitem [ref=f582e55]: Demonstrated ability to take ambiguous problems and solve them in a structured, hypothesis-driven, data-supported way
              - listitem [ref=f582e56]: Familiarity with causal inference techniques and causal models
              - listitem [ref=f582e57]: Excellent communication and experience working with senior leaders / stakeholders
              - listitem [ref=f582e58]: Entrepreneurial, self-directed, and enthusiastic about solving problems
              - listitem [ref=f582e59]: Demonstrated ability to mentor other data scientists and share best practices to elevate the data science practice at Reddit
              - listitem [ref=f582e60]: Conform in innovative and fast-paced environments, and have a bias toward action.
              - listitem [ref=f582e61]: Can discuss complex topics with technical and non-technical audiences
            - paragraph [ref=f582e62]:
              - strong [ref=f582e63]: "Benefits:"
            - list [ref=f582e64]:
              - listitem [ref=f582e65]: Comprehensive Healthcare Benefits and Income Replacement Programs
              - listitem [ref=f582e66]: 401k with Employer Match
              - listitem [ref=f582e67]: Global Benefit programs that fit your lifestyle, from workspace to professional development to caregiving support
              - listitem [ref=f582e68]: Family Planning Support
              - listitem [ref=f582e69]: Gender-Affirming Care
              - listitem [ref=f582e70]: Mental Health & Coaching Benefits
              - listitem [ref=f582e71]: Flexible Vacation & Paid Volunteer Time Off
              - listitem [ref=f582e72]: Generous Paid Parental Leave
            - paragraph [ref=f582e73]
            - paragraph [ref=f582e74]: "#LI-REMOTE"
            - paragraph [ref=f582e75]
          - generic [ref=f582e77]:
            - generic [ref=f582e80]:
              - paragraph [ref=f582e81]:
                - strong [ref=f582e82]: "Pay Transparency:"
              - paragraph [ref=f582e83]: This job posting may span more than one career level.
              - paragraph [ref=f582e84]:
                - text: In addition to base salary, this job is eligible to receive equity in the form of restricted stock units, and depending on the position offered, it may also be eligible to receive a commission. Additionally, Reddit offers a wide range of benefits to U.S.-based employees, including medical, dental, and vision insurance, 401(k) program with employer match, generous time off for vacation, and parental leave. To learn more, please visit
                - link "https://www.redditinc.com/careers/" [ref=f582e85] [cursor=pointer]:
                  - /url: https://www.redditinc.com/careers/
                - text: .
              - paragraph [ref=f582e86]: To provide greater transparency to candidates, we share base salary ranges for all US-based job postings regardless of state. We set standard base pay ranges for all roles based on function, level, and country location, benchmarked against similar stage growth companies. Final offer amounts are determined by multiple factors including, skills, depth of work experience and relevant licenses/credentials, and may vary from the amounts listed below.
            - paragraph [ref=f582e87]: "The base salary range for this position is:"
            - paragraph [ref=f582e88]: $217,000 - $303,900 USD
          - generic [ref=f582e89]:
            - paragraph [ref=f582e90]: In select roles and locations, the interviews will be recorded, transcribed and summarized by artificial intelligence (AI). You will have the opportunity to opt out of recording, transcription and summarization prior to any scheduled interviews.
            - paragraph [ref=f582e91]:
              - generic [ref=f582e92]:
                - text: "During the interview, we will collect the following categories of personal information: Identifiers, Professional and Employment-Related Information, Sensory Information (audio/video recording), and any other categories of personal information you choose to share with us. We will use this information to evaluate your application for employment or an independent contractor role, as applicable. We will not sell your personal information or disclose it to any third party for their marketing purposes. We will delete any recording of your interview promptly after making a hiring decision. For more information about how we will handle your personal information, including our retention of it, please refer to our"
                - link "Candidate Privacy Policy for Potential Employees and Contractors" [ref=f582e93] [cursor=pointer]:
                  - /url: https://redditinc.com/policies/candidate-privacy-policy
                - text: .
            - paragraph [ref=f582e94]:
              - emphasis [ref=f582e95]: Reddit is proud to be an equal opportunity employer, and is committed to building a workforce representative of the diverse communities we serve. Reddit is committed to providing reasonable accommodations for qualified individuals with disabilities and disabled veterans in our job application procedures. If, due to a disability, you need an accommodation during the interview process, please let your recruiter know.
