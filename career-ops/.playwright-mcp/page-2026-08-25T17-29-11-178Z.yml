          - generic [ref=f103e39]:
            - heading [level=1] [ref=f103e40]:
              - strong [ref=f103e41]: About Suno
            - paragraph [ref=f103e42]: "We're building the world's first creative entertainment platform, where the entire world can feel the joy and fulfillment of making music. Music is for everyone: Our users include everyone from grandmothers creating songs for their loved ones, to Grammy winners using Suno Studio, our power tool, to make the most popular hits in the world."
            - paragraph [ref=f103e43]: "Building the future of entertainment requires ambition. The pace is fast, the problems are hard, and the work demands ownership and intensity. For the right people, it’s incredibly rewarding: a chance to shape a new medium, work with a small team that cares deeply about quality, make music, drink too much coffee, and build something that millions of people use to express themselves in ways that were never before possible."
            - paragraph [ref=f103e44]: Suno is the fastest growing consumer entertainment company and the leader in AI music. We are backed by leading investors including Bond Capital, Menlo Ventures, Lightspeed Venture Partners, IVP, Forerunner, Union Square Ventures, Alkeon, Quiet, Matrix Partners, Schroders Capital and, NVentures (venture arm of NVIDIA).
            - paragraph [ref=f103e45]
            - heading [level=2] [ref=f103e46]:
              - strong [ref=f103e47]: About the Role
            - paragraph [ref=f103e48]: Finding joy through being creative is inherent in human nature. The Consumer Create team is building experiences to enable users to entertain themselves through their own creativity. We are hiring a data scientist to be a thought leader on this new team. In this high-impact role, you will collaborate with Product, Engineering, and Design to set the product strategy and roadmap for how we grow and measure creative engagement on our mobile app.
            - paragraph [ref=f103e49]
            - heading "What You'll Do" [level=2] [ref=f103e50]
            - list [ref=f103e51]:
              - listitem [ref=f103e52]:
                - paragraph [ref=f103e53]: Partner with product and engineering to shape the roadmap for Mobile Consumer Create, from early ideation through launch
              - listitem [ref=f103e54]:
                - paragraph [ref=f103e55]: Design and run experiments end-to-end that test new ways to make creation on mobile more fun and rewarding
              - listitem [ref=f103e56]:
                - paragraph [ref=f103e57]: Build analyses that surface user behavior patterns and inform how we think about and build for our consumers. Identify the "magic moments" that keep people creating, and the product changes that lead to more of them
              - listitem [ref=f103e58]:
                - paragraph [ref=f103e59]: Establish the metrics and frameworks the team uses to define and measure success
              - listitem [ref=f103e60]:
                - paragraph [ref=f103e61]: Contribute to building strong data foundations as part of our awesome data science team
                - paragraph [ref=f103e62]
            - heading "What You'll Need" [level=2] [ref=f103e63]
            - heading "Must-Haves" [level=3] [ref=f103e64]
            - list [ref=f103e65]:
              - listitem [ref=f103e66]:
                - paragraph [ref=f103e67]: 6–8+ years of experience in data science in consumer tech and mobile apps
              - listitem [ref=f103e68]:
                - paragraph [ref=f103e69]: Advanced proficiency in SQL, Python, and statistical modeling
              - listitem [ref=f103e70]:
                - paragraph [ref=f103e71]: Experience running experiments end-to-end, from design through analysis to shipping decision
              - listitem [ref=f103e72]:
                - paragraph [ref=f103e73]: A user-centric, product-first mindset
              - listitem [ref=f103e74]:
                - paragraph [ref=f103e75]: Excellent communication and collaboration
              - listitem [ref=f103e76]:
                - paragraph [ref=f103e77]: A self-starter mentality with the ability to thrive in ambiguity, eagerness to wear multiple hats, and passion for continuous learning
              - listitem [ref=f103e78]:
                - paragraph [ref=f103e79]: Proficiency with and excitement about using and building AI tools
            - heading "Nice-to-Haves" [level=3] [ref=f103e80]
            - list [ref=f103e81]:
              - listitem [ref=f103e82]:
                - paragraph [ref=f103e83]: Musician or creative hobbyist — genuine empathy for the people using the product
              - listitem [ref=f103e84]:
                - paragraph [ref=f103e85]: Experience partnering with early-stage or 0-to-1 product teams
              - listitem [ref=f103e86]:
                - paragraph [ref=f103e87]: Familiarity with mobile-specific analytics and attribution tooling
                - paragraph [ref=f103e88]
            - heading "Work Location Policy" [level=2] [ref=f103e89]
            - paragraph [ref=f103e90]: This role is expected to work from the designated Suno office 5 days a week, per Suno's company policy. Full-time employees will receive competitive equity packages, and comprehensive benefits. The actual base salary offered may vary depending on location, skills, qualifications, and experience.
            - heading "Additional Notes" [level=2] [ref=f103e92]
            - paragraph [ref=f103e93]: Applicants must be eligible to work in the US.
            - heading "Perks & Benefits for Full-Time Employees" [level=2] [ref=f103e95]
            - list [ref=f103e96]:
              - listitem [ref=f103e97]:
                - paragraph [ref=f103e98]: Company Equity Package
              - listitem [ref=f103e99]:
