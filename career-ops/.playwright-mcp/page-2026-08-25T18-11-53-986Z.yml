        - generic [ref=f627e21]:
          - generic [ref=f627e28]:
            - text: Reddit is a community of communities. It’s built on shared interests, passion, and trust, and is home to the most open and authentic conversations on the internet. Every day, Reddit users submit, vote, and comment on the topics they care most about. With 100,000+ active communities and approximately 130 million daily active unique visitors, Reddit is one of the internet’s largest sources of information. For more information, visit
            - link "www.redditinc.com" [ref=f627e29] [cursor=pointer]:
              - /url: http://www.redditinc.com/
            - text: .
          - generic [ref=f627e30]:
            - paragraph [ref=f627e31]:
              - strong [ref=f627e32]: "Location:"
              - text: "Reddit has a flexible first workforce. Don't live near our office? No worries: you can work remotely from anywhere in the UK or the Netherlands."
            - paragraph [ref=f627e33]:
              - strong [ref=f627e34]: Team Overview
            - paragraph [ref=f627e35]: We’re building a scalable feature platform that powers Ads ML by making high-quality features and training datasets easy to build, share, and maintain. Our small but growing team works on projects like batch & realtime feature management platform, training set generation platform, sequence features platform and, agentic and automated ML workflows for feature lifecycle management.
            - paragraph [ref=f627e36]: We are looking for an engineer with experience in building high-scale data infrastructure and exposure to ML platforms to help evolve and scale our feature management systems.
            - paragraph [ref=f627e37]: This is not a pure ML modeling role. The ideal candidate is excited about building reliable infrastructure, data pipelines, and developer-facing tools that make ML engineers more productive.
            - paragraph [ref=f627e38]:
              - strong [ref=f627e39]: What You’ll Do
            - list [ref=f627e40]:
              - listitem [ref=f627e41]: Design and build data infrastructure that supports large-scale feature and training set computation, transformation, and storage.
              - listitem [ref=f627e42]: Develop frameworks for batch and real-time features with a focus on reliability, scalability, and ease of use.
              - listitem [ref=f627e43]: Build platform capabilities for feature governance, including lineage tracking, validation, drift detection, anomaly monitoring, reproducibility, and versioning
              - listitem [ref=f627e44]: Partner with ML engineers to ensure smooth integration of feature engineering workflows into ML production systems.
              - listitem [ref=f627e45]: Build systems that support agentic ML workflows, including automated feature discovery, feature quality evaluation and feature lifecycle management
              - listitem [ref=f627e46]: Contribute to operational excellence through observability, performance tuning, reliability engineering, and cost optimization initiatives.
            - paragraph [ref=f627e47]:
              - strong [ref=f627e48]: What You Bring
            - list [ref=f627e49]:
              - listitem [ref=f627e50]: 3+ years in data infrastructure/platform engineering or ML infrastructure platforms.
              - listitem [ref=f627e51]: Hands-on experience building production services, data pipelines, APIs, workflow systems, or developer tools.
              - listitem [ref=f627e52]: Experience with at least one distributed data or compute system such as Spark, PySpark, Flink, Kafka, Ray, Airflow, Kubernetes, BigQuery, or similar technologies.
              - listitem [ref=f627e53]: Familiarity with ML data workflows such as feature generation, training dataset creation, batch processing, real-time data processing, model training, experimentation, or online serving.
              - listitem [ref=f627e54]: Strong coding skills and ability to write clean, maintainable, well-tested code.
              - listitem [ref=f627e55]: Experience building intelligent automation or agentic workflows for ML systems is a strong plus
              - listitem [ref=f627e56]: Experience with ML infrastructure and MLOps workflows spanning feature engineering, training pipelines, experimentation, model deployment, and online serving is a plus
            - paragraph [ref=f627e57]:
              - strong [ref=f627e58]: "Benefits:"
            - list [ref=f627e59]:
              - listitem [ref=f627e60]: Global Benefit programs that fit your lifestyle, from workspace to professional development to caregiving support
              - listitem [ref=f627e61]: Family Planning Support
              - listitem [ref=f627e62]: Gender-Affirming Care
              - listitem [ref=f627e63]: Mental Health & Coaching Benefits
              - listitem [ref=f627e64]: Private Pension plan with Employer-matching
              - listitem [ref=f627e65]: 100% employer-sponsored group medical plan
              - listitem [ref=f627e66]: Income Replacement Programs
              - listitem [ref=f627e67]: Flexible Vacation & Paid Volunteer Time Off
              - listitem [ref=f627e68]: Generous Paid Parental Leave
          - generic [ref=f627e69]:
            - paragraph [ref=f627e70]: In select roles and locations, the interviews will be recorded, transcribed and summarized by artificial intelligence (AI). You will have the opportunity to opt out of recording, transcription and summarization prior to any scheduled interviews.
            - paragraph [ref=f627e71]:
              - generic [ref=f627e72]:
                - text: "During the interview, we will collect the following categories of personal information: Identifiers, Professional and Employment-Related Information, Sensory Information (audio/video recording), and any other categories of personal information you choose to share with us. We will use this information to evaluate your application for employment or an independent contractor role, as applicable. We will not sell your personal information or disclose it to any third party for their marketing purposes. We will delete any recording of your interview promptly after making a hiring decision. For more information about how we will handle your personal information, including our retention of it, please refer to our"
                - link "Candidate Privacy Policy for Potential Employees and Contractors" [ref=f627e73] [cursor=pointer]:
                  - /url: https://redditinc.com/policies/candidate-privacy-policy
                - text: .
            - paragraph [ref=f627e74]:
