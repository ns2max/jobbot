        - generic [ref=f163e20]:
          - generic [ref=f163e21]:
            - paragraph [ref=f163e22]:
              - text: Grafana Labs, the company behind the open observability cloud, is founded on the principles of open source, open standards, open ecosystems, and open culture. Grafana Cloud, our fully managed observability platform, is flexible and built for scale. With Grafana Cloud's actually useful AI, organizations can see, understand, and act on all their disparate data to move at the speed of their ambitions. Today, more than 35 million users and 7,000+ customers – including Anthropic, Bloomberg, NVIDIA, Microsoft, and Salesforce – trust Grafana Labs to ensure reliability of their applications and systems, resolve incidents quickly, and optimize their telemetry to reduce noise and cost. We are a 100% remote company with 1,600+ team members across 40+ countries, and we’re backed by leading investors including Lightspeed Venture Partners, Sequoia Capital, GIC, Coatue, J.P. Morgan, CapitalG, and Lead Edge Capital. Learn more at
              - link "grafana.com" [ref=f163e25] [cursor=pointer]:
                - /url: http://grafana.com
              - text: and follow us on
              - link "LinkedIn" [ref=f163e28] [cursor=pointer]:
                - /url: https://www.linkedin.com/company/grafana-labs/
              - text: and
              - link "X" [ref=f163e31] [cursor=pointer]:
                - /url: https://twitter.com/grafana
              - text: .
            - paragraph [ref=f163e32]: "We’re scaling fast and staying true to what makes us different: an open-source legacy, a global collaborative culture, and a passion for meaningful work. Our team thrives in an innovation-driven environment where transparency, autonomy, and trust fuel everything we do."
            - paragraph [ref=f163e33]: You may not meet every requirement, and that’s okay. If this role excites you, we’d love you to raise your hand for what could be a truly career-defining opportunity.
          - generic [ref=f163e34]:
            - heading "Senior ML Engineer Recommender Systems, Developer Advocacy | Germany | Remote" [level=3] [ref=f163e35]
            - paragraph [ref=f163e36]: This is a fully remote position and we're considering candidates in Germany.
            - paragraph [ref=f163e37]:
              - strong [ref=f163e38]: "The Opportunity:"
            - paragraph [ref=f163e39]: Grafana Labs is building an Interactive Learning system, an open source, in-product learning experience that helps users learn and succeed without leaving Grafana. A central part of that vision is a personalized recommendation system that helps each user discover the next guide, action, or product experience most likely to help them succeed.
            - paragraph [ref=f163e40]: Today, the Interactive Learning tool includes a rule-based recommendation engine that provides useful contextual recommendations. We are hiring an ML Engineer to lead its evolution into an increasingly personalized, continuously improving system driven by real-time product behavior, content metadata, customer context, and experimentation.
            - paragraph [ref=f163e41]: This is an applied product data science role. You will personally build, deploy, and operate recommendation models, design experiments, establish evaluation methodology, and define the scientific roadmap. You will partner closely with software engineers who own the production recommender codebase and with an existing Data Analyst who supports measurement, instrumentation, and analysis across Developer Advocacy.
            - paragraph [ref=f163e42]:
              - strong [ref=f163e43]: "What You’ll Be Doing:"
            - paragraph [ref=f163e44]: The long-term vision is ambitious, but we do not expect it to arrive in one release. We are looking for someone who can understand the whole problem, establish strong foundations, and ship measurable improvements into the existing recommender one iteration at a time.
            - list [ref=f163e45]:
              - listitem [ref=f163e46]:
                - strong [ref=f163e47]: Evolve the Interactive Learning Plugin's recommendation system
              - list [ref=f163e48]:
                - listitem [ref=f163e49]: Develop increasingly personalized approaches to candidate selection, ranking, sequencing, and next-best-action recommendations.
                - listitem [ref=f163e50]: You’ll own a real-time recommendation service
              - listitem [ref=f163e51]:
                - strong [ref=f163e52]: Build and operate applied models
              - list [ref=f163e53]:
                - listitem [ref=f163e54]: Develop, validate, version, monitor, and iterate on models used by the recommendation system.
                - listitem [ref=f163e55]: You’ll own model training & serving
              - listitem [ref=f163e56]:
                - strong [ref=f163e57]: Define what recommendation quality means
              - list [ref=f163e58]:
                - listitem [ref=f163e59]: Develop offline, online, and longitudinal measures of recommendation performance.
                - listitem [ref=f163e60]: You’ll own feature pipelines, monitoring of the model and architecture
              - listitem [ref=f163e61]:
                - strong [ref=f163e62]: Ship incremental improvements
              - list [ref=f163e63]:
                - listitem [ref=f163e64]: Use the data and infrastructure available today while identifying the instrumentation and platform capabilities needed tomorrow.
                - listitem [ref=f163e65]: Integrate improvements into the existing recommender rather than waiting for a complete replacement system.
              - listitem [ref=f163e66]:
                - strong [ref=f163e67]: Partner across disciplines
              - list [ref=f163e68]:
                - listitem [ref=f163e69]: Work closely with software engineers & data analysts to productionize models and integrate them safely into the recommender service.
                - listitem [ref=f163e70]: Partner with the Product Analytics team on metric definitions, instrumentation, data quality, dashboards, and experiment analysis.
                - listitem [ref=f163e71]: Collaborate with Developer Advocacy, Docs, Product, Engineering, GTM, and other teams to translate ambiguous needs into testable hypotheses and measurable product decisions.
                - listitem [ref=f163e72]: Explain modeling choices, tradeoffs, uncertainty, and results clearly to both technical and non-technical audiences.
            - paragraph [ref=f163e73]:
              - strong [ref=f163e74]: "What Makes You a Great Fit:"
            - paragraph [ref=f163e75]: We know it is rare to find everything. Strong candidates should demonstrate credible ability across all three core areas below and be particularly strong in at least two.
            - list [ref=f163e76]:
              - listitem [ref=f163e77]:
                - strong [ref=f163e78]: Recommendation and personalization science
                - text: ": you have built recommendation, ranking, search, matching, propensity, or next-best-action systems. You are comfortable beginning with simple, explainable approaches when they are the best way to learn."
              - listitem [ref=f163e79]:
                - strong [ref=f163e80]: HTTP/gRPC, streaming, Go/TypeScript previous experience in distributed systems
              - listitem [ref=f163e81]:
                - strong [ref=f163e82]: Applied model ownership
                - text: . You have personally built, validated, monitored, and iterated on models used in a product or operational environment. You can work effectively in version-controlled codebases and collaborate with engineers on production implementation.
            - paragraph [ref=f163e83]: You should also be a strong product thinker and technical communicator. You can take an ambitious and ambiguous objective, identify the most important unknowns, and create a sequence of models and experiments that steadily improves the product.
            - paragraph [ref=f163e84]:
              - strong [ref=f163e85]: "Bonus Points For:"
            - list [ref=f163e86]:
              - listitem [ref=f163e87]: Experience with content, education, onboarding, or learning recommendation systems
              - listitem [ref=f163e88]: Experience with SaaS product telemetry and customer-account data
              - listitem [ref=f163e89]: Experience using warehouse-scale behavioral data
              - listitem [ref=f163e90]: Experience with directed graphs, sequence models, or prerequisite-aware recommendations
              - listitem [ref=f163e91]: Experience with contextual bandits or other exploration strategies
              - listitem [ref=f163e92]: Familiarity with Grafana or the broader observability ecosystem
              - listitem [ref=f163e93]: Experience with open source software or transparent development practices
              - listitem [ref=f163e94]: Experience working with privacy, fairness, explainability, or responsible personalization constraints
            - paragraph [ref=f163e95]:
              - strong [ref=f163e96]: "Compensation & Rewards:"
            - paragraph [ref=f163e97]:
              - emphasis [ref=f163e98]:
                - emphasis [ref=f163e99]: In Germany, the base compensation range for this role is EUR 97,034 - EUR 116,441. Actual compensation may vary based on level, experience, and skillset as assessed throughout the interview process. All of our roles include Restricted Stock Units (RSUs), giving every team member ownership in Grafana Labs' success. We believe in shared outcomes—RSUs help us stay aligned and invested as we scale globally.
          - generic [ref=f163e100]:
