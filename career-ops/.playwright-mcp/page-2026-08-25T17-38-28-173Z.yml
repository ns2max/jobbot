                  - emphasis [ref=f163e129]: "*We will comply with local legislation where applicable."
              - paragraph [ref=f163e130]:
                - strong [ref=f163e131]: "Equal Opportunity Employer:"
                - emphasis [ref=f163e132]: Grafana Labs is an equal opportunities employer. We welcome applications from everyone regardless of race, colour, nationality, origin, caste, sex, gender reassignment identity or expression, sexual orientation, age, religion or belief, disability, veteran status, genetic information, pregnancy, maternity, marital, family or carer status, or any other characteristic which is protected by local law. We believe that equality and diversity build a strong organisation, and we work hard to ensure that is the foundation of our organisation as we grow.
              - paragraph [ref=f163e133]:
                - emphasis [ref=f163e134]: Grafana Labs may utilize AI tools in its recruitment process to assist in matching information provided in CVs to job postings. The recruitment team will continue to review inbound CVs manually to identify alignment with current openings.
