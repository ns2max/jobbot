    - generic [ref=f605e27]:
      - generic [ref=f605e28]:
        - paragraph [ref=f605e29]: At Toyota Research Institute (TRI), we’re on a mission to improve the quality of human life. We’re developing new tools and capabilities to amplify the human experience. To lead this transformative shift in mobility, we’ve built a world-class team advancing the state of the art in AI, robotics, driving, and material sciences.
        - strong [ref=f605e32]: The Vision
        - generic [ref=f605e33]: "We envision a future with robots that help people in our real environments with interactions that allow robots to understand, adapt, and grow with us. We believe that robots should and will work well alongside people: helping where wanted, and ultimately enabling people to spend more time on the activities they enjoy most. To achieve this, robots need to be able to operate reliably in messy, unstructured environments. We must also create robots that people can understand, collaborate with, and rely on."
        - generic [ref=f605e34]:
          - strong
          - strong [ref=f605e35]: The Team
        - generic [ref=f605e36]: Our goal is to revolutionize the field of robotics, enabling long-horizon dexterous behaviors to be efficiently taught, learned, and improved over time in diverse, real-world environments with people.Our team has deep cross-functional expertise across hardware, simulation, perception, controls, and machine learning. We measure our success in terms of fundamental capabilities development, as well as research impact via open-source software and publications. Come join us and let’s make general-purpose robots a reality.
        - link "Some of our ongoing work is highlighted here." [ref=f605e39] [cursor=pointer]:
          - /url: https://youtu.be/DeLpnTgzJT4?si=bSrRj45GlmCKHXUD
        - generic [ref=f605e40]:
          - strong
          - strong [ref=f605e41]: The Opportunity
        - generic [ref=f605e42]: We’re looking for a driven researcher with a “make it happen” mentality. The ideal candidate is able to operate independently when needed, but works well as part of a larger integrated group at the cutting edge of state-of-the-art robotics and machine learning. If our mission of revolutionizing robotics through machine learning resonates with you, get in touch and let’s talk about how we can create the next generation of AI-powered capable robots together!
      - generic [ref=f605e45]:
        - heading "Responsibilities" [level=3] [ref=f605e46]
        - list [ref=f605e50]:
          - listitem [ref=f605e51]: Work as part of a dynamic, closely-knit research team building useful robots and general-purpose robot foundation models.
          - listitem [ref=f605e52]: Implement, extend, and create state-of-the-art methods for robot behavior learning from a mixture of interactive embodied data and online data sources.
          - listitem [ref=f605e53]: Design and implement high-performance machine-learning pipelines and optimize data and learning stacks for scalability, efficiency, and performance.
          - listitem [ref=f605e54]: Be a key member of the team and play a critical role in rapid progress measured by both the development of internal capabilities and high-impact external publication.
          - listitem [ref=f605e55]: Collaborate with internal research scientists and our partner labs at top academic research universities including MIT, Stanford, Berkeley, CMU, Columbia, and Princeton to drive pioneering research at scale.
      - generic [ref=f605e57]:
        - heading "Qualifications" [level=3] [ref=f605e58]
        - list [ref=f605e62]:
          - listitem [ref=f605e63]: PhD in computer science, machine learning, robotics, or a closely related field.
          - listitem [ref=f605e64]: Experience training large models and deploying them on embodied systems, particularly toward robotic manipulation.
          - listitem [ref=f605e65]: Strong software development skills in Python, familiarity with mixed C++/Python codebases, and a focus on clean, maintainable code.
          - listitem [ref=f605e66]: Extensive practical experience with Machine Learning using a major framework such as PyTorch or TensorFlow. Familiarity with data pipelines, model serving and optimization, cloud training, and dataset management.
          - listitem [ref=f605e67]: Strong understanding of the state-of-the-art in robot learning, including generative models (e.g., diffusion policy, flow matching), reinforcement learning, and/or world models.
          - listitem [ref=f605e68]: Practical experience with robots and the system integration challenges inherent in conducting research and deploying onto physical hardware platforms.
          - listitem [ref=f605e69]: An ability to move fast and switch between modes of rapid prototyping and robust implementation as required.
          - listitem [ref=f605e70]: A strong track record of impact, either via first author research publications at top-tier machine learning or robotics conferences (RSS, NeurIPS, ICML, CoRL, ICRA, IROS, …), or via meaningful contributions to successful industry initiatives.
      - generic [ref=f605e72]:
        - heading "Bonus Qualifications" [level=3] [ref=f605e73]
        - list [ref=f605e76]:
          - listitem [ref=f605e77]: Experience in robotics and machine learning research or related projects in an industry setting.
          - listitem [ref=f605e78]: Experience with robotic middleware such as ROS 2 and common communication methods and protocols.
          - listitem [ref=f605e79]: Experience with modern ML infrastructure pipelines, approaches, and tools.
          - listitem [ref=f605e80]: Experience with VR-based teleoperation for real-time robot control.
          - listitem [ref=f605e81]: "Background or familiarity with some of the following: motion control and actuation, whole-body control, reinforcement learning, robot teleoperation methods, common communication protocols, research robotic arms/systems, visual perception and depth sensors, machine learning, robotic simulation, force and tactile sensing systems, haptic interfaces."
      - generic [ref=f605e82]:
        - emphasis [ref=f605e84]: The pay range for this position at commencement of employment is expected to be between $180,000 and $258,750/year for Massachusetts-based roles. Base pay offered will depend on multiple individualized factors, including, but not limited to, a candidate's experience, skills, job-related knowledge, and market location. TRI offers a generous benefits package including medical, dental, and vision insurance, 401(k) eligibility, paid time off benefits (including vacation, sick time, and parental leave), and an annual cash bonus structure. Additional details regarding these benefit plans will be provided if an employee receives an offer of employment.
