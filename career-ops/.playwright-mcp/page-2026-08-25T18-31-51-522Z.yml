    - main [ref=f835e62]:
      - generic [ref=f835e63]:
        - generic [ref=f835e64]:
          - generic [ref=f835e65]:
            - generic [ref=f835e71]: AI Job Summary
            - button "About AI Job Summary" [ref=f835e72] [cursor=pointer]
          - list [ref=f835e78]:
            - listitem [ref=f835e79]: • Completion of a graduate program (M.Sc/Ph.D) in CS, Bioinformatics, Computational Biology or related fields.
            - listitem [ref=f835e80]: • Proficient in Python and related libraries/toolkits.
            - listitem [ref=f835e81]: • Must be legally eligible to work in Canada.
          - button "Sign up or log in to analyse my fit" [ref=f835e83] [cursor=pointer]
        - generic [ref=f835e88]:
          - heading "Role Type" [level=3] [ref=f835e89]
          - generic [ref=f835e90]: Contract • Full-time • Entry Level
        - generic [ref=f835e91]:
          - heading "Description" [level=3] [ref=f835e92]
          - generic [ref=f835e93]:
            - paragraph [ref=f835e94]:
              - emphasis [ref=f835e95]: “If you are looking to develop a transcriptomic-based ML model for precision oncology, this is a great opportunity. Join a team of ML scientists and domain experts to leverage molecular diagnostics for personalized patient care.”
            - paragraph [ref=f835e96]: – Anjana Puliyanda, Machine Learning Scientist
            - heading [level=2] [ref=f835e97]:
              - strong [ref=f835e98]: About the Role
            - paragraph [ref=f835e99]: This is a paid residency that will be undertaken over a twelve-month period with the potential to be hired by our client afterwards. The Resident will be reporting to an Amii Scientist and regularly consult with the Client team to share insights and engage in knowledge transfer activities.
            - heading [level=2] [ref=f835e100]:
              - strong [ref=f835e101]: About our Client
            - paragraph [ref=f835e102]: Qualisure Diagnostics is a Calgary-based precision oncology company redefining how molecular diagnostics are developed, deployed, and scaled. Founded by clinician-scientists and engineers, it sits at the intersection of cancer biology, artificial intelligence, and health system implementation, with a mission to advance diagnostic biomarkers for personalized patient care across the world. We encourage you to visit their website to learn more (https://qualisuredx.com/).
            - heading [level=2] [ref=f835e103]:
              - strong [ref=f835e104]: About the Project
            - paragraph [ref=f835e105]:
              - text: As the ML Resident on this project, you’ll build a proof-of-concept foundation model for bulk RNA sequencing data that produces stable, biologically faithful representations which stay invariant to
              - emphasis [ref=f835e106]: how
              - text: the data was generated. The goal is a model where equivalent biology yields equivalent outputs, regardless of the upstream workflow, while preserving the gene–gene relationships, pathway activity, and disease signatures that downstream clinical tasks depend on.
            - heading [level=2] [ref=f835e107]:
              - strong [ref=f835e108]: Required Skills / Expertise
            - paragraph [ref=f835e109]: We are looking for a talented and enthusiastic resident with strong knowledge of machine learning, and working experience in bioinformatics.
            - heading [level=2] [ref=f835e110]:
              - strong [ref=f835e111]: "Key responsibilities:"
            - list [ref=f835e112]:
              - listitem [ref=f835e113]: Work with large-scale heterogeneous transcriptomic datasets.
              - listitem [ref=f835e114]: Build, train, and evaluate ML/DL models for contrastive and adversarial tasks.
              - listitem [ref=f835e115]: Undertake applied research on ML techniques to address the limitations in existing models.
              - listitem [ref=f835e116]: Translate scientific code into working solutions.
              - listitem [ref=f835e117]: Collaborate with cross-functional teams to develop minimum viable products (MVPs) and client-centric solutions.
              - listitem [ref=f835e118]: Engage in regular client meetings, contributing to presentations and reports on project progress.
              - listitem [ref=f835e119]: Optimize ML pipelines to ensure efficiency, scalability, and real-time processing capabilities.
            - heading [level=2] [ref=f835e120]:
              - strong [ref=f835e121]: "Requirements:"
            - list [ref=f835e122]:
              - listitem [ref=f835e123]: Completion of a graduate level program (M.Sc/Ph.D) in Computer Science, Bioinformatics, Computational Biology or related fields.
              - listitem [ref=f835e124]: Research and/or applied project experience in foundation AI models for biology.
              - listitem [ref=f835e125]: Proficient in Python programming language and related libraries and toolkits.
              - listitem [ref=f835e126]: Proficient in bash scripting and working with HPC clusters.
              - listitem [ref=f835e127]: A positive attitude towards learning and understanding a new applied domain.
              - listitem [ref=f835e128]: Must be legally eligible to work in Canada.
            - heading [level=2] [ref=f835e129]:
              - strong [ref=f835e130]: "Assets / Nice to Haves:"
            - list [ref=f835e131]:
              - listitem [ref=f835e132]: Experience working with NGS technologies for RNA-seq.
              - listitem [ref=f835e133]: Publication record in peer-reviewed academic conferences or relevant journals.
              - listitem [ref=f835e134]: Knowledge and experience in designing experimental frameworks for large datasets.
            - heading [level=2] [ref=f835e135]:
              - strong [ref=f835e136]: "Non-technical requirements:"
            - list [ref=f835e137]:
              - listitem [ref=f835e138]: Interdisciplinary team player enthusiastic about working together to achieve excellence.
              - listitem [ref=f835e139]: Capable of critical and independent thought.
              - listitem [ref=f835e140]: Able to communicate technical concepts clearly and advise on the application of machine learning.
              - listitem [ref=f835e141]: Intellectual curiosity and the desire to learn new things, techniques, and technologies.
            - heading [level=2] [ref=f835e142]:
              - strong [ref=f835e143]: Why You Should Apply
            - paragraph [ref=f835e144]: "Besides gaining industry experience, additional perks include:"
            - list [ref=f835e145]:
              - listitem [ref=f835e146]: Working under the mentorship of an Amii Scientist for the duration of the project.
              - listitem [ref=f835e147]: Participating in professional development activities.
              - listitem [ref=f835e148]: Gaining access to the Amii community and events.
              - listitem [ref=f835e149]: Building your professional network.
              - listitem [ref=f835e150]: The opportunity for an ongoing machine learning role at the client’s organization at the end of the term (at the client’s discretion)
            - heading [level=2] [ref=f835e151]:
              - strong [ref=f835e152]: About Amii
            - paragraph [ref=f835e153]: One of Canada’s three main institutes for artificial intelligence (AI) and machine learning, our world-renowned researchers drive fundamental and applied research at the University of Alberta (and other academic institutions), training some of the world’s top scientific talent. Our cross-functional teams work collaboratively with Alberta-based businesses and organizations to build AI capacity and translate scientific advancement into industry adoption and economic impact.
            - heading [level=2] [ref=f835e154]:
              - strong [ref=f835e155]: How to Apply
            - paragraph [ref=f835e156]:
              - text: If this sounds like the opportunity you’ve been waiting for, please don’t wait for the closing August 25, 2026 to apply – we’re excited to add a new member to the Amii team for this role, and the posting may come down sooner than the closing date if we find the right candidate before the posting closes! When sending your application, please send your
              - strong [ref=f835e157]: resume and cover letter
              - text: indicating why you think you’d be a fit for Amii. In your cover letter, please include one professional accomplishment you are most proud of and why.
            - paragraph
            - paragraph [ref=f835e158]:
              - strong [ref=f835e159]: Applicants must be legally eligible to work in Canada at the time of application.
            - paragraph:
              - strong
            - paragraph [ref=f835e160]: Amii is an equal opportunity employer and values a diverse workforce. We encourage applications from all qualified individuals without regard to ethnicity, religion, gender identity, sexual orientation, age or disability. Accommodations for disability-related needs throughout the recruitment and selection process are available upon request. Any information provided by you for accommodations will be kept confidential and won’t be used in the selection process.
