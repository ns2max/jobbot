              - paragraph [ref=f358e464]: We are a federal contractor or subcontractor. The law requires us to provide equal employment opportunity to qualified people with disabilities. We have a goal of having at least 7% of our workers as people with disabilities. The law says we must measure our progress towards this goal. To do this, we must ask applicants and employees if they have a disability or have ever had one. People can become disabled, so we need to ask this question at least every five years.
              - paragraph [ref=f358e465]:
                - text: Completing this form is voluntary, and we hope that you will choose to do so. Your answer is confidential. No one who makes hiring decisions will see it. Your decision to complete the form and your answer will not harm you in any way. If you want to learn more about the law or this form, visit the U.S. Department of Labor’s Office of Federal Contract Compliance Programs (OFCCP) website at
                - link "www.dol.gov/ofccp" [ref=f358e466] [cursor=pointer]:
                  - /url: https://www.dol.gov/ofccp
                - text: .
              - strong [ref=f358e467]: How do you know if you have a disability?
              - paragraph [ref=f358e468]:
                - text: A disability is a condition that substantially limits one or more of your “major life activities.” If you have or have ever had such a condition, you are a person with a disability.
                - strong [ref=f358e469]: "Disabilities include, but are not limited to:"
              - list [ref=f358e470]:
                - listitem [ref=f358e471]: Alcohol or other substance use disorder (not currently using drugs illegally)
                - listitem [ref=f358e472]: Autoimmune disorder, for example, lupus, fibromyalgia, rheumatoid arthritis, HIV/AIDS
                - listitem [ref=f358e473]: Blind or low vision
                - listitem [ref=f358e474]: Cancer (past or present)
                - listitem [ref=f358e475]: Cardiovascular or heart disease
                - listitem [ref=f358e476]: Celiac disease
                - listitem [ref=f358e477]: Cerebral palsy
                - listitem [ref=f358e478]: Deaf or serious difficulty hearing
                - listitem [ref=f358e479]: Diabetes
                - listitem [ref=f358e480]: Disfigurement, for example, disfigurement caused by burns, wounds, accidents, or congenital disorders
                - listitem [ref=f358e481]: Epilepsy or other seizure disorder
                - listitem [ref=f358e482]: Gastrointestinal disorders, for example, Crohn's Disease, irritable bowel syndrome
                - listitem [ref=f358e483]: Intellectual or developmental disability
                - listitem [ref=f358e484]: Mental health conditions, for example, depression, bipolar disorder, anxiety disorder, schizophrenia, PTSD
                - listitem [ref=f358e485]: Missing limbs or partially missing limbs
                - listitem [ref=f358e486]: Mobility impairment, benefiting from the use of a wheelchair, scooter, walker, leg brace(s) and/or other supports
                - listitem [ref=f358e487]: Nervous system condition, for example, migraine headaches, Parkinson’s disease, multiple sclerosis (MS)
                - listitem [ref=f358e488]: Neurodivergence, for example, attention-deficit/hyperactivity disorder (ADHD), autism spectrum disorder, dyslexia, dyspraxia, other learning disabilities
                - listitem [ref=f358e489]: Partial or complete paralysis (any cause)
                - listitem [ref=f358e490]: Pulmonary or respiratory conditions, for example, tuberculosis, asthma, emphysema
                - listitem [ref=f358e491]: Short stature (dwarfism)
                - listitem [ref=f358e492]: Traumatic brain injury
