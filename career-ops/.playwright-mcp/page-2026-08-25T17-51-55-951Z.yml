        - generic [ref=f358e20]:
          - generic [ref=f358e21]:
            - heading [level=2] [ref=f358e22]:
              - strong [ref=f358e23]: About Anthropic
            - paragraph [ref=f358e24]: Anthropic’s mission is to create reliable, interpretable, and steerable AI systems. We want AI to be safe and beneficial for our users and for society as a whole. Our team is a quickly growing group of committed researchers, engineers, policy experts, and business leaders working together to build beneficial AI systems.
          - generic [ref=f358e25]:
            - heading [level=2] [ref=f358e26]:
              - strong [ref=f358e27]: About the role
            - paragraph [ref=f358e28]: The Cloud Inference team scales and optimizes Claude to serve the massive audiences of developers and enterprise companies across AWS, GCP, Azure, and future cloud service providers (CSPs). We own the end-to-end product of Claude on each cloud platform, from API integration and intelligent request routing to inference execution, capacity management, and day-to-day operations.
            - paragraph [ref=f358e29]: "Our engineers are extremely high leverage: we simultaneously drive multiple major revenue streams while optimizing one of Anthropic's most precious resources: compute. As we expand to more cloud platforms, the complexity of managing inference efficiently across providers with different hardware, networking stacks, and operational models grows significantly. We need product-minded backend engineers who can navigate these platform differences, design the services and abstractions that work across providers, and make architectural decisions that keep us reliable and cost-effective at massive scale."
            - paragraph [ref=f358e30]: Your work will increase the scale at which our services operate, accelerate our ability to reliably launch new frontier models and innovative features to customers across all platforms, and ensure our LLMs meet rigorous safety, performance, and security standards.
            - heading [level=2] [ref=f358e31]:
              - strong [ref=f358e32]: Key responsibilities
            - list [ref=f358e33]:
              - listitem [ref=f358e34]: Design, build, and own backend services and infrastructure that serve Claude across multiple CSPs, accounting for differences in compute hardware, networking, APIs, and operational models
              - listitem [ref=f358e35]: Work cross-functionally with internal inference, product API, systems, and security teams, among others, and with CSP partners to stand up the full serving stack on new cloud platforms, resolve operational issues, and influence provider roadmaps
              - listitem [ref=f358e36]: Build and evolve CI/CD automation systems, including validation and deployment pipelines, that reliably ship new model versions to millions of users across cloud platforms without regressions
              - listitem [ref=f358e37]: Design interfaces and tooling abstractions across CSPs that enable cost-effective inference management, scale across providers, and reduce per-platform complexity
              - listitem [ref=f358e38]: Contribute to capacity planning, autoscaling, and workload routing strategies that match supply with demand and direct requests to the most cost-effective accelerator and region
              - listitem [ref=f358e39]: Analyze observability data across providers to identify performance bottlenecks, cost anomalies, and regressions, and drive remediation based on real-world production workloads
            - heading [level=2] [ref=f358e40]:
              - strong [ref=f358e41]: Minimum qualifications
            - list [ref=f358e42]:
              - listitem [ref=f358e43]: Have significant software engineering experience, with a strong background in high-performance, large-scale distributed systems serving millions of users
              - listitem [ref=f358e44]: Have experience building or operating services on at least one major cloud platform (AWS, GCP, or Azure), with exposure to Kubernetes, Infrastructure as Code, or container orchestration
              - listitem [ref=f358e45]: Are curious about LLM serving; prior inference or ML experience is not required
              - listitem [ref=f358e46]: Thrive in cross-functional collaboration with both internal teams and external partners
              - listitem [ref=f358e47]: Have experience working with external partners to align goals and deliver impact
              - listitem [ref=f358e48]: Are a fast learner who can quickly ramp up on new technologies, hardware platforms, and provider ecosystems
              - listitem [ref=f358e49]: Are highly autonomous and take ownership of problems end-to-end, including work that falls outside your job description
            - heading [level=2] [ref=f358e50]:
              - strong [ref=f358e51]: Preferred qualifications
            - list [ref=f358e52]:
              - listitem [ref=f358e53]: Direct experience working with CSPs to scale infrastructure or products across multiple platforms, navigating differences in networking, security, privacy, billing, and managed service offerings
              - listitem [ref=f358e54]: Hands-on experience with capacity management, cost optimization, or resource planning at scale across heterogeneous environments
              - listitem [ref=f358e55]: Solid understanding of multi-region deployments, geographic routing, and global traffic management
              - listitem [ref=f358e56]: Proficiency in Python or Rust
