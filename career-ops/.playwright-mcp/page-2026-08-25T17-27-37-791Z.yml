              - strong [ref=f77e466]: Why are you being asked to complete this form?
              - paragraph [ref=f77e467]: We are a federal contractor or subcontractor. The law requires us to provide equal employment opportunity to qualified people with disabilities. We have a goal of having at least 7% of our workers as people with disabilities. The law says we must measure our progress towards this goal. To do this, we must ask applicants and employees if they have a disability or have ever had one. People can become disabled, so we need to ask this question at least every five years.
              - paragraph [ref=f77e468]:
                - text: Completing this form is voluntary, and we hope that you will choose to do so. Your answer is confidential. No one who makes hiring decisions will see it. Your decision to complete the form and your answer will not harm you in any way. If you want to learn more about the law or this form, visit the U.S. Department of Labor’s Office of Federal Contract Compliance Programs (OFCCP) website at
                - link "www.dol.gov/ofccp" [ref=f77e469] [cursor=pointer]:
                  - /url: https://www.dol.gov/ofccp
                - text: .
              - strong [ref=f77e470]: How do you know if you have a disability?
              - paragraph [ref=f77e471]:
                - text: A disability is a condition that substantially limits one or more of your “major life activities.” If you have or have ever had such a condition, you are a person with a disability.
                - strong [ref=f77e472]: "Disabilities include, but are not limited to:"
              - list [ref=f77e473]:
                - listitem [ref=f77e474]: Alcohol or other substance use disorder (not currently using drugs illegally)
                - listitem [ref=f77e475]: Autoimmune disorder, for example, lupus, fibromyalgia, rheumatoid arthritis, HIV/AIDS
                - listitem [ref=f77e476]: Blind or low vision
                - listitem [ref=f77e477]: Cancer (past or present)
                - listitem [ref=f77e478]: Cardiovascular or heart disease
                - listitem [ref=f77e479]: Celiac disease
                - listitem [ref=f77e480]: Cerebral palsy
                - listitem [ref=f77e481]: Deaf or serious difficulty hearing
                - listitem [ref=f77e482]: Diabetes
                - listitem [ref=f77e483]: Disfigurement, for example, disfigurement caused by burns, wounds, accidents, or congenital disorders
                - listitem [ref=f77e484]: Epilepsy or other seizure disorder
                - listitem [ref=f77e485]: Gastrointestinal disorders, for example, Crohn's Disease, irritable bowel syndrome
                - listitem [ref=f77e486]: Intellectual or developmental disability
                - listitem [ref=f77e487]: Mental health conditions, for example, depression, bipolar disorder, anxiety disorder, schizophrenia, PTSD
                - listitem [ref=f77e488]: Missing limbs or partially missing limbs
                - listitem [ref=f77e489]: Mobility impairment, benefiting from the use of a wheelchair, scooter, walker, leg brace(s) and/or other supports
                - listitem [ref=f77e490]: Nervous system condition, for example, migraine headaches, Parkinson’s disease, multiple sclerosis (MS)
                - listitem [ref=f77e491]: Neurodivergence, for example, attention-deficit/hyperactivity disorder (ADHD), autism spectrum disorder, dyslexia, dyspraxia, other learning disabilities
                - listitem [ref=f77e492]: Partial or complete paralysis (any cause)
                - listitem [ref=f77e493]: Pulmonary or respiratory conditions, for example, tuberculosis, asthma, emphysema
                - listitem [ref=f77e494]: Short stature (dwarfism)
                - listitem [ref=f77e495]: Traumatic brain injury
