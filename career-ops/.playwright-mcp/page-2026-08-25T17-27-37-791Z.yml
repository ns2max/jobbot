        - generic [ref=f77e20]:
          - generic [ref=f77e21]:
            - heading [level=2] [ref=f77e22]:
              - strong [ref=f77e23]: About Anthropic
            - paragraph [ref=f77e24]: Anthropic’s mission is to create reliable, interpretable, and steerable AI systems. We want AI to be safe and beneficial for our users and for society as a whole. Our team is a quickly growing group of committed researchers, engineers, policy experts, and business leaders working together to build beneficial AI systems.
          - generic [ref=f77e25]:
            - heading "About the team" [level=2] [ref=f77e26]
            - paragraph [ref=f77e27]: Anthropic's Life Sciences team is building a world-class research group focused on making fundamental biological discoveries. The team combines cutting-edge AI with hands-on biological research, positioning Anthropic at the forefront of AI-accelerated scientific discovery.
            - heading "About the role" [level=2] [ref=f77e28]
            - paragraph [ref=f77e29]: We're seeking an exceptional Research Scientist to join the team. This role combines deep computational biology expertise with frontier AI capabilities, positioning Anthropic at the forefront of AI-driven scientific discovery.
            - paragraph [ref=f77e30]: As one of the first computational members of this Life Sciences research group, you'll work on a high-impact team that operates at the intersection of computational and experimental biology. You'll bring broad computational biology experience to bear across the team's projects, driving discoveries from large-scale computational analysis of biological data through to results our experimental scientists can test, and moving flexibly between problems as the science demands. You'll have substantial access to Claude and you'll help establish how computational biology operates at Anthropic.
            - paragraph [ref=f77e31]: This role offers a unique opportunity to shape how AI transforms biological research. You'll work with some of the world's best AI researchers while tackling problems that matter deeply for scientific understanding and biomedicine. If you're excited about using your computational expertise to make fundamental biological discoveries and guide the development of transformative AI systems, we want to hear from you.
            - heading "Key responsibilities" [level=2] [ref=f77e32]
            - list [ref=f77e33]:
              - listitem [ref=f77e34]: "Build, run, and maintain the analysis pipelines that back the team's experimental programs: sequence analysis at petabyte scale, structural bioinformatics, phylogenetic and comparative genomics, design and analysis of high-throughput functional screens, biological sequence modeling, etc."
              - listitem [ref=f77e35]: Partner directly with experimental biologists to design experiments that produce high-quality data, and turn results around fast enough to immediately inform the next experiment
              - listitem [ref=f77e36]: Draw on the literature and curated biological knowledge bases alongside primary data to generate and prioritize hypotheses for experimental follow-up
              - listitem [ref=f77e37]: "Stand up and maintain the team's computational infrastructure: data ingestion, workflow orchestration, internal databases, and the interfaces that make all of it accessible to both researchers and AI agents"
              - listitem [ref=f77e38]: Use Claude and our internal agent frameworks heavily in your own work, and feed what you learn back to the model-improvement and product teams as evaluations, datasets, and concrete failure cases
              - listitem [ref=f77e39]: Pick up analyses across projects as priorities shift; we're looking for breadth and flexibility over a single deep specialty
            - heading "Minimum qualifications" [level=2] [ref=f77e40]
            - list [ref=f77e41]:
              - listitem [ref=f77e42]: Have a PhD in computational biology, bioinformatics, genomics, biophysics, machine learning, computer science, or a related quantitative or biological field, or equivalent industry research experience
              - listitem [ref=f77e43]: Have a track record of computational biology research you have led end to end, from question to result, with evidence of impact (for example publications, preprints, released datasets or tools, or research that changed a program's direction)
              - listitem [ref=f77e44]: Have demonstrated breadth across multiple areas of computational biology
              - listitem [ref=f77e45]: Are proficient in one or more programming languages used in scientific computing and comfortable working on large datasets in Linux and cloud compute environments
              - listitem [ref=f77e46]: Can take an ambiguous biological question, scope the analysis, and produce a result an experimentalist can act on
              - listitem [ref=f77e47]: Communicate computational results clearly to both biologists and ML researchers
            - heading "Preferred qualifications" [level=2] [ref=f77e48]
            - list [ref=f77e49]:
              - listitem [ref=f77e50]: Are comfortable navigating ambiguity and developing solutions in rapidly evolving research environments
              - listitem [ref=f77e51]: Are results-oriented, with a bias towards flexibility and impact
              - listitem [ref=f77e52]: Hands-on experience in experimental biology, or a track record of designing experiments side by side with experimentalists
              - listitem [ref=f77e53]: Experience building tools, pipelines, or agentic systems on top of LLMs, or training models on biological sequence data
              - listitem [ref=f77e54]: Deep expertise in one or two areas of computational biology (for example structural biology, metagenomics, single-cell genomics, or protein design) on top of the required breadth
