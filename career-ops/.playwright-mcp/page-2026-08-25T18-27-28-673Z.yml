    - main [ref=f685e62]:
      - generic [ref=f685e63]:
        - generic [ref=f685e64]:
          - generic [ref=f685e65]:
            - generic [ref=f685e71]: AI Job Summary
            - button "About AI Job Summary" [ref=f685e72] [cursor=pointer]
          - list [ref=f685e78]:
            - listitem [ref=f685e79]: • Completion of a Computer Science (or related) MSc or PhD.
            - listitem [ref=f685e80]: • Proficient in developing, fine-tuning, and evaluating ML/deep neural models in PyTorch.
            - listitem [ref=f685e81]: • Strong understanding of transformer architectures and LLMs (attention, tokenization, decoding, context, failure modes).
          - button "Sign up or log in to analyse my fit" [ref=f685e83] [cursor=pointer]
        - generic [ref=f685e88]:
          - heading "Role Type" [level=3] [ref=f685e89]
          - generic [ref=f685e90]: Contract • Full-time • Entry Level
        - generic [ref=f685e91]:
          - heading "Description" [level=3] [ref=f685e92]
          - generic [ref=f685e93]:
            - paragraph [ref=f685e94]: “If you are interested in the application of machine learning and NLP to improve acute care wait lists through automated clinical decision support, this is the right opportunity for you. Join a team of research and machine learning scientists building AI-driven rule creation pipelines from the ground up and get mentored by some of the best minds in AI during the process.”
            - paragraph [ref=f685e95]: – Kunwar Saaim, Machine Learning Scientist, Amii
            - paragraph [ref=f685e96]
            - heading [level=2] [ref=f685e97]:
              - strong [ref=f685e98]: About the Role
            - paragraph [ref=f685e99]: "This is a paid residency that will be undertaken over a 12-month period with the potential to be hired by our client, Mobia Health Innovations, afterwards (note: at the discretion of the client). The Resident will report to an Amii Scientist and regularly consult with the client team to share insights and engage in knowledge transfer activities. Successful candidates will be members of a cross-functional project team with backgrounds in ML research, project management, software engineering, and new product development. This is a rare opportunity to be mentored by world-class scientists and to develop something truly impactful."
            - heading [level=2] [ref=f685e100]:
              - strong [ref=f685e101]: About the Client
            - paragraph [ref=f685e102]: Mobia Health Innovations (a spin-off from MOBIA Technology Innovations) combines the expertise of front-line clinicians and digital transformation specialists to address critical technology gaps in healthcare. On a mission to relieve pressure on the healthcare system, Mobia Health designs and implements innovative Software-as-a-Service (SaaS) solutions such as accessNavigator that optimize clinical workflows, eliminate inappropriate waitlists, and improve patient care delivery
            - paragraph [ref=f685e103]
            - heading [level=2] [ref=f685e104]:
              - strong [ref=f685e105]: About the Project
            - paragraph [ref=f685e106]: Mobia Health, in collaboration with Canadian Association of Radiologists (CAR) and numerous healthcare organizations across Canada have identified that a significant number of diagnostic imaging tests can be avoided if published guidelines are automated into the referral process. This directly reduces challenging wait lists for CT and MRI by ensuring patients receive the most appropriate care.
            - paragraph [ref=f685e107]: This project focuses on scaling Mobia Health’s accessNavigator platform to implement guidelines from sources such as CAR by utilizing AI, Machine Learning, and Natural Language Processing to dynamically ingest unstructured healthcare policies and clinical guidelines. In partnership with Amii, the team is building an automated Retrieval-Augmented Generation (RAG) pipeline to extract clinical rules, decision logic, and conditions from evidence-based guidelines—specifically targeting Diagnostic Imaging (MRI and CT scan) referrals and map them into machine-readable JSON platform configurations. By replacing manual setup with automated rule extraction and validation, the project aims to reduce configuration time by 40% to 70%, streamline waitlists, increase clinical referral appropriateness, and provide a graphical user interface for non-technical administrators to manage decision support rules.
            - heading [level=2] [ref=f685e108]:
              - strong [ref=f685e109]: Required Skills / Expertise
            - paragraph [ref=f685e110]: Are you passionate about building great solutions? You’ll be presented with opportunities to both personally and professionally develop as you build your career. We’re looking for a talented and enthusiastic individual with a solid background in machine learning, demonstrated experience with NLP and LLMs, and exposure to healthcare systems or clinical decision-support workflows.
            - heading [level=2] [ref=f685e111]:
              - strong [ref=f685e112]: "Key Responsibilities:"
            - list [ref=f685e113]:
              - listitem [ref=f685e114]: Design, implement, optimize, and evaluate models for information extraction and structured data generation tasks.
              - listitem [ref=f685e115]: Prepare, curate, and preprocess high-quality datasets for training or fine-tuning, and validating models.
              - listitem [ref=f685e116]: Utilize Large Language Models (LLMs), Retrieval-Augmented Generation (RAG), and ML frameworks, tools and open-source libraries to enhance model performance, accelerate workflows, and optimize data processing
              - listitem [ref=f685e117]: Undertake applied research on ML and NLP techniques to address the limitations in existing models.
              - listitem [ref=f685e118]: Optimize ML pipelines for throughput, cost, and reproducibility across batch document-processing workloads.
              - listitem [ref=f685e119]: Implement schema-constrained generation (JSON Schema, Pydantic, function calling or grammar-constrained decoding) together with span-level evidence attribution
              - listitem [ref=f685e120]: Collaborate with the project team and stakeholders to develop MVP and client focused solutions.
              - listitem [ref=f685e121]: Engage in regular client meetings, contributing to presentations and reports on project progress.
              - listitem [ref=f685e122]: To provide AI leadership as part of the cross-functional team and act as a liaison between the Client and Amii experts.
            - heading [level=2] [ref=f685e123]:
              - strong [ref=f685e124]: "Required Qualifications:"
            - list [ref=f685e125]:
              - listitem [ref=f685e126]: Completion of a Computer Science (or a related graduate degree program) MSc. or PhD.
              - listitem [ref=f685e127]: Proficient in developing, fine-tuning, and evaluating machine learning and deep neural network models in PyTorch.
              - listitem [ref=f685e128]: Solid understanding of modern transformer architectures and large language models, including attention, tokenization, decoding strategies, context-window behaviour, and the characteristic failure modes of generative models.
              - listitem [ref=f685e129]: Proficient in Python programming language and related ML frameworks, libraries, and toolkits (e.g., Scikit-learn, PyTorch, LangChain, Pandas, HuggingFace).
              - listitem [ref=f685e130]: "Hands-on experience building LLM-based systems in research or production settings: prompt and context engineering, long-context document processing, structured and constrained output generation, and retrieval systems (embeddings, hybrid search, re-ranking)."
              - listitem [ref=f685e131]: Working knowledge of applied statistics for evaluation.
              - listitem [ref=f685e132]: Familiarity with Linux, Git version control, and writing clean code.
              - listitem [ref=f685e133]: A positive attitude towards learning and understanding a new applied domain .
              - listitem [ref=f685e134]: Must be legally eligible to work in Canada.
            - heading [level=2] [ref=f685e135]:
              - strong [ref=f685e136]: "Preferred Qualifications:"
            - list [ref=f685e137]:
              - listitem [ref=f685e138]: Specialization in predictive health or medical applications is considered an asset.
              - listitem [ref=f685e139]: Familiarity with and hands-on experience with unstructured text data.
              - listitem [ref=f685e140]: Experience serving open-weight LLMs (e.g. vLLM), parameter-efficient fine-tuning (LoRA/QLoRA), and quantization for cost- constrained deployment.
              - listitem [ref=f685e141]: Publication record in peer-reviewed academic conferences or relevant journals in machine learning.
              - listitem [ref=f685e142]: Experience/familiarity with software engineering best practices.
              - listitem [ref=f685e143]: Experience with deploying machine learning models in production environments or strong software engineering (or MLE) skills is a plus.
            - heading [level=2] [ref=f685e144]:
              - strong [ref=f685e145]: "Non-Technical Requirements:"
            - list [ref=f685e146]:
              - listitem [ref=f685e147]: Desire to take ownership of a problem and demonstrate leadership skills.
              - listitem [ref=f685e148]: Interdisciplinary team player enthusiastic about working together to achieve excellence.
              - listitem [ref=f685e149]: Capable of critical and independent thought.
              - listitem [ref=f685e150]: Able to communicate technical concepts clearly and advise on the application of machine intelligence.
              - listitem [ref=f685e151]: Comfortable working in an agile environment and able to pivot as required by project demands
              - listitem [ref=f685e152]: Intellectual curiosity and the desire to learn new things, techniques, and technologies.
            - heading [level=2] [ref=f685e153]:
              - strong [ref=f685e154]: Why You Should Apply
            - paragraph [ref=f685e155]: "Besides gaining industry experience, additional perks include:"
            - list [ref=f685e156]:
              - listitem [ref=f685e157]: Work under the mentorship of an Amii Scientist for the duration of the project
              - listitem [ref=f685e158]: Participate in professional development activities
              - listitem [ref=f685e159]: Gain access to the Amii community and events
              - listitem [ref=f685e160]: Get paid for your work (a fair and equitable rate of pay will be negotiated at the time of offer)
              - listitem [ref=f685e161]: Build your professional network
              - listitem [ref=f685e162]: The opportunity for an ongoing machine learning role at the client’s organization at the end of the term (at the client’s discretion)
            - heading [level=2] [ref=f685e163]:
              - strong [ref=f685e164]: About Amii
            - paragraph [ref=f685e165]: One of Canada’s three main institutes for artificial intelligence (AI) and machine learning, our world-renowned researchers drive fundamental and applied research at the University of Alberta (and other academic institutions), training some of the world’s top scientific talent. Our cross-functional teams work collaboratively with Alberta-based businesses and organizations to build AI capacity and translate scientific advancement into industry adoption and economic impact.
            - heading [level=2] [ref=f685e166]:
              - strong [ref=f685e167]: How to Apply
            - paragraph [ref=f685e168]:
              - text: If this sounds like the opportunity you’ve been waiting for, please don’t wait for the closing September 11, 2026 to apply – we’re excited to add a new member to the Amii team for this role, and the posting may come down sooner than the closing date if we find the right candidate before the posting closes! When sending your application, please send your
              - strong [ref=f685e169]: resume and cover letter
              - text: indicating why you think you’d be a fit for Amii. In your cover letter, please include one professional accomplishment you are most proud of and why.
            - paragraph
            - paragraph [ref=f685e170]:
              - strong [ref=f685e171]: Applicants must be legally eligible to work in Canada at the time of application.
            - paragraph
            - paragraph [ref=f685e172]: Amii is an equal opportunity employer and values a diverse workforce. We encourage applications from all qualified individuals without regard to ethnicity, religion, gender identity, sexual orientation, age or disability. Accommodations for disability-related needs throughout the recruitment and selection process are available upon request. Any information provided by you for accommodations will be kept confidential and won’t be used in the selection process.
            - paragraph [ref=f685e173]
