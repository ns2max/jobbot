          - generic [ref=f135e10]:
            - heading "Senior Manager, Research Scientist" [level=1] [ref=f135e11]
            - generic [ref=f135e12]: San Francisco, CA; New York, NY
          - button "Apply" [ref=f135e16] [cursor=pointer]
        - generic [ref=f135e17]:
          - generic [ref=f135e18]:
            - paragraph [ref=f135e19]: Scale AI accelerates the development of AI systems by providing the data, infrastructure, and tooling that power the most advanced models in the world. Our teams operate at the intersection of cutting-edge research, large-scale engineering, and real-world deployment, partnering with leading frontier labs, enterprises, and government agencies to push Generative AI into new capabilities and applications.
            - paragraph [ref=f135e20]: As AI rapidly evolves from static models to dynamic, agentic systems, Scale is building the foundational research, evaluation methodologies, and agent/RL infrastructure that will define this next era. You’ll join a high-impact research organization driving advances in large-language models, post-training, evaluation, and agentic/RL environments, helping shape how next-generation AI is built, measured, and deployed.
            - paragraph [ref=f135e21]: As a Research Scientist Manager, you will lead a world-class team of research scientists and engineers, define the research roadmap, and drive execution from early prototyping to deployment. You’ll thrive in a fast-moving environment, balancing deep technical leadership with people management, vision setting, and delivery.
            - heading [level=3] [ref=f135e22]:
              - strong [ref=f135e23]: "You will:"
            - list [ref=f135e24]:
              - listitem [ref=f135e25]: Lead, mentor and grow a team of research scientists and engineers working on GenAI research initiatives (e.g., evaluation, post-training, agents, RL environments).
              - listitem [ref=f135e26]: "Define and drive a multi-year research roadmap: identify key scientific questions, set milestones, allocate resources, and ensure rigorous execution."
              - listitem [ref=f135e27]: Collaborate cross-functionally with engineering, product, client-facing teams and external academic or industry partners to translate research into components, insights, and actionable outcomes.
              - listitem [ref=f135e28]: "Communicate compellingly: publish research, present at conferences, engage in open-source contributions, and represent the team externally."
              - listitem [ref=f135e29]: "Drive an inclusive, high-performing culture: help your team through technical challenges, provide growth opportunities, and attract top talent."
              - listitem [ref=f135e30]: Stay deeply connected to the research community, understanding major trends, and helping set them.
              - listitem [ref=f135e31]: Thrive in a high-energy, fast-paced startup environment and are ready to dedicate the time and effort needed to drive impactful results.
            - heading [level=3] [ref=f135e32]:
              - strong [ref=f135e33]: "Ideally you'd have:"
            - list [ref=f135e34]:
              - listitem [ref=f135e35]: 5+ years of hands-on research experience (PhD or equivalent preferred) in machine learning, deep learning, generative models, agent/rl systems or related domains.
              - listitem [ref=f135e36]: A strong track record of research excellence, including publications in top-tier ML/AI venues (NeurIPS, ICML, ICLR, ACL, etc.).
              - listitem [ref=f135e37]: Experience and track of recording in landing major research impacts in a fast-paced environment
              - listitem [ref=f135e38]: Experience leading or managing research teams. You’re excited to mentor, coach and develop talent.
              - listitem [ref=f135e39]: Excellent written and verbal communication skills. You are able to articulate research ideas and outcomes to both technical and non-technical stakeholders.
          - generic [ref=f135e41]:
            - paragraph [ref=f135e45]:
              - emphasis [ref=f135e46]: "Compensation packages at Scale for eligible roles include base salary, equity, and benefits. The range displayed on each job posting reflects the minimum and maximum target for new hire salaries for the position and may be inclusive of several career levels at Scale; it will be determined during the interview process based on work location and additional factors, including job-related skills, experience, qualifications, interview performance, and relevant education or training. Scale employees in eligible roles are also granted equity based compensation, subject to Board of Director approval. Your recruiter can share more about the specific salary range for your preferred location during the hiring process, and confirm whether the hired role will be eligible for equity grant. You'll also receive benefits including, but not limited to: comprehensive health, dental and vision coverage, retirement benefits, a learning and development stipend, and generous PTO. Additionally, this role may be eligible for additional benefits such as a commuter stipend."
            - paragraph [ref=f135e47]: "Please reference the job posting's subtitle for where this position will be located. For pay transparency purposes, the base salary range for this full-time position in the locations of San Francisco, New York, Seattle is:"
            - paragraph [ref=f135e48]: $290,400 - $363,000 USD
          - generic [ref=f135e49]:
            - paragraph [ref=f135e50]:
              - strong [ref=f135e51]:
                - emphasis [ref=f135e52]: "PLEASE NOTE:"
              - emphasis [ref=f135e53]: Our policy requires a 90-day waiting period before reconsidering candidates for the same role. This allows us to ensure a fair and thorough evaluation of all applicants.
            - paragraph [ref=f135e54]:
              - strong [ref=f135e55]: "About Us:"
            - paragraph [ref=f135e56]:
              - emphasis [ref=f135e57]: At Scale, our mission is to develop reliable AI systems for the world's most important decisions. Our products provide the high-quality data and full-stack technologies that power the world's leading models, and help enterprises and governments build, deploy, and oversee AI applications that deliver real impact. We work closely with industry leaders like Meta,
              - emphasis [ref=f135e58]: Ernst
              - emphasis [ref=f135e59]
              - emphasis [ref=f135e60]: "&"
              - emphasis [ref=f135e61]: Young, Mayo Clinic, Time Inc., the Government of Qatar, and U.S. government agencies including the Army and Air Force. We are expanding our team to accelerate the development of AI applications.
            - paragraph [ref=f135e62]:
              - emphasis [ref=f135e63]: We believe that everyone should be able to bring their whole selves to work, which is why we are proud to be an inclusive and equal opportunity workplace. We are committed to equal employment opportunity regardless of race, color, ancestry, religion, sex, national origin, sexual orientation, age, citizenship, marital status, disability status, gender identity or Veteran status.
            - paragraph [ref=f135e64]:
              - emphasis [ref=f135e65]: We are committed to working with and providing reasonable accommodations to applicants with physical and mental disabilities. If you need assistance and/or a reasonable accommodation in the application or recruiting process due to a disability, please contact us at accommodations@scale.com. Please see the United States Department of Labor's
              - link [ref=f135e66] [cursor=pointer]:
                - /url: https://www.eeoc.gov/sites/default/files/2023-06/22-088_EEOC_KnowYourRights6.12ScreenRdr.pdf
                - emphasis [ref=f135e67]: Know Your Rights poster
              - emphasis [ref=f135e68]: for additional information.
            - paragraph [ref=f135e69]:
              - emphasis [ref=f135e70]: We comply with the United States Department of Labor's
              - emphasis [ref=f135e71]: Pay Transparency provision
              - emphasis [ref=f135e72]: .
            - paragraph [ref=f135e73]:
              - emphasis [ref=f135e74]:
                - strong [ref=f135e75]: "PLEASE NOTE:"
                - text: We collect, retain and use personal data for our professional business purposes, including notifying you of job opportunities that may be of interest and sharing with our affiliates. We limit the personal data we collect to that which we believe is appropriate and necessary to manage applicants’ needs, provide our services, and comply with applicable laws. Any information we collect in connection with your application will be treated in accordance with our internal policies and programs designed to protect personal data. Please see our
                - link "privacy policy" [ref=f135e76] [cursor=pointer]:
                  - /url: https://scale.com/legal/privacy
                - text: for additional information.
