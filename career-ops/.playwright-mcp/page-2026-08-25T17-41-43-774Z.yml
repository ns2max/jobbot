        - heading "You will…" [level=2] [ref=f262e26]
        - list [ref=f262e27]:
          - listitem [ref=f262e28]:
            - paragraph [ref=f262e29]: Be part of a multidisciplinary team of Research Scientists and Engineers building the content backbone of a best-in-class multi-sensor simulation stack.
          - listitem [ref=f262e30]:
            - paragraph [ref=f262e31]:
              - strong [ref=f262e32]: Architect and own asset pipelines end-to-end
              - text: ": From raw sensor logs all the way into simulation-ready representations (e.g., 3DGS, NeRF, mesh, hybrid), validation, packaging, and serving into Waabi World."
          - listitem [ref=f262e33]:
            - paragraph [ref=f262e34]:
              - strong [ref=f262e35]: Design schemas, formats, and storage
              - text: for a heterogeneous asset library spanning traditional mesh/material assets, neural representations, and generative-model outputs. Ownership of design decisions ranging from formats and compression, to streaming, and cross-renderer interop.
          - listitem [ref=f262e36]:
            - paragraph [ref=f262e37]:
              - strong [ref=f262e38]: Build tooling and visualization
              - text: that lets research scientists, simulation engineers, and technical artists inspect, compare, debug, and curate assets at the scale of tens of thousands of items — including search, similarity, lineage, and regression review.
          - listitem [ref=f262e39]:
            - paragraph [ref=f262e40]:
              - strong [ref=f262e41]: Integrate cutting-edge research into the pipeline
              - text: — collaborate with the neural rendering and generative AI teams to productionize the latest reconstruction, diffusion, and world-model techniques as first-class steps in the asset lifecycle.
          - listitem [ref=f262e42]:
            - paragraph [ref=f262e43]:
              - strong [ref=f262e44]: Collaborate with autonomy and safety teams
              - text: to ensure the asset catalog meets the diversity, realism, and coverage demands of training and closed-loop evaluation.
        - heading "Qualifications:" [level=2] [ref=f262e45]
        - list [ref=f262e46]:
          - listitem [ref=f262e47]:
            - paragraph [ref=f262e48]:
              - strong [ref=f262e49]: Shipping Production Software.
              - text: You have experience reading and developing production-quality software at scale, not just prototypes. You have shipped systems that other engineers and researchers depend on day-to-day.
          - listitem [ref=f262e50]:
            - paragraph [ref=f262e51]:
              - strong [ref=f262e52]: 3D Content Pipelines.
              - text: "You have built or extended large-scale 3D content pipelines — ingestion, processing, validation, versioning, and serving: for graphics, simulation, VFX, games, robotics, or AV. You understand the failure modes that emerge at tens of thousands of assets."
          - listitem [ref=f262e53]:
            - paragraph [ref=f262e54]:
              - strong [ref=f262e55]: Modern 3D Representations.
              - text: "You are fluent across at least several of: traditional mesh/material/PBR, OpenUSD, NeRF, 3D Gaussian Splatting, and procedural/generative content. You understand the trade-offs between paradigms — fidelity, edit-ability, runtime cost, storage, interop, and can make pragmatic choices."
          - listitem [ref=f262e56]:
            - paragraph [ref=f262e57]:
              - strong [ref=f262e58]: Cloud Infrastructure at Scale.
              - text: Experience designing, launching, and debugging GPU jobs in the cloud (AWS, GCP, or equivalent), including job orchestration, cost modeling, and throughput optimization for batch and pipeline workloads.
          - listitem [ref=f262e59]:
            - paragraph [ref=f262e60]:
