              - strong [ref=f65e523]: Why are you being asked to complete this form?
              - paragraph [ref=f65e524]: We are a federal contractor or subcontractor. The law requires us to provide equal employment opportunity to qualified people with disabilities. We have a goal of having at least 7% of our workers as people with disabilities. The law says we must measure our progress towards this goal. To do this, we must ask applicants and employees if they have a disability or have ever had one. People can become disabled, so we need to ask this question at least every five years.
              - paragraph [ref=f65e525]:
                - text: Completing this form is voluntary, and we hope that you will choose to do so. Your answer is confidential. No one who makes hiring decisions will see it. Your decision to complete the form and your answer will not harm you in any way. If you want to learn more about the law or this form, visit the U.S. Department of Labor’s Office of Federal Contract Compliance Programs (OFCCP) website at
                - link "www.dol.gov/ofccp" [ref=f65e526] [cursor=pointer]:
                  - /url: https://www.dol.gov/ofccp
                - text: .
              - strong [ref=f65e527]: How do you know if you have a disability?
              - paragraph [ref=f65e528]:
                - text: A disability is a condition that substantially limits one or more of your “major life activities.” If you have or have ever had such a condition, you are a person with a disability.
                - strong [ref=f65e529]: "Disabilities include, but are not limited to:"
              - list [ref=f65e530]:
                - listitem [ref=f65e531]: Alcohol or other substance use disorder (not currently using drugs illegally)
                - listitem [ref=f65e532]: Autoimmune disorder, for example, lupus, fibromyalgia, rheumatoid arthritis, HIV/AIDS
                - listitem [ref=f65e533]: Blind or low vision
                - listitem [ref=f65e534]: Cancer (past or present)
                - listitem [ref=f65e535]: Cardiovascular or heart disease
                - listitem [ref=f65e536]: Celiac disease
                - listitem [ref=f65e537]: Cerebral palsy
                - listitem [ref=f65e538]: Deaf or serious difficulty hearing
                - listitem [ref=f65e539]: Diabetes
                - listitem [ref=f65e540]: Disfigurement, for example, disfigurement caused by burns, wounds, accidents, or congenital disorders
                - listitem [ref=f65e541]: Epilepsy or other seizure disorder
                - listitem [ref=f65e542]: Gastrointestinal disorders, for example, Crohn's Disease, irritable bowel syndrome
                - listitem [ref=f65e543]: Intellectual or developmental disability
                - listitem [ref=f65e544]: Mental health conditions, for example, depression, bipolar disorder, anxiety disorder, schizophrenia, PTSD
                - listitem [ref=f65e545]: Missing limbs or partially missing limbs
                - listitem [ref=f65e546]: Mobility impairment, benefiting from the use of a wheelchair, scooter, walker, leg brace(s) and/or other supports
                - listitem [ref=f65e547]: Nervous system condition, for example, migraine headaches, Parkinson’s disease, multiple sclerosis (MS)
                - listitem [ref=f65e548]: Neurodivergence, for example, attention-deficit/hyperactivity disorder (ADHD), autism spectrum disorder, dyslexia, dyspraxia, other learning disabilities
                - listitem [ref=f65e549]: Partial or complete paralysis (any cause)
                - listitem [ref=f65e550]: Pulmonary or respiratory conditions, for example, tuberculosis, asthma, emphysema
                - listitem [ref=f65e551]: Short stature (dwarfism)
                - listitem [ref=f65e552]: Traumatic brain injury
