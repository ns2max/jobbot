        - generic [ref=f65e20]:
          - generic [ref=f65e21]:
            - heading [level=2] [ref=f65e22]:
              - strong [ref=f65e23]: About Anthropic
            - paragraph [ref=f65e24]: Anthropic’s mission is to create reliable, interpretable, and steerable AI systems. We want AI to be safe and beneficial for our users and for society as a whole. Our team is a quickly growing group of committed researchers, engineers, policy experts, and business leaders working together to build beneficial AI systems.
          - generic [ref=f65e25]:
            - heading [level=2] [ref=f65e26]:
              - strong [ref=f65e27]: About the role
            - paragraph [ref=f65e28]: We are seeking a Recruiting Research Scientist to join our People Data Solutions team. You’ll be the research expert supporting our Recruiting organization, using rigorous scientific methods to advance our understanding of recruiting funnels, interview effectiveness, candidate experience, and recruiting capacity. This role sits at the intersection of organizational science, behavioral research, and people strategy – developing novel frameworks and conducting systematic research that drives evidence-based people decisions across our growing organization.
            - paragraph [ref=f65e29]: This role offers the opportunity to make a significant impact on both our recruiting practices and the broader field of people science at a leading AI safety company.
            - heading [level=2] [ref=f65e30]:
              - strong [ref=f65e31]: Responsibilities
            - paragraph [ref=f65e32]:
              - strong [ref=f65e33]: Research design & scientific inquiry
            - list [ref=f65e34]:
              - listitem [ref=f65e35]:
                - paragraph [ref=f65e36]: Design and execute systematic research studies to answer fundamental questions about recruiting funnel health, assessment quality, candidate experience, and quality of hire
              - listitem [ref=f65e37]:
                - paragraph [ref=f65e38]: Generate and test hypotheses about sourcing strategies, interview design, and selection decisions using rigorous experimental and quasi-experimental methods
              - listitem [ref=f65e39]:
                - paragraph [ref=f65e40]: Conduct mixed-method research to understand what are the drivers and blockers to recruiting operations.
              - listitem [ref=f65e41]:
                - paragraph [ref=f65e42]: Navigate research ethics considerations when studying candidate data, ensuring responsible research practices
            - paragraph [ref=f65e43]:
              - strong [ref=f65e44]: Selection & assessment research
            - list [ref=f65e45]:
              - listitem [ref=f65e46]:
                - paragraph [ref=f65e47]: Design and execute validation studies to assess the quality of interviews and other selection tools
              - listitem [ref=f65e48]:
                - paragraph [ref=f65e49]: Utilize psychometric techniques to analyze and improve interviewer calibration and rating consistency
              - listitem [ref=f65e50]:
                - paragraph [ref=f65e51]: Lead investigative research into innovative approaches for candidate assessment
            - paragraph [ref=f65e52]:
              - strong [ref=f65e53]: Metrics design and governance
            - list [ref=f65e54]:
              - listitem [ref=f65e55]:
                - paragraph [ref=f65e56]: Design the metrics framework for recruiting org health — defining the canonical KPIs, dimensions, and definitions that leadership uses to understand funnel performance, capacity, and hiring quality
              - listitem [ref=f65e57]:
                - paragraph [ref=f65e58]: Establish the governance and definitional rigor that keeps metrics consistent across tools and reporting surfaces
            - paragraph [ref=f65e59]:
              - strong [ref=f65e60]: Analytical solution building
            - list [ref=f65e61]:
              - listitem [ref=f65e62]:
                - paragraph [ref=f65e63]: Architect analytical solutions that convert research insights into actionable products, empowering stakeholders to execute data-driven scenario and strategic planning
              - listitem [ref=f65e64]:
                - paragraph [ref=f65e65]: Quantify the adoption and downstream impact of deployed tools, driving iterative improvements
            - paragraph [ref=f65e66]:
              - strong [ref=f65e67]: Visualization & communication
            - list [ref=f65e68]:
              - listitem [ref=f65e69]:
                - paragraph [ref=f65e70]: Build compelling visualizations and dashboards that make complex research findings accessible to diverse audiences
              - listitem [ref=f65e71]:
                - paragraph [ref=f65e72]: Present research findings to senior leadership with clear, actionable recommendations
            - heading [level=2] [ref=f65e73]:
              - strong [ref=f65e74]: "Minimum Qualifications:"
            - list [ref=f65e75]:
              - listitem [ref=f65e76]:
                - paragraph [ref=f65e77]: Hold an advanced degree (Master’s or PhD) in I/O Psychology, Organizational Behavior, Statistics, Data Science, Economics, Behavioral Science, or a related research field
              - listitem [ref=f65e78]:
                - paragraph [ref=f65e79]: Have experience with selection research, assessment validation, psychometrics, or recruiting funnel analytics
              - listitem [ref=f65e80]:
                - paragraph [ref=f65e81]: Are comfortable working in the People Analytics tech stack and collaborating with data engineers
              - listitem [ref=f65e82]:
                - paragraph [ref=f65e83]: Are proficient in SQL and Python/R, with experience in statistical analysis and machine learning
              - listitem [ref=f65e84]:
                - paragraph [ref=f65e85]: Have experience with data visualization and can tell compelling stories with research findings
              - listitem [ref=f65e86]:
                - paragraph [ref=f65e87]: Possess excellent communication skills and can influence stakeholders at all levels
              - listitem [ref=f65e88]:
                - paragraph [ref=f65e89]: Thrive in ambiguity and can balance rigor with pragmatism
              - listitem [ref=f65e90]:
                - paragraph [ref=f65e91]: Have a track record of challenging assumptions with data and changing long-held practices
              - listitem [ref=f65e92]:
                - paragraph [ref=f65e93]: Can navigate sensitive topics diplomatically while maintaining analytical rigor
              - listitem [ref=f65e94]:
                - paragraph [ref=f65e95]: Demonstrate intellectual humility and comfort with iterative discovery
              - listitem [ref=f65e96]:
                - paragraph [ref=f65e97]: Use data to improve how organizations find, assess, and hire talent
            - heading [level=2] [ref=f65e98]:
              - strong [ref=f65e99]: "Preferred Qualifications:"
            - list [ref=f65e100]:
              - listitem [ref=f65e101]:
                - paragraph [ref=f65e102]: 5 + years of experience in research, people analytics, or related quantitative fields with demonstrated research methodology expertise
              - listitem [ref=f65e103]:
                - paragraph [ref=f65e104]: Background in recruiting analytics specifically (not just general analytics)
              - listitem [ref=f65e105]:
                - paragraph [ref=f65e106]: Experience running interview or assessment validation studies
              - listitem [ref=f65e107]:
                - paragraph [ref=f65e108]: Experience building self-service analytics tools or dashboards
              - listitem [ref=f65e109]:
                - paragraph [ref=f65e110]: Previous experience in high-growth technology companies or AI/ML organizations
              - listitem [ref=f65e111]:
                - paragraph [ref=f65e112]: Familiarity with network analysis, machine learning, or advanced statistical methods
              - listitem [ref=f65e113]:
                - paragraph [ref=f65e114]: Experience with BigQuery and modern data stack tools
              - listitem [ref=f65e115]:
                - paragraph [ref=f65e116]: Experience with Greenhouse, Gem, ModernLoop, or similar recruiting tools
