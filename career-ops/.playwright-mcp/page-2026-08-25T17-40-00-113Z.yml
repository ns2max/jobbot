            - heading "AI Engineering Manager" [level=2] [ref=f229e54]
            - paragraph [ref=f229e55]: Bengaluru - BLR1
            - paragraph [ref=f229e56]: ID:JR11805 (for internal use only)
          - button "Apply Now" [ref=f229e59] [cursor=pointer]
        - generic [ref=f229e61]:
          - generic [ref=f229e62]:
            - generic [ref=f229e63]:
              - heading "Samsara's Mission" [level=3] [ref=f229e64]
              - paragraph [ref=f229e65]: Improve the safety, efficiency, and sustainability of the operations that power the global economy.
              - link [ref=f229e66] [cursor=pointer]:
                - /url: /blog/the-samsara-culture-playbook
            - generic [ref=f229e70]:
              - generic [ref=f229e71]:
                - paragraph [ref=f229e72]:
                  - strong [ref=f229e74]: Who we are
                - paragraph [ref=f229e75]: "Samsara (NYSE: IOT) is the pioneer of the Connected Operations™ Cloud, which is a platform that enables organizations that depend on physical operations to harness Internet of Things (IoT) data to develop actionable insights and improve their operations. At Samsara, we are helping improve the safety, efficiency and sustainability of the physical operations that power our global economy. Representing more than 40% of global GDP, these industries are the infrastructure of our planet, including agriculture, construction, field services, transportation, and manufacturing — and we are excited to help digitally transform their operations at scale."
                - paragraph [ref=f229e76]: Working at Samsara means you’ll help define the future of physical operations and be on a team that’s shaping an exciting array of product solutions, including Video-Based Safety, Vehicle Telematics, Apps and Driver Workflows, and Equipment Monitoring. As part of a recently public company, you’ll have the autonomy and support to make an impact as we build for the long term.
              - paragraph [ref=f229e77]:
                - strong [ref=f229e78]: ABOUT THE ROLE
              - paragraph [ref=f229e79]: Samsara's Go-To-Market Systems team is building the AI-first infrastructure that powers how one of the world's fastest-growing SaaS companies sells. As Engineering Manager, GTM AI Engineering, you'll lead a team of senior engineers who build and operate the AI orchestration engines, Salesforce/CRM/PRM integrations, and agentic workflows that keep our global sales organization moving.
              - paragraph [ref=f229e80]: "This role is for a hands-on engineering leader — someone who writes code, conducts design reviews, and shapes architecture alongside the team, while also owning the people processes that make a great team great: hiring, career development, performance, and culture. You'll partner closely with Sales Ops, BizTech, Finance, and GTM leadership to translate business ambitions into reliable, scalable engineering roadmaps."
              - paragraph [ref=f229e81]: You'll report to the Sr. Director, Sales Technology Engineering, and serve as the technical and people lead for a team of 4–7 engineers. You'll set the standard — for code quality, architectural thinking, on-call discipline, and how the team shows up in cross-functional conversations.
              - paragraph [ref=f229e82]:
                - strong [ref=f229e83]: YOU SHOULD APPLY IF
              - list [ref=f229e84]:
                - listitem [ref=f229e85]: You thrive at the intersection of hands-on technical leadership and people management — you're equally comfortable in a design review and a 1:1 conversation about career growth
                - listitem [ref=f229e86]: You believe great managers unblock their teams by being technically credible, not by staying out of the code
                - listitem [ref=f229e87]: You've built and shipped production AI systems and know what it takes to take an agentic workflow from prototype to enterprise reliability
                - listitem [ref=f229e88]: You're energized by ambiguity — you can take a fuzzy business need from a VP of Sales and turn it into a concrete engineering roadmap
                - listitem [ref=f229e89]: You care about building an inclusive, high-trust team where engineers grow and do the best work of their careers
              - paragraph [ref=f229e90]:
                - strong [ref=f229e91]: IN THIS ROLE, YOU WILL
              - list [ref=f229e92]:
                - listitem [ref=f229e93]: Lead, hire, and develop a team of 4–7 senior engineers across the full GTM AI systems stack — setting a high bar for technical excellence, collaboration, and delivery
                - listitem [ref=f229e94]: "Stay hands-on: contribute to system architecture, participate in code and design reviews, pair with engineers on complex problems, and own critical technical decisions for the team's most impactful systems"
                - listitem [ref=f229e95]: Own the engineering roadmap for GTM AI systems — partnering with Sales Ops, BizTech, Finance, Legal, and GTM leadership to set priorities, define milestones, and communicate progress
                - listitem [ref=f229e96]: "Drive delivery of AI-first GTM systems: agentic AI pipelines, LLM orchestration layers, Salesforce CPQ integrations, real-time Slack applications, and AWS event-driven architectures"
                - listitem [ref=f229e97]: "Champion engineering quality: establish and uphold standards for code review, testing, observability (distributed tracing, alerting, SLAs), incident response, and documentation"
                - listitem [ref=f229e98]: Create a culture of responsible AI development — ensuring the team follows safe data handling practices, maintains audit trails, and builds human-in-the-loop controls from the start
                - listitem [ref=f229e99]: "Manage team health: run effective 1:1s, give timely and actionable feedback, unblock engineers, resolve conflicts, and advocate for your team's needs within the broader org"
                - listitem [ref=f229e100]: Identify and eliminate systemic sources of friction in GTM workflows — turning recurring manual processes into automated, self-healing systems that scale with the business
                - listitem [ref=f229e101]: Serve as a technical authority in cross-functional conversations — representing the engineering team's perspective to VP- and C-level GTM stakeholders
              - paragraph [ref=f229e102]:
                - strong [ref=f229e103]: MINIMUM REQUIREMENTS
              - list [ref=f229e104]:
                - listitem [ref=f229e105]: 8+ years of software engineering experience, including 2+ years in an engineering management or tech lead role with direct reports
                - listitem [ref=f229e106]: Strong technical depth in Python (production services, async processing, LLM integration) and TypeScript/JavaScript (React, Node.js)
                - listitem [ref=f229e107]: "Hands-on Salesforce platform experience: REST/Bulk/Streaming APIs, SOQL, CPQ/Steelbrick, platform events, and flow automation"
                - listitem [ref=f229e108]: "Solid AWS expertise: Lambda, SQS/SNS/EventBridge, API Gateway, S3, RDS/Aurora, CloudWatch, IAM, and multi-account patterns"
                - listitem [ref=f229e109]: Experience building and deploying LLM-powered systems using OpenAI API, Anthropic API, LangChain, LangGraph, or equivalent agentic frameworks
                - listitem [ref=f229e110]: "Demonstrated ability to lead multi-engineer technical efforts: writing design docs, running design reviews, and defining engineering standards"
                - listitem [ref=f229e111]: "Track record of effective people management: hiring, performance development, and building inclusive team culture"
                - listitem [ref=f229e112]: Strong cross-functional communication skills — able to translate engineering decisions to non-technical business stakeholders
                - listitem [ref=f229e113]: Bachelor's degree in Computer Science, Engineering, or related field, or equivalent practical experience
              - paragraph [ref=f229e114]:
                - strong [ref=f229e115]: AN IDEAL CANDIDATE ALSO HAS
              - list [ref=f229e116]:
                - listitem [ref=f229e117]: Experience designing and operating low-code automation platforms (Workato, MuleSoft, Salesforce Flow) alongside custom-built agentic systems
                - listitem [ref=f229e118]: Background in GTM engineering, RevOps tooling, or sales technology platform development in a high-growth B2B SaaS environment
                - listitem [ref=f229e119]: Familiarity with Model Context Protocol (MCP) or custom tool/function-calling patterns in production agentic systems
                - listitem [ref=f229e120]: "AWS certifications: Solutions Architect Professional or DevOps Engineer Professional"
                - listitem [ref=f229e121]: Experience operating in GovRAMP or FedRAMP-adjacent environments
                - listitem [ref=f229e122]: Prior experience scaling an engineering team through a period of significant organizational or technical growth
              - paragraph [ref=f229e123]: "#LI-hybrid"
              - generic [ref=f229e124]:
                - paragraph [ref=f229e125]:
                  - strong [ref=f229e126]: Total Rewards
                - paragraph [ref=f229e127]:
                  - text: At Samsara, we build for the people who keep the global economy moving. We want owners, not passengers, which is why
                  - link "our rewards" [ref=f229e128] [cursor=pointer]:
                    - /url: https://www.samsara.com/company/careers/benefits
                  - text: are designed to fuel high-impact builders. Our compensation program delivers above-market total compensation through a combination of base salary, performance-based bonus/variable pay, and equity (for eligible roles) in a high-growth public company. We meaningfully differentiate pay for our top performers, who have the opportunity to earn above-market compensation that can outpace the broader market over time.
                - paragraph [ref=f229e129]: "Beyond compensation, we provide the foundations that enable long-term success: a flexible, employee-led remote model, a professional development stipend, comprehensive health and parental leave plans, and more. If you’re ready to build for the long term and own the outcome, your journey starts here."
                - paragraph [ref=f229e130]:
                  - strong [ref=f229e131]: Flexible Working
                - paragraph [ref=f229e132]: At Samsara, we embrace a flexible working model that caters to the diverse needs of our teams. Our offices are open for those who prefer to work in-person and we also support remote work where it aligns with our operational requirements. For certain positions, being close to one of our offices or within a specific geographic area is important to facilitate collaboration, access to resources, or alignment with our service regions. In these cases, the job description will clearly indicate any working location requirements. Our goal is to ensure that all members of our team can contribute effectively, whether they are working on-site, in a hybrid model, or fully remotely. All offers of employment are contingent upon an individual’s ability to secure and maintain the legal right to work at the company and in the specified work location, if applicable.
                - paragraph [ref=f229e133]:
                  - strong [ref=f229e134]: Belonging at Samsara
                - paragraph [ref=f229e135]: At Samsara, we welcome everyone regardless of their background. All qualified applicants will receive consideration for employment without regard to race, color, religion, national origin, sex, gender, gender identity, sexual orientation, protected veteran status, disability, age, and other characteristics protected by law. We depend on the unique approaches of our team members to help us solve complex problems and want to ensure that Samsara is a place where people from all backgrounds can make an impact.
                - paragraph [ref=f229e136]:
                  - strong [ref=f229e137]: Accommodations
                - paragraph [ref=f229e138]:
                  - text: Samsara is an inclusive work environment, and we are committed to ensuring equal opportunity in employment for qualified persons with disabilities. Please email
                  - link "accessibleinterviewing@samsara.com" [ref=f229e139] [cursor=pointer]:
                    - /url: mailto:accessibleinterviewing@samsara.com
                  - text: or
                  - link "click here" [ref=f229e140] [cursor=pointer]:
                    - /url: https://forms.gle/DrM6DFQUiSgfPtCVA
                  - text: if you require any reasonable accommodations throughout the recruiting process.
                - paragraph [ref=f229e141]:
                  - strong [ref=f229e142]: Our Commitment to Authenticity
                - paragraph [ref=f229e143]:
                  - text: We use
                  - link "Tofu" [ref=f229e144] [cursor=pointer]:
                    - /url: https://hiretofu.com/privacyPolicy
                  - text: ", a fraud detection tool, to validate the authenticity of applications and protect against identity fraud. This ensures we are connecting with real people and allows us to prioritize genuine candidates. Please see Samsara’s"
                  - link "Candidate Privacy Notice" [ref=f229e145] [cursor=pointer]:
                    - /url: https://www.samsara.com/legal/candidate-privacy-notice
                  - text: for more information.
                - paragraph [ref=f229e146]:
                  - strong [ref=f229e147]: Fraudulent Employment Offers
                - paragraph [ref=f229e148]:
                  - text: Samsara is aware of scams involving fake job interviews and offers. Please know we do not charge fees to applicants at any stage of the hiring process. Official communication about your application will only come from emails ending in @samsara.com, @us-greenhouse-mail.io or @mail3.guide.co. For more information regarding fraudulent employment offers, please visit our
                  - link "blog post here" [ref=f229e149] [cursor=pointer]:
                    - /url: https://samsara.com/blog/avoiding-fake-job-offers
                  - text: .
