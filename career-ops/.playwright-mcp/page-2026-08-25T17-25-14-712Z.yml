            - heading "Staff Software Engineer, Inference / Compute Infrastructure Engineering" [level=1] [ref=f27e11]
            - generic [ref=f27e12]: San Francisco
          - button "Apply" [ref=f27e16] [cursor=pointer]
        - generic [ref=f27e18]:
          - paragraph [ref=f27e19]:
            - strong [ref=f27e20]: About the Role
          - paragraph [ref=f27e21]:
            - text: We're looking for a Software Engineer to build the systems that treat infrastructure as software. This role owns the software state machines that provision hardware, bring it into service, and manage its full lifecycle — turning racks of GPUs into
            - strong [ref=f27e22]: running inference clusters
            - text: "without a human touching a runbook. The Research and Inference team is your customer: today they file tickets and wait; the target state is that they issue a single API call to stand up, scale, or tear down a cluster, and the system takes care of the rest. The platform is manifest-driven such that teams declare the desired state of a cluster or host — shape, topology, software stack — and the system is responsible for reconciling reality to that manifest, continuously, through every stage of its lifecycle. You will design the engines that manifest the schema, the engines that execute against it, and the workflows that carry a piece of hardware or a cluster from one state to the next—taking it from bare metal to a fully functioning AI cluster for training or inference."
          - paragraph [ref=f27e23]: You'll write production code which is typed, tested, versioned, and deployed through CI/CD that models infrastructure state and reconciles it, the same way a Kubernetes controller reconciles a cluster's desired state. Success looks like eliminating manual provisioning work, not documenting it better.
          - paragraph [ref=f27e24]:
            - text: A product mindset - you've built internal platforms or APIs consumed by other engineering teams and care about the developer experience of what you ship.
            - strong [ref=f27e25]: You build it, you own it.
            - text: You are not only responsible for delivering the software but also for operating and supporting it in production.
          - paragraph [ref=f27e26]:
            - strong [ref=f27e27]: Responsibilities
          - list [ref=f27e28]:
            - listitem [ref=f27e29]:
              - strong [ref=f27e30]: "Build the provisioning state machine:"
              - text: design and implement the software that models the full lifecycle of a physical host from discovery, inference bring-up to GPU driver/CUDA stack, health validation, and decommission/RMA — as explicit, versioned states and transitions.
            - listitem [ref=f27e31]:
              - strong [ref=f27e32]: "Build the self-service API:"
              - text: design declarative APIs and a control plane so the inference team can request, scale, and tear down inference clusters with one API call — no ticket, no human in the loop.
            - listitem [ref=f27e33]:
              - strong [ref=f27e34]: "Automate self-healing:"
              - text: detect degraded or failed nodes, drain them safely, trigger repair or replacement, and reintroduce healthy capacity into the pool automatically.
            - listitem [ref=f27e35]:
              - strong [ref=f27e36]: "Own reliability of the pipeline:"
              - text: idempotency, retries, rollback, and drift detection so the provisioning system is as dependable as any other production service.
            - listitem [ref=f27e37]:
              - strong [ref=f27e38]: "Partner with the inference/ML platform team:"
              - text: understand the cluster shapes they need — topology, interconnect, scheduling constraints — and encode them as first-class abstractions in the platform.
            - listitem [ref=f27e39]:
              - strong [ref=f27e40]: "Engineer it like software:"
              - text: strong typing, automated tests, code review, versioning, and CI/CD for infrastructure code — this is a product, not a collection of Ansible playbooks.
          - paragraph [ref=f27e41]:
            - strong [ref=f27e42]: Requirements
          - paragraph [ref=f27e43]: "Core requirements (all levels):"
          - list [ref=f27e44]:
            - listitem [ref=f27e45]: Strong software engineering background in Go, Python, Rust, or similar — you write and test real software for a living.
            - listitem [ref=f27e46]: Experience with durable workflow orchestration tools such as Temporal, Cadence, or equivalent to run long-lived, manifest-driven workflows that survive failures and resume mid-execution.
            - listitem [ref=f27e47]: Experience building software control planes or orchestration systems that model state and reconcile it over time (e.g., Kubernetes controllers/operators, custom reconciliation loops, workflow engines).
            - listitem [ref=f27e48]: Experience with event-driven systems — designing and building software around message queues, event streams, or pub/sub (e.g., Kafka, NATS, SQS) rather than polling or cron-driven scripts.
            - listitem [ref=f27e49]: A product mindset. You’ve built internal platforms or APIs consumed by other engineering teams and care about the developer experience of what you ship.
          - paragraph [ref=f27e50]: "Nice to have:"
          - list [ref=f27e51]:
            - listitem [ref=f27e52]: Exposure to bare-metal provisioning (PXE/iPXE, Redfish/IPMI, BMC) and/or networking fundamentals (VLANs, BGP, fabric design), or GPU/accelerator infrastructure.
            - listitem [ref=f27e53]: Experience with GPU cluster software stacks (NCCL, CUDA, InfiniBand/RoCE).
            - listitem [ref=f27e54]: Prior work at a hyperscaler, GPU cloud, or datacenter-scale infrastructure organization.
            - listitem [ref=f27e55]: Systems programming in Rust or Go.
          - paragraph [ref=f27e56]:
            - strong [ref=f27e57]: About Together AI
          - paragraph [ref=f27e58]: Together AI is a research-driven artificial intelligence company. We believe open and transparent AI systems will drive innovation and create the best outcomes for society, and together we are on a mission to significantly lower the cost of modern AI systems by co-designing software, hardware, algorithms, and models. We have contributed to leading open-source research, models, and datasets to advance the frontier of AI, and our team has been behind technological advancement such as FlashAttention, Hyena, FlexGen, and RedPajama. We invite you to join a passionate group of researchers and engineers in our journey in building the next generation AI infrastructure.
          - paragraph [ref=f27e59]:
            - strong [ref=f27e60]: Compensation
          - paragraph [ref=f27e61]: "We offer competitive compensation, startup equity, health insurance and other competitive benefits. The US base salary range for this full-time position is: $240,000 - $280,000 + equity + benefits. Our salary ranges are determined by location, level and role. Individual compensation will be determined by experience, skills, and job-related knowledge."
          - paragraph [ref=f27e62]:
            - strong [ref=f27e63]: Equal Opportunity
          - paragraph [ref=f27e64]: Together AI is an Equal Opportunity Employer and is proud to offer equal employment opportunity to everyone regardless of race, color, ancestry, religion, sex, national origin, sexual orientation, age, citizenship, marital status, disability, gender identity, veteran status, and more.
