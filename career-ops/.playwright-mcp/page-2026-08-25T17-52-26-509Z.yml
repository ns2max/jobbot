        - tabpanel "Overview" [ref=f368e40]:
          - generic [ref=f368e41]:
            - paragraph [ref=f368e42]: Voice AI that resolves, not transfers.Most phone systems trap callers in menus and scripts. Vapi is the platform for deploying voice agents that know your business and can listen, adapt, and resolve in minutes.
            - list [ref=f368e43]:
              - listitem [ref=f368e44]:
                - paragraph [ref=f368e45]:
                  - strong [ref=f368e46]: "The numbers:"
                  - text: 1 billion calls. 1 million developers. 10x enterprise ARR growth
              - listitem [ref=f368e47]:
                - paragraph [ref=f368e48]:
                  - strong [ref=f368e49]: "The customers:"
                  - text: Amazon Ring, ServiceTitan, New York Life, Intuit, Kavak, and thousands more, from YC startups to the Fortune 500
              - listitem [ref=f368e50]:
                - paragraph [ref=f368e51]:
                  - strong [ref=f368e52]: "The news:"
                  - text: "a $50M Series B led by Peak XV Partners, with Bessemer Venture Partners, Kleiner Perkins, M12 (Microsoft's Venture Fund), Y Combinator, and our earlier backers. Total raised: $72M"
            - paragraph [ref=f368e53]
            - heading [level=2] [ref=f368e54]:
              - strong [ref=f368e55]: "Why We’re Hiring This Role:"
            - list [ref=f368e56]:
              - listitem [ref=f368e57]:
                - paragraph [ref=f368e58]: 99.99% call completion is the number this role drives. Vapi runs live phone calls — a p99 spike means callers drop. We’ve had 15 stability-gap outages worth learning from, and we need someone who runs incident command, owns SLOs and error budgets, and builds the reliability culture from scratch.
              - listitem [ref=f368e59]:
                - paragraph [ref=f368e60]: "This is not a bash-and-YAML role. You’ll ship code (Go or TypeScript) for services that monitor and manage the platform: auto-remediation, capacity forecasters, oncall tooling. Capacity planning, load testing, and KEDA-based autoscaling for Vapi’s wscaler and workerpool-cron-scaler are on your plate."
            - heading [level=2] [ref=f368e61]:
              - strong [ref=f368e62]: "What You’ll Do:"
            - list [ref=f368e63]:
              - listitem [ref=f368e64]:
                - paragraph [ref=f368e65]:
                  - strong [ref=f368e66]: 30 Day
                  - text: ": Join the oncall rotation. Walk the 15 stability-gap incidents and turn the patterns into a prioritized reliability backlog. Define the first set of SLOs for the call-completion path."
              - listitem [ref=f368e67]:
                - paragraph [ref=f368e68]:
                  - strong [ref=f368e69]: 60 Day
                  - text: ": Stand up error budgets and SLO-based alerting in Chronosphere/Prometheus for the highest-impact services. Run the first proper load test against provider rate limits and per-org concurrency. Tune autoscaling for wscaler / workerpool-cron-scaler."
              - listitem [ref=f368e70]:
                - paragraph [ref=f368e71]:
                  - strong [ref=f368e72]: 90 Day
                  - text: ": Ship a real platform service — capacity forecaster, auto-remediation, or oncall tooling — in Go or TypeScript. Own the postmortem process. Drive a measurable improvement in p99 call completion or MTTR."
            - heading [level=2] [ref=f368e73]:
              - strong [ref=f368e74]: "Who You Are:"
            - paragraph [ref=f368e75]:
              - emphasis [ref=f368e76]:
                - strong [ref=f368e77]: Must-haves
            - list [ref=f368e78]:
              - listitem [ref=f368e79]:
                - paragraph [ref=f368e80]: You’ve run incident command and postmortem discipline at scale on a real oncall rotation.
              - listitem [ref=f368e81]:
                - paragraph [ref=f368e82]: You’ve operated SLOs and error budgets in Chronosphere, Prometheus, Grafana, or Datadog.
              - listitem [ref=f368e83]:
                - paragraph [ref=f368e84]: You’ve done capacity planning and load testing for production systems with real users.
              - listitem [ref=f368e85]:
                - paragraph [ref=f368e86]: "You’re fluent in Kubernetes production ops: pod crash diagnosis, HPA/VPA tuning, PodDisruptionBudgets, graceful shutdown."
              - listitem [ref=f368e87]:
                - paragraph [ref=f368e88]: You know backpressure and autoscaling patterns — KEDA, custom metrics scaling.
            - paragraph [ref=f368e89]:
              - emphasis [ref=f368e90]:
                - strong [ref=f368e91]: Nice-to-haves
            - list [ref=f368e92]:
              - listitem [ref=f368e93]:
                - paragraph [ref=f368e94]: You ship code, not just scripts. You can build platform services in Go or TypeScript (matches Vapi’s cluster-manager, database-health, wscaler, incidentManager).
              - listitem [ref=f368e95]:
                - paragraph [ref=f368e96]: Real-time / latency-sensitive product background where degraded means a dropped call, not a slow dashboard.
            - paragraph [ref=f368e97]:
              - emphasis [ref=f368e98]:
                - strong [ref=f368e99]: Tech stack you’ll work in
            - list [ref=f368e100]:
              - listitem [ref=f368e101]:
                - paragraph [ref=f368e102]: "Languages: Go and TypeScript (you ship code, not just scripts), Bash."
              - listitem [ref=f368e103]:
                - paragraph [ref=f368e104]: "Observability: Chronosphere, Prometheus, Grafana, Datadog, OpenTelemetry."
              - listitem [ref=f368e105]:
                - paragraph [ref=f368e106]: "Orchestration: Kubernetes on EKS — production ops (HPA/VPA tuning, PodDisruptionBudgets, graceful shutdown, pod crash diagnosis)."
              - listitem [ref=f368e107]:
                - paragraph [ref=f368e108]: "Autoscaling and backpressure: KEDA, custom metrics scaling (matches Vapi’s wscaler and workerpool-cron-scaler)."
              - listitem [ref=f368e109]:
                - paragraph [ref=f368e110]: "Load testing: script-based load testing, provider rate-limit auditing, per-org concurrency auditing."
              - listitem [ref=f368e111]:
                - paragraph [ref=f368e112]: "Vapi services you’ll touch or build: cluster-manager, database-health, wscaler, incidentManager."
            - paragraph [ref=f368e113]:
              - emphasis [ref=f368e114]:
                - strong [ref=f368e115]: Where you likely come from
            - list [ref=f368e116]:
              - listitem [ref=f368e117]:
                - paragraph [ref=f368e118]: A real-time / latency-sensitive product (Discord, Zoom, Mux, Twitch, Twilio, LiveKit, Cloudflare, a trading firm, a gaming backend), or a FAANG SRE / Production Engineer (Google, Uber, Twitter/X, Meta) who misses being hands-on.
              - listitem [ref=f368e119]:
                - paragraph [ref=f368e120]: "Weak fit: SRE from analytics or CRM backends where “degraded” means a slow dashboard, not a dropped call. Anyone uncomfortable reading or writing code."
