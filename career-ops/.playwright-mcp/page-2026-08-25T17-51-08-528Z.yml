        - generic [ref=f340e20]:
          - generic [ref=f340e21]:
            - heading [level=2] [ref=f340e22]:
              - strong [ref=f340e23]: About Anthropic
            - paragraph [ref=f340e24]: Anthropic’s mission is to create reliable, interpretable, and steerable AI systems. We want AI to be safe and beneficial for our users and for society as a whole. Our team is a quickly growing group of committed researchers, engineers, policy experts, and business leaders working together to build beneficial AI systems.
          - generic [ref=f340e25]:
            - heading [level=2] [ref=f340e26]:
              - strong [ref=f340e27]: About the role
            - paragraph [ref=f340e28]: How do we know whether a model is safe - and how do we know whether the systems we built to catch misuse actually catch it?
            - paragraph [ref=f340e29]: Anthropic answers both questions with evaluations. We measure model behavior across misuse, prompt injection, and user well-being to inform training and deployment decisions. We also use AI to investigate potential misuse of Claude, analyzing real-world traffic to surface bad actors and emerging threats that drive enforcement actions. Neither is worth much unless the evaluations behind them are representative, robust, and trustworthy.
            - paragraph [ref=f340e30]: This role builds the methods and infrastructure that make them so. Sitting at the intersection of applied ML research and engineering, you'll design experiments to improve how we evaluate both model behavior and the agentic systems that govern it, build datasets that represent real abuse rather than clean approximations of it, and ship those methods into the pipelines that gate model training, agent changes, and launch decisions.
            - heading [level=2] [ref=f340e31]:
              - strong [ref=f340e32]: Responsibilities
            - paragraph [ref=f340e33]:
              - strong [ref=f340e34]: Evaluation research and methodology.
              - text: Design and run experiments to improve evaluation quality — developing methods to generate representative test data, simulate realistic user behavior, and validate grading accuracy. Research how different factors (multi-turn conversations, tools, long context, user diversity) impact model safety behavior. Analyze evaluation coverage to identify measurement gaps, and evolve evals so they remain unsaturated and high-signal as model and agent capabilities advance.
            - paragraph [ref=f340e35]:
              - strong [ref=f340e36]: Agentic investigation evals.
              - text: Build and own the evaluation harness for an agentic investigation system — defining metrics, test cases, and grading approaches for a complex, long-horizon agent. Measure agent performance end-to-end (detection precision and recall, investigation quality, robustness) and drive hill-climbing on the hardest harm areas. Construct RL environments to improve Claude's safety investigation capabilities.
            - paragraph [ref=f340e37]:
              - strong [ref=f340e38]: Datasets grounded in real harm.
              - text: Construct high-quality eval datasets representing real-world misuse across harm areas such as cyber attacks, bio weapons, and influence operations, drawing from both real traffic patterns and synthetic generation. Collaborate with Policy and Enforcement to translate observed harm patterns into measurable evaluations.
            - paragraph [ref=f340e39]:
              - strong [ref=f340e40]: Productionization and tooling.
              - text: Ship successful research into evaluation, regression, and release pipelines that run during model training, on every agent change, prompt update, and underlying model upgrade, and beyond launch. Build tooling that enables policy experts to author, run, and iterate on evaluations without engineering support. Surface findings to research and training teams to drive upstream model improvements.
            - heading [level=2] [ref=f340e41]:
              - strong [ref=f340e42]: Minimum qualifications
            - list [ref=f340e43]:
              - listitem [ref=f340e44]: 8+ years of industry software engineering or ML engineering experience
              - listitem [ref=f340e45]: Experience building and maintaining data pipelines
              - listitem [ref=f340e46]: Experience working with LLMs and a working understanding of their capabilities and failure modes — especially agentic systems with tool use and multi-step reasoning
              - listitem [ref=f340e47]: Strong data analysis skills — you can draw reliable insights from large datasets
              - listitem [ref=f340e48]: Ability to move fluidly between research prototyping and production-quality code
              - listitem [ref=f340e49]: Ability to translate ambiguous problems into concrete, testable experiments
              - listitem [ref=f340e50]: Care deeply about AI safety and want your work to have real impact
            - heading [level=2] [ref=f340e51]:
              - strong [ref=f340e52]: Preferred qualifications
            - list [ref=f340e53]:
              - listitem [ref=f340e54]: Expertise in building or contributing to LLM or agent evaluation frameworks, benchmarks, or automated grading systems
              - listitem [ref=f340e55]: Extensive experience in trust and safety, content moderation, or abuse detection systems
              - listitem [ref=f340e56]: Experience in red teaming, adversarial testing, or jailbreak research on AI systems
              - listitem [ref=f340e57]: Experience with synthetic data generation or data augmentation
              - listitem [ref=f340e58]: Experience with distributed systems or large-scale data processing
              - listitem [ref=f340e59]: Experience with prompt engineering or building LLM-powered applications
