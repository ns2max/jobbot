              - generic [ref=f340e485]:
                - generic [ref=f340e486]:
                  - generic [ref=f340e487]: Form CC-305
                  - generic [ref=f340e488]: Page 1 of 1
                - generic [ref=f340e489]:
                  - generic [ref=f340e490]: OMB Control Number 1250-0005
                  - generic [ref=f340e491]: Expires 07/31/2029
              - strong [ref=f340e492]: Why are you being asked to complete this form?
              - paragraph [ref=f340e493]: We are a federal contractor or subcontractor. The law requires us to provide equal employment opportunity to qualified people with disabilities. We have a goal of having at least 7% of our workers as people with disabilities. The law says we must measure our progress towards this goal. To do this, we must ask applicants and employees if they have a disability or have ever had one. People can become disabled, so we need to ask this question at least every five years.
              - paragraph [ref=f340e494]:
                - text: Completing this form is voluntary, and we hope that you will choose to do so. Your answer is confidential. No one who makes hiring decisions will see it. Your decision to complete the form and your answer will not harm you in any way. If you want to learn more about the law or this form, visit the U.S. Department of Labor’s Office of Federal Contract Compliance Programs (OFCCP) website at
                - link "www.dol.gov/ofccp" [ref=f340e495] [cursor=pointer]:
                  - /url: https://www.dol.gov/ofccp
                - text: .
              - strong [ref=f340e496]: How do you know if you have a disability?
              - paragraph [ref=f340e497]:
                - text: A disability is a condition that substantially limits one or more of your “major life activities.” If you have or have ever had such a condition, you are a person with a disability.
                - strong [ref=f340e498]: "Disabilities include, but are not limited to:"
              - list [ref=f340e499]:
                - listitem [ref=f340e500]: Alcohol or other substance use disorder (not currently using drugs illegally)
                - listitem [ref=f340e501]: Autoimmune disorder, for example, lupus, fibromyalgia, rheumatoid arthritis, HIV/AIDS
                - listitem [ref=f340e502]: Blind or low vision
                - listitem [ref=f340e503]: Cancer (past or present)
                - listitem [ref=f340e504]: Cardiovascular or heart disease
                - listitem [ref=f340e505]: Celiac disease
                - listitem [ref=f340e506]: Cerebral palsy
                - listitem [ref=f340e507]: Deaf or serious difficulty hearing
                - listitem [ref=f340e508]: Diabetes
                - listitem [ref=f340e509]: Disfigurement, for example, disfigurement caused by burns, wounds, accidents, or congenital disorders
                - listitem [ref=f340e510]: Epilepsy or other seizure disorder
                - listitem [ref=f340e511]: Gastrointestinal disorders, for example, Crohn's Disease, irritable bowel syndrome
                - listitem [ref=f340e512]: Intellectual or developmental disability
                - listitem [ref=f340e513]: Mental health conditions, for example, depression, bipolar disorder, anxiety disorder, schizophrenia, PTSD
                - listitem [ref=f340e514]: Missing limbs or partially missing limbs
                - listitem [ref=f340e515]: Mobility impairment, benefiting from the use of a wheelchair, scooter, walker, leg brace(s) and/or other supports
                - listitem [ref=f340e516]: Nervous system condition, for example, migraine headaches, Parkinson’s disease, multiple sclerosis (MS)
                - listitem [ref=f340e517]: Neurodivergence, for example, attention-deficit/hyperactivity disorder (ADHD), autism spectrum disorder, dyslexia, dyspraxia, other learning disabilities
                - listitem [ref=f340e518]: Partial or complete paralysis (any cause)
                - listitem [ref=f340e519]: Pulmonary or respiratory conditions, for example, tuberculosis, asthma, emphysema
                - listitem [ref=f340e520]: Short stature (dwarfism)
                - listitem [ref=f340e521]: Traumatic brain injury
