    - generic [ref=f780e55]:
      - 'heading "Machine Learning Resident – Client: ZeroKey (12 month term)" [level=1] [ref=f780e56]'
      - generic [ref=f780e58]:
        - text: at
        - link "Alberta Machine Intelligence Institute" [ref=f780e59] [cursor=pointer]:
          - /url: https://employmenthero.com/en-ca/jobs/organisations/alberta-machine-intelligence-institute/
      - generic [ref=f780e60]: Edmonton, Alberta, Canada • Full-time
    - main [ref=f780e61]:
      - generic [ref=f780e62]:
        - generic [ref=f780e63]:
          - heading "Role Type" [level=3] [ref=f780e64]
          - generic [ref=f780e65]: Contract • Full-time • Entry Level
        - generic [ref=f780e66]:
          - heading "Description" [level=3] [ref=f780e67]
          - generic [ref=f780e68]:
            - paragraph [ref=f780e69]:
              - emphasis [ref=f780e70]: “If you are excited about applying machine learning to tackle real-world challenges in spatial movement analysis , this is a perfect opportunity for you. Be a part of the team of research and machine learning scientists building deployable real-world ML applications from ground up and get mentored by some of the best minds in AI during the process.”
            - paragraph [ref=f780e71]: – Xu, Machine Learning Scientist and Amor Provins, Product Owner, Advanced Technology
            - heading [level=2] [ref=f780e72]:
              - strong [ref=f780e73]: About the Role
            - paragraph [ref=f780e74]: "This is a paid Residency that will be undertaken over a twelve-month period with the potential to be hired by our client, ZeroKey, afterwards (note: at the discretion of the client). The Resident will report to an Amii Scientist and regularly consult with the client team to share insights and engage in knowledge transfer activities."
            - paragraph [ref=f780e75]: Successful candidates will be members of a cross-functional project team with backgrounds in ML research, project management, software engineering, and new product development. This is a rare opportunity to be mentored by world-class scientists and to develop something truly impactful.
            - heading [level=2] [ref=f780e76]:
              - strong [ref=f780e77]: About the Client
            - paragraph [ref=f780e78]: ZeroKey is building the spatial data layer for Physical AI.
            - paragraph [ref=f780e79]: AI transformed the digital economy because every keystroke was captured as data. The physical economy has no equivalent. On a factory floor, every human action, material movement, tool motion, and assembly step is invisible to software, and therefore to AI. ZeroKey closes that gap.
            - paragraph
            - paragraph [ref=f780e80]: ZeroKey’s patented Quantum RTLS® (35+ patents) is the industry’s most accurate large-scale 3D real-time location system. It tracks people, tools, robots, and materials across entire factories to an accuracy of 1.5 millimetres, over 100 times more precise than anything else on the market, using ultrasound instead of cameras. That precision is the foundation of something bigger. The spatial data feeds OmniVisor AI™, an agentic platform that puts a dedicated AI process engineer in every work cell. The OmniVisor AI™ platform combines agentic intelligence with physical motion dynamics to continuously analyze workflows and process efficiencies in real time. Driven by a commitment to eliminate waste, improve worker safety, and unlock operational efficiency, ZeroKey is building the foundation for the self-diagnosing, autonomous factories of the future.
            - heading [level=2] [ref=f780e81]:
              - strong [ref=f780e82]: About the Project
            - paragraph [ref=f780e83]: A central objective of this project is to use machine learning to prevent anomalies, inefficiencies, ergonomic risks, or non-compliant operations. Analysis will be performed both continuously and proactively by the OmniVisor AI platform, and upon request by end users with specific queries.
            - paragraph [ref=f780e84]: This project will deliver machine learning models that can be deployed in production environments, optimized for real-time performance to efficiently run on edge-devices. The models will be capable of operating live on the millimeter-accurate positioning data and other observables in programmed workflows, analyzing the spatial-temporal patterns.
            - heading [level=2] [ref=f780e85]:
              - strong [ref=f780e86]: Required Skills / Expertise
            - paragraph [ref=f780e87]: Are you passionate about building great solutions? You’ll be presented with opportunities to both personally and professionally develop as you build your career. We’re looking for a talented and enthusiastic individual with a solid background in machine learning, AI agents, along with proven experience in applied settings.
            - heading [level=2] [ref=f780e88]:
              - strong [ref=f780e89]: "Key Responsibilities:"
            - list [ref=f780e90]:
              - listitem [ref=f780e91]: Build predictive models that can detect risky behaviors in the system.
              - listitem [ref=f780e92]: Prepare, clean, and curate datasets for model training, fine-tuning, benchmarking, and evaluation.
              - listitem [ref=f780e93]: Conduct applied research in advanced models for spatial-temporal multimodal analysis on complex patterns.
              - listitem [ref=f780e94]: Explore potential agentic AI solutions for advanced business problems.
              - listitem [ref=f780e95]: Collaborate with the project team and stakeholders to develop MVP and client focused solutions.
              - listitem [ref=f780e96]: Engage in regular client meetings, contributing to presentations and reports on project progress.
            - heading [level=2] [ref=f780e97]:
              - strong [ref=f780e98]: "Required Qualifications:"
            - list [ref=f780e99]:
              - listitem [ref=f780e100]: Completion of a Computer Science (or a related graduate degree program) MSc. or PhD with specialization in Artificial Intelligence, Machine Learning, Computer Vision, Spatial Intelligence, Physical AI, Data Science, or related fields.
              - listitem [ref=f780e101]: "Research or project experience in one or more of the following: computer vision, time series analysis, video analysis, virtual reality, motion sensing, pose estimation."
              - listitem [ref=f780e102]: Proficiency in Python and modern AI frameworks such as PyTorch, Hugging Face Transformers, Sklearn, and other common machine learning and statistics libraries.
              - listitem [ref=f780e103]: Capable of building custom machine learning algorithms from scratch (e.g. developing a transformer model).
              - listitem [ref=f780e104]: Familiarity with Kalman Filtering, signal processing, and 3D spatial computing.
              - listitem [ref=f780e105]: Familiarity with linux, Git version control, and writing clean code.
              - listitem [ref=f780e106]: A positive attitude towards learning and understanding a new applied domain.
              - listitem [ref=f780e107]: Must be legally eligible to work in Canada.
            - heading [level=2] [ref=f780e108]:
              - strong [ref=f780e109]: "Preferred Qualifications:"
            - list [ref=f780e110]:
              - listitem [ref=f780e111]: Experience with multimodal foundation models (VLMs/LLMs) and AI agents.
              - listitem [ref=f780e112]: Expertise in 3D spatial AI, 3D reconstruction, and any form of 3D physical simulations.
              - listitem [ref=f780e113]: Experience with real world noisy data is a big plus.
              - listitem [ref=f780e114]: Experience with building, training, evaluating, and quantizing machine learning models to achieve optimized performance in production environments, with a focus on low-latency, resource-efficient edge-device deployment.
              - listitem [ref=f780e115]: Experience with CI/CD, deploying machine learning models in production environments or strong software engineering (or MLE) skills is a plus.
              - listitem [ref=f780e116]: Publication record in peer-reviewed academic conferences or relevant journals in ML or Applied AI (especially in computer vision and 3D spatial intelligence).
            - heading [level=2] [ref=f780e117]:
              - strong [ref=f780e118]: "Non-Technical Requirements:"
            - list [ref=f780e119]:
              - listitem [ref=f780e120]: Desire to take ownership of a problem and demonstrated leadership skills
              - listitem [ref=f780e121]: Interdisciplinary team player enthusiastic about working together to achieve excellence
              - listitem [ref=f780e122]: Capable of critical and independent thought
              - listitem [ref=f780e123]: Able to communicate technical concepts clearly and advise on the application of machine intelligence
              - listitem [ref=f780e124]: Intellectual curiosity and the desire to learn new things, techniques, and technologies
            - heading [level=2] [ref=f780e125]:
              - strong [ref=f780e126]: Why You Should Apply
            - paragraph [ref=f780e127]: "Besides gaining industry experience, additional perks include:"
            - list [ref=f780e128]:
              - listitem [ref=f780e129]: Work under the mentorship of an Amii Scientist for the duration of the project
              - listitem [ref=f780e130]: Participate in professional development activities
              - listitem [ref=f780e131]: Gain access to the Amii community and events
              - listitem [ref=f780e132]: Get paid for your work (a fair and equitable rate of pay will be negotiated at the time of offer)
              - listitem [ref=f780e133]: Build your professional network
              - listitem [ref=f780e134]: The opportunity for an ongoing machine learning role at the client’s organization at the end of the term (at the client’s discretion)
            - heading [level=2] [ref=f780e135]:
              - strong [ref=f780e136]: About Amii
            - paragraph [ref=f780e137]: One of Canada’s three main institutes for artificial intelligence (AI) and machine learning, our world-renowned researchers drive fundamental and applied research at the University of Alberta (and other academic institutions), training some of the world’s top scientific talent. Our cross-functional teams work collaboratively with Alberta-based businesses and organizations to build AI capacity and translate scientific advancement into industry adoption and economic impact.
            - heading [level=2] [ref=f780e138]:
              - strong [ref=f780e139]: How to Apply
            - paragraph [ref=f780e140]:
              - text: If this sounds like the opportunity you’ve been waiting for, please don’t wait for the closing August 25, 2026 to apply – we’re excited to add a new member to the Amii team for this role, and the posting may come down sooner than the closing date if we find the right candidate before the posting closes! When sending your application, please send your
              - strong [ref=f780e141]: resume and cover letter
              - text: indicating why you think you’d be a fit for Amii. In your cover letter, please include one professional accomplishment you are most proud of and why.
            - paragraph
            - paragraph [ref=f780e142]:
              - strong [ref=f780e143]: Applicants must be legally eligible to work in Canada at the time of application.
            - paragraph:
              - strong
            - paragraph [ref=f780e144]: Amii is an equal opportunity employer and values a diverse workforce. We encourage applications from all qualified individuals without regard to ethnicity, religion, gender identity, sexual orientation, age or disability. Accommodations for disability-related needs throughout the recruitment and selection process are available upon request. Any information provided by you for accommodations will be kept confidential and won’t be used in the selection process.
            - paragraph [ref=f780e145]
