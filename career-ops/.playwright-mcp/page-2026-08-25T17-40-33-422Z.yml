          - generic [ref=f243e14]:
            - heading "Machine Learning Manager, Feed Relevance (Retrieval)" [level=1] [ref=f243e15]
            - generic [ref=f243e16]: Remote - United States
          - button "Apply" [ref=f243e20] [cursor=pointer]
        - generic [ref=f243e21]:
          - generic [ref=f243e28]:
            - text: Reddit is a community of communities. It’s built on shared interests, passion, and trust, and is home to the most open and authentic conversations on the internet. Every day, Reddit users submit, vote, and comment on the topics they care most about. With 100,000+ active communities and approximately 130 million daily active unique visitors, Reddit is one of the internet’s largest sources of information. For more information, visit
            - link "www.redditinc.com" [ref=f243e29] [cursor=pointer]:
              - /url: http://www.redditinc.com/
            - text: .
          - generic [ref=f243e30]:
            - paragraph [ref=f243e31]: "Reddit is looking for an experienced Engineering Manager to lead our Feed Retrieval team. In this role, you’ll lead a high-impact team of Machine Learning Engineers building the systems that identify, retrieve, and shape the candidate inventory powering Reddit’s personalized feeds. Your team will work at the foundation of Feed Relevance: expanding the set of high-quality content Reddit can recommend, improving personalization and discovery for users across different levels of signal, and building scalable ML systems that directly shape the experiences of over 120M+ daily users.If applying ML / AI in production to improve Reddit Relevance excites you, then you’ve found the right place."
            - paragraph [ref=f243e32]:
              - strong [ref=f243e33]: "Responsibilities:"
            - list [ref=f243e34]:
              - listitem [ref=f243e35]:
                - strong [ref=f243e36]: "Define Technical Vision & Strategy:"
                - text: Define the technical vision and long-term roadmap for Feed Retrieval, aligning large-scale recommender-system investments with Reddit’s product, ecosystem, and business objectives.
              - listitem [ref=f243e37]:
                - strong [ref=f243e38]: "Roadmap & Prioritization:"
                - text: Translate broad Feed Relevance goals into a focused team roadmap, making clear prioritization tradeoffs across model quality, inventory expansion, experimentation velocity, infrastructure cost, and operational reliability.
              - listitem [ref=f243e39]:
                - strong [ref=f243e40]: "Team Leadership & Development:"
                - text: Coach and support the development of your team, constantly seeking opportunities to grow their skills and impact.
              - listitem [ref=f243e41]:
                - strong [ref=f243e42]: "Technical Execution & Delivery:"
                - text: Oversee the design, development, and optimization of retrieval systems that source relevant, diverse, fresh, and high-quality candidates for personalized feed experiences.
              - listitem [ref=f243e43]:
                - strong [ref=f243e44]: "Measurement & Learning:"
                - text: Establish strong measurement, experimentation, and debugging practices so the team can understand retrieval quality, candidate coverage, source incrementality, and downstream impact.
              - listitem [ref=f243e45]:
                - strong [ref=f243e46]: "Platform & Infrastructure Collaboration:"
                - text: Collaborate with ML platform, infrastructure, ranking, safety, and product teams to build scalable, low-latency retrieval systems that can support the next generation of AI-powered recommendations.
              - listitem [ref=f243e47]:
                - strong [ref=f243e48]: "Operational Excellence:"
                - text: Maintain high standards for system performance, reliability, latency, cost efficiency, and responsible recommendation practices.
              - listitem [ref=f243e49]:
                - strong [ref=f243e50]: "Cross-Functional Partnership:"
                - text: Work with cross-functional partners from across the company to identify key areas of opportunity, set expectations, and communicate your team’s work.
              - listitem [ref=f243e51]:
                - strong [ref=f243e52]: "Recruiting & Growth:"
                - text: Partner with our incredible recruiting team to attract, interview, and hire diverse and talented machine learning engineers, growing a world-class team.
            - paragraph [ref=f243e53]:
              - strong [ref=f243e54]: "Qualifications:"
            - list [ref=f243e55]:
              - listitem [ref=f243e56]:
                - strong [ref=f243e57]: "Experience Leading ML Teams:"
                - text: 2+ years of experience building and managing high-performing ML or recommender-systems teams.
              - listitem [ref=f243e58]:
                - strong [ref=f243e59]: "Deep ML Expertise:"
                - text: Hands-on experience with large-scale production ML systems, ideally including recommender systems, retrieval models, embedding-based systems, sequence models, transformer-based architectures, or LLM-powered recommendation applications.
              - listitem [ref=f243e60]:
                - strong [ref=f243e61]: "Technical Domain Knowledge:"
                - text: Strong understanding of recommender systems, especially candidate retrieval, embedding/indexing systems, ranking handoffs, feed personalization, exploration, content quality, and measurement strategies.
              - listitem [ref=f243e62]:
                - strong [ref=f243e63]: "Strategic Thinking:"
                - text: Ability to develop and communicate a clear technical strategy across ambiguous problem spaces, balancing user relevance, ecosystem health, system scalability, and business impact.
              - listitem [ref=f243e64]:
                - strong [ref=f243e65]: "Impact-Driven Mindset:"
                - text: Passion for developing scalable, well-designed, and responsible AI solutions that drive business value.
              - listitem [ref=f243e66]:
                - strong [ref=f243e67]: "Exceptional Communication & Collaboration:"
                - text: Strong interpersonal skills and a collaborative mindset, with the ability to effectively communicate complex technical topics to diverse audiences and build strong relationships with cross-functional partners.
            - paragraph [ref=f243e68]:
              - strong [ref=f243e69]: "Benefits:"
            - list [ref=f243e70]:
              - listitem [ref=f243e71]: Comprehensive Healthcare Benefits and Income Replacement Programs
              - listitem [ref=f243e72]: 401k with Employer Match
              - listitem [ref=f243e73]: Global Benefit programs that fit your lifestyle, from workspace to professional development to caregiving support
              - listitem [ref=f243e74]: Family Planning Support
              - listitem [ref=f243e75]: Gender-Affirming Care
              - listitem [ref=f243e76]: Mental Health & Coaching Benefits
              - listitem [ref=f243e77]: Flexible Vacation & Paid Volunteer Time Off
              - listitem [ref=f243e78]: Generous Paid Parental Leave
            - paragraph [ref=f243e79]: "#LI-remote, #LI-JS5"
          - generic [ref=f243e81]:
            - generic [ref=f243e84]:
              - paragraph [ref=f243e85]:
                - strong [ref=f243e86]: "Pay Transparency:"
              - paragraph [ref=f243e87]: This job posting may span more than one career level.
              - paragraph [ref=f243e88]:
                - text: In addition to base salary, this job is eligible to receive equity in the form of restricted stock units, and depending on the position offered, it may also be eligible to receive a commission. Additionally, Reddit offers a wide range of benefits to U.S.-based employees, including medical, dental, and vision insurance, 401(k) program with employer match, generous time off for vacation, and parental leave. To learn more, please visit
                - link "https://www.redditinc.com/careers/" [ref=f243e89] [cursor=pointer]:
                  - /url: https://www.redditinc.com/careers/
                - text: .
              - paragraph [ref=f243e90]: To provide greater transparency to candidates, we share base salary ranges for all US-based job postings regardless of state. We set standard base pay ranges for all roles based on function, level, and country location, benchmarked against similar stage growth companies. Final offer amounts are determined by multiple factors including, skills, depth of work experience and relevant licenses/credentials, and may vary from the amounts listed below.
            - paragraph [ref=f243e91]: "The base salary range for this position is:"
            - paragraph [ref=f243e92]: $253,300 - $354,600 USD
          - generic [ref=f243e93]:
            - paragraph [ref=f243e94]: In select roles and locations, the interviews will be recorded, transcribed and summarized by artificial intelligence (AI). You will have the opportunity to opt out of recording, transcription and summarization prior to any scheduled interviews.
            - paragraph [ref=f243e95]:
              - generic [ref=f243e96]:
                - text: "During the interview, we will collect the following categories of personal information: Identifiers, Professional and Employment-Related Information, Sensory Information (audio/video recording), and any other categories of personal information you choose to share with us. We will use this information to evaluate your application for employment or an independent contractor role, as applicable. We will not sell your personal information or disclose it to any third party for their marketing purposes. We will delete any recording of your interview promptly after making a hiring decision. For more information about how we will handle your personal information, including our retention of it, please refer to our"
                - link "Candidate Privacy Policy for Potential Employees and Contractors" [ref=f243e97] [cursor=pointer]:
                  - /url: https://redditinc.com/policies/candidate-privacy-policy
                - text: .
            - paragraph [ref=f243e98]:
              - emphasis [ref=f243e99]: Reddit is proud to be an equal opportunity employer, and is committed to building a workforce representative of the diverse communities we serve. Reddit is committed to providing reasonable accommodations for qualified individuals with disabilities and disabled veterans in our job application procedures. If, due to a disability, you need an accommodation during the interview process, please let your recruiter know.
