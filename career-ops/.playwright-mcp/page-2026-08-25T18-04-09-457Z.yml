        - generic [ref=f521e20]:
          - generic [ref=f521e21]:
            - paragraph [ref=f521e22]:
              - text: Grafana Labs, the company behind the open observability cloud, is founded on the principles of open source, open standards, open ecosystems, and open culture. Grafana Cloud, our fully managed observability platform, is flexible and built for scale. With Grafana Cloud's actually useful AI, organizations can see, understand, and act on all their disparate data to move at the speed of their ambitions. Today, more than 35 million users and 7,000+ customers – including Anthropic, Bloomberg, NVIDIA, Microsoft, and Salesforce – trust Grafana Labs to ensure reliability of their applications and systems, resolve incidents quickly, and optimize their telemetry to reduce noise and cost. We are a 100% remote company with 1,600+ team members across 40+ countries, and we’re backed by leading investors including Lightspeed Venture Partners, Sequoia Capital, GIC, Coatue, J.P. Morgan, CapitalG, and Lead Edge Capital. Learn more at
              - link "grafana.com" [ref=f521e25] [cursor=pointer]:
                - /url: http://grafana.com
              - text: and follow us on
              - link "LinkedIn" [ref=f521e28] [cursor=pointer]:
                - /url: https://www.linkedin.com/company/grafana-labs/
              - text: and
              - link "X" [ref=f521e31] [cursor=pointer]:
                - /url: https://twitter.com/grafana
              - text: .
            - paragraph [ref=f521e32]: "We’re scaling fast and staying true to what makes us different: an open-source legacy, a global collaborative culture, and a passion for meaningful work. Our team thrives in an innovation-driven environment where transparency, autonomy, and trust fuel everything we do."
            - paragraph [ref=f521e33]: You may not meet every requirement, and that’s okay. If this role excites you, we’d love you to raise your hand for what could be a truly career-defining opportunity.
          - generic [ref=f521e34]:
            - paragraph [ref=f521e35]:
              - strong [ref=f521e36]: This is a remote opportunity and we would be interested in applicants from USA time zones only at this time.
            - heading "Staff AI Engineer" [level=3] [ref=f521e37]
            - paragraph [ref=f521e38]:
              - strong [ref=f521e39]: "The Opportunity:"
            - paragraph [ref=f521e40]: At Grafana, we build observability tools that help users understand, respond to, and improve their systems – regardless of scale, complexity, or tech stack. The Grafana AI teams play a key role in this mission by helping users make sense of complex observability data through AI-driven features. These capabilities reduce toil, lower the barrier of domain expertise, and surface meaningful signals from noisy environments.
            - paragraph [ref=f521e41]:
              - text: What makes our team different is
              - emphasis [ref=f521e42]: how
              - text: "we work: we operate with a high degree of autonomy and ownership, both as individuals and as a team. Engineers are empowered to make decisions, move quickly, and validate ideas early – while being supported by a deeply collaborative culture that values curiosity, feedback, and cross-functional partnership."
            - paragraph [ref=f521e43]: We’re looking for an AI Software Engineer with a strong software engineering background, a quick iteration mindset, and a passion for experimentation – balanced by a focus on shipping and scaling impactful features that deliver value to users. You’ll work closely with cross-functional teams to develop, test, and ship AI-powered features that contribute to improving infrastructure and observability quality through automation, while also expanding the capabilities of AI agents across the observability stack to assist users with incident response. As the team matures, there’s a broad opportunity to expand or redefine this role based on impact and initiative.
            - paragraph [ref=f521e44]:
              - text: Curious about what it's like to build AI at Grafana? Learn more about the team's philosophy, culture, and approach
              - link "here" [ref=f521e45] [cursor=pointer]:
                - /url: https://medium.com/grafana-labs/how-we-build-ai-at-grafana-labs-small-steps-that-add-up-to-actually-useful-ai-2dcd7b2b3184
              - text: .
            - paragraph [ref=f521e46]:
              - strong [ref=f521e47]: "What You’ll Be Doing:"
            - list [ref=f521e48]:
              - listitem [ref=f521e49]: "Build and deliver AI solutions: Take ownership of developing high-performance AI features to help users detect, triage, and resolve incidents using observability data and tools."
              - listitem [ref=f521e50]: "Rapid experimentation and iteration: Implement a highly iterative process where you quickly prototype, test, and validate with real users, including shipping and evolving LLM- or agent-powered workflows for incident lifecycle management and automated analysis tasks."
              - listitem [ref=f521e51]: "Collaborate cross-functionally: Work with data analysts, product managers, and designers to shape AI-driven product features, including integration of agentic components with internal tools, alerting systems, runbooks, and developer workflows."
              - listitem [ref=f521e52]: "Utilize AI tools effectively: Use AI and automation tools to enhance both product functionality and your own development workflows."
              - listitem [ref=f521e53]: "Effective communication: You’ll be working in a highly dynamic and collaborative environment, so we need someone who can communicate effectively and contribute across teams."
              - listitem [ref=f521e54]: "Ownership and impact: Take full ownership of the AI solutions you develop, ensuring they are not only innovative but also scalable, maintainable, and aligned with real user workflows."
            - paragraph [ref=f521e55]: "We invest heavily in developer productivity. You can use modern AI coding assistants as part of your daily workflow (your choice of tools, within security guidelines), backed by a company-funded usage budget so you can iterate quickly without unnecessary friction. We encourage pragmatic AI-assisted development: faster prototyping, test generation, refactors, documentation, and incident follow-ups—always with strong code review and quality standards. You'll also have access to the latest frontier models from OpenAI, Anthropic, and Google."
            - paragraph [ref=f521e56]:
              - strong [ref=f521e57]: "What Makes You a Great Fit:"
            - list [ref=f521e58]:
              - listitem [ref=f521e59]: "Strong engineering skills: Solid experience building production software systems (backend and / or full stack). You’re a self-starter, capable of tackling complex engineering problems with minimal supervision."
              - listitem [ref=f521e60]: "AI experience with a practical mindset: You’re familiar with AI technologies and frameworks, and you focus on delivering high-quality solutions that work in the real world, not just in theory."
              - listitem [ref=f521e61]: "Quick iteration and experimentation: You’re comfortable releasing prototypes, collecting feedback, and iterating with a pragmatic mindset."
              - listitem [ref=f521e62]: "Proven initiative: You take ownership and drive projects forward, pushing boundaries to find the most impactful solutions. You can deal with ambiguity and are able to define scope where things are loosely defined."
              - listitem [ref=f521e63]: "Collaborative attitude: You communicate effectively with peers, product managers, and designers. You’re open to feedback, and you bring a solutions-oriented mindset to the table."
            - paragraph [ref=f521e64]:
              - strong [ref=f521e65]: "Requirements:"
            - list [ref=f521e66]:
              - listitem [ref=f521e67]: Experience with LLMs, prompt engineering, and building applications powered by GenAI.
              - listitem [ref=f521e68]: Proven track record of delivering software that made it into production and is actively used by users.
              - listitem [ref=f521e69]: Exposure to working in cloud-native environments (e.g., AWS, GCP, Azure).
              - listitem [ref=f521e70]: Experience using observability tools to understand and troubleshoot system behavior.
            - paragraph [ref=f521e71]:
              - strong [ref=f521e72]: "Bonus Points For:"
            - list [ref=f521e73]:
              - listitem [ref=f521e74]: Experience building or working with agent frameworks or multi‑agent workflows.
              - listitem [ref=f521e75]: "Experience with infrastructure / devops related tooling: Kubernetes, Docker, Terraform or similar for deployments."
              - listitem [ref=f521e76]: Familiarity with model fine-tuning techniques.
              - listitem [ref=f521e77]: Experience building observability tooling.
            - paragraph [ref=f521e78]:
              - strong [ref=f521e79]: "Compensation & Rewards:"
            - paragraph [ref=f521e80]:
              - text: In the United States, the Base compensation range for this role is USD 174,986 - USD 220,000. Actual compensation may vary based on level, experience, and skillset as assessed in the interview process. Benefits include equity, bonus (if applicable) and other benefits listed
              - link "here" [ref=f521e81] [cursor=pointer]:
                - /url: https://grafana.com/about/careers/#jobs
              - text: .
            - paragraph [ref=f521e82]: All of our roles include Restricted Stock Units (RSUs), giving every team member ownership in Grafana Labs' success. We believe in shared outcomes—RSUs help us stay aligned and invested as we scale globally.
            - paragraph [ref=f521e83]
          - generic [ref=f521e84]:
            - generic [ref=f521e85]:
              - paragraph [ref=f521e86]:
                - emphasis [ref=f521e87]: "*Compensation ranges are country specific. If you are applying for this role from a different location than listed above, your recruiter will discuss your specific market’s defined pay range & benefits at the beginning of the process."
              - paragraph [ref=f521e88]:
                - strong [ref=f521e89]: "Why You’ll Thrive at Grafana Labs:"
              - list [ref=f521e90]:
                - listitem [ref=f521e91]:
                  - strong [ref=f521e92]: 100% Remote, Global Culture -
                  - text: As a remote-only company, we bring together talent from around the world, united by a culture of collaboration and shared purpose.
                - listitem [ref=f521e93]:
                  - strong [ref=f521e94]: Scaling Organization
                  - text: – Tackle meaningful work in a high-growth, ever-evolving environment.
                - listitem [ref=f521e95]:
                  - strong [ref=f521e96]: Transparent Communication
                  - text: – Expect open decision-making and regular company-wide updates.
                - listitem [ref=f521e97]:
                  - strong [ref=f521e98]: Innovation-Driven
                  - text: – Autonomy and support to ship great work and try new things.
                - listitem [ref=f521e99]:
                  - strong [ref=f521e100]: Open Source Roots
                  - text: – Built on community-driven values that shape how we work.
                - listitem [ref=f521e101]:
                  - strong [ref=f521e102]: Empowered Teams
                  - text: – High trust, low ego culture that values outcomes over optics.
                - listitem [ref=f521e103]:
                  - strong [ref=f521e104]: Career Growth Pathways
                  - text: – Defined opportunities to grow and develop your career.
                - listitem [ref=f521e105]:
                  - strong [ref=f521e106]: Approachable Leadership
                  - text: – Transparent execs who are involved, visible, and human.
                - listitem [ref=f521e107]:
                  - strong [ref=f521e108]: Passionate People
                  - text: – Join a team of smart, supportive folks who care deeply about what they do.
                - listitem [ref=f521e109]:
                  - strong [ref=f521e110]: In-Person onboarding
                  - text: "- We want you to thrive from day 1 with your fellow new ‘Grafanistas’ to learn all about what we do and how we do it."
                - listitem [ref=f521e111]:
                  - strong [ref=f521e112]: Balance is Key
                  - text: "- We operate a global annual leave policy of 30 days per annum. 3 days of your annual leave entitlement are reserved for Grafana Shutdown Days to allow the team to really disconnect."
                  - emphasis [ref=f521e113]: "*We will comply with local legislation where applicable."
              - paragraph [ref=f521e114]:
                - strong [ref=f521e115]: "Equal Opportunity Employer:"
                - emphasis [ref=f521e116]: Grafana Labs is an equal opportunities employer. We welcome applications from everyone regardless of race, colour, nationality, origin, caste, sex, gender reassignment identity or expression, sexual orientation, age, religion or belief, disability, veteran status, genetic information, pregnancy, maternity, marital, family or carer status, or any other characteristic which is protected by local law. We believe that equality and diversity build a strong organisation, and we work hard to ensure that is the foundation of our organisation as we grow.
              - paragraph [ref=f521e117]:
                - emphasis [ref=f521e118]: Grafana Labs may utilize AI tools in its recruitment process to assist in matching information provided in CVs to job postings. The recruitment team will continue to review inbound CVs manually to identify alignment with current openings.
              - paragraph [ref=f521e119]: "#LI-Remote"
