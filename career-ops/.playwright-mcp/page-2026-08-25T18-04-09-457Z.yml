                  - /url: https://www.dol.gov/ofccp
                - text: .
              - strong [ref=f521e464]: How do you know if you have a disability?
              - paragraph [ref=f521e465]:
                - text: A disability is a condition that substantially limits one or more of your “major life activities.” If you have or have ever had such a condition, you are a person with a disability.
                - strong [ref=f521e466]: "Disabilities include, but are not limited to:"
              - list [ref=f521e467]:
                - listitem [ref=f521e468]: Alcohol or other substance use disorder (not currently using drugs illegally)
                - listitem [ref=f521e469]: Autoimmune disorder, for example, lupus, fibromyalgia, rheumatoid arthritis, HIV/AIDS
                - listitem [ref=f521e470]: Blind or low vision
                - listitem [ref=f521e471]: Cancer (past or present)
                - listitem [ref=f521e472]: Cardiovascular or heart disease
                - listitem [ref=f521e473]: Celiac disease
                - listitem [ref=f521e474]: Cerebral palsy
                - listitem [ref=f521e475]: Deaf or serious difficulty hearing
                - listitem [ref=f521e476]: Diabetes
                - listitem [ref=f521e477]: Disfigurement, for example, disfigurement caused by burns, wounds, accidents, or congenital disorders
                - listitem [ref=f521e478]: Epilepsy or other seizure disorder
                - listitem [ref=f521e479]: Gastrointestinal disorders, for example, Crohn's Disease, irritable bowel syndrome
                - listitem [ref=f521e480]: Intellectual or developmental disability
                - listitem [ref=f521e481]: Mental health conditions, for example, depression, bipolar disorder, anxiety disorder, schizophrenia, PTSD
                - listitem [ref=f521e482]: Missing limbs or partially missing limbs
                - listitem [ref=f521e483]: Mobility impairment, benefiting from the use of a wheelchair, scooter, walker, leg brace(s) and/or other supports
                - listitem [ref=f521e484]: Nervous system condition, for example, migraine headaches, Parkinson’s disease, multiple sclerosis (MS)
                - listitem [ref=f521e485]: Neurodivergence, for example, attention-deficit/hyperactivity disorder (ADHD), autism spectrum disorder, dyslexia, dyspraxia, other learning disabilities
                - listitem [ref=f521e486]: Partial or complete paralysis (any cause)
                - listitem [ref=f521e487]: Pulmonary or respiratory conditions, for example, tuberculosis, asthma, emphysema
                - listitem [ref=f521e488]: Short stature (dwarfism)
                - listitem [ref=f521e489]: Traumatic brain injury
