            - heading "Staff Machine Learning Engineer, Shopping Ads" [level=1] [ref=f285e15]
            - generic [ref=f285e16]: Remote - United States
          - button "Apply" [ref=f285e20] [cursor=pointer]
        - generic [ref=f285e21]:
          - generic [ref=f285e28]:
            - text: Reddit is a community of communities. It’s built on shared interests, passion, and trust, and is home to the most open and authentic conversations on the internet. Every day, Reddit users submit, vote, and comment on the topics they care most about. With 100,000+ active communities and approximately 130 million daily active unique visitors, Reddit is one of the internet’s largest sources of information. For more information, visit
            - link "www.redditinc.com" [ref=f285e29] [cursor=pointer]:
              - /url: http://www.redditinc.com/
            - text: .
          - generic [ref=f285e30]:
            - paragraph [ref=f285e31]: Reddit is a community of communities, built on shared interests, passion, and trust. Our Shopping Ads team builds relevant, performant, and scalable commerce advertising experiences that help advertisers connect products with people who are likely to find them useful.
            - paragraph [ref=f285e32]: As a Staff Machine Learning Engineer on Shopping Ads, you will lead the technical strategy and execution for the models that power Shopping Ads delivery. You will work across targeting, retrieval, ranking, engagement and conversion prediction, feature engineering, and online serving to improve advertiser outcomes across Dynamic Product Ads and Product Listing Ads. This is a hands-on technical leadership role for an engineer who can translate business goals into an end-to-end ML roadmap and deliver impact through multiple systems and teams.
            - paragraph [ref=f285e33]:
              - strong [ref=f285e34]: Responsibilities
            - list [ref=f285e35]:
              - listitem [ref=f285e36]: Lead the ML strategy and architecture for Shopping Ads delivery across targeting, retrieval, ranking, engagement, conversion, and value optimization.
              - listitem [ref=f285e37]: Own end-to-end model development from opportunity sizing, data and label design, feature engineering, model selection, offline evaluation, online experimentation, deployment, monitoring, and iteration.
              - listitem [ref=f285e38]: Build and optimize models for low-funnel advertiser objectives while maintaining strong relevance, user experience, marketplace health, and measurement quality.
              - listitem [ref=f285e39]: Develop feature and representation strategies that connect user intent, context, product catalog signals, advertiser signals, and historical interactions across multiple models in the delivery stack.
              - listitem [ref=f285e40]: Apply and adapt state-of-the-art machine learning approaches to production problems, selecting architectures based on measurable benefit rather than novelty alone.
              - listitem [ref=f285e41]: Design systems that balance prediction quality with online latency, throughput, reliability, operational complexity, and serving cost.
              - listitem [ref=f285e42]: Drive complex initiatives that require coordinated changes across Shopping Ads, Catalog, Foundational Insights, ML Platform, Ads Serving, Auction, Bidding, Product, and Data Science.
              - listitem [ref=f285e43]: Set a high technical bar through architecture reviews, experimentation standards, production ownership, observability, and model-quality practices.
              - listitem [ref=f285e44]: Mentor engineers and technical leads, clarify ownership, and help the team execute effectively in ambiguous problem spaces.
              - listitem [ref=f285e45]: Stay current with advances in ads optimization, commerce recommendation, retrieval and ranking, representation learning, and production ML systems.
            - paragraph [ref=f285e46]:
              - strong [ref=f285e47]: Minimum qualifications
            - list [ref=f285e48]:
              - listitem [ref=f285e49]: 7+ years of professional software or machine learning engineering experience, including substantial experience building applied ML systems in production.
              - listitem [ref=f285e50]: Demonstrated experience building end-to-end models or model-driven products that improve advertising, recommendation, search, or marketplace performance.
              - listitem [ref=f285e51]: Experience optimizing low-funnel objectives such as conversion, purchase value, revenue, return on ad spend, or other outcome-based metrics.
              - listitem [ref=f285e52]: Strong hands-on experience with model development, complex feature engineering, training and evaluation pipelines, online inference, and experimentation.
              - listitem [ref=f285e53]: Record of delivering complex results that require multiple system components or teams to work together.
              - listitem [ref=f285e54]: Experience applying modern machine learning models in production and producing significant, measurable performance improvements.
              - listitem [ref=f285e55]: "Proven technical-lead experience: setting direction, driving architecture and execution, mentoring engineers, and influencing cross-functional stakeholders."
              - listitem [ref=f285e56]: Strong understanding of large-scale, high-throughput, low-latency ML systems and the trade-offs among model quality, latency, reliability, and cost.
              - listitem [ref=f285e57]: Excellent written and verbal communication, mentoring, and collaboration skills, with the ability to align teams on a long-term vision for Shopping Ads delivery.
            - paragraph [ref=f285e58]:
              - strong [ref=f285e59]: Preferred qualifications
            - list [ref=f285e60]:
              - listitem [ref=f285e61]: Experience with Shopping Ads, Commerce ads, Dynamic Product Ads, Product Listing Ads, product recommendation, or retail media.
              - listitem [ref=f285e62]: Experience with one or more of targeting, candidate retrieval, ranking, conversion modeling, value optimization, recommender systems, or representation learning.
              - listitem [ref=f285e63]: Experience designing features or shared representations used across multiple models in a multi-stage delivery stack.
              - listitem [ref=f285e64]: Experience with deep learning architectures such as multi-task models, sequence models, transformers, two-tower models, graph methods, or learned embeddings.
              - listitem [ref=f285e65]: Experience with catalog quality, product feeds, advertiser-side signals, delayed or sparse conversion labels, and online/offline distribution shift.
              - listitem [ref=f285e66]: Experience at a large-scale ads, social, search, recommendation, e-commerce, or marketplace company.
            - paragraph [ref=f285e67]:
              - strong [ref=f285e68]: "Benefits:"
            - list [ref=f285e69]:
              - listitem [ref=f285e70]: Comprehensive Healthcare Benefits and Income Replacement Programs
              - listitem [ref=f285e71]: 401k with Employer Match
              - listitem [ref=f285e72]: Global Benefit programs that fit your lifestyle, from workspace to professional development to caregiving support
              - listitem [ref=f285e73]: Family Planning Support
              - listitem [ref=f285e74]: Gender-Affirming Care
              - listitem [ref=f285e75]: Mental Health & Coaching Benefits
              - listitem [ref=f285e76]: Flexible Vacation & Paid Volunteer Time Off
              - listitem [ref=f285e77]: Generous Paid Parental Leave
            - paragraph [ref=f285e78]
            - paragraph [ref=f285e79]
          - generic [ref=f285e81]:
            - generic [ref=f285e84]:
              - paragraph [ref=f285e85]:
                - strong [ref=f285e86]: "Pay Transparency:"
              - paragraph [ref=f285e87]: This job posting may span more than one career level.
              - paragraph [ref=f285e88]:
                - text: In addition to base salary, this job is eligible to receive equity in the form of restricted stock units, and depending on the position offered, it may also be eligible to receive a commission. Additionally, Reddit offers a wide range of benefits to U.S.-based employees, including medical, dental, and vision insurance, 401(k) program with employer match, generous time off for vacation, and parental leave. To learn more, please visit
                - link "https://www.redditinc.com/careers/" [ref=f285e89] [cursor=pointer]:
                  - /url: https://www.redditinc.com/careers/
                - text: .
              - paragraph [ref=f285e90]: To provide greater transparency to candidates, we share base salary ranges for all US-based job postings regardless of state. We set standard base pay ranges for all roles based on function, level, and country location, benchmarked against similar stage growth companies. Final offer amounts are determined by multiple factors including, skills, depth of work experience and relevant licenses/credentials, and may vary from the amounts listed below.
            - paragraph [ref=f285e91]: "The base salary range for this position is:"
            - paragraph [ref=f285e92]: $230,000 - $322,000 USD
          - generic [ref=f285e93]:
            - paragraph [ref=f285e94]: In select roles and locations, the interviews will be recorded, transcribed and summarized by artificial intelligence (AI). You will have the opportunity to opt out of recording, transcription and summarization prior to any scheduled interviews.
            - paragraph [ref=f285e95]:
              - generic [ref=f285e96]:
                - text: "During the interview, we will collect the following categories of personal information: Identifiers, Professional and Employment-Related Information, Sensory Information (audio/video recording), and any other categories of personal information you choose to share with us. We will use this information to evaluate your application for employment or an independent contractor role, as applicable. We will not sell your personal information or disclose it to any third party for their marketing purposes. We will delete any recording of your interview promptly after making a hiring decision. For more information about how we will handle your personal information, including our retention of it, please refer to our"
                - link "Candidate Privacy Policy for Potential Employees and Contractors" [ref=f285e97] [cursor=pointer]:
                  - /url: https://redditinc.com/policies/candidate-privacy-policy
                - text: .
