            - heading "Senior Backend Engineer - Brand Platform" [level=1] [ref=f20e10]
            - generic [ref=f20e11]: Kitchener-Waterloo, ON; Toronto, ON
          - button "Apply" [ref=f20e15] [cursor=pointer]
        - generic [ref=f20e16]:
          - generic [ref=f20e17]:
            - paragraph [ref=f20e18]:
              - strong [ref=f20e20]: About Faire
            - paragraph [ref=f20e21]: Faire is a technology wholesale platform built on the belief that the future is local. Independent retailers around the globe collectively represent a multi-hundred-billion-dollar wholesale market that has historically been fragmented and offline. At Faire, we're using the power of tech, data, and machine learning to connect this thriving community of entrepreneurs across the globe. Picture your favorite boutique in town — we help them discover the best products from around the world to sell in their stores. With the right tools and insights, we believe that we can level the playing field so businesses can grow and local communities can thrive.
            - paragraph [ref=f20e22]: We’re looking for smart, resourceful and passionate people to join us as we power the shop local movement. If you believe in community, come join ours.
          - generic [ref=f20e23]:
            - paragraph [ref=f20e24]:
              - strong [ref=f20e25]: "About this role:"
            - paragraph [ref=f20e26]: Our Brand engineering team owns the code that our Brands use to manage their business on Faire. This includes managing product listings, fulfilling orders, and communicating with retailers. This role is for the brand platform sub-team and focuses on laying a strong foundation for customer-facing teams to build on.
            - paragraph [ref=f20e27]: We care about good engineering practices and love to write software that is secure, tested, easy to maintain, and scalable to millions of users. We build minimum viable products, deploy to production multiple times per day, A/B test customer-facing changes, listen to the data, and iterate.
            - paragraph [ref=f20e28]:
              - strong [ref=f20e29]: "As a Senior Back-end on the Brand Platform team, you'll collaborate with us to:"
            - list [ref=f20e30]:
              - listitem [ref=f20e31]: Define clear service boundaries
              - listitem [ref=f20e32]: Build out AI enablement for common tasks on the team
              - listitem [ref=f20e33]: Optimize the performance of our highest contention data models.
              - listitem [ref=f20e34]: Deliver core features of our Kotlin server
              - listitem [ref=f20e35]: Design and build new APIs used by our website and mobile app
              - listitem [ref=f20e36]: Help the product team continuously improve our customer's experience
            - paragraph [ref=f20e37]:
              - strong [ref=f20e38]: "We're excited about you because you have:"
            - list [ref=f20e39]:
              - listitem [ref=f20e40]: A passion for programming and solving problems with code
              - listitem [ref=f20e41]: Examples of using AI to automate large-scale quality improvements of existing code bases
              - listitem [ref=f20e42]: A deep understanding of NewSQL relational databases like CockroachDB
              - listitem [ref=f20e43]: Experience digging into engineering productivity and finding opportunities for improvements across multiple teams
              - listitem [ref=f20e44]: A love for technology, and an insatiable curiosity for new tools to tackle real problems
            - paragraph [ref=f20e45]:
              - strong [ref=f20e46]: "Technologies we use and teach:"
            - list [ref=f20e47]:
              - listitem [ref=f20e48]: Kotlin, Java
              - listitem [ref=f20e49]: JUnit, Hibernate, Guice, Jersey
              - listitem [ref=f20e50]: HTTP, JSON, and Protocol Buffers
              - listitem [ref=f20e51]: MySQL, CockroachDB
              - listitem [ref=f20e52]: AWS
            - paragraph [ref=f20e53]:
              - strong [ref=f20e54]: "Salary range:"
            - paragraph [ref=f20e55]: "Canada: the pay range for this role is $156,000 - $214,500 per year."
            - paragraph [ref=f20e56]: This role will also be eligible for equity and benefits. Actual base pay will be determined based on permissible factors such as transferable skills, work experience, market demands, and primary work location. The base pay range provided is subject to change and may be modified in the future.
          - generic [ref=f20e57]:
            - paragraph [ref=f20e58]:
              - emphasis [ref=f20e59]:
                - generic [ref=f20e60]:
                  - emphasis [ref=f20e61]: Hybrid Faire employees currently go into the office 3 days per week on Tuesdays, Thursdays, and a third flex day of their choosing (Monday, Wednesday, or Friday).
                  - text: Additionally, hybrid in-office roles will have the flexibility to work remotely up to 4 weeks per year. Specific Workplace and Information Technology positions may require onsite attendance 5 days per week as will be indicated in the job posting.
            - paragraph [ref=f20e62]:
              - strong [ref=f20e63]: Why you’ll love working at Faire
            - list [ref=f20e64]:
              - listitem [ref=f20e65]:
                - strong [ref=f20e66]: "Move fast:"
                - text: You'll own meaningful problems that serve customers around the globe with the agency to move fast and see your results clearly.
              - listitem [ref=f20e67]:
                - strong [ref=f20e68]: "Equipped to scale:"
                - text: We invest in what matters, including the latest enterprise AI tools, to help you work smarter and get more out of every day.
              - listitem [ref=f20e69]:
                - strong [ref=f20e70]: "Best in class:"
                - text: Our team is full of sharp, kind, and generous colleagues who care about their craft and about helping you grow in yours.
              - listitem [ref=f20e71]:
                - strong [ref=f20e72]: Real rewards.
                - text: Competitive pay, equity, and comprehensive benefits designed to support your life inside and outside of work.
              - listitem [ref=f20e73]:
                - strong [ref=f20e74]: "Belonging:"
                - text: We're intentional about building an environment where every Faire employee has equal access to opportunities, growth, and success.
            - paragraph [ref=f20e75]:
              - text: "Faire was founded in 2017 by a team of early product and engineering leads from Square. We’re backed by some of the top investors in retail and tech including: Y Combinator, Lightspeed Venture Partners, Forerunner Ventures, Khosla Ventures, Sequoia Capital, Founders Fund, and DST Global. We have headquarters in San Francisco and Kitchener-Waterloo, and a global employee presence across offices in Toronto, London, and New York. To learn more about Faire and our customers, you can read more on our"
              - link "blog" [ref=f20e76] [cursor=pointer]:
                - /url: https://blog.faire.com/
              - text: .
            - paragraph
            - paragraph [ref=f20e77]: Faire provides equal employment opportunities (EEO) to all employees and applicants for employment without regard to race, color, religion, sex, national origin, age, disability, genetics, sexual orientation, gender identity or gender expression.
            - paragraph [ref=f20e78]:
              - text: Faire is committed to providing access, equal opportunity and reasonable accommodation for individuals with disabilities in employment, its services, programs, and activities. Accommodations are available throughout the recruitment process and applicants with a disability may request to be accommodated throughout the recruitment process. We will work with all applicants to accommodate their individual accessibility needs. To request reasonable accommodation, please fill out our
              - link "Accommodation Request Form" [ref=f20e79] [cursor=pointer]:
                - /url: https://docs.google.com/forms/d/e/1FAIpQLSczpI9me7nYKhunSC6AlagHKv75LHqfi-Qi2TP_3dpin0Uc9Q/viewform
              - text: (
              - link "https://bit.ly/faire-form)" [ref=f20e80] [cursor=pointer]:
                - /url: https://bit.ly/faire-form)
            - paragraph [ref=f20e81]:
              - strong [ref=f20e82]: Privacy
            - paragraph [ref=f20e83]:
              - text: For information about the type of personal data Faire collects from applicants, as well as your choices regarding the data collected about you, please visit Faire’s
              - link "Privacy Notice (https://www.faire.com/privacy)" [ref=f20e84] [cursor=pointer]:
                - /url: https://www.faire.com/privacy
