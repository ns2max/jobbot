        - generic [ref=f443e20]:
          - generic [ref=f443e21]:
            - heading [level=2] [ref=f443e22]:
              - strong [ref=f443e23]: About Anthropic
            - paragraph [ref=f443e24]: Anthropic’s mission is to create reliable, interpretable, and steerable AI systems. We want AI to be safe and beneficial for our users and for society as a whole. Our team is a quickly growing group of committed researchers, engineers, policy experts, and business leaders working together to build beneficial AI systems.
          - generic [ref=f443e25]:
            - heading [level=2] [ref=f443e26]:
              - strong [ref=f443e27]: About the Role
            - paragraph [ref=f443e28]: We're seeking an exceptional Research Engineer to join our Life Sciences team at Anthropic. Our team is organized around the north star goal of accelerating progress in the life sciences, from early discovery through translation, by an order of magnitude. Our team likes to think across the whole model stack. In this role, you'll combine your deep expertise in machine learning engineering to develop novel evaluation frameworks and training strategies that push the frontier of what AI can achieve in biology.
            - paragraph [ref=f443e29]: You'll work at the intersection of cutting-edge AI and the biological sciences, developing rigorous methods to measure and improve model performance on complex scientific tasks. You'll collaborate closely with world-class researchers and engineers to build AI systems that can engage in all phases of research and development, while maintaining our commitment to safety and beneficial impact.
            - paragraph [ref=f443e30]: Previous experience in life sciences is welcome, but not required for this role.
            - heading [level=2] [ref=f443e31]:
              - strong [ref=f443e32]: Minimum Qualifications
            - list [ref=f443e33]:
              - listitem [ref=f443e34]: Demonstrated experience training and evaluating large language models
              - listitem [ref=f443e35]: Proficiency in Python and familiarity with modern ML development practices
              - listitem [ref=f443e36]: Experience building and managing data pipelines for large-scale datasets
              - listitem [ref=f443e37]: Comfortable navigating ambiguity and developing solutions in rapidly evolving research environments
              - listitem [ref=f443e38]: Strong written and verbal communication skills, with the ability to work independently while collaborating effectively across cross-functional teams
            - heading [level=2] [ref=f443e39]:
              - strong [ref=f443e40]: Preferred Qualifications
            - list [ref=f443e41]:
              - listitem [ref=f443e42]: 8+ years of machine learning experience
              - listitem [ref=f443e43]: Prior work experience in AI and biology, including graduate studies (molecular biology, biochemistry, computational biology, or related fields)
              - listitem [ref=f443e44]: Experience working with large-scale biological datasets
              - listitem [ref=f443e45]: Published research or practical experience in scientific AI applications or long-horizon reasoning
              - listitem [ref=f443e46]: Background in reinforcement learning and/or pretraining
              - listitem [ref=f443e47]: Knowledge of containerization technologies (e.g., Docker, Kubernetes) and cloud deployment at scale
              - listitem [ref=f443e48]: Demonstrated ability to work across multiple domains, such as language modeling, systems engineering, and scientific computing
              - listitem [ref=f443e49]: Contributions to open-source scientific software or databases
          - generic [ref=f443e51]:
            - generic [ref=f443e54]:
              - paragraph [ref=f443e55]: The annual compensation range for this role is listed below.
              - paragraph [ref=f443e56]: For sales roles, the range provided is the role’s On Target Earnings ("OTE") range, meaning that the range includes both the sales commissions/sales bonuses target and annual base salary for the role.
            - paragraph [ref=f443e57]: "Annual Salary:"
            - paragraph [ref=f443e58]: $350,000 - $500,000 USD
          - generic [ref=f443e59]:
            - heading [level=2] [ref=f443e60]:
              - strong [ref=f443e61]: Logistics
            - paragraph [ref=f443e62]:
              - strong [ref=f443e63]: "Minimum education:"
              - text: Bachelor’s degree or an equivalent combination of education, training, and/or experience
            - paragraph [ref=f443e64]:
              - strong [ref=f443e65]: "Required field of study:"
              - text: A field relevant to the role as demonstrated through coursework, training, or professional experience
            - paragraph [ref=f443e66]:
              - strong [ref=f443e67]: "Minimum years of experience:"
              - text: Years of experience required will correlate with the internal job level requirements for the position
            - paragraph [ref=f443e68]:
              - strong [ref=f443e69]: "Location-based hybrid policy:"
              - text: Currently, we expect all staff to be in one of our offices at least 25% of the time. However, some roles may require more time in our offices.
            - paragraph [ref=f443e70]:
              - strong [ref=f443e71]: "Visa sponsorship:"
              - text: We do sponsor visas! However, we aren't able to successfully sponsor visas for every role and every candidate. But if we make you an offer, we will make every reasonable effort to get you a visa, and we retain an immigration lawyer to help with this.
            - paragraph [ref=f443e72]:
              - strong [ref=f443e73]: We encourage you to apply even if you do not believe you meet every single qualification.
              - text: Not all strong candidates will meet every single qualification as listed. Research shows that people who identify as being from underrepresented groups are more prone to experiencing imposter syndrome and doubting the strength of their candidacy, so we urge you not to exclude yourself prematurely and to submit an application if you're interested in this work. We think AI systems like the ones we're building have enormous social and ethical implications. We think this makes representation even more important, and we strive to include a range of diverse perspectives on our team.
              - strong [ref=f443e74]: Your safety matters to us.
              - text: To protect yourself from potential scams, remember that Anthropic recruiters only contact you from @anthropic.com email addresses. In some cases, we may partner with vetted recruiting agencies who will identify themselves as working on behalf of Anthropic. Be cautious of emails from other domains. Legitimate Anthropic recruiters will never ask for money, fees, or banking information before your first day. If you're ever unsure about a communication, don't click any links—visit
              - link "anthropic.com/careers" [ref=f443e76] [cursor=pointer]:
                - /url: http://anthropic.com/careers
              - text: directly for confirmed position openings.
            - heading [level=2] [ref=f443e77]:
              - strong [ref=f443e78]: How we're different
            - paragraph [ref=f443e79]: We believe that the highest-impact AI research will be big science. At Anthropic we work as a single cohesive team on just a few large-scale research efforts. And we value impact — advancing our long-term goals of steerable, trustworthy AI — rather than work on smaller and more specific puzzles. We view AI research as an empirical science, which has as much in common with physics and biology as with traditional efforts in computer science. We're an extremely collaborative group, and we host frequent research discussions to ensure that we are pursuing the highest-impact work at any given time. As such, we greatly value communication skills.
            - paragraph [ref=f443e80]: "The easiest way to understand our research directions is to read our recent research. This research continues many of the directions our team worked on prior to Anthropic, including: GPT-3, Circuit-Based Interpretability, Multimodal Neurons, Scaling Laws, AI & Compute, Concrete Problems in AI Safety, and Learning from Human Preferences."
            - heading [level=2] [ref=f443e81]:
              - strong [ref=f443e82]: Come work with us!
            - paragraph [ref=f443e83]:
              - text: Anthropic is a public benefit corporation headquartered in San Francisco. We offer competitive compensation and benefits, optional equity donation matching, generous vacation and parental leave, flexible working hours, and a lovely office space in which to collaborate with colleagues.
              - strong [ref=f443e84]: "Guidance on Candidates' AI Usage:"
              - text: Learn about
              - link "our policy" [ref=f443e85] [cursor=pointer]:
                - /url: https://www.anthropic.com/candidate-ai-guidance
              - text: for using AI in our application process.
