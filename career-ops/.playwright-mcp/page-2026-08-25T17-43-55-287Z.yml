        - generic [ref=f271e21]:
          - generic [ref=f271e28]:
            - text: Reddit is a community of communities. It’s built on shared interests, passion, and trust, and is home to the most open and authentic conversations on the internet. Every day, Reddit users submit, vote, and comment on the topics they care most about. With 100,000+ active communities and approximately 130 million daily active unique visitors, Reddit is one of the internet’s largest sources of information. For more information, visit
            - link "www.redditinc.com" [ref=f271e29] [cursor=pointer]:
              - /url: http://www.redditinc.com/
            - text: .
          - generic [ref=f271e30]:
            - paragraph [ref=f271e31]: Reddit’s Ads Data Science team is looking for a Senior Staff Data Scientist to lead the scientific strategy behind Reddit’s ads measurement and signal systems. This role sits at the center of how Reddit proves advertiser value, improves signal quality, builds privacy-aware measurement systems, and connects ads exposure to real advertiser outcomes.
            - paragraph [ref=f271e32]: As a Senior Staff Data Scientist for Ads Measurement, you will be the principal architect of our technical vision and the driving force behind the next generation of our measurement ecosystem. In a landscape rapidly shifting due to privacy regulations, browser changes, and evolving platform dynamics, you will spearhead innovation across experimental design (incrementality/lift), identity, signals, and privacy-safe 1P/3P measurement.
            - paragraph [ref=f271e33]: This is a high-visibility, high-impact role requiring a rare blend of deep experimentation & causal inference expertise, strategic foresight, and the ability to influence cross-functional executives and industry standards. You will not just adapt to the changing ad-tech environment, you will redefine how we measure value.
            - heading [level=3] [ref=f271e34]:
              - strong [ref=f271e35]: Responsibilities
            - list [ref=f271e36]:
              - listitem [ref=f271e37]:
                - strong [ref=f271e38]: "Technical Vision & Strategy:"
                - text: Define the long-term data science vision & strategy across ads measurement, signal quality, identity, attribution, and privacy. Establish how Reddit should evaluate advertiser value, measurement quality, and signal utility across first-party and third-party products.
              - listitem [ref=f271e39]:
                - strong [ref=f271e40]: "Set the Cross-Pillar Measurement Science Strategy:"
                - text: Define the long-term data science strategy across ads measurement, signal quality, identity, attribution, and privacy. Establish how Reddit should evaluate advertiser value, measurement quality, and signal utility across first-party and third-party products.
              - listitem [ref=f271e41]:
                - strong [ref=f271e42]: "Build Trusted Measurement and Evaluation Frameworks:"
                - text: Create rigorous frameworks for validating lift, attribution, identity quality, modeled conversions, signal loss recovery, and privacy-aware measurement. Define ground truth, objective functions, quality metrics, guardrails, and decision frameworks that guide product and engineering investments.
              - listitem [ref=f271e43]:
                - strong [ref=f271e44]: "Advance Experimentation and Causal Inference at Scale:"
                - text: Lead the evolution of Reddit’s experimentation and lift methodologies across Brand Lift, Conversion Lift, Split Testing, and emerging measurement products. Improve study quality, reduce bias and contamination, and develop scalable diagnostics for experiment health, feasibility, and interpretability. Partner with Ads Engineering to operationalize complex causal models, ensuring that scientific methodologies are not only accurate but also performant, scalable, and resilient in high-throughput production environments.
              - listitem [ref=f271e45]:
                - strong [ref=f271e46]: "Connect Signals, Identity, and Ranking Outcomes:"
                - text: Quantify how signal quality, match rates, identity resolution, modeled conversions, and privacy changes affect bidding efficiency, CPA, ROAS, and advertiser outcomes. Partner with modeling and ranking teams to translate measurement improvements into performance gains.
              - listitem [ref=f271e47]:
                - strong [ref=f271e48]: "Guide Privacy-Aware Ads Measurement:"
                - text: Lead a privacy-first measurement paradigm, positioning Reddit as a market leader in trusted advertising by recovering signal utility through compliant modeling.
              - listitem [ref=f271e49]:
                - strong [ref=f271e50]: "Create Durable Data Science Infrastructure and Standards:"
                - text: Lead cross-org efforts to define reusable methodologies, dashboards, scorecards, quality metrics, and best practices. Build repeatable systems that improve how Ads DS evaluates launches, monitors regressions, sizes opportunities, and communicates impact.
              - listitem [ref=f271e51]:
                - strong [ref=f271e52]: "Influence Senior Cross-Functional Strategy:"
                - text: Partner with senior leaders across Product, Engineering, Sales, Marketing Science, Legal/Privacy, and Ads leadership to shape roadmap decisions. Translate complex scientific tradeoffs into clear business and product recommendations.
              - listitem [ref=f271e53]:
                - strong [ref=f271e54]: "Uplevel the Data Science Organization:"
                - text: Mentor Staff and Senior data scientists, sponsor high-impact technical work, and raise the bar for causal inference, measurement science, identity evaluation, data quality, and cross-functional decision-making across Ads DS.
            - heading [level=3] [ref=f271e55]:
              - strong [ref=f271e56]: Qualifications
            - heading [level=4] [ref=f271e57]:
              - strong [ref=f271e58]: Required
            - list [ref=f271e59]:
              - listitem [ref=f271e60]: Advanced degree in Statistics, Economics, Mathematics, Computer Science, Operations Research, Physics, or a related quantitative field, or equivalent industry experience.
              - listitem [ref=f271e61]: 10+ years of industry experience in data science, applied science, economics, statistics, or a related quantitative role.
              - listitem [ref=f271e62]: Deep expertise in ads measurement, experimentation, causal inference, attribution, marketplace measurement, or ads optimization.
              - listitem [ref=f271e63]: Proven track record leading ambiguous, cross-functional, multi-pillar problem spaces with measurable business impact.
              - listitem [ref=f271e64]: Strong command of statistical modeling, experimental design, causal inference, and measurement methodology.
              - listitem [ref=f271e65]: Experience defining metrics, evaluation frameworks, quality guardrails, and decision systems for complex products.
              - listitem [ref=f271e66]: Demonstrated ability to balance long-term strategic vision with hands-on execution of complex technical ideas.
              - listitem [ref=f271e67]: Advanced proficiency in SQL and Python or R.
              - listitem [ref=f271e68]: Ability to influence senior product, engineering, and business leaders through clear technical judgment and communication.
              - listitem [ref=f271e69]: Demonstrated ability to mentor senior ICs and improve technical standards across a data science organization.
              - listitem [ref=f271e70]: Demonstrated agility in adopting AI tools to amplify your personal output, turning complex methodologies into working prototypes with modern speed and efficiency.
            - heading [level=4] [ref=f271e71]:
              - strong [ref=f271e72]: Preferred
            - list [ref=f271e73]:
              - listitem [ref=f271e74]: Experience with ads identity, conversion modeling, signal loss, modeled conversions, match-rate optimization, or identity graph evaluation.
              - listitem [ref=f271e75]: Experience with lift measurement, brand lift, conversion lift, incrementality testing, MMM, MTA, or third-party measurement partnerships.
              - listitem [ref=f271e76]: Experience working on privacy-constrained measurement, clean rooms, aggregation, consent-aware systems, or privacy-preserving modeling.
              - listitem [ref=f271e77]: Experience partnering with ranking, bidding, or machine learning teams to connect measurement quality to optimization outcomes.
              - listitem [ref=f271e78]: Familiarity with two-sided marketplaces, auction systems, performance advertising, or advertiser-facing measurement products.
              - listitem [ref=f271e79]: Experience building durable internal frameworks, training programs, scorecards, or methodology standards adopted across an organization.
            - paragraph [ref=f271e80]:
              - strong [ref=f271e81]: "Benefits:"
            - list [ref=f271e82]:
              - listitem [ref=f271e83]: Global Benefit programs that fit your lifestyle, from workspace to professional development to caregiving support
              - listitem [ref=f271e84]: Family Planning Support
