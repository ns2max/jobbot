              - listitem [ref=f271e86]: Mental Health & Coaching Benefits
              - listitem [ref=f271e87]: Comprehensive Medical Benefits & Health Care Spending Account
              - listitem [ref=f271e88]: Registered Retirement Savings Plan with matching contributions
              - listitem [ref=f271e89]: Income Replacement Programs
              - listitem [ref=f271e90]: Flexible Vacation & Paid Volunteer Time Off
              - listitem [ref=f271e91]: Generous Paid Parental Leave
