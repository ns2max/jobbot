            - heading "Staff Data Scientist, Ads" [level=1] [ref=f576e15]
            - generic [ref=f576e16]: Remote - United States
          - button "Apply" [ref=f576e20] [cursor=pointer]
        - generic [ref=f576e21]:
          - generic [ref=f576e28]:
            - text: Reddit is a community of communities. It’s built on shared interests, passion, and trust, and is home to the most open and authentic conversations on the internet. Every day, Reddit users submit, vote, and comment on the topics they care most about. With 100,000+ active communities and approximately 130 million daily active unique visitors, Reddit is one of the internet’s largest sources of information. For more information, visit
            - link "www.redditinc.com" [ref=f576e29] [cursor=pointer]:
              - /url: http://www.redditinc.com/
            - text: .
          - generic [ref=f576e30]:
            - paragraph [ref=f576e31]:
              - strong [ref=f576e32]: "Location: US remote-friendly"
            - paragraph [ref=f576e33]: Reddit has a flexible first workforce. At Reddit we continue to grow our teams with the best talent. We're completely remote friendly and will continue to be.
            - paragraph [ref=f576e34]: Advertising is Reddit’s primary revenue driver and we have an ambitious goal to turn it into a massive business. Although several large digital ad platforms already exist, advertisers are being increasingly drawn to Reddit because of our passionate communities. We believe our community-centric platform has created the opportunity for Reddit to build a highly differentiated ads business.
            - paragraph [ref=f576e35]:
              - strong [ref=f576e36]: "About the Ads Data Science Team:"
            - paragraph [ref=f576e37]: The Ads Data Science team at Reddit leverages data to maximize advertiser value on Reddit through robust data foundations, metrics, and strategic insights generated through experimentation and cutting-edge DS methods.
            - paragraph [ref=f576e38]: We work on a wide range of challenging problems in the areas of ads and platform measurement, campaign and creative management, advertiser growth and retention, monetization, and the intersection of brand and community engagement. We are a highly collaborative team of passionate data scientists and engineers who are constantly pushing the boundaries of what's possible with machine learning and statistical modeling.
            - paragraph [ref=f576e39]:
              - strong [ref=f576e40]: "About the Role:"
            - paragraph [ref=f576e41]: Reddit’s Ads Data Science team is looking for a highly experienced Staff Data Scientist to advance the intelligence powering the advertiser experience on Reddit. In this role, you'll take deep ownership of a high-impact problem space within advertising, specializing in measurement, identity, and signal quality.
            - paragraph [ref=f576e42]: This is a high-impact, high-autonomy role where you'll influence strategic direction, set a high technical bar, and drive cross-functional initiatives across one or more critical focus areas in the Ads organization.
            - paragraph [ref=f576e43]:
              - strong [ref=f576e44]: "Responsibilities:"
            - list [ref=f576e45]:
              - listitem [ref=f576e46]:
                - strong [ref=f576e47]: "Design the Future of Ads Identity:"
                - text: Develop/employ probabilistic models for identity resolution. Design the methodology that links on-platform and off-platform actions to maximize addressability while honoring privacy.
              - listitem [ref=f576e48]:
                - strong [ref=f576e49]: "Advance Lift Methodologies & Experimentation:"
                - text: Own the statistical rigor behind Reddit’s Brand and Conversion Lift products. Innovate experimental design and develop infrastructure that supports large-scale, high-velocity, low-bias testing for advertisers.
              - listitem [ref=f576e50]:
                - strong [ref=f576e51]: "Maximize Signal for Predictive Performance:"
                - text: Define the strategy for new signal sources. You will mathematically quantify the value of these signals and work with modeling teams to incorporate them into predictive models, directly improving bidding efficiency and ROAS.
              - listitem [ref=f576e52]:
                - strong [ref=f576e53]: "Define Ground Truth & Evaluation Frameworks:"
                - text: Solve the industry-wide challenge of validating identity and measurement. Design the objective functions and truth sets used to train our models and measure the incremental impact of our identity graph.
              - listitem [ref=f576e54]:
                - strong [ref=f576e55]: "Lead Through Cross-Functional and Technical Influence:"
                - text: Collaborate deeply with engineering, product, and sales to align on strategic goals, translate insights into action, and drive execution. Set a high technical bar by mentoring others and championing best practices across modeling, experimentation, and measurement.
            - paragraph [ref=f576e56]:
              - strong [ref=f576e57]: "Qualifications:"
            - list [ref=f576e58]:
              - listitem [ref=f576e59]:
                - strong [ref=f576e60]: "Required:"
                - list [ref=f576e61]:
                  - listitem [ref=f576e62]: Advanced degree (Master's or Ph.D.) in Statistics, Mathematics, Physics, Economics, or Operations Research
                  - listitem [ref=f576e63]: "For M.S. holders: 10+ years of industry experience in applied science or data science roles"
                  - listitem [ref=f576e64]: "For Ph.D. holders: 6+ years of industry experience in applied science or data science roles"
                  - listitem [ref=f576e65]: Deep understanding of the ads ecosystem
                  - listitem [ref=f576e66]:
                    - text: "Demonstrated expertise in at least one of the following areas:"
                    - list [ref=f576e67]:
                      - listitem [ref=f576e68]: Measurement & Experimentation at Scale (with focus on lift and attribution)
                      - listitem [ref=f576e69]: Identity Graph Creation & Resolution Methodology and Infrastructure
                      - listitem [ref=f576e70]: Predictive Modeling with Signal Loss
                  - listitem [ref=f576e71]: Advanced proficiency in statistical programming (Python or R) and SQL
                  - listitem [ref=f576e72]: Experience with machine learning or optimization techniques
                  - listitem [ref=f576e73]: Strong understanding of experimental design, causal inference, or A/B testing methodologies
                  - listitem [ref=f576e74]: Exceptional problem-solving and communication skills, with a track record of influencing product and engineering partners
                  - listitem [ref=f576e75]: Experience working in fast-paced, ambiguous environments with cross-functional teams
            - paragraph [ref=f576e76]:
              - strong [ref=f576e77]: "Benefits:"
            - list [ref=f576e78]:
              - listitem [ref=f576e79]: Comprehensive Healthcare Benefits and Income Replacement Programs
              - listitem [ref=f576e80]: 401k with Employer Match
              - listitem [ref=f576e81]: Global Benefit programs that fit your lifestyle, from workspace to professional development to caregiving support
              - listitem [ref=f576e82]: Family Planning Support
              - listitem [ref=f576e83]: Gender-Affirming Care
              - listitem [ref=f576e84]: Mental Health & Coaching Benefits
              - listitem [ref=f576e85]: Flexible Vacation & Paid Volunteer Time Off
              - listitem [ref=f576e86]: Generous Paid Parental Leave
            - paragraph [ref=f576e87]
            - paragraph [ref=f576e88]: "#LI-Remote"
          - generic [ref=f576e90]:
            - generic [ref=f576e93]:
              - paragraph [ref=f576e94]:
                - strong [ref=f576e95]: "Pay Transparency:"
              - paragraph [ref=f576e96]: This job posting may span more than one career level.
              - paragraph [ref=f576e97]:
                - text: In addition to base salary, this job is eligible to receive equity in the form of restricted stock units, and depending on the position offered, it may also be eligible to receive a commission. Additionally, Reddit offers a wide range of benefits to U.S.-based employees, including medical, dental, and vision insurance, 401(k) program with employer match, generous time off for vacation, and parental leave. To learn more, please visit
                - link "https://www.redditinc.com/careers/" [ref=f576e98] [cursor=pointer]:
                  - /url: https://www.redditinc.com/careers/
                - text: .
              - paragraph [ref=f576e99]: To provide greater transparency to candidates, we share base salary ranges for all US-based job postings regardless of state. We set standard base pay ranges for all roles based on function, level, and country location, benchmarked against similar stage growth companies. Final offer amounts are determined by multiple factors including, skills, depth of work experience and relevant licenses/credentials, and may vary from the amounts listed below.
            - paragraph [ref=f576e100]: "The base salary range for this position is:"
            - paragraph [ref=f576e101]: $217,000 - $303,900 USD
          - generic [ref=f576e102]:
            - paragraph [ref=f576e103]: In select roles and locations, the interviews will be recorded, transcribed and summarized by artificial intelligence (AI). You will have the opportunity to opt out of recording, transcription and summarization prior to any scheduled interviews.
            - paragraph [ref=f576e104]:
              - generic [ref=f576e105]:
                - text: "During the interview, we will collect the following categories of personal information: Identifiers, Professional and Employment-Related Information, Sensory Information (audio/video recording), and any other categories of personal information you choose to share with us. We will use this information to evaluate your application for employment or an independent contractor role, as applicable. We will not sell your personal information or disclose it to any third party for their marketing purposes. We will delete any recording of your interview promptly after making a hiring decision. For more information about how we will handle your personal information, including our retention of it, please refer to our"
                - link "Candidate Privacy Policy for Potential Employees and Contractors" [ref=f576e106] [cursor=pointer]:
                  - /url: https://redditinc.com/policies/candidate-privacy-policy
                - text: .
            - paragraph [ref=f576e107]:
