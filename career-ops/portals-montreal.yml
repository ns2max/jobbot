# Montreal-specific job scan configuration
# Run with: CAREER_OPS_PORTALS=portals-montreal.yml node scan.mjs

title_filter:
  positive:
    - "Machine Learning"
    - "ML Engineer"
    - "ML Scientist"
    - "MLOps"
    - "Research Scientist"
    - "Applied Scientist"
    - "Research Engineer"
    - "AI Engineer"
    - "AI Scientist"
    - "Data Scientist"
    - "Member of Technical Staff"
    - "LLM"
    - "NLP"
    - "Inference"
    - "Model Evaluation"
    - "Audio"
    - "Speech"
    - "Signal Processing"
    - "DSP"
    - "Acoustic"
    - "Voice AI"
    - "Conversational AI"
    - "GenAI"
    - "Generative AI"
    - "Computer Vision"
    - "Deep Learning"
    - "Scientist"
    - "Researcher"
  negative:
    - "Junior"
    - "Intern"
    - ".NET"
    - "Java "
    - "iOS"
    - "Android"
    - "PHP"
    - "Ruby"
    - "Blockchain"
    - "Web3"
    - "Crypto"
    - "COBOL"
    - "Salesforce Admin"
    - "Account Executive"
    - "Business Development"
    - "Success Manager"

location_filter:
  always_allow:
    - "remote"
    - "canada"
  allow:
    - "montreal"
    - "montréal"
    - "québec"
    - "quebec"
    - "laval"
    - "longueuil"
  block:
    - "united states"
    - "san francisco"
    - "new york"
    - "seattle"
    - "austin"
    - "boston"
    - "chicago"
    - "los angeles"
    - "london"
    - "paris"
    - "berlin"
    - "singapore"
    - "bangalore"
    - "india"
    - "uk only"
    - "us only"
    - "united kingdom"

search_queries:
  - name: Montreal ML/AI — Ashby
    query: 'site:jobs.ashbyhq.com ("Machine Learning" OR "Research Scientist" OR "AI Engineer" OR "NLP" OR "Speech" OR "Audio") "Montreal" OR "Montréal" OR "Quebec"'
    enabled: true

  - name: Montreal ML/AI — Greenhouse
    query: 'site:job-boards.greenhouse.io ("Machine Learning" OR "Research Scientist" OR "AI Engineer" OR "NLP") "Montreal" OR "Montréal"'
    enabled: true

  - name: Montreal ML/AI — Lever
    query: 'site:jobs.lever.co ("Machine Learning" OR "Research Scientist" OR "AI Engineer") "Montreal" OR "Montréal"'
    enabled: true

  - name: Montreal AI Research roles
    query: '"Montreal" OR "Montréal" ("Research Scientist" OR "Research Engineer" OR "Applied Scientist") "Machine Learning" OR "AI" OR "NLP" OR "speech" site:job-boards.greenhouse.io OR site:jobs.ashbyhq.com OR site:jobs.lever.co'
    enabled: true

  - name: Mila ecosystem jobs
    query: '"Mila" OR "mila.quebec" "Research Engineer" OR "Research Scientist" OR "ML Engineer" OR "Applied Scientist" 2026'
    enabled: true

  - name: Montreal audio/speech ML
    query: '"Montreal" OR "Montréal" ("Audio" OR "Speech" OR "Signal Processing" OR "Voice AI") ("Machine Learning" OR "Engineer" OR "Scientist") site:job-boards.greenhouse.io OR site:jobs.ashbyhq.com OR site:jobs.lever.co'
    enabled: true

tracked_companies:

