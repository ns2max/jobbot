    notes: "Montreal QC. World-leading AI research institute (Bengio/LeCun). Research Engineer & Scientist roles."
    enabled: true

  - name: IVADO Labs
    careers_url: https://jobs.lever.co/ivado
    notes: "Montreal QC. Mila spinoff — AI research commercialization. Research Scientist & ML Engineer roles."
    enabled: true

  - name: Samsung AI Centre Montreal (SAIC-MT)
