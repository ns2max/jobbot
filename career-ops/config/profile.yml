narrative:
  headline: >
    PhD ML Research Engineer with 10+ years building real-time AI systems across audio,
    computer vision, and industrial automation.
  exit_story: >
    Started in industry building production ML and CV systems at scale (MAS Holdings,
    up to 300% throughput improvement across manufacturing lines; RIP integration and
    alignment algorithm for Promptly, now a Twinery on-demand printing product deployed
    in 4 countries), then pursued a PhD for depth on the research side — real-time
    signal processing, embedded ML, and Music Information Retrieval. Postdoc on the
    EU-funded MUSMET project at the University of Trento: 14ms inference on Raspberry Pi 4
    at F1 0.76, 74x faster than the DTW baseline (JAES 2026), plus a real-time multimodal
    pipeline syncing audio + BCI/EEG + XR head/hand tracking across 4 musicians live.
    Now returning to industry to build applied ML at the intersection of research and
    production engineering.
