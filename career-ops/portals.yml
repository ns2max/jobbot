  positive:
    # Core ML/Research roles — strict match to avoid noise
    # -- ML Engineering & Research --
    - "Machine Learning"
    - "ML Engineer"
    - "ML Scientist"
    - "MLOps"
    - "LLMOps"
    - "Research Scientist"
    - "Applied Scientist"
    - "Research Engineer"
    - "AI Engineer"
    - "AI Scientist"
    - "Data Scientist"
    - "Member of Technical Staff"
    # -- LLM/NLP --
    - "LLM"
    - "NLP"
    - "Inference"
    - "Model Evaluation"
    - "Evals"
    # -- Audio, Speech, Signal --
