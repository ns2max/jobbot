    query: 'site:builtin.com/job "Machine Learning Engineer" OR "ML Engineer" OR "Research Engineer" audio OR speech OR signal remote OR Toronto'
    enabled: true

  - name: BuiltIn — Applied Scientist
    query: 'site:builtin.com/job "Applied Scientist" OR "Research Scientist" OR "ML Scientist" audio OR speech OR signal'
    enabled: true

  - name: BuiltIn — AI Engineer Senior
    query: 'site:builtin.com/job "Senior AI Engineer" OR "Staff ML Engineer" OR "Audio AI" OR "Speech AI"'
    enabled: true

  # -- Audio & Music AI (new) --
